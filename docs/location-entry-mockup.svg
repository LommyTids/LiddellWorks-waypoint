<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">Waypoint location picker with coordinate and Plus Code entry</title>
  <desc id="desc">A desktop mockup of an Edit activity dialog showing the expanded Coordinates or code panel, a map preview and confirmation action.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1a2233" flood-opacity=".2"/></filter>
    <pattern id="roads" width="88" height="88" patternUnits="userSpaceOnUse"><rect width="88" height="88" fill="#eef0ec"/><path d="M-15 19C16 21 31 8 57 4S92 12 111 -2M-9 66C18 50 34 68 54 58S75 33 101 40M18-12C26 15 17 39 31 56S71 74 96 101" fill="none" stroke="#d5d9cd" stroke-width="5"/><path d="M-12 43C17 31 31 33 48 22S79 19 104 28M47-4C40 18 54 34 52 53S35 77 41 97" fill="none" stroke="#fff" stroke-width="3"/></pattern>
  </defs>
  <rect width="1280" height="980" fill="#eef0ec"/>
  <rect x="0" y="0" width="1280" height="68" fill="#1a2233"/>
  <text x="68" y="43" fill="#fff" font-family="Georgia,serif" font-size="28" font-weight="700">Waypoint</text>
  <text x="68" y="105" fill="#56607a" font-family="Arial,sans-serif" font-size="14" letter-spacing="1.2">TOKYO SPRING · ACTIVITY</text>
  <rect x="70" y="130" width="1140" height="790" rx="14" fill="#fff" filter="url(#shadow)"/>
  <rect x="70" y="130" width="1140" height="83" rx="14" fill="#fff"/>
  <line x1="70" y1="213" x2="1210" y2="213" stroke="#d5d9cd"/>
  <text x="108" y="177" fill="#1a2233" font-family="Georgia,serif" font-size="29" font-weight="700">Edit activity</text>
  <text x="1167" y="177" fill="#56607a" font-family="Arial,sans-serif" font-size="28">×</text>
  <text x="108" y="260" fill="#1a2233" font-family="Arial,sans-serif" font-size="14" font-weight="700">VENUE OR ACTIVITY</text>
  <rect x="108" y="276" width="500" height="47" rx="6" fill="#fff" stroke="#838d9e"/>
  <text x="123" y="305" fill="#1a2233" font-family="Arial,sans-serif" font-size="16">TeamLab Planets TOKYO</text>
  <text x="108" y="364" fill="#1a2233" font-family="Arial,sans-serif" font-size="14" font-weight="700">LOCATION</text>
  <rect x="108" y="380" width="385" height="48" rx="6" fill="#fff" stroke="#838d9e"/>
  <text x="123" y="410" fill="#1a2233" font-family="Arial,sans-serif" font-size="16">Toyosu, Koto City</text>
  <rect x="505" y="380" width="135" height="48" rx="6" fill="#1a2233"/>
  <text x="526" y="410" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Find location</text>
  <rect x="108" y="446" width="136" height="33" rx="16" fill="#dcefe9"/>
  <circle cx="128" cy="462" r="5" fill="#1f6f63"/>
  <text x="141" y="467" fill="#1f6f63" font-family="Arial,sans-serif" font-size="13" font-weight="700">Mapped</text>
  <text x="108" y="518" fill="#1a2233" font-family="Arial,sans-serif" font-size="14" font-weight="700">MORE WAYS TO SET A PIN</text>
  <rect x="108" y="536" width="152" height="39" rx="6" fill="#fff" stroke="#d5d9cd"/>
  <text x="124" y="561" fill="#56607a" font-family="Arial,sans-serif" font-size="14">Use typed location</text>
  <rect x="272" y="536" width="164" height="39" rx="6" fill="#f3e6d2" stroke="#a6752b"/>
  <text x="288" y="561" fill="#3a2d15" font-family="Arial,sans-serif" font-size="14" font-weight="700">Coordinates or code</text>
  <rect x="448" y="536" width="149" height="39" rx="6" fill="#fff" stroke="#d5d9cd"/>
  <text x="464" y="561" fill="#56607a" font-family="Arial,sans-serif" font-size="14">Set pin manually</text>
  <rect x="108" y="596" width="1000" height="257" rx="8" fill="#e3e6dd" stroke="#d5d9cd"/>
  <text x="128" y="628" fill="#1a2233" font-family="Arial,sans-serif" font-size="15" font-weight="700">Coordinates, Plus Code or map link</text>
  <rect x="128" y="642" width="585" height="46" rx="6" fill="#fff" stroke="#838d9e"/>
  <text x="143" y="672" fill="#1a2233" font-family="'Courier New',monospace" font-size="16">35.649407, 139.789823</text>
  <text x="128" y="713" fill="#56607a" font-family="Arial,sans-serif" font-size="13">Latitude first, longitude second. Decimal, DMS, a full Plus Code, or a Google Maps coordinate link.</text>
  <rect x="128" y="730" width="145" height="44" rx="6" fill="#1a2233"/>
  <text x="148" y="758" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Preview location</text>
  <text x="128" y="806" fill="#2f7d4f" font-family="Arial,sans-serif" font-size="13">Check the point, then choose Use this location. Your place name and address will be kept.</text>
  <rect x="746" y="620" width="330" height="198" rx="6" fill="url(#roads)" stroke="#d5d9cd"/>
  <path d="M771 740C809 704 849 738 885 700S949 692 981 662S1040 652 1062 630" fill="none" stroke="#4fbfae" stroke-width="4" opacity=".8"/>
  <circle cx="919" cy="721" r="14" fill="#1f6f63" stroke="#fff" stroke-width="4"/>
  <path d="M919 713v16M911 721h16" stroke="#fff" stroke-width="2"/>
  <text x="747" y="849" fill="#1a2233" font-family="'Courier New',monospace" font-size="13">35.649407, 139.789823 · Plus Code 8Q7XMPXQ+QW</text>
  <rect x="903" y="832" width="173" height="44" rx="6" fill="#a6752b"/>
  <text x="926" y="860" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Use this location</text>
  <line x1="70" y1="874" x2="1210" y2="874" stroke="#d5d9cd"/>
  <rect x="956" y="891" width="86" height="42" rx="6" fill="#fff" stroke="#d5d9cd"/>
  <text x="979" y="918" fill="#56607a" font-family="Arial,sans-serif" font-size="14">Cancel</text>
  <rect x="1053" y="891" width="102" height="42" rx="6" fill="#1a2233"/>
  <text x="1083" y="918" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Save</text>
</svg>
