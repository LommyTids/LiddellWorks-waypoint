name: Deploy isolated backend staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: waypoint-backend-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: waypoint-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WAYPOINT_STAGING_KV_ID: ${{ vars.WAYPOINT_STAGING_KV_ID }}
      WAYPOINT_STAGING_D1_ID: ${{ vars.WAYPOINT_STAGING_D1_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - run: npm run test:backend:runtime
      - run: npm run backend:staging-config
      - name: Apply staging schema only
        run: npx wrangler d1 migrations apply WAYPOINT_DB --remote --config wrangler.backend-staging.generated.json
      - name: Deploy separate staging Worker
        run: npx wrangler deploy --config wrangler.backend-staging.generated.json
