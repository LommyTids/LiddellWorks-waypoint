<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Leaflet (the Map tab's mapping library) is vendored locally under
     vendor/leaflet/ rather than pulled from a CDN, so the Map tab still
     works even if some external CDN happens to be unreachable. Only the
     map tiles themselves and the place-name lookups (see the Map section
     of js/map.js) need the open internet at runtime.
     Deliberately an absolute path (starting with /WayPoint/), not a
     relative one — a relative path here resolves differently depending
     on whether the visited URL ends in "/WayPoint" or "/WayPoint/", and
     would silently 404 in the no-trailing-slash case. -->
<link rel="stylesheet" href="/WayPoint/vendor/leaflet/leaflet.css">
<!-- Application styles retain cascade order, including responsive overrides. -->
<link rel="stylesheet" href="/WayPoint/styles/base.css">
<link rel="stylesheet" href="/WayPoint/styles/forms.css">
<link rel="stylesheet" href="/WayPoint/styles/views.css">
<link rel="stylesheet" href="/WayPoint/styles/map.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="topbar">
  <div class="brand">
    <span id="brand-icon" aria-hidden="true"></span>
    Waypoint
  </div>
  <span id="save-indicator" class="save-indicator" role="status" aria-live="polite" aria-atomic="true"></span>
  <div id="account-bar" class="account-bar"></div>
</header>
<div id="system-banner" class="system-banner" role="status" aria-live="polite" aria-atomic="true"></div>
<main id="main-content" class="page" tabindex="-1">
  <div id="app"></div>
</main>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="polite-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="/WayPoint/vendor/leaflet/leaflet.js"></script>
<script src="/WayPoint/data/currencies.js"></script>
<script src="/WayPoint/data/timezones.js"></script>
<script src="/WayPoint/data/countries.js"></script>
<script src="/WayPoint/data/cities.js"></script>
<script src="/WayPoint/data/airports.js"></script>
<script src="/WayPoint/data/avatars.js"></script>
<!-- The full airport database supports extended suggestions and coordinate
     lookup. Keep its existing deferred execution; defer still downloads
     the asset during page load. The curated list above is available first. -->
<script defer src="/WayPoint/data/airports-full.js"></script>
<!-- Local, dependency-free semantic SVG set; loaded before the application
     renderer so every screen and Leaflet marker uses the same artwork. -->
<script src="/WayPoint/ui/icons.js"></script>
<!-- Classic application scripts share scope. Preserve this order; boot runs last. -->
<script src="/WayPoint/js/core.js"></script>
<script src="/WayPoint/js/state.js"></script>
<script src="/WayPoint/js/auth.js"></script>
<script src="/WayPoint/js/dialogs.js"></script>
<script src="/WayPoint/js/forms.js"></script>
<script src="/WayPoint/js/form-schemas.js"></script>
<script src="/WayPoint/js/editors.js"></script>
<script src="/WayPoint/js/flights.js"></script>
<script src="/WayPoint/js/suggestions.js"></script>
<script src="/WayPoint/js/locations.js"></script>
<script src="/WayPoint/js/people.js"></script>
<script src="/WayPoint/js/trip-models.js"></script>
<script src="/WayPoint/js/shell.js"></script>
<script src="/WayPoint/js/cards.js"></script>
<script src="/WayPoint/js/lists.js"></script>
<script src="/WayPoint/js/map.js"></script>
<script src="/WayPoint/js/timeline.js"></script>
<script src="/WayPoint/js/expenses-settings.js"></script>
<script src="/WayPoint/js/render.js"></script>
<script src="/WayPoint/js/events.js"></script>
<script src="/WayPoint/js/boot.js"></script>
</body>
</html>
