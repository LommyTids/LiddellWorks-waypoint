<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Leaflet (the Map tab's mapping library) is vendored locally under
     vendor/leaflet/ rather than pulled from a CDN, so the Map tab still
     works even if some external CDN happens to be unreachable. Only the
     map tiles themselves and the place-name lookups (see the Map section
     of the main script below) need the open internet at runtime.
     Deliberately an absolute path (starting with /WayPoint/), not a
     relative one — a relative path here resolves differently depending
     on whether the visited URL ends in "/WayPoint" or "/WayPoint/", and
     would silently 404 in the no-trailing-slash case. -->
<link rel="stylesheet" href="/WayPoint/vendor/leaflet/leaflet.css">
<style>
/* ============================================================
   WAYPOINT — a multi-trip travel planner
   ------------------------------------------------------------
   This stylesheet is organised top-to-bottom as:
     1. Design tokens (colors/type/spacing) for light + dark mode
     2. Reset & base element styles
     3. Layout shell (top bar, page container)
     4. Components (cards, tabs, timeline, forms, modal, toast)
   ============================================================ */

/* ---- 1. Design tokens --------------------------------------- */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #e3e6dd;
  --ink: #1a2233;
  --ink-soft: #56607a;
  --ink-faint: #838d9e;
  --line: #d5d9cd;
  --accent: #a6752b;
  --accent-ink: #ffffff;
  --accent-soft: #f3e6d2;
  --teal: #1f6f63;
  --teal-soft: #dcefe9;
  --danger: #b24444;
  --danger-soft: #f6e1df;
  --success: #2f7d4f;
  --success-soft: #dff0e3;
  --shadow: 0 1px 2px rgba(26,34,51,.06), 0 8px 24px -12px rgba(26,34,51,.18);
  --radius: 12px;
  --radius-sm: 8px;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c;
    --surface: #1b212b;
    --surface-2: #232b37;
    --ink: #edefea;
    --ink-soft: #a2acbe;
    --ink-faint: #6e788c;
    --line: #2c3542;
    --accent: #d9a24b;
    --accent-ink: #1a1206;
    --accent-soft: #3a2d15;
    --teal: #4fbfae;
    --teal-soft: #16302c;
    --danger: #e08585;
    --danger-soft: #3a2020;
    --success: #6fcb94;
    --success-soft: #1c3527;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #12161c;
  --surface: #1b212b;
  --surface-2: #232b37;
  --ink: #edefea;
  --ink-soft: #a2acbe;
  --ink-faint: #6e788c;
  --line: #2c3542;
  --accent: #d9a24b;
  --accent-ink: #1a1206;
  --accent-soft: #3a2d15;
  --teal: #4fbfae;
  --teal-soft: #16302c;
  --danger: #e08585;
  --danger-soft: #3a2020;
  --success: #6fcb94;
  --success-soft: #1c3527;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

/* ---- 2. Reset & base ------------------------------------------ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--teal); }
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 14px; }
.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; }
::selection { background: var(--accent-soft); }

/* ---- 3. Layout shell -------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 20px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .01em; }
.brand .icon { width: 22px; height: 22px; color: var(--accent); }
.save-indicator { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); min-width: 90px; text-align: right; }
.save-indicator[data-kind="saving"] { color: var(--ink-soft); }
.save-indicator[data-kind="error"] { color: var(--danger); }
.save-indicator[data-kind="readonly"] { color: var(--danger); }
.save-indicator[data-kind="saved"] { color: var(--success); }

/* Accounts/login: who's signed in, "Manage accounts" (site owner only),
   Log out — lives in the topbar next to the save indicator. See
   applyAuthUI(). */
.account-bar { display: flex; align-items: center; gap: 8px; }
.account-label { font-size: 12.5px; color: var(--ink-soft); margin-right: 2px; white-space: nowrap; }

/* ---- Avatars (Companions/Avatars feature) ---------------------------
   One small circle marker, used in three slightly different contexts:
   (a) the account-holder swatch button in the topbar (bigger, clickable
   -- see .account-avatar-btn below), (b) inline next to a name in an
   item row / trip card / timeline / tag-picker (small, see
   avatarMarkerHtml() in the JS), and (c) the swatch options inside the
   avatar-picker modal itself. All three share the same base look so a
   marker always means the same thing wherever it shows up. Colours are
   always set inline from avatarColorHex()/AVATAR_GREY_HEX -- see that
   function's own comment in data/avatars.js for why that's safe (it
   only ever returns one of a fixed, allowlisted set of hex codes, never
   a raw stored value) -- never write a raw token into one of these
   style attributes directly. */
.avatar-marker {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 20px; height: 20px; border-radius: 50%; font-size: 12px; line-height: 1;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.avatar-marker-smiley { font-size: 12px; font-weight: 700; }
.avatar-row { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.account-avatar-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none;
  border-radius: 999px; padding: 3px 8px 3px 3px; cursor: pointer; color: var(--ink);
}
.account-avatar-btn:hover { border-color: var(--line); background: var(--surface-2); }
.account-avatar-btn .avatar-marker { width: 24px; height: 24px; font-size: 14px; }
.trip-card-avatars { margin-top: -2px; }
/* Overflow bubble for a trip card with more companions than fit — see
   MAX_CARD_AVATARS in tripCardAvatarsHtml(). Reuses .avatar-marker's size
   so it lines up with the real markers beside it, but with a flat neutral
   background/text instead of an inline avatar colour (it isn't a real
   person's marker, so it deliberately doesn't look like one). */
.avatar-marker-overflow { background: var(--surface-2); color: var(--ink-soft); font-size: 10px; font-weight: 700; box-shadow: inset 0 0 0 1px var(--line); }

/* The avatar-picker modal: two small swatch grids (colours, then
   animals), each option rendered as its own little circle button --
   clicking one just updates which is `.is-selected` (client-side only,
   see openAvatarPicker()'s click handling) until Save actually submits
   the pair together. */
.avatar-picker-section { margin-bottom: 16px; }
.avatar-picker-section h4 { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
.avatar-swatch-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.avatar-swatch-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; font-size: 16px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  /* This class is used both on the non-interactive <span> the 'avatar-color'
     form field renders (its background always set inline per swatch -- see
     fieldHtml()'s 'avatar-color' case) AND on the real <button> elements
     openAvatarPicker()'s animal grid renders (no inline background there,
     since an animal swatch's colour is the neutral chip below, not a
     colour choice itself). padding/font/background here undo the browser's
     default button chrome so both uses look identical either way. */
  padding: 0; font-family: inherit; background: var(--surface-2);
}
.avatar-swatch-btn.is-selected { border-color: var(--ink); }
/* The 'avatar-color' form-field case in fieldHtml() uses real (visually
   hidden) radio inputs rather than JS click-handling — this is the CSS
   that actually shows which one is picked. */
.avatar-swatch-label { position: relative; display: inline-block; cursor: pointer; line-height: 0; }
.avatar-swatch-radio { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.avatar-swatch-radio:checked + .avatar-swatch-btn { border-color: var(--ink); }
.avatar-swatch-radio:focus-visible + .avatar-swatch-btn { outline: 2px solid var(--accent); outline-offset: 2px; }
.avatar-picker-preview { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px; background: var(--surface-2); border-radius: var(--radius-sm); }
.avatar-picker-preview .avatar-marker { width: 36px; height: 36px; font-size: 18px; }

/* NOTE: there used to be a single blanket "read-only-mode" body class
   here that hid every Add/Edit/Delete control at once for a non-Admin
   account. That doesn't work anymore now that permissions are PER TRIP
   (and, for a "user" grant, per ITEM within a trip) rather than one
   global role — see canFullyEditTrip()/canEditItem() in the JS further
   down. Every Add/Edit/Delete control is now included in a render's HTML
   string, or left out of it, based on those functions — a plain "is this
   button even in the page" check, not a CSS toggle. As ever, this is a
   courtesy for a nicer UI, not the real security boundary: the Worker
   independently refuses any write it doesn't allow, regardless of what
   the page shows (see the big "SAVING SAFELY" comment in src/worker.js). */
/* A small row of buttons that sit right next to each other, e.g. the
   "Add companion"/"Add guest" pair on the Companions tab (see
   renderCompanionsTab()) -- without this, two buttons dropped straight
   into a header that also has `justify-content: space-between` (see
   .tab-panel-head below) become two SEPARATE flex items and end up
   pushed apart to fill the row, rather than sitting adjacent to each
   other the way they visually should. Wrapping them in one of these
   makes the pair itself a single flex item instead. */
.head-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
/* A plain sub-heading inside a tab body, splitting it into named
   sections -- e.g. "Companions" vs "Guests" on the Companions tab.
   Kept deliberately tiny/reusable rather than growing renderSettingsTab()'s
   inline `style="font-size:15px..."` one-offs into a genuinely new
   pattern -- this is that exact same look, just given a name since the
   Companions tab now uses it twice on one screen. */
.section-subhead { font-size: 15px; margin-bottom: 8px; }
.section-subhead:not(:first-child) { margin-top: 28px; }

/* Login / first-run setup screen — shown instead of the normal app
   whenever there's no valid session (see renderAuthScreen()/renderBoot()). */
.auth-screen { display: flex; justify-content: center; padding: 60px 20px; }
.auth-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); }
.auth-card h1 { font-family: var(--font-display); font-size: 22px; margin-bottom: 6px; }
.auth-card .field-hint { margin-bottom: 16px; }
.auth-error { background: var(--danger-soft); color: var(--danger); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; margin-bottom: 14px; }

.page { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

/* ---- 4a. Buttons & form controls --------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 8px 16px; font-size: 13.5px; font-weight: 500;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--ink-faint); }
.btn-primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-primary:hover { opacity: .9; border-color: var(--ink); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-soft); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-icon { padding: 7px; border-radius: 8px; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="password"], select, textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink);
}
textarea { resize: vertical; min-height: 60px; }
.field { margin-bottom: 14px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-hint { font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; }
.form-section + .form-section { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 20px; }
.form-section-head { margin-bottom: 14px; }
.form-section-head h3 { font-size: 14px; }
.form-section-head p { margin-top: 2px; font-size: 11.5px; color: var(--ink-faint); }
.form-details { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); margin-top: 12px; }
.form-details summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; padding: 10px 12px; color: var(--ink); font-size: 13px; font-weight: 600; }
.form-details summary::-webkit-details-marker { display: none; }
.form-details summary::after { content: '+'; color: var(--ink-faint); font-size: 16px; font-weight: 400; }
.form-details[open] summary::after { content: '−'; }
.form-details-body { padding: 2px 12px 2px; }
.form-details-body .field:last-child { margin-bottom: 12px; }
.checkbox-field { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.checkbox-field input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--accent); }
/* The Companions "tag-picker" field (see fieldHtml()'s 'tag-picker' case)
   — a row of small pill-shaped checkboxes, one per companion, that wraps
   onto multiple lines once there are more than fit on one. */
.tag-picker { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-picker-item {
  display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px;
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
}
.tag-picker-item input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--accent); }
.flight-lookup-row { display: flex; gap: 8px; }
.flight-lookup-row input { flex: 1; }
.flight-lookup-row .btn { flex-shrink: 0; white-space: nowrap; }
.flight-lookup-status { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; min-height: 14px; }
.flight-lookup-status.is-error { color: var(--danger); }
.flight-lookup-status.is-ok { color: var(--ink-soft); }
.airport-resolve-hint.is-ok { color: var(--success); }
.airport-resolve-hint.is-unresolved { color: var(--ink-faint); }
.location-picker { position: relative; }
.location-picker-row { display: flex; gap: 8px; }
.location-picker-row input { flex: 1; }
.location-picker-row .btn { flex-shrink: 0; white-space: nowrap; }
.location-results { margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.location-result { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 10px; color: var(--ink); cursor: pointer; }
.location-result:last-child { border-bottom: 0; }
.location-result:hover, .location-result:focus { background: var(--surface-2); outline: none; }
.location-result-title { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 650; }
.location-result-kind { font-size: 11px; color: var(--ink-soft); font-weight: 500; white-space: nowrap; }
.location-result-address { margin-top: 2px; color: var(--ink-soft); font-size: 11.5px; }
.location-selected { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); font-size: 12px; }
.location-selected.is-stale { border-color: var(--danger-soft); }
.location-selected-status { color: var(--success); font-weight: 650; }
.location-selected.is-stale .location-selected-status { color: var(--danger); }
.location-picker-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 7px; }
.location-picker-actions .btn { padding: 5px 8px; font-size: 12px; }
.location-pin-map { display: none; height: 220px; margin-top: 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.location-pin-map.is-open { display: block; }
/* Generic suggestion dropdown — shared by EVERY field with app-managed
   suggestions (currency, country, city, timezone, airport; see
   suggestInputHtml() and the "Generic suggestion dropdown" section in
   the JS further down), so they all look and behave identically. It
   replaces what used to be a native <datalist> for these fields (a
   couple of real problems drove that: a native datalist popup can't be
   repositioned by CSS at all, and rebuilding its options while it's
   open was interrupting typing on some devices/browsers — see the JS
   comment for the full story). `.suggest-input-wrap` is the
   positioning anchor for the dropdown, scoped to just the input so the
   dropdown's `top: 100%` sits right under the input itself, not under
   any hint text below it (airport's resolve-hint, timezone's offset
   hint). */
.suggest-input-wrap { position: relative; }
.suggest-list {
  display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  box-shadow: var(--shadow); max-height: 220px; overflow-y: auto; z-index: 50;
}
.suggest-list.is-open { display: block; }
.suggest-item { padding: 8px 10px; font-size: 13px; cursor: pointer; }
.suggest-item.is-active, .suggest-item:hover { background: var(--surface-2); }
.suggest-empty { padding: 8px 10px; font-size: 12.5px; color: var(--ink-faint); }

/* ---- 4b. Dashboard ------------------------------------------------ */
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
.section-head h1 { font-size: 26px; }
.trip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.trip-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
  transition: transform .12s;
}
.trip-card:hover { transform: translateY(-2px); }
.trip-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.trip-card h3 { font-size: 18px; }
.trip-dates { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.pill-upcoming { background: var(--teal-soft); color: var(--teal); }
.pill-ongoing { background: var(--accent-soft); color: var(--accent); }
.pill-past { background: var(--surface-2); color: var(--ink-faint); }
.trip-stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-soft); flex-wrap: wrap; }
.trip-stats b { color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
.card-actions { display: flex; gap: 4px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty-state .icon { width: 34px; height: 34px; color: var(--ink-faint); margin-bottom: 10px; }
.empty-state h3 { margin-bottom: 6px; color: var(--ink); }
.empty-state p { max-width: 440px; margin: 0 auto; font-size: 13.5px; }
.intro-note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 22px; font-size: 13px; color: var(--ink-soft); }
.intro-note strong { color: var(--ink); }

/* ---- 4c. Trip header & tabs ---------------------------------------- */
.trip-header { margin-bottom: 22px; }
.back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 10px; }
.back-link .icon { width: 14px; height: 14px; transform: rotate(180deg); }
.trip-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.trip-title-row h1 { font-size: 28px; }
.trip-meta { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.trip-meta b { font-family: var(--font-mono); color: var(--ink); }
.warn-link { color: var(--danger); cursor: pointer; background: none; border: none; font-size: 13px; padding: 0; text-decoration: underline; }

/* Navigation is deliberately grouped by the job someone is doing: View
   (Timeline/Map), Plan, People and Manage. The groups wrap rather than
   disappear on small screens, so the structure makes the many trip views
   easier to scan without reintroducing the old hidden-tab problem. */
.nav-group-label { margin-top: 18px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--ink-faint); }
/* The two "big picture" views (Timeline, Map) — larger and more prominent
   than the regular data-entry tabs below, since they're the main thing
   most people open a trip to look at. */
.hero-row { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
.hero-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  font-family: var(--font-display); font-weight: 600; font-size: 16px; cursor: pointer;
  transition: transform .12s, border-color .15s;
}
.hero-btn .icon { width: 20px; height: 20px; color: var(--accent); }
.hero-btn:hover { transform: translateY(-1px); }
.hero-btn.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.hero-btn.active .icon { color: var(--accent); }

/* Each group owns its own short tab row. This keeps related controls
   together on wide screens and still lets every group wrap in full on a
   phone, rather than hiding tabs in a horizontal scroll strip. */
.tabbar { display: flex; flex-wrap: wrap; gap: 12px 20px; margin: 20px 0 22px; overflow-x: visible; }
.tab-group { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tab-group-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--ink-faint); }
.tab-group-tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); }
.tab-btn {
  padding: 9px 14px; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--ink-soft); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.tab-panel-head h2 { font-size: 18px; }

/* ---- 4d. Item list rows (destinations/activities/transport/etc) ------ */
.item-list { display: flex; flex-direction: column; gap: 10px; }
.item-row {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 13px 14px; display: flex; gap: 12px; align-items: flex-start;
}
.item-row .item-icon {
  width: 34px; height: 34px; border-radius: 9px; background: var(--surface-2); color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.item-row .item-icon .icon { width: 17px; height: 17px; }
/* Companions tab: the row's "icon" slot is the person's actual avatar
   marker instead of a generic SVG glyph -- see renderCompanionsTab(). */
.item-row .item-icon.item-icon-avatar { background: none; }
.item-row .item-icon.item-icon-avatar .avatar-marker { width: 30px; height: 30px; font-size: 16px; }
.item-main { flex: 1; min-width: 0; }
.item-title-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item-title { font-weight: 600; font-size: 14.5px; }
.item-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.item-tags { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; font-family: var(--font-mono); color: var(--ink-soft); background: var(--surface-2); border-radius: 6px; padding: 2px 7px; display: inline-flex; align-items: center; gap: 4px; }
.tag .icon { width: 11px; height: 11px; }
.tag-cost { color: var(--accent); background: var(--accent-soft); }
/* Companions tab: Guest vs Companion, and a Companion's access-level tag
   (Super/Admin/User/Viewer) -- see renderCompanionsTab() and the
   COMPANIONS & AVATARS comment in src/worker.js's resolveCompanionAccessLevels()
   for what these mean and who can see them (everyone on the trip, unlike
   the raw `grants` list itself). Colour is purely a visual hint of
   "how much this person can do here" -- Super/Admin get the same warm
   accent colour already used for cost tags elsewhere (most privileged,
   most worth noticing at a glance); User/Viewer and Guest stay the plain
   neutral grey `.tag` already used for everything else, since they're
   not something you need to specifically notice. */
.tag-role-superuser, .tag-role-admin { color: var(--accent); background: var(--accent-soft); }
.item-actions { display: flex; gap: 2px; flex-shrink: 0; }
.copy-btn { background: none; border: none; color: var(--ink-faint); cursor: pointer; padding: 2px; display: inline-flex; }
.copy-btn:hover { color: var(--ink); }
.copy-btn .icon { width: 12px; height: 12px; }

/* ---- 4e. Timeline ------------------------------------------------- */
.day-card { display: flex; gap: 14px; margin-bottom: 22px; }
.day-rail { display: flex; flex-direction: column; align-items: center; width: 46px; flex-shrink: 0; }
.day-num { font-family: var(--font-mono); font-weight: 600; font-size: 15px; background: var(--ink); color: var(--surface); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.day-line { flex: 1; width: 2px; background: var(--line); margin-top: 4px; }
.day-body { flex: 1; min-width: 0; padding-bottom: 4px; }
.day-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.day-heading h3 { font-size: 15.5px; }
.day-areas { display: flex; gap: 6px; flex-wrap: wrap; }
.area-chip { font-size: 11px; background: var(--teal-soft); color: var(--teal); border-radius: 999px; padding: 2px 9px; display: inline-flex; align-items: center; gap: 4px; }
.day-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
.timeline-add-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-soft); font-size: 11.5px; cursor: pointer; }
.timeline-add-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
.timeline-add-btn .icon { width: 12px; height: 12px; }
.day-events { display: flex; flex-direction: column; gap: 8px; }
.event-row { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; }
.event-time { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); width: 44px; flex-shrink: 0; padding-top: 1px; }
.event-icon { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.event-icon .icon { width: 14px; height: 14px; }
.event-icon.k-activity { background: var(--accent-soft); color: var(--accent); }
.event-icon.k-transport { background: var(--teal-soft); color: var(--teal); }
.event-icon.k-stay { background: var(--surface-2); color: var(--ink-soft); }
.event-main { flex: 1; min-width: 0; }
.event-title { font-weight: 600; font-size: 13.5px; }
.event-sub { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
.overnight-note { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-faint); margin-top: 8px; padding-left: 2px; }
.overnight-note .icon { width: 13px; height: 13px; }
.no-day-events { font-size: 12.5px; color: var(--ink-faint); font-style: italic; padding: 4px 0; }

/* ---- 4f. Expenses table ------------------------------------------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 18px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; }
.stat-tile .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); font-weight: 600; }
.stat-tile .stat-value { font-family: var(--font-mono); font-size: 19px; font-weight: 600; margin-top: 4px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); background: var(--surface-2); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
.rate-missing { color: var(--danger); font-size: 11.5px; }
.rate-table label { margin: 0; }
.rate-table .field-row { grid-template-columns: 1fr 1fr; align-items: end; }

/* ---- 4g. Modal & toast --------------------------------------------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,18,24,.5); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
.modal { background: var(--surface); border-radius: var(--radius); max-width: 520px; width: 100%; box-shadow: var(--shadow); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 18px 20px; max-height: 65vh; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
.confirm-text { font-size: 14px; color: var(--ink-soft); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); z-index: 200; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

@media (max-width: 640px) {
  .field-row { grid-template-columns: 1fr; }
  .trip-title-row h1 { font-size: 23px; }
}

/* ---- 4h. Map tab ----------------------------------------------------- */
.map-toggles { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.map-day-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.map-day-controls .map-day-label { font-size: 13px; color: var(--ink-soft); margin-right: 2px; }
.map-day-controls input[type="date"] { min-height: 36px; }
.map-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); cursor: pointer; user-select: none; }
.map-toggle input { margin: 0; cursor: pointer; }
.map-toggle-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.map-canvas { height: 480px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); }
.map-status { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }
/* The little direction-of-travel triangle dropped at the midpoint of
   each transport leg (see addDirectionArrow() in the Map tab section).
   A plain CSS border-triangle rather than an image, so it's crisp at
   any zoom and its colour always matches the line it belongs to. The
   custom classname sidesteps Leaflet's default divIcon box (a white
   square with a border) — we want just the triangle, nothing around it.
   Points right (0deg) by default; JS rotates it to match each leg. */
.transport-arrow-icon { background: transparent; border: none; }
.transport-arrow {
  width: 0; height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-left: 11px solid; /* color set inline per-leg */
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
}
/* Leaflet's popup chrome is styled inline by the library; these few rules
   just make it sit comfortably against the app's own card/surface look
   instead of Leaflet's plain-white default. */
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
.leaflet-popup-content { font-family: var(--font-body); font-size: 13px; }
</style>
</head>

<div class="topbar">
  <div class="brand">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6z"/></svg>
    Waypoint
  </div>
  <span id="save-indicator" class="save-indicator"></span>
  <div id="account-bar" class="account-bar"></div>
</div>
<div class="page">
  <div id="app"></div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/WayPoint/vendor/leaflet/leaflet.js"></script>
<script src="/WayPoint/data/currencies.js"></script>
<script src="/WayPoint/data/timezones.js"></script>
<script src="/WayPoint/data/countries.js"></script>
<script src="/WayPoint/data/cities.js"></script>
<script src="/WayPoint/data/airports.js"></script>
<script src="/WayPoint/data/avatars.js"></script>
<!-- `defer`, unlike the data/*.js tags above: this file (~550KB, ~7,900
     airports) is a coordinate-lookup fallback only touched when a
     Flight leg is saved, never needed for the very first form's
     suggestion dropdown the way the others above are — see the comment
     at the top of data/airports-full.js for the full reasoning. -->
<script defer src="/WayPoint/data/airports-full.js"></script>
<script>
/* ================================================================
   WAYPOINT — application logic
   ----------------------------------------------------------------
   This file has no build step and no framework: it is plain
   JavaScript that (a) keeps all trip data in one JS object called
   `state`, (b) turns that object into HTML strings whenever
   something changes (the render* functions), and (c) saves the
   updated object to our own tiny JSON API (see loadInitialState()
   and persist() below), which stores it in Cloudflare KV — see
   src/worker.js in this same repo for the server side of that API —
   so the trips are still here next time you open the page. Sections
   below are ordered so each one only depends on the ones above it.
   ================================================================ */

/* ---------- 1. Small constants ---------------------------------- */

// COMMON_CURRENCIES, COMMON_TIMEZONES, COMMON_COUNTRIES, COMMON_CITIES
// and COMMON_AIRPORTS used to be defined right here as big inline
// arrays. They're now loaded from separate files under
// /WayPoint/data/ (see the <script> tags near the top of this file,
// just after leaflet.js) — purely to keep this file smaller, since a
// few thousand lines of airport/city/country names made this file
// unwieldy to upload/edit as a single piece. Nothing about how they're
// used changed: they're still plain globals by the time any of the
// code below runs. See data/airports.js specifically for why
// COMMON_AIRPORTS is shaped differently from the others (objects with
// city/country, not flat strings) — it's about the Map tab's
// geocoding, not just tidiness.

var WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var TRANSPORT_MODES = ['Flight','Train','Bus','Car','Ferry','Other'];
// How a transport leg was paid for — drives which cost-related fields
// show up on the form (see transportFieldsForMode()): Cash shows a
// currency+amount, Points shows a program+points-count, Combo shows
// both, and Free shows neither (nothing to record).
var TRANSPORT_PAYMENT_TYPES = ['Cash', 'Points', 'Combo', 'Free'];
var EXPENSE_CATEGORIES = ['Food & drink','Transport','Accommodation','Activities','Shopping','Other'];

/* ---------- 2. Generic utilities --------------------------------- */

// Turns any value into a short random-ish id, unique enough for a
// personal planner (not a distributed database, so this is plenty).
function newId() {
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

// Escapes text so it is always safe to drop straight into an HTML
// template string, whether it ends up as element text or inside a
// quoted attribute. Without this, a note containing e.g. `<` or `"`
// could break the page's markup.
function esc(value) {
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Finds one item in `list` by its id. Most of Waypoint's data now uses a
// typed id field name instead of a generic `id` -- a trip's own id field
// is `tripId`, a destination's is `destinationId`, and so on (see the
// "SCHEMA NOTE" comment in src/worker.js for why). Pass which field to
// match against as `idField` -- e.g. byId(trip.destinations, someId,
// 'destinationId'). Account/login records (see managedUsers below) still
// use the plain `id` field, which is why that's the default when
// `idField` is left out.
function byId(list, id, idField) {
  var field = idField || 'id';
  return (list || []).find(function (x) { return x[field] === id; });
}

// Maps a trip item type -- however it's referred to, whether the plural
// key it's stored under on the trip (e.g. "destinations") or the
// singular name used in click-action strings like "edit-destination" --
// to the name of that item's own id field. Centralised here so
// deleteEntity() and rowActions() (further down) both stay in sync about
// what each item type's id field is actually called.
var ENTITY_ID_FIELDS = {
  destination: 'destinationId', destinations: 'destinationId',
  activity: 'activityId', activities: 'activityId',
  transport: 'transportId',
  accommodation: 'accommodationId',
  contact: 'contactId', contacts: 'contactId',
  companion: 'companionId', companions: 'companionId',
  expense: 'expenseId', expenses: 'expenseId'
};

// Deep-clones the app state before we mutate it, so a half-finished
// edit never leaks into the UI before it's actually saved.
function cloneState(s) {
  if (typeof structuredClone === 'function') return structuredClone(s);
  return JSON.parse(JSON.stringify(s));
}

function slug(str) {
  return String(str || 'trip').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'trip';
}

/* ---- date/time helpers ----
   All dates are stored as plain "YYYY-MM-DD" strings and combined
   date+times as "YYYY-MM-DDTHH:MM". We deliberately avoid feeding
   these into `new Date("YYYY-MM-DD")` for display, because that
   parses as UTC midnight and then a *local* timezone conversion can
   silently roll the displayed date backwards a day. Working with
   the UTC getters keeps every user's timeline showing the date they
   actually typed in, no matter where they are. */

function addDays(dateStr, n) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}

function formatDateHeading(dateStr) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  return WEEKDAYS[dt.getUTCDay()] + ' ' + parts[2] + ' ' + MONTHS[parts[1] - 1] + ' ' + parts[0];
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  var parts = dateStr.split('-').map(Number);
  return parts[2] + ' ' + MONTHS[parts[1] - 1] + ' ' + parts[0];
}

function dateOnly(iso) { return iso ? iso.slice(0, 10) : ''; }
function timeOnly(iso) { return (iso && iso.length >= 16) ? iso.slice(11, 16) : ''; }

function combineDateTime(date, time) {
  if (!date) return '';
  return date + 'T' + (time || '00:00');
}
function splitDateTime(iso) {
  return { date: dateOnly(iso), time: timeOnly(iso) };
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

/* ---- currency helpers ---- */

// Converts an amount in `currency` into the trip's home currency.
// A per-item `rateOverride` always wins; otherwise we fall back to
// the trip's one fixed rate for that currency (set in Settings).
// `known` is false when neither is available, so callers can flag
// the amount instead of silently treating it as zero.
function homeValue(trip, amount, currency, rateOverride) {
  var amt = Number(amount) || 0;
  if (!currency || currency === trip.homeCurrency) return { value: amt, rateUsed: 1, known: true };
  var rate = (rateOverride !== undefined && rateOverride !== null && rateOverride !== '')
    ? Number(rateOverride)
    : trip.currencyRates[currency];
  if (rate === undefined || rate === null || isNaN(rate)) return { value: 0, rateUsed: null, known: false };
  return { value: amt * rate, rateUsed: rate, known: true };
}

function money(amount, currency) {
  var n = Number(amount) || 0;
  return esc(currency || '') + ' ' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Turns an IANA timezone name (e.g. "Asia/Bangkok") into a short
// current UTC-offset label (e.g. "GMT+7") using the browser's own
// timezone database — no network call involved. Returns '' for a
// blank or unrecognised timezone rather than throwing, since this is
// only ever used for a friendly hint next to the name the user typed.
function tzOffsetLabel(tz) {
  if (!tz) return '';
  try {
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(new Date());
    var part = parts.find(function (p) { return p.type === 'timeZoneName'; });
    return part ? part.value : '';
  } catch (e) {
    return '';
  }
}

/* ---------- 3. Icons ---------------------------------------------
   Small inline SVGs built from simple primitives (circles/lines/
   short paths) so the page needs no icon font or external asset. */

var ICONS = {
  pin: '<path d="M12 21s7-7.58 7-12A7 7 0 1 0 5 9c0 4.42 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/>',
  ticket: '<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/>',
  plane: '<path d="M2 13l20-9-9 20-2-8-8-3z"/>',
  train: '<rect x="5" y="3" width="14" height="13" rx="3"/><circle cx="8.5" cy="19" r="1.2"/><circle cx="15.5" cy="19" r="1.2"/><line x1="5" y1="11" x2="19" y2="11"/>',
  bus: '<rect x="3" y="5" width="18" height="11" rx="2"/><line x1="3" y1="11" x2="21" y2="11"/><circle cx="7.5" cy="19" r="1.3"/><circle cx="16.5" cy="19" r="1.3"/>',
  ferry: '<path d="M4 16l1.5 4h13L20 16"/><path d="M6 16V8h12v8"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="12" y1="3" x2="16" y2="5"/>',
  car: '<path d="M4 16V11l2-5h12l2 5v5"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="7.5" cy="17.5" r="1.4"/><circle cx="16.5" cy="17.5" r="1.4"/>',
  bed: '<path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7"/><path d="M3 15h18"/><path d="M7 11V8a1 1 0 0 1 1-1h3"/>',
  user: '<circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
  receipt: '<path d="M6 3h12v18l-2-1.3L14 21l-2-1.3L10 21l-2-1.3L6 21z"/><line x1="8.5" y1="8" x2="15.5" y2="8"/><line x1="8.5" y1="11.5" x2="15.5" y2="11.5"/>',
  moon: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  edit: '<path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20z"/>',
  trash: '<path d="M5 7h14"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13"/>',
