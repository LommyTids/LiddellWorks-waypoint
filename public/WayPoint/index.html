/* ---------- 8. Open-form helpers per entity -------------------------
   Each of these prepares the right initial values (splitting combined
   date+times back into separate fields for editing) and defines what
   happens on submit (recombining them, and pushing/updating the
   record inside `updateState`). */

function currentTrip() { return byId(state.trips, currentTripId); }

function defaultHomeCurrency() {
  var last = state.trips[state.trips.length - 1];
  return (last && last.homeCurrency) || 'GBP';
}

function openTripForm(existing) {
  openForm({
    title: existing ? 'Edit trip' : 'New trip',
    fields: TRIP_FIELDS,
    initial: existing || { homeCurrency: defaultHomeCurrency() },
    submitLabel: existing ? 'Save changes' : 'Create trip',
    onSubmit: function (v) {
      updateState(function (next) {
        if (existing) {
          var t = byId(next.trips, existing.id);
          t.name = v.name; t.startDate = v.startDate || ''; t.endDate = v.endDate || '';
          t.homeCurrency = (v.homeCurrency || 'GBP').toUpperCase(); t.notes = v.notes || '';
        } else {
          next.trips.push({
            id: newId(), name: v.name, startDate: v.startDate || '', endDate: v.endDate || '',
            homeCurrency: (v.homeCurrency || 'GBP').toUpperCase(), notes: v.notes || '',
            currencyRates: {}, destinations: [], activities: [], transport: [], accommodation: [], contacts: [], expenses: [],
            // A cache of place-name -> {lat,lng} lookups for the Map tab (see
            // the Map section further down), so the same place is only ever
            // looked up once, not re-fetched on every visit. {} for a new
            // trip; older trips just get one lazily the first time they need
            // it (see initMap()).
            geocodeCache: {}
          });
          currentTripId = next.trips[next.trips.length - 1].id;
          currentView = 'trip'; currentTab = 'timeline';
        }
      });
    }
  });
}

function openDestinationForm(trip, existing) {
  openForm({
    title: existing ? 'Edit destination' : 'Add destination', fields: DESTINATION_FIELDS,
    initial: existing || {}, trip: trip, submitLabel: 'Save',
    onSubmit: function (v) {
      updateState(function (next) {
        var t = byId(next.trips, trip.id);
        var rec = { id: existing ? existing.id : newId(), name: v.name, country: v.country || '', arriveDate: v.arriveDate, departDate: v.departDate, timezone: (v.timezone || '').trim(), notes: v.notes || '' };
        if (existing) t.destinations[t.destinations.findIndex(function (x) { return x.id === existing.id; })] = rec;
        else t.destinations.push(rec);
      });
    }
  });
}

function openActivityForm(trip, existing) {
  openForm({
    title: existing ? 'Edit activity' : 'Add activity', fields: ACTIVITY_FIELDS,
    initial: existing || {}, trip: trip, submitLabel: 'Save',
    onSubmit: function (v) {
      updateState(function (next) {
        var t = byId(next.trips, trip.id);
        var rec = {
          id: existing ? existing.id : newId(), title: v.title, destinationId: v.destinationId || '',
          date: v.date, startTime: v.startTime || '', endTime: v.endTime || '',
          location: v.location || '', address: v.address || '', bookingRef: v.bookingRef || '',
          contactId: v.contactId || '', costAmount: v.costAmount || '', costCurrency: (v.costCurrency || '').toUpperCase(),
          costRate: v.costRate || '', receiptRef: v.receiptRef || '', notes: v.notes || ''
        };
        if (existing) t.activities[t.activities.findIndex(function (x) { return x.id === existing.id; })] = rec;
        else t.activities.push(rec);
      });
    }
  });
}

// Resolves the map coordinate to save for one end (From or To) of a
// Flight leg, in priority order: (1) a known match in COMMON_AIRPORTS
// for the typed/selected code — the common case, and the one that
// actually fixes routes like SFO–ICN not showing up on the Map tab;
// (2) whatever the most recent "Look up" click in this form session (if
// any) returned for that end, via AeroDataBox's own location data (see
// lastFlightLookupCoords) — covers airports too minor to be in
// COMMON_AIRPORTS; (3) a coordinate already saved on this same leg from
// an earlier save, reused ONLY if the location text hasn't changed
// since (so editing "From" to somewhere else can't accidentally keep
// the old place's coordinate). Anything else returns null, which just
// means the Map tab falls back to geocoding the location text via
// Nominatim — exactly what it always did, for exactly the cases where
// nothing better is known.
function resolveLegCoords(text, lookupCoords, existing, textKey, latKey, lngKey) {
  var staticMatch = airportCoordsFromText(text);
  if (staticMatch) return staticMatch;
  if (lookupCoords) return lookupCoords;
  if (existing && existing[textKey] === text && typeof existing[latKey] === 'number' && typeof existing[lngKey] === 'number') {
    return { lat: existing[latKey], lng: existing[lngKey] };
  }
  return null;
}

function openTransportForm(trip, existing) {
  // A brand-new leg needs paymentType set explicitly to 'Free' here,
  // not left undefined — a <select> with nothing marked `selected`
  // just shows its first listed option ("Cash") regardless of what
  // transportPaymentFields() treats as the default internally, which
  // would show "Cash" selected while still rendering NO cost fields
  // (since that function separately defaults an undefined paymentType
  // to 'Free'). Setting it here keeps the visible selection and the
  // fields actually shown in agreement from the very first render.
  var initial = existing ? Object.assign({}, existing, splitDateTime(existing.departDateTime), {
    arriveDate: dateOnly(existing.arriveDateTime), arriveTime: timeOnly(existing.arriveDateTime)
  }) : { mode: 'Flight', paymentType: 'Free' };
  if (existing) { initial.departDate = dateOnly(existing.departDateTime); initial.departTime = timeOnly(existing.departDateTime); }
  if (existing) {
    // Older saved legs predate "Paid with" — infer a starting value
    // from what they already have (a cost amount means Cash; nothing
    // means Free) rather than defaulting blank, so editing one doesn't
    // make its existing cost data vanish behind a payment type that
    // hides it. costRateOverrideEnabled is real boolean state (not a
    // saved field) purely so the checkbox starts checked when a rate
    // override was already saved — see transportPaymentFields()'s
    // comment on how it reads this same key back off live form data.
    if (!initial.paymentType) initial.paymentType = existing.costAmount ? 'Cash' : 'Free';
    initial.costRateOverrideEnabled = !!existing.costRate;
  }
  // A fresh form session shouldn't inherit a coordinate from whatever
  // leg was last looked up (possibly minutes ago, possibly a
  // completely different leg) — see lastFlightLookupCoords' own
  // comment for why this matters.
  lastFlightLookupCoords = { from: null, to: null };
  openForm({
    title: existing ? 'Edit transport leg' : 'Add transport leg',
    // The field list depends on whichever mode AND payment type are
    // currently selected (a flight shows a flight-number field, Cash
    // shows a currency+amount, etc.) — see transportFieldsForMode().
    fields: function (values) { return transportFieldsForMode(values); },
    // Three fields drive a live re-render, not just Mode: switching
    // "Paid with" swaps in the right cost/points fields, and toggling
    // the exchange-rate checkbox shows/hides the override input right
    // underneath it — see the 'change' listener that reads this array.
    reactiveKey: ['mode', 'paymentType', 'costRateOverrideEnabled'],
    initial: initial, trip: trip, submitLabel: 'Save',
    onSubmit: function (v) {
      updateState(function (next) {
        var t = byId(next.trips, trip.id);
        // Coordinates are only meaningful for Flight legs — every other
        // mode's "From"/"To" are city-type free text (see
        // transportFieldsForMode()), with no airport code to match
        // against COMMON_AIRPORTS, so those just keep using Nominatim
        // text geocoding on the Map tab exactly as before.
        var fromCoords = null, toCoords = null;
        if (v.mode === 'Flight') {
          fromCoords = resolveLegCoords(v.fromLocation, lastFlightLookupCoords.from, existing, 'fromLocation', 'fromLat', 'fromLng');
          toCoords = resolveLegCoords(v.toLocation, lastFlightLookupCoords.to, existing, 'toLocation', 'toLat', 'toLng');
        }
        // Only keep cost/points data for whichever section "Paid with"
        // actually shows right now — e.g. switching an already-priced
        // leg to Free clears its cost rather than silently keeping a
        // cash amount nothing on screen still shows. This mirrors
        // exactly what transportPaymentFields() decided to render, so
        // nothing gets dropped that was still visible on save.
        var paymentType = v.paymentType || 'Free';
        var showCash = paymentType === 'Cash' || paymentType === 'Combo';
        var showPoints = paymentType === 'Points' || paymentType === 'Combo';
        var rateOverrideOn = v.costRateOverrideEnabled === 'on' || v.costRateOverrideEnabled === true;
        var rec = {
          id: existing ? existing.id : newId(), mode: v.mode || 'Other', carrier: v.carrier || '',
          flightNumber: v.flightNumber || '', licensePlate: v.licensePlate || '',
          fromLocation: v.fromLocation, toLocation: v.toLocation,
          fromLat: fromCoords ? fromCoords.lat : '', fromLng: fromCoords ? fromCoords.lng : '',
          toLat: toCoords ? toCoords.lat : '', toLng: toCoords ? toCoords.lng : '',
          departDateTime: combineDateTime(v.departDate, v.departTime), arriveDateTime: combineDateTime(v.arriveDate, v.arriveTime),
          bookingRef: v.bookingRef || '', contactId: v.contactId || '',
          paymentType: paymentType,
          costAmount: showCash ? (v.costAmount || '') : '',
          costCurrency: showCash ? (v.costCurrency || '').toUpperCase() : '',
          costRate: (showCash && rateOverrideOn) ? (v.costRate || '') : '',
          pointsProgram: showPoints ? (v.pointsProgram || '') : '',
          pointsAmount: showPoints ? (v.pointsAmount || '') : '',
          receiptRef: v.receiptRef || '', notes: v.notes || ''
        };
        if (existing) t.transport[t.transport.findIndex(function (x) { return x.id === existing.id; })] = rec;
        else t.transport.push(rec);
      });
    }
  });
}

// Handles the "Look up" button next to Flight number (see fieldHtml's
// 'flight-lookup' case and the 'lookup-flight' click-delegation
// branch below). Talks to our own /WayPoint/api/flight-lookup, which
// proxies AeroDataBox (via RapidAPI) — see src/worker.js's
// handleFlightLookup() for why that's a server-side call rather than
// one made straight from here. AeroDataBox looks flights up by number
// AND date.
//
// The date used to come ONLY from the real "Depart date" field further
// down the form — awkward, since that field isn't even visible yet at
// the point someone's just typed a flight number, so the natural first
// click just bounced off a "fill in Depart date first" message. Now
// there's a dedicated date input right next to the flight number (see
// fieldHtml's 'flight-lookup' case) — this prefers that one, and only
// falls back to "Depart date" if it's left blank, so editing an
// existing leg (which already prefilled both) still works exactly as
// before. Either way, once a lookup succeeds, the date actually used
// gets written back into "Depart date" too, so the two fields can't
// end up disagreeing regardless of which one someone actually typed
// into.
//
// On success this fills in Airline/From/To/times directly in the
// still-open form (not through updateState()/render() — the form is
// mid-edit, and a full re-render would discard anything else typed and
// reset field focus/scroll).
//
// AeroDataBox returns a few extra details (aircraft type, terminal,
// gate) that used to only ever appear transiently in the status line
// underneath ("...— not saved, just FYI") — genuinely thrown away the
// moment the form closed. mergeFlightLookupNotes() below is what fixes
// that: it folds those details into the Notes field instead, inside a
// clearly-delimited block so they're easy to spot (and so re-running
// "Look up" — e.g. after fixing a typo'd flight number — replaces that
// block rather than piling up duplicates underneath whatever the
// viewer already typed into Notes by hand).
var FLIGHT_LOOKUP_NOTES_START = '--- Flight lookup details (auto-filled by "Look up") ---';
var FLIGHT_LOOKUP_NOTES_END = '--- end flight lookup details ---';

function mergeFlightLookupNotes(existingNotes, detailLines) {
  var notes = (existingNotes || '').trim();
  var startIdx = notes.indexOf(FLIGHT_LOOKUP_NOTES_START);
  if (startIdx !== -1) {
    var endIdx = notes.indexOf(FLIGHT_LOOKUP_NOTES_END, startIdx);
    var afterEnd = endIdx !== -1 ? endIdx + FLIGHT_LOOKUP_NOTES_END.length : notes.length;
    notes = (notes.slice(0, startIdx) + notes.slice(afterEnd)).trim();
  }
  if (!detailLines.length) return notes;
  var block = FLIGHT_LOOKUP_NOTES_START + '\n' + detailLines.join('\n') + '\n' + FLIGHT_LOOKUP_NOTES_END;
  return notes ? (notes + '\n\n' + block) : block;
}

function performFlightLookup(button) {
  var form = document.getElementById('entity-form');
  if (!form) return;
  var flightInput = form.querySelector('[name="flightNumber"]');
  var quickDateInput = document.getElementById('flight-lookup-date');
  var departDateInput = form.querySelector('[name="departDate"]');
  var statusEl = document.getElementById('flight-lookup-status');
  var flightNumber = (flightInput && flightInput.value || '').trim();
  var quickDate = (quickDateInput && quickDateInput.value || '').trim();
  var departDate = quickDate || (departDateInput && departDateInput.value || '').trim();

  if (!flightNumber) {
    if (statusEl) { statusEl.textContent = 'Type a flight number first.'; statusEl.className = 'flight-lookup-status is-error'; }
    return;
  }
  if (!departDate) {
    if (statusEl) { statusEl.textContent = 'Pick a date first (either right here, or in "Depart date" below) — flight schedules are looked up per date.'; statusEl.className = 'flight-lookup-status is-error'; }
    return;
  }

  button.disabled = true;
  if (statusEl) { statusEl.textContent = 'Looking up ' + flightNumber + ' on ' + departDate + '…'; statusEl.className = 'flight-lookup-status'; }

  fetch('/WayPoint/api/flight-lookup?flightNumber=' + encodeURIComponent(flightNumber) + '&date=' + encodeURIComponent(departDate))
    .then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        return { ok: res.ok, body: body };
      });
    })
    .then(function (result) {
      // The form may have been closed (or switched away from Flight
      // mode) while the request was in flight — re-check both before
      // touching anything.
      var currentForm = document.getElementById('entity-form');
      if (!currentForm || currentForm !== form) return;
      var currentStatusEl = document.getElementById('flight-lookup-status');

      if (!result.ok) {
        if (currentStatusEl) {
          currentStatusEl.textContent = (result.body && result.body.error) || 'Flight lookup failed.';
          currentStatusEl.className = 'flight-lookup-status is-error';
        }
        return;
      }

      var data = result.body;
      var carrierInput = currentForm.querySelector('[name="carrier"]');
      var fromInput = currentForm.querySelector('[name="fromLocation"]');
      var toInput = currentForm.querySelector('[name="toLocation"]');
      var notesInput = currentForm.querySelector('[name="notes"]');
      var departDateField = currentForm.querySelector('[name="departDate"]');
      var departTimeField = currentForm.querySelector('[name="departTime"]');
      var arriveDateField = currentForm.querySelector('[name="arriveDate"]');
      var arriveTimeField = currentForm.querySelector('[name="arriveTime"]');
      if (carrierInput && data.airline) carrierInput.value = data.airline;
      if (fromInput && data.origin) fromInput.value = airportDisplay(data.origin);
      if (toInput && data.destination) toInput.value = airportDisplay(data.destination);
      // See this function's opening comment, and lastFlightLookupCoords'
      // own comment (near airportCoordsFromText()) — this is the "even
      // for an airport too minor to be in COMMON_AIRPORTS" fallback
      // source of real map coordinates, consulted at save time in
      // openTransportForm()'s onSubmit.
      lastFlightLookupCoords = {
        from: (data.origin && data.origin.location) ? data.origin.location : null,
        to: (data.destination && data.destination.location) ? data.destination.location : null
      };
      // The date searched with (whichever field it came from — see
      // this function's opening comment) is written into "Depart
      // date" here so it's always right there, even if someone typed
      // it only into the quick date input next to the flight number.
      // Arrival date DOES get filled in fresh (not just the time): a
      // flight can land the next calendar day, and AeroDataBox tells
      // us the real arrival date rather than us having to guess or
      // leave it defaulted to the depart date.
      if (departDateField) departDateField.value = departDate;
      if (departTimeField && data.departure && data.departure.time) departTimeField.value = data.departure.time;
      if (arriveDateField && data.arrival && data.arrival.date) arriveDateField.value = data.arrival.date;
      if (arriveTimeField && data.arrival && data.arrival.time) arriveTimeField.value = data.arrival.time;

      // Everything below used to only ever flash briefly in the status
      // line, then vanish once the form closed — mergeFlightLookupNotes()
      // (see this function's opening comment) now actually saves it
      // into the leg's Notes field instead, so it's still there next
      // time this leg is opened.
      var noteLines = [];
      noteLines.push(flightNumber + ' on ' + departDate + (data.airline ? ' (' + data.airline + ')' : ''));
      if (data.aircraft) noteLines.push('Aircraft: ' + data.aircraft);
      if (data.departure && (data.departure.terminal || data.departure.gate)) {
        noteLines.push('Departs' + (data.departure.terminal ? ' terminal ' + data.departure.terminal : '') + (data.departure.gate ? ', gate ' + data.departure.gate : ''));
      }
      if (data.arrival && (data.arrival.terminal || data.arrival.gate)) {
        noteLines.push('Arrives' + (data.arrival.terminal ? ' terminal ' + data.arrival.terminal : '') + (data.arrival.gate ? ', gate ' + data.arrival.gate : ''));
      }
      if (data.matchCount > 1) noteLines.push(data.matchCount + ' flights matched that number/date — this is the first match, double-check it\'s the right one.');
      if (notesInput) notesInput.value = mergeFlightLookupNotes(notesInput.value, noteLines);

      var extras = [];
      if (data.departure && data.departure.terminal) extras.push('departs terminal ' + data.departure.terminal);
      if (data.departure && data.departure.gate) extras.push('gate ' + data.departure.gate);
      if (data.arrival && data.arrival.terminal) extras.push('arrives terminal ' + data.arrival.terminal);
      var extrasText = extras.length ? ' (' + extras.join(', ') + ' — saved to Notes)' : '';
      var matchNote = data.matchCount > 1 ? ' Note: ' + data.matchCount + ' flights matched that number/date — this is the first match, double-check it\'s the right one.' : '';

      if (currentStatusEl) {
        currentStatusEl.textContent = 'Filled in from AeroDataBox' + extrasText + '.' + matchNote;
        currentStatusEl.className = 'flight-lookup-status is-ok';
      }
    })
    .catch(function () {
      var currentStatusEl = document.getElementById('flight-lookup-status');
      if (currentStatusEl) {
        currentStatusEl.textContent = 'Couldn\'t reach the flight lookup service — check your connection and try again.';
        currentStatusEl.className = 'flight-lookup-status is-error';
      }
    })
    .finally(function () {
      var currentButton = document.querySelector('[data-action="lookup-flight"]');
      if (currentButton) currentButton.disabled = false;
    });
}

// Builds the display/saved string for one airport, from EITHER shape
// this app deals with: a COMMON_AIRPORTS entry (data/airports.js —
// { code, name, city, country }), or one of handleFlightLookup()'s
// reshaped airport objects (src/worker.js's airportSummary() —
// { code, name, municipality, country }). Both are used the same way:
// as the value typed/saved into a transport leg's "From"/"To" field, so
// a looked-up value reads consistently with one a viewer picked by
// hand from the airport suggestion dropdown (see openSuggestions()).
//
// The result looks like "LHR — London Heathrow, London, United
// Kingdom" — deliberately fuller than the old "CODE — Name" alone.
// "From"/"To" feed straight into the Map tab's Nominatim geocoding
// (see geocodeLookup()/mapLegsForTrip()) — but that's now a fallback
// path, only used for airports NOT in COMMON_AIRPORTS' curated
// shortlist (which carries real coordinates — see
// airportCoordsFromText() just below, and the comment atop
// data/airports.js for the full story of why "From"/"To" text alone
// wasn't reliable enough for Nominatim). This still matters for that
// fallback case, and for just reading well in the itinerary either way,
// so it still builds a fuller string than a bare code — a bare airport
// code or name alone is often too little for Nominatim to place
// reliably, especially for smaller/regional airports.
//
// City is skipped from the "place" part when it's already embedded in
// the airport name (e.g. "London Heathrow" already says "London"), so
// the common case doesn't read as "LHR — London Heathrow, London,
// United Kingdom" with London twice — just "...London Heathrow, United
// Kingdom".
function airportDisplay(airport) {
  if (!airport) return '';
  var codeName = (airport.code && airport.name) ? (airport.code + ' — ' + airport.name)
    : (airport.code || airport.name || '');
  var city = airport.city || airport.municipality || '';
  var cityIsRedundant = city && airport.name && airport.name.toLowerCase().indexOf(city.toLowerCase()) !== -1;
  var placeParts = [];
  if (city && !cityIsRedundant) placeParts.push(city);
  if (airport.country) placeParts.push(airport.country);
  var place = placeParts.join(', ');
  if (!codeName) return place;
  return place ? (codeName + ', ' + place) : codeName;
}

// Looks up a real, known coordinate for an IATA-style airport code —
// the actual fix for routes like SFO–ICN not showing up on the Map
// tab. Tries two sources, in order:
//   1. COMMON_AIRPORTS (data/airports.js) — the curated ~126 major
//      hubs, checked first since it's tiny and always already loaded.
//   2. AIRPORT_DB (data/airports-full.js) — ~7,900 airports worldwide,
//      loaded with `defer` so it may (very briefly, on a first-ever
//      page load) not be ready yet; that's fine, since this only ever
//      runs when a Flight leg is actually saved, well after page load
//      finishes. Guarded with `typeof AIRPORT_DB !== 'undefined'`
//      purely as a defensive fallback in case that file ever fails to
//      load at all (e.g. briefly offline) — everything still works,
//      just without this tier.
// Returns null if neither has it, which is the signal for the caller
// (openTransportForm()'s onSubmit) to fall back further — to
// AeroDataBox's own location data if a "Look up" was done, and after
// that to Nominatim text geocoding, exactly as before.
function airportCoordsForCode(code) {
  var found = COMMON_AIRPORTS.filter(function (a) { return a.code === code; })[0];
  if (found && typeof found.lat === 'number' && typeof found.lng === 'number') return { lat: found.lat, lng: found.lng };
  if (typeof AIRPORT_DB !== 'undefined' && AIRPORT_DB[code]) {
    var entry = AIRPORT_DB[code]; // [name, city, countryCode, lat, lng]
    return { lat: entry[3], lng: entry[4] };
  }
  return null;
}

// Pulls the leading 3-letter airport code off a "CODE — Name, City,
// Country" (or bare "CODE") string — the shape both the airport
// suggestion dropdown and a successful flight lookup fill "From"/"To"
// with — and resolves it via airportCoordsForCode() above. Returns
// null for anything that doesn't start with a plausible 3-letter code
// (a city name typed for a non-Flight mode, say), which is fine — the
// caller just falls back to geocoding that text instead.
function airportCoordsFromText(text) {
  var m = /^([A-Za-z]{3})\b/.exec((text || '').trim());
  return m ? airportCoordsForCode(m[1].toUpperCase()) : null;
}

var MAX_AIRPORT_SUGGESTIONS = 30;
var MIN_AIRPORT_SEARCH_LENGTH = 2;

// A flattened, lowercased copy of AIRPORT_DB, built once on first use
// rather than every keystroke. AIRPORT_DB itself stores name/city with
// their original casing (so airportDisplay() and other callers get
// proper capitalization); searching needs a lowercased version of the
// same text to compare against, and doing that ~7,900-entry lowercase
// pass fresh on every single keystroke was real, measurable work on a
// slower device — most of what made typing feel laggy. This trades a
// few hundred KB of memory (built once, kept for the rest of the
// session) to turn every search after the first into a plain
// substring-compare loop instead.
var airportSearchIndex = null;
function airportSearchIndexReady() {
  if (airportSearchIndex || typeof AIRPORT_DB === 'undefined') return !!airportSearchIndex;
  airportSearchIndex = [];
  for (var code in AIRPORT_DB) {
    if (!Object.prototype.hasOwnProperty.call(AIRPORT_DB, code)) continue;
    var entry = AIRPORT_DB[code]; // [name, city, countryCode, lat, lng]
    airportSearchIndex.push({
      code: code, name: entry[0], city: entry[1],
      nameLower: (entry[0] || '').toLowerCase(), cityLower: (entry[1] || '').toLowerCase()
    });
  }
  return true;
}

// Searches for airports matching whatever's typed into a Flight leg's
// "From"/"To" field, against the FULL ~7,900-airport AIRPORT_DB, not
// just COMMON_AIRPORTS' curated ~126 — so typing e.g. "birmingham" or
// "bhx" finds a secondary airport too, the same way typing "london"
// already found LHR/LGW/STN/LTN among the curated hubs. Returns a
// plain array of { code, name, city }, capped at
// MAX_AIRPORT_SUGGESTIONS — under 2 characters (or before AIRPORT_DB
// has finished its `defer`red load) just returns the curated list, the
// same "nothing to search yet, show the obvious answers" fallback as
// before.
function searchAirports(query) {
  var q = (query || '').trim();
  if (q.length < MIN_AIRPORT_SEARCH_LENGTH || !airportSearchIndexReady()) return COMMON_AIRPORTS;

  var qUpper = q.toUpperCase();
  var qLower = q.toLowerCase();
  var matches = [];
  for (var i = 0; i < airportSearchIndex.length; i++) {
    var e = airportSearchIndex[i];
    var score = 0;
    // Ranked so an exact/prefix code match (what a frequent flyer types)
    // always beats a name/city text match (what someone browsing by
    // place typed) — both are useful, but shouldn't compete evenly.
    if (e.code === qUpper) score = 4;
    else if (e.code.indexOf(qUpper) === 0) score = 3;
    else if (e.cityLower.indexOf(qLower) === 0) score = 2;
    else if (e.nameLower.indexOf(qLower) !== -1 || e.cityLower.indexOf(qLower) !== -1) score = 1;
    if (score > 0) matches.push({ code: e.code, name: e.name, city: e.city, score: score });
  }
  matches.sort(function (a, b) { return (b.score - a.score) || a.code.localeCompare(b.code); });
  return matches.slice(0, MAX_AIRPORT_SUGGESTIONS);
}

// Updates the live "resolved to a real coordinate or not" hint under a
// Flight leg's "From"/"To" field (see fieldHtml's 'airport' case for
// the initial render of the same hint) as the viewer types.
function updateAirportResolveHint(input) {
  var hintEl = document.getElementById(input.name + '-resolve-hint');
  if (!hintEl) return;
  var val = input.value.trim();
  if (!val) { hintEl.textContent = ''; hintEl.className = 'field-hint airport-resolve-hint'; return; }
  var resolved = airportCoordsFromText(val);
  hintEl.textContent = resolved ? '✓ Mapped precisely for the Map tab' : 'No exact airport match yet — the map will try to search by name instead.';
  hintEl.className = 'field-hint airport-resolve-hint' + (resolved ? ' is-ok' : ' is-unresolved');
}

// ---- Generic suggestion dropdown -------------------------------------
//
// EVERY free-text field with suggestions — currency, timezone, country,
// city, and airport — shares this one mechanism, so they all look and
// behave identically. It replaces what used to be a native
// <input list="..."> wired to a <datalist> (airport was converted
// first, when real-world use turned up two problems with datalist that
// the others all had too: the browser's own suggestion popup renders
// wherever the browser decides, with no CSS hook to move it, so on a
// field near the edge of a narrow modal it can end up covering the very
// input it's attached to; and swapping the datalist's <option>s live —
// needed for airport's search-as-you-type widening — was interrupting
// mid-word typing on at least one real device/browser, the native
// popup seemingly fighting with the input over the keystroke that
// triggered the rebuild). A plain, app-rendered <div> (`.suggest-list`,
// positioned by the `.suggest-input-wrap` CSS rule right under its
// input) sidesteps both: we choose exactly where it sits, and
// rebuilding it is just an ordinary DOM update the input itself is
// never involved in, so it can never interrupt what's being typed.
//
// A field opts in by rendering its input inside `.suggest-input-wrap`
// with a `data-suggest-type="..."` attribute naming one of the sources
// below (see fieldHtml()'s 'currency'/'country'/'city'/'timezone'/
// 'airport' cases) — everything past that is handled here, generically,
// for every field the same way.
//
// Each source is just { search(query) -> array of items,
// display(item) -> the string shown in the dropdown AND written into
// the field on selection }. The plain-string fields (currency/timezone/
// country/city) share one small substring search; airport keeps its
// own richer one (code/city/name scoring across ~7,900 entries — see
// searchAirports() above) since it has real search work to do that the
// others don't.
function searchStringList(list, query) {
  var q = (query || '').trim().toLowerCase();
  if (!q) return list;
  // Ranked so a "starts with" match (what most people are typing
  // towards) surfaces before a mere "contains" match, same spirit as
  // searchAirports()'s scoring, just for plain string lists.
  var starts = [], contains = [];
  for (var i = 0; i < list.length; i++) {
    var lower = list[i].toLowerCase();
    if (lower.indexOf(q) === 0) starts.push(list[i]);
    else if (lower.indexOf(q) !== -1) contains.push(list[i]);
  }
  return starts.concat(contains);
}

var SUGGEST_SOURCES = {
  currency: { search: function (q) { return searchStringList(COMMON_CURRENCIES, q); }, display: function (item) { return item; } },
  timezone: { search: function (q) { return searchStringList(COMMON_TIMEZONES, q); }, display: function (item) { return item; } },
  country: { search: function (q) { return searchStringList(COMMON_COUNTRIES, q); }, display: function (item) { return item; } },
  city: { search: function (q) { return searchStringList(COMMON_CITIES, q); }, display: function (item) { return item; } },
  airport: { search: searchAirports, display: airportDisplay }
};

// suggestDropdownState tracks whichever ONE field currently has its
// dropdown open — a form can have several suggestible fields (a
// Flight leg has two airport fields, say), but only one can be
// focused/typed-into at a time, so a single shared state object
// (rather than one per field) is enough, and keeps the
// keyboard-navigation handlers below simple.
var suggestDropdownState = { input: null, items: [], activeIndex: -1, source: null };

function suggestListEl(input) {
  return input ? document.getElementById(input.name + '-suggest') : null;
}

function suggestSourceFor(input) {
  var type = input && input.getAttribute && input.getAttribute('data-suggest-type');
  return type ? SUGGEST_SOURCES[type] : null;
}

function isSuggestInput(el) {
  return !!(el && el.getAttribute && el.getAttribute('data-suggest-type'));
}

function closeSuggestions(input) {
  var el = suggestListEl(input);
  if (el) { el.classList.remove('is-open'); el.innerHTML = ''; }
  if (suggestDropdownState.input === input) suggestDropdownState = { input: null, items: [], activeIndex: -1, source: null };
}

function renderSuggestList(input) {
  var el = suggestListEl(input);
  if (!el) return;
  var items = suggestDropdownState.items;
  var display = suggestDropdownState.source.display;
  if (!items.length) {
    el.innerHTML = '<div class="suggest-empty">No matches yet</div>';
    el.classList.add('is-open');
    return;
  }
  el.innerHTML = items.map(function (item, i) {
    return '<div class="suggest-item' + (i === suggestDropdownState.activeIndex ? ' is-active' : '') +
      '" data-index="' + i + '">' + esc(display(item)) + '</div>';
  }).join('');
  el.classList.add('is-open');
  if (suggestDropdownState.activeIndex >= 0) {
    var active = el.querySelector('.suggest-item.is-active');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
  }
}

function openSuggestions(input) {
  var source = suggestSourceFor(input);
  if (!source) return;
  var items = source.search(input.value);
  suggestDropdownState = { input: input, items: items, activeIndex: -1, source: source };
  renderSuggestList(input);
}

function selectSuggestion(input, item) {
  input.value = suggestDropdownState.source.display(item);
  closeSuggestions(input);
  // Airport-only: keep the resolve-hint in sync when the value changes
  // via a click/keyboard selection, same as it already does on typed
  // input (see the 'input' listener below).
  if (input.getAttribute('data-suggest-type') === 'airport') updateAirportResolveHint(input);
}

// Debounced so a fast typist doesn't trigger a dropdown rebuild on
// every single keystroke — 120ms is short enough to still feel
// immediate, long enough to skip the in-between keystrokes of a normal
// typing burst. Airport's resolve-hint update is cheap enough (no list
// rebuild, just one lookup) to run on every keystroke without this.
var suggestDebounce = null;
document.addEventListener('input', function (e) {
  if (!isSuggestInput(e.target)) return;
  var input = e.target;
  if (input.getAttribute('data-suggest-type') === 'airport') updateAirportResolveHint(input);
  clearTimeout(suggestDebounce);
  suggestDebounce = setTimeout(function () { openSuggestions(input); }, 120);
});

// Opens with whatever's already there (the field's default list, on an
// empty field) as soon as the field is focused, same as a native
// datalist would've offered on focus.
document.addEventListener('focusin', function (e) {
  if (!isSuggestInput(e.target)) return;
  openSuggestions(e.target);
});

// Closing on blur needs a short delay: a click on a suggestion fires
// the input's blur before the click's own handler runs, so closing
// immediately would remove the option out from under the click. The
// mousedown handler below cancels that click from ever blurring the
// input in the first place, but the delay stays as a safety net for
// any other way focus can leave the field (Tab, tapping elsewhere).
document.addEventListener('focusout', function (e) {
  if (!isSuggestInput(e.target)) return;
  var input = e.target;
  setTimeout(function () { closeSuggestions(input); }, 150);
});

// preventDefault on mousedown (not click) is what stops the input
// from blurring at all when a suggestion is tapped/clicked — by the
// time a 'click' event would fire, blur has already happened.
document.addEventListener('mousedown', function (e) {
  var item = e.target.closest && e.target.closest('.suggest-item');
  if (!item) return;
  e.preventDefault();
  var input = suggestDropdownState.input;
  if (!input) return;
  var chosen = suggestDropdownState.items[parseInt(item.getAttribute('data-index'), 10)];
  if (chosen) selectSuggestion(input, chosen);
});

document.addEventListener('keydown', function (e) {
  if (!isSuggestInput(e.target) || suggestDropdownState.input !== e.target) return;
  var items = suggestDropdownState.items;
  if (e.key === 'Escape') { closeSuggestions(e.target); return; }
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    suggestDropdownState.activeIndex = Math.min(suggestDropdownState.activeIndex + 1, items.length - 1);
    renderSuggestList(e.target);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    suggestDropdownState.activeIndex = Math.max(suggestDropdownState.activeIndex - 1, 0);
    renderSuggestList(e.target);
  } else if (e.key === 'Enter' && suggestDropdownState.activeIndex >= 0) {
    e.preventDefault();
    selectSuggestion(e.target, items[suggestDropdownState.activeIndex]);
  }
});

// Holds whatever real coordinates the most recent successful flight
// lookup (in the currently-open transport form) returned for its

// Reset every time the transport form is (re)opened (see

var lastFlightLookupCoords = { from: null, to: null };

/* ---------- 9. Cost / expense aggregation --------------------------
   Every bookable item (activity, transport leg, accommodation stay)
   can carry its own cost; on top of that a trip can have standalone
   expenses (meals, taxis, souvenirs...). allCostLines() flattens all
   of it into one list so the Expenses tab and the CSV export both
   work from a single, consistent ledger. */

function allCostLines(trip) {
  var lines = [];
  trip.activities.forEach(function (a) {
    if (a.costAmount) lines.push({ date: a.date, type: 'Activity', desc: a.title, amount: a.costAmount, currency: a.costCurrency, rateOverride: a.costRate, receiptRef: a.receiptRef, bookingRef: a.bookingRef, category: 'Activities' });
  });
  trip.transport.forEach(function (t) {
    if (t.costAmount) lines.push({ date: dateOnly(t.departDateTime), type: 'Transport', desc: transportLabel(t), amount: t.costAmount, currency: t.costCurrency, rateOverride: t.costRate, receiptRef: t.receiptRef, bookingRef: t.bookingRef, category: 'Transport' });
  });
  trip.accommodation.forEach(function (ac) {
    if (ac.costAmount) lines.push({ date: dateOnly(ac.checkIn), type: 'Accommodation', desc: ac.name, amount: ac.costAmount, currency: ac.costCurrency, rateOverride: ac.costRate, receiptRef: ac.receiptRef, bookingRef: ac.bookingRef, category: 'Accommodation' });
  });
  trip.expenses.forEach(function (e) {
    lines.push({ date: e.date, type: 'Expense', desc: e.description, amount: e.amount, currency: e.currency, rateOverride: e.rateOverride, receiptRef: e.receiptRef, bookingRef: '', category: e.category || 'Other' });
  });
  lines.sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  return lines;
}

function usedCurrencies(trip) {
  var set = {};
  allCostLines(trip).forEach(function (l) { if (l.currency && l.currency !== trip.homeCurrency) set[l.currency] = true; });
  return Object.keys(set).sort();
}

function csvEscape(v) {
  var s = String(v === undefined || v === null ? '' : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildCsv(trip) {
  var lines = allCostLines(trip);
  var header = ['Date', 'Type', 'Category', 'Description', 'Amount', 'Currency', 'Rate used', 'Converted (' + trip.homeCurrency + ')', 'Booking ref', 'Receipt ref'];
  var rows = lines.map(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    return [l.date, l.type, l.category, l.desc, l.amount, l.currency, hv.rateUsed == null ? '' : hv.rateUsed, hv.known ? hv.value.toFixed(2) : 'unknown', l.bookingRef, l.receiptRef];
  });
  return [header].concat(rows).map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
}

// Builds the CSV text (see buildCsv() above) and hands it to the
// browser as a normal file download. This is the standard vanilla-JS
// download trick: wrap the text in a Blob, make a temporary object URL
// for it, click a hidden link pointing at that URL, then clean both up
// straight away. No server round-trip needed for this one.
function exportCsv(trip) {
  var csv = buildCsv(trip);
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = slug(trip.name) + '-expenses.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  // Give the browser a moment to actually start the download before we
  // revoke the URL it's reading from.
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ---------- 10. Timeline logic --------------------------------------
   This is the heart of the "multi-leg, overnight, several areas in a
   day" requirement: it builds one chronological agenda per trip that
   folds together destinations, activities, transport and
   accommodation, and makes overnight travel and multi-night stays
   visible instead of splitting them awkwardly across days. */

function tripDayList(trip) {
  var dates = {};
  function add(d) { if (d) dates[d] = true; }
  add(trip.startDate); add(trip.endDate);
  trip.destinations.forEach(function (d) { add(d.arriveDate); add(d.departDate); });
  trip.activities.forEach(function (a) { add(a.date); });
  trip.transport.forEach(function (t) { add(dateOnly(t.departDateTime)); add(dateOnly(t.arriveDateTime)); });
  trip.accommodation.forEach(function (a) { add(dateOnly(a.checkIn)); add(dateOnly(a.checkOut)); });
  var keys = Object.keys(dates).sort();
  if (keys.length === 0) return [];
  var out = []; var cur = keys[0]; var end = keys[keys.length - 1];
  while (cur <= end) { out.push(cur); cur = addDays(cur, 1); }
  return out;
}

function eventsForDay(trip, day) {
  var events = [];
  trip.activities.forEach(function (a) {
    if (a.date === day) events.push({ time: a.startTime || '00:00', kind: 'activity', data: a });
  });
  trip.accommodation.forEach(function (ac) {
    if (dateOnly(ac.checkIn) === day) events.push({ time: timeOnly(ac.checkIn) || '15:00', kind: 'checkin', data: ac });
    if (dateOnly(ac.checkOut) === day) events.push({ time: timeOnly(ac.checkOut) || '11:00', kind: 'checkout', data: ac });
  });
  trip.transport.forEach(function (t) {
    if (dateOnly(t.departDateTime) === day) events.push({ time: timeOnly(t.departDateTime) || '00:00', kind: 'depart', data: t });
    if (dateOnly(t.arriveDateTime) === day && dateOnly(t.arriveDateTime) !== dateOnly(t.departDateTime)) {
      events.push({ time: timeOnly(t.arriveDateTime) || '00:00', kind: 'arrive', data: t });
    }
  });
  events.sort(function (a, b) { return a.time.localeCompare(b.time); });
  return events;
}

function overnightStay(trip, day) {
  var stay = trip.accommodation.find(function (ac) { return dateOnly(ac.checkIn) <= day && day < dateOnly(ac.checkOut); });
  if (stay) return { kind: 'stay', data: stay };
  var nextDay = addDays(day, 1);
  var leg = trip.transport.find(function (t) { return dateOnly(t.departDateTime) === day && dateOnly(t.arriveDateTime) === nextDay; });
  if (leg) return { kind: 'transit', data: leg };
  return null;
}

function areasForDay(trip, day) {
  return trip.destinations.filter(function (d) { return d.arriveDate <= day && day <= d.departDate; });
}

/* ---------- 11. Trip-level stats ------------------------------------ */

function tripStatus(trip) {
  var today = todayStr();
  if (trip.startDate && trip.endDate) {
    if (today < trip.startDate) return 'upcoming';
    if (today > trip.endDate) return 'past';
    return 'ongoing';
  }
  if (trip.startDate && today < trip.startDate) return 'upcoming';
  if (trip.endDate && today > trip.endDate) return 'past';
  return 'upcoming';
}

function tripSpend(trip) {
  var known = 0, unknownCount = 0;
  allCostLines(trip).forEach(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    if (hv.known) known += hv.value; else unknownCount++;
  });
  return { known: known, unknownCount: unknownCount };
}

/* ---------- 13. Render: Trip view shell (header + tabs) -------------- */

// The two "big picture" views of a trip — see the day-by-day agenda, or
// see it on a map — are surfaced as large HERO_TABS buttons above the
// regular tab bar rather than being just another tab among the data-entry
// ones below, since they're what most people actually want to look at
// most of the time. Everything else (adding/editing the underlying data)
// lives in TABS, in the order requested: Destinations, Transport,
// Accommodation, Activities, then Contacts, with Expenses and Settings
// kept at the end as before. Both arrays share the exact same "switch-tab"
// data-action/click handler (see the click listener further down) — a
// hero button and a regular tab button are just two different looks for
// the same underlying currentTab switch.
var HERO_TABS = [
  { key: 'timeline', label: 'Timeline', icon: 'calendar' },
  { key: 'map', label: 'Map', icon: 'map' }
];

var TABS = [
  { key: 'destinations', label: 'Destinations', icon: 'pin' },
  { key: 'transport', label: 'Transport', icon: 'plane' },
  { key: 'accommodation', label: 'Accommodation', icon: 'bed' },
  { key: 'activities', label: 'Activities', icon: 'ticket' },
  { key: 'contacts', label: 'Contacts', icon: 'users' },
  { key: 'expenses', label: 'Expenses', icon: 'wallet' },
  { key: 'settings', label: 'Settings', icon: 'gear' }
];

function renderTripView() {
  var trip = currentTrip();
  if (!trip) { currentView = 'dashboard'; return renderDashboard(); }
  var spend = tripSpend(trip);
  var status = tripStatus(trip);
  var heroHtml = HERO_TABS.map(function (t) {
    return '<button class="hero-btn ' + (currentTab === t.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + t.key + '">' +
      icon(t.icon) + t.label + '</button>';
  }).join('');
  var tabsHtml = TABS.map(function (t) {
    return '<button class="tab-btn ' + (currentTab === t.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + t.key + '">' +
      icon(t.icon) + t.label + '</button>';
  }).join('');
  var panel;
  switch (currentTab) {
    case 'destinations': panel = renderDestinationsTab(trip); break;
    case 'activities': panel = renderActivitiesTab(trip); break;
    case 'transport': panel = renderTransportTab(trip); break;
    case 'accommodation': panel = renderAccommodationTab(trip); break;
    case 'map': panel = renderMapTab(trip); break;
    case 'contacts': panel = renderContactsTab(trip); break;
    case 'expenses': panel = renderExpensesTab(trip); break;
    case 'settings': panel = renderSettingsTab(trip); break;

      '<button class="back-link" data-action="back-to-dashboard">' + icon('back') + ' All trips</button>' +

            '<span>' + (trip.startDate ? formatDateShort(trip.startDate) : '?') + ' – ' + (trip.endDate ? formatDateShort(trip.endDate) : '?') + '</span>' +
            '<span><b>' + money(spend.known, trip.homeCurrency) + '</b> spent so far' +
              (spend.unknownCount ? ' · <button class="warn-link" data-action="switch-tab" data-tab="settings">' + spend.unknownCount + ' need an exchange rate</button>' : '') +
            '</span>' +

        '</div>' +
        '<div class="card-actions" data-write-only>' +
          '<button class="btn btn-icon btn-ghost" data-action="edit-trip" data-id="' + trip.id + '" title="Edit trip">' + icon('edit') + '</button>' +
          '<button class="btn btn-icon btn-ghost" data-action="delete-trip" data-id="' + trip.id + '" title="Delete trip">' + icon('trash') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="hero-row">' + heroHtml + '</div>' +
    '<div class="tabbar">' + tabsHtml + '</div>' +

/* ---------- 14. Shared row-rendering helpers -------------------------- */

function copyBtn(value, label) {
  if (!value) return '';
  return '<button class="copy-btn" data-action="copy-text" data-value="' + esc(value) + '" title="Copy ' + esc(label) + '">' + icon('copy') + '</button>';
}

function mapsLink(address) {
  if (!address) return '';
  var url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">Open in Maps ' + icon('arrowRight') + '</a>';

function costTag(trip, amount, currency, rateOverride) {
  if (!amount) return '';
  var hv = homeValue(trip, amount, currency, rateOverride);
  var label = money(amount, currency);
  if (currency && currency !== trip.homeCurrency) {
    label += hv.known ? ' (≈ ' + money(hv.value, trip.homeCurrency) + ')' : ' (rate needed)';
  }
  return '<span class="tag tag-cost">' + icon('wallet') + label + '</span>';

function rowActions(trip, section, item, label) {

/* ---------- 15. Render: Destinations tab ------------------------------ */

function renderDestinationsTab(trip) {
  if (trip.destinations.length === 0) return emptyTab('pin', 'No destinations yet', 'Add the places or areas you\'ll be based in — activities and accommodation can then be tagged to them.', 'new-destination', 'Add destination');
  var sorted = trip.destinations.slice().sort(function (a, b) { return (a.arriveDate || '') < (b.arriveDate || '') ? -1 : 1; });
  var rows = sorted.map(function (d) {
    var tzOffset = d.timezone ? tzOffsetLabel(d.timezone) : '';
    var tzTag = d.timezone ? '<span class="tag">' + icon('clock') + esc(d.timezone) + (tzOffset ? ' (' + esc(tzOffset) + ')' : '') + '</span>' : '';
    return '<div class="item-row"><div class="item-icon">' + icon('pin') + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(d.name) + (d.country ? ', ' + esc(d.country) : '') + '</span></div>' +
      '<div class="item-sub">' + formatDateShort(d.arriveDate) + ' – ' + formatDateShort(d.departDate) + '</div>' +
      (tzTag ? '<div class="item-tags">' + tzTag + '</div>' : '') +
      (d.notes ? '<div class="item-sub">' + esc(d.notes) + '</div>' : '') +
      '</div>' + rowActions(trip, 'destination', d) + '</div>';
  }).join('');
  return tabHead('Destinations', 'new-destination', 'Add destination') + '<div class="item-list">' + rows + '</div>';

/* ---------- 16. Render: Activities tab -------------------------------- */

function renderActivitiesTab(trip) {
  if (trip.activities.length === 0) return emptyTab('ticket', 'No activities yet', 'Tours, museum visits, dinner reservations — anything with a date and time.', 'new-activity', 'Add activity');
  var sorted = trip.activities.slice().sort(function (a, b) { return ((a.date || '') + (a.startTime || '')) < ((b.date || '') + (b.startTime || '')) ? -1 : 1; });
  var rows = sorted.map(function (a) {
    var dest = a.destinationId ? byId(trip.destinations, a.destinationId) : null;
    var contact = a.contactId ? byId(trip.contacts, a.contactId) : null;
    var tags = [];
    if (a.location) tags.push('<span class="tag">' + esc(a.location) + '</span>');
    if (dest) tags.push('<span class="tag">' + icon('pin') + esc(dest.name) + '</span>');
    if (a.bookingRef) tags.push('<span class="tag">' + icon('ticket') + esc(a.bookingRef) + copyBtn(a.bookingRef, 'booking ref') + '</span>');
    if (contact) tags.push('<span class="tag">' + icon('user') + esc(contact.name) + '</span>');
    if (a.costAmount) tags.push(costTag(trip, a.costAmount, a.costCurrency, a.costRate));
    return '<div class="item-row"><div class="item-icon">' + icon('ticket') + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(a.title) + '</span><span class="item-sub">' + formatDateShort(a.date) + (a.startTime ? ' · ' + a.startTime : '') + (a.endTime ? '–' + a.endTime : '') + '</span></div>' +
      (a.address ? '<div class="item-sub">' + esc(a.address) + ' ' + mapsLink(a.address) + '</div>' : '') +

  }).join('');
  return tabHead('Activities', 'new-activity', 'Add activity') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 17. Render: Transport tab ---------------------------------- */

function renderTransportTab(trip) {

  var sorted = trip.transport.slice().sort(function (a, b) { return (a.departDateTime || '') < (b.departDateTime || '') ? -1 : 1; });

    if (t.carrier) tags.push('<span class="tag">' + esc(t.carrier) + '</span>');

      '<div class="item-sub">' + formatDateShort(dateOnly(t.departDateTime)) + ' ' + timeOnly(t.departDateTime) +
