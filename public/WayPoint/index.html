}

// Handles the "Look up" button next to Flight number (see fieldHtml's
// 'flight-lookup' case and the 'lookup-flight' click-delegation branch
// below). Talks to /WayPoint/api/flight-lookup, which proxies
// AeroDataBox server-side (see handleFlightLookup() in src/worker.js).
// AeroDataBox looks flights up by number and date.
//
// The date used to come only from "Depart date" further down the form --
// awkward, since that field isn't visible yet when someone's just typed
// a flight number. Now there's a dedicated date input next to the flight
// number (fieldHtml's 'flight-lookup' case); this prefers that one and
// falls back to "Depart date" if blank. Once a lookup succeeds, the date
// used is written back into "Depart date" too, so they can't disagree.
//
// On success this fills in Airline/From/To/times directly in the
// still-open form (not through updateState()/render(), which would
// discard other typed fields and reset focus/scroll).
//
// AeroDataBox returns extra details (aircraft type, terminal, gate) that
// used to just flash in the status line and vanish. mergeFlightLookupNotes()
// below folds those into Notes instead, in a clearly-delimited block so
// re-running "Look up" replaces it rather than piling up duplicates.
var FLIGHT_LOOKUP_NOTES_START = '--- Flight lookup details (auto-filled by "Look up") ---';
var FLIGHT_LOOKUP_NOTES_END = '--- end flight lookup details ---';

function mergeFlightLookupNotes(existingNotes, detailLines) {
  var notes = (existingNotes || '').trim();
  var startIdx = notes.indexOf(FLIGHT_LOOKUP_NOTES_START);
  if (startIdx !== -1) {
    var endIdx = notes.indexOf(FLIGHT_LOOKUP_NOTES_END, startIdx);
    var afterEnd = endIdx !== -1 ? endIdx + FLIGHT_LOOKUP_NOTES_END.length : notes.length;
    notes = (notes.slice(0, startIdx) + notes.slice(afterEnd)).trim();
  }
  if (!detailLines.length) return notes;
  var block = FLIGHT_LOOKUP_NOTES_START + '\n' + detailLines.join('\n') + '\n' + FLIGHT_LOOKUP_NOTES_END;
  return notes ? (notes + '\n\n' + block) : block;
}

// Preserve a reviewed pin for the same airport; changed airports must update
// the label and hidden coordinates together, never retain the previous pin.
function applyFlightAirport(input, airport) {
  var wrapper = input.closest('[data-location-picker]');
  if (!wrapper) { input.value = airportDisplay(airport); return; }
  var prefix = wrapper.dataset.locationPrefix;
  var priorCode = /^([A-Z]{3})\b/i.exec(input.value.trim());
  var priorLat = (pickerInput(wrapper, prefix + 'Lat') || {}).value;
  var priorLng = (pickerInput(wrapper, prefix + 'Lng') || {}).value;
  var stale = (pickerInput(wrapper, prefix + 'LocationStale') || {}).value === 'true';
  if (!stale && priorCode && priorCode[1].toUpperCase() === airport.code && priorLat !== '' && priorLat != null && priorLng !== '' && priorLng != null) return;
  var coords = airportCoordsForCode(airport.code) || airport.location;
  selectLocationResult(wrapper, {
    name: airportDisplay(airport), lat: coords ? coords.lat : '', lng: coords ? coords.lng : '',
    locationRef: /^[A-Z]{3}$/.test(airport.code || '') && coords ? 'local:airport:' + airport.code : '',
    granularity: coords ? 'airport' : 'unknown', kindLabel: coords ? 'Airport' : ''
  });
  if (!coords) {
    var summary = wrapper.querySelector('[data-location-summary]');
    if (summary) summary.hidden = true;
    pickerHint(wrapper, 'Airport details updated. Find the location or set a pin to map it.');
  }
}

function performFlightLookup(button) {
  var form = document.getElementById('entity-form');
  if (!form) return;
  var flightInput = form.querySelector('[name="flightNumber"]');
  var quickDateInput = document.getElementById('flight-lookup-date');
  var departDateInput = form.querySelector('[name="departDate"]');
  var statusEl = document.getElementById('flight-lookup-status');
  var flightNumber = (flightInput && flightInput.value || '').trim();
  var quickDate = (quickDateInput && quickDateInput.value || '').trim();
  var departDate = quickDate || (departDateInput && departDateInput.value || '').trim();

  if (!flightNumber) {
    if (statusEl) { statusEl.textContent = 'Type a flight number first.'; statusEl.className = 'flight-lookup-status is-error'; }
    return;
  }
  if (!departDate) {
    if (statusEl) { statusEl.textContent = 'Pick a date first (either right here, or in "Depart date" below) — flight schedules are looked up per date.'; statusEl.className = 'flight-lookup-status is-error'; }
    return;
  }

  button.disabled = true;
  if (statusEl) { statusEl.textContent = 'Looking up ' + flightNumber + ' on ' + departDate + '…'; statusEl.className = 'flight-lookup-status'; }

  fetch('/WayPoint/api/flight-lookup?flightNumber=' + encodeURIComponent(flightNumber) + '&date=' + encodeURIComponent(departDate), { credentials: 'same-origin' })
    .then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        return { ok: res.ok, body: body };
      });
    })
    .then(function (result) {
      // The form may have been closed (or switched away from Flight
      // mode) while the request was in flight — re-check both before
      // touching anything.
      var currentForm = document.getElementById('entity-form');
      if (!currentForm || currentForm !== form) return;
      var liveFlight = currentForm.querySelector('[name="flightNumber"]');
      var liveLookupDate = document.getElementById('flight-lookup-date');
      var liveDepartDate = currentForm.querySelector('[name="departDate"]');
      if (!liveFlight || liveFlight.value.trim() !== flightNumber || ((liveLookupDate && liveLookupDate.value) || (liveDepartDate && liveDepartDate.value) || '') !== departDate) return;
      var currentStatusEl = document.getElementById('flight-lookup-status');

      if (!result.ok) {
        if (currentStatusEl) {
          currentStatusEl.textContent = (result.body && result.body.error) || 'Flight lookup failed.';
          currentStatusEl.className = 'flight-lookup-status is-error';
        }
        return;
      }

      var data = result.body;
      var carrierInput = currentForm.querySelector('[name="carrier"]');
      var fromInput = currentForm.querySelector('[name="fromLocation"]');
      var toInput = currentForm.querySelector('[name="toLocation"]');
      var notesInput = currentForm.querySelector('[name="notes"]');
      var departDateField = currentForm.querySelector('[name="departDate"]');
      var departTimeField = currentForm.querySelector('[name="departTime"]');
      var arriveDateField = currentForm.querySelector('[name="arriveDate"]');
      var arriveTimeField = currentForm.querySelector('[name="arriveTime"]');
      if (carrierInput && data.airline) carrierInput.value = data.airline;
      if (fromInput && data.origin) applyFlightAirport(fromInput, data.origin);
      if (toInput && data.destination) applyFlightAirport(toInput, data.destination);
      // See lastFlightLookupCoords' own comment -- this is the fallback
      // coordinate source for an airport too minor for COMMON_AIRPORTS,
      // consulted at save time in openTransportForm()'s onSubmit.
      lastFlightLookupCoords = {
        from: (data.origin && data.origin.location) ? data.origin.location : null,
        to: (data.destination && data.destination.location) ? data.destination.location : null
      };
      // The date searched with is written into "Depart date" here, even
      // if typed only into the quick date input. Arrival date gets
      // filled in fresh too: a flight can land the next calendar day,
      // and AeroDataBox gives the real date rather than us guessing.
      if (departDateField) departDateField.value = departDate;
      if (departTimeField && data.departure && data.departure.time) departTimeField.value = data.departure.time;
      if (arriveDateField && data.arrival && data.arrival.date) arriveDateField.value = data.arrival.date;
      if (arriveTimeField && data.arrival && data.arrival.time) arriveTimeField.value = data.arrival.time;
      var transportJourney = currentForm.querySelector('[data-journey]');
      if (transportJourney) {
        var transportJourneyAuto = currentForm.elements[transportJourney.dataset.autoKey];
        if (transportJourneyAuto) transportJourneyAuto.value = 'false';
        updateJourneyPresentation(currentForm, transportJourney);
      }

      // This used to only flash in the status line, then vanish --
      // mergeFlightLookupNotes() now saves it into Notes so it's still
      // there next time this leg is opened.
      var noteLines = [];
      noteLines.push(flightNumber + ' on ' + departDate + (data.airline ? ' (' + data.airline + ')' : ''));
      if (data.aircraft) noteLines.push('Aircraft: ' + data.aircraft);
      if (data.departure && (data.departure.terminal || data.departure.gate)) {
        noteLines.push('Departs' + (data.departure.terminal ? ' terminal ' + data.departure.terminal : '') + (data.departure.gate ? ', gate ' + data.departure.gate : ''));
      }
      if (data.arrival && (data.arrival.terminal || data.arrival.gate)) {
        noteLines.push('Arrives' + (data.arrival.terminal ? ' terminal ' + data.arrival.terminal : '') + (data.arrival.gate ? ', gate ' + data.arrival.gate : ''));
      }
      if (data.matchCount > 1) noteLines.push(data.matchCount + ' flights matched that number/date — this is the first match, double-check it\'s the right one.');
      if (notesInput) notesInput.value = mergeFlightLookupNotes(notesInput.value, noteLines);

      var extras = [];
      if (data.departure && data.departure.terminal) extras.push('departs terminal ' + data.departure.terminal);
      if (data.departure && data.departure.gate) extras.push('gate ' + data.departure.gate);
      if (data.arrival && data.arrival.terminal) extras.push('arrives terminal ' + data.arrival.terminal);
      var extrasText = extras.length ? ' (' + extras.join(', ') + ' — saved to Notes)' : '';
      var matchNote = data.matchCount > 1 ? ' Note: ' + data.matchCount + ' flights matched that number/date — this is the first match, double-check it\'s the right one.' : '';

      if (currentStatusEl) {
        currentStatusEl.textContent = 'Filled in from AeroDataBox' + extrasText + '.' + matchNote;
        currentStatusEl.className = 'flight-lookup-status is-ok';
      }
    })
    .catch(function () {
      if (document.getElementById('entity-form') !== form || !button.isConnected) return;
      var currentStatusEl = document.getElementById('flight-lookup-status');
      if (currentStatusEl) {
        currentStatusEl.textContent = 'Couldn\'t reach the flight lookup service — check your connection and try again.';
        currentStatusEl.className = 'flight-lookup-status is-error';
      }
    })
    .finally(function () {
      if (button.isConnected) button.disabled = false;
    });
}

// Builds the display/saved string for one airport, from either shape
// this app deals with: a COMMON_AIRPORTS entry ({ code, name, city,
// country }), or handleFlightLookup()'s reshaped airportSummary()
// ({ code, name, municipality, country }). Both feed a transport leg's
// "From"/"To" field the same way, so a looked-up value reads consistently
// with one picked from the suggestion dropdown.
//
// Result looks like "LHR — London Heathrow, London, United Kingdom" --
// fuller than "CODE — Name" alone, giving enough context to choose
// between similarly named airports; the map coordinate is stored
// separately. City is skipped from the "place" part when already
// embedded in the airport name, to avoid "...London Heathrow, London,
// United Kingdom" reading with London twice.
function airportDisplay(airport) {
  if (!airport) return '';
  var codeName = (airport.code && airport.name) ? (airport.code + ' — ' + airport.name)
    : (airport.code || airport.name || '');
  var city = airport.city || airport.municipality || '';
  var cityIsRedundant = city && airport.name && airport.name.toLowerCase().indexOf(city.toLowerCase()) !== -1;
  var placeParts = [];
  if (city && !cityIsRedundant) placeParts.push(city);
  if (airport.country) placeParts.push(airport.country);
  var place = placeParts.join(', ');
  if (!codeName) return place;
  return place ? (codeName + ', ' + place) : codeName;
}

// Looks up a real, known coordinate for an IATA-style airport code.
// Tries two sources, in order:
//   1. COMMON_AIRPORTS (data/airports.js) — curated ~126 major hubs,
//      tiny and always already loaded.
//   2. AIRPORT_DB (data/airports-full.js) — ~7,900 airports worldwide,
//      loaded with `defer`, so guarded with `typeof AIRPORT_DB !==
//      'undefined'` in case it hasn't loaded yet (or fails to load).
// Returns null if neither has it -- the caller (openTransportForm()'s
// onSubmit) then leaves the end unmapped.
function airportCoordsForCode(code) {
  var found = COMMON_AIRPORTS.filter(function (a) { return a.code === code; })[0];
  if (found && typeof found.lat === 'number' && typeof found.lng === 'number') return { lat: found.lat, lng: found.lng };
  if (typeof AIRPORT_DB !== 'undefined' && AIRPORT_DB[code]) {
    var entry = AIRPORT_DB[code]; // [name, city, countryCode, lat, lng]
    return { lat: entry[3], lng: entry[4] };
  }
  return null;
}

// Pulls the leading 3-letter airport code off a "CODE — Name, City,
// Country" (or bare "CODE") string and resolves it via
// airportCoordsForCode() above. Returns null for anything that doesn't
// start with a plausible code (a city name for a non-Flight mode, say).
function airportCoordsFromText(text) {
  var m = /^([A-Za-z]{3})\b/.exec((text || '').trim());
  return m ? airportCoordsForCode(m[1].toUpperCase()) : null;
}

var MAX_AIRPORT_SUGGESTIONS = 30;
var MIN_AIRPORT_SEARCH_LENGTH = 2;

// A flattened, lowercased copy of AIRPORT_DB, built once on first use
// rather than every keystroke. AIRPORT_DB keeps original casing (for
// display); searching needs lowercase, and redoing that ~7,900-entry
// pass on every keystroke was measurably laggy on a slower device.
// Trades a few hundred KB of memory for a plain substring-compare loop.
var airportSearchIndex = null;
function airportSearchIndexReady() {
  if (airportSearchIndex || typeof AIRPORT_DB === 'undefined') return !!airportSearchIndex;
  airportSearchIndex = [];
  for (var code in AIRPORT_DB) {
    if (!Object.prototype.hasOwnProperty.call(AIRPORT_DB, code)) continue;
    var entry = AIRPORT_DB[code]; // [name, city, countryCode, lat, lng]
    airportSearchIndex.push({
      code: code, name: entry[0], city: entry[1],
      nameLower: (entry[0] || '').toLowerCase(), cityLower: (entry[1] || '').toLowerCase()
    });
  }
  return true;
}

// Searches airports typed into a Flight leg's "From"/"To" field against
// the full ~7,900-airport AIRPORT_DB, not just COMMON_AIRPORTS' curated
// ~126, so "birmingham" or "bhx" finds a secondary airport too. Returns
// { code, name, city } capped at MAX_AIRPORT_SUGGESTIONS -- under 2
// characters (or before AIRPORT_DB finishes loading) falls back to the
// curated list.
function searchAirports(query) {
  var q = (query || '').trim();
  if (q.length < MIN_AIRPORT_SEARCH_LENGTH || !airportSearchIndexReady()) return COMMON_AIRPORTS;

  var qUpper = q.toUpperCase();
  var qLower = q.toLowerCase();
  var matches = [];
  for (var i = 0; i < airportSearchIndex.length; i++) {
    var e = airportSearchIndex[i];
    var score = 0;
    // Ranked so an exact/prefix code match (what a frequent flyer types)
    // always beats a name/city text match (what someone browsing by
    // place typed) — both are useful, but shouldn't compete evenly.
    if (e.code === qUpper) score = 4;
    else if (e.code.indexOf(qUpper) === 0) score = 3;
    else if (e.cityLower.indexOf(qLower) === 0) score = 2;
    else if (e.nameLower.indexOf(qLower) !== -1 || e.cityLower.indexOf(qLower) !== -1) score = 1;
    if (score > 0) matches.push({ code: e.code, name: e.name, city: e.city, score: score });
  }
  matches.sort(function (a, b) { return (b.score - a.score) || a.code.localeCompare(b.code); });
  return matches.slice(0, MAX_AIRPORT_SUGGESTIONS);
}

// Updates the live "resolved to a real coordinate or not" hint under a
// Flight leg's "From"/"To" field (see fieldHtml's 'airport' case for
// the initial render of the same hint) as the viewer types.
function updateAirportResolveHint(input) {
  var hintEl = document.getElementById(input.name + '-resolve-hint');
  if (!hintEl) return;
  var val = input.value.trim();
  if (!val) { hintEl.textContent = ''; hintEl.className = 'field-hint airport-resolve-hint'; return; }
  var resolved = airportCoordsFromText(val);
  hintEl.textContent = resolved ? '✓ Mapped precisely for the Map tab' : 'No exact airport match yet — the map will try to search by name instead.';
  hintEl.className = 'field-hint airport-resolve-hint' + (resolved ? ' is-ok' : ' is-unresolved');
}

// ---- Generic suggestion dropdown -------------------------------------
//
// Every free-text field with suggestions — currency, timezone, country,
// city, airport — shares this one mechanism. Replaces a native
// <input list="..."> + <datalist> (dropped after two real problems: the
// browser's own popup renders wherever it decides, with no CSS hook, so
// it can cover the input near a narrow modal's edge; and swapping
// <option>s live for airport's search-as-you-type interrupted mid-word
// typing on at least one device). A plain app-rendered <div>
// (`.suggest-list`, positioned by `.suggest-input-wrap`) sidesteps both.
//
// A field opts in by rendering its input inside `.suggest-input-wrap`
// with `data-suggest-type="..."` naming one of the sources below (see
// fieldHtml()'s 'currency'/'country'/'city'/'timezone'/'airport' cases).
//
// Each source is { search(query) -> items, display(item) -> the string
// shown and written on selection }. Plain-string fields share one
// substring search; airport keeps its own richer scoring (see
// searchAirports() above).
function searchStringList(list, query) {
  var q = (query || '').trim().toLowerCase();
  if (!q) return list;
  // Ranked so a "starts with" match (what most people are typing
  // towards) surfaces before a mere "contains" match, same spirit as
  // searchAirports()'s scoring, just for plain string lists.
  var starts = [], contains = [];
  for (var i = 0; i < list.length; i++) {
    var lower = list[i].toLowerCase();
    if (lower.indexOf(q) === 0) starts.push(list[i]);
    else if (lower.indexOf(q) !== -1) contains.push(list[i]);
  }
  return starts.concat(contains);
}

var SUGGEST_SOURCES = {
  currency: { search: function (q) { return searchStringList(COMMON_CURRENCIES, q); }, display: function (item) { return item; } },
  timezone: { search: function (q) { return searchStringList(COMMON_TIMEZONES, q); }, display: function (item) { return item; } },
  country: { search: function (q) { return searchStringList(COMMON_COUNTRIES, q); }, display: function (item) { return item; } },
  city: { search: function (q) { return searchStringList(COMMON_CITIES, q); }, display: function (item) { return item; } },
  airport: { search: searchAirports, display: airportDisplay }
};

// suggestDropdownState tracks whichever one field currently has its
// dropdown open — only one can be focused at a time, so a single shared
// state object keeps the keyboard-navigation handlers below simple.
var suggestDropdownState = { input: null, items: [], activeIndex: -1, source: null };

function suggestListEl(input) {
  return input ? document.getElementById(input.name + '-suggest') : null;
}

function suggestSourceFor(input) {
  var type = input && input.getAttribute && input.getAttribute('data-suggest-type');
  return type ? SUGGEST_SOURCES[type] : null;
}

function isSuggestInput(el) {
  return !!(el && el.getAttribute && el.getAttribute('data-suggest-type'));
}

function closeSuggestions(input) {
  clearTimeout(suggestDebounce);
  var el = suggestListEl(input);
  if (el) { el.classList.remove('is-open'); el.innerHTML = ''; }
  if (input) {
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  if (suggestDropdownState.input === input) suggestDropdownState = { input: null, items: [], activeIndex: -1, source: null };
}

function renderSuggestList(input) {
  var el = suggestListEl(input);
  if (!el) return;
  var items = suggestDropdownState.items;
  var display = suggestDropdownState.source.display;
  var status = document.getElementById(input.name + '-suggest-status');
  input.setAttribute('aria-expanded', 'true');
  if (!items.length) {
    el.innerHTML = '<div class="suggest-empty">No matches yet</div>';
    el.classList.add('is-open');
    input.removeAttribute('aria-activedescendant');
    if (status) status.textContent = 'No suggestions available.';
    return;
  }
  el.innerHTML = items.map(function (item, i) {
    return '<div class="suggest-item' + (i === suggestDropdownState.activeIndex ? ' is-active' : '') +
      '" id="' + input.name + '-suggest-option-' + i + '" role="option" aria-selected="' + (i === suggestDropdownState.activeIndex) + '" data-index="' + i + '">' + esc(display(item)) + '</div>';
  }).join('');
  el.classList.add('is-open');
  if (status) status.textContent = items.length + ' suggestion' + (items.length === 1 ? '' : 's') + ' available. Use the arrow keys to review them.';
  if (suggestDropdownState.activeIndex >= 0) {
    var active = el.querySelector('.suggest-item.is-active');
    if (active) input.setAttribute('aria-activedescendant', active.id);
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
  } else {
    input.removeAttribute('aria-activedescendant');
  }
}

function openSuggestions(input) {
  var source = suggestSourceFor(input);
  if (!source) return;
  var items = source.search(input.value);
  suggestDropdownState = { input: input, items: items, activeIndex: -1, source: source };
  renderSuggestList(input);
}

function selectSuggestion(input, item) {
  input.value = suggestDropdownState.source.display(item);
  closeSuggestions(input);
  // Airport-only: keep the resolve-hint in sync when the value changes
  // via a click/keyboard selection, same as it already does on typed
  // input (see the 'input' listener below).
  if (input.getAttribute('data-suggest-type') === 'airport') updateAirportResolveHint(input);
  // Programmatic choices must notify Journey captions and validation just as
  // typed changes do, without reopening the suggestion list.
  input.dispatchEvent(new Event('change', { bubbles: true }));
}

// Debounced so a fast typist doesn't trigger a dropdown rebuild on
// every single keystroke — 120ms is short enough to still feel
// immediate, long enough to skip the in-between keystrokes of a normal
// typing burst. Airport's resolve-hint update is cheap enough (no list
// rebuild, just one lookup) to run on every keystroke without this.
var suggestDebounce = null;
document.addEventListener('input', function (e) {
  if (!isSuggestInput(e.target)) return;
  var input = e.target;
  if (input.getAttribute('data-suggest-type') === 'airport') updateAirportResolveHint(input);
  clearTimeout(suggestDebounce);
  suggestDebounce = setTimeout(function () { if (input.isConnected && document.activeElement === input) openSuggestions(input); }, 120);
});

// Opens with whatever's already there (the field's default list, on an
// empty field) as soon as the field is focused, same as a native
// datalist would've offered on focus.
document.addEventListener('focusin', function (e) {
  if (!isSuggestInput(e.target)) return;
  openSuggestions(e.target);
});

// Closing on blur needs a short delay: a click on a suggestion fires
// the input's blur before the click's own handler runs, so closing
// immediately would remove the option out from under the click. The
// mousedown handler below cancels that click from ever blurring the
// input in the first place, but the delay stays as a safety net for
// any other way focus can leave the field (Tab, tapping elsewhere).
document.addEventListener('focusout', function (e) {
  if (!isSuggestInput(e.target)) return;
  var input = e.target;
  setTimeout(function () { closeSuggestions(input); }, 150);
});

// preventDefault on mousedown (not click) is what stops the input
// from blurring at all when a suggestion is tapped/clicked — by the
// time a 'click' event would fire, blur has already happened.
document.addEventListener('mousedown', function (e) {
  var item = e.target.closest && e.target.closest('.suggest-item');
  if (!item) return;
  e.preventDefault();
  var input = suggestDropdownState.input;
  if (!input) return;
  var chosen = suggestDropdownState.items[parseInt(item.getAttribute('data-index'), 10)];
  if (chosen) selectSuggestion(input, chosen);
});

document.addEventListener('keydown', function (e) {
  if (!isSuggestInput(e.target) || suggestDropdownState.input !== e.target) return;
  var items = suggestDropdownState.items;
  if (e.key === 'Escape') { closeSuggestions(e.target); return; }
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    suggestDropdownState.activeIndex = Math.min(suggestDropdownState.activeIndex + 1, items.length - 1);
    renderSuggestList(e.target);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    suggestDropdownState.activeIndex = Math.max(suggestDropdownState.activeIndex - 1, 0);
    renderSuggestList(e.target);
  } else if (e.key === 'Enter' && suggestDropdownState.activeIndex >= 0) {
    e.preventDefault();
    selectSuggestion(e.target, items[suggestDropdownState.activeIndex]);
  }
});

/* ---- Shared location-picker behaviour -------------------------------- */

var locationPickerResults = {};

function pickerInput(wrapper, name) {
  return wrapper.querySelector('input[name="' + name + '"]');
}

function pickerSet(wrapper, name, value) {
  var input = pickerInput(wrapper, name);
  if (input) input.value = value === undefined || value === null ? '' : value;
}

function pickerSummary(wrapper, label, stale) {
  var summary = wrapper.querySelector('[data-location-summary]');
  if (!summary) return;
  summary.hidden = false;
  summary.classList.toggle('is-stale', !!stale);
  var status = summary.querySelector('.location-selected-status');
  var detail = summary.querySelector('span:last-child');
  if (status) status.textContent = stale ? 'Location may not match' : label;
  if (detail) detail.textContent = stale ? 'Search again to confirm this location' : '';
}

function pickerHint(wrapper, message, isError) {
  var hint = wrapper.querySelector('[data-location-hint]');
  if (!hint) return;
  hint.textContent = message || '';
  hint.style.color = isError ? 'var(--wp-state-danger)' : '';
}

function abortLocationSearch(wrapper) {
  if (wrapper._locationSearchController) {
    wrapper._locationSearchController.abort();
    wrapper._locationSearchController = null;
  }
  // An aborted request no longer owns its finally block. Restore the controls
  // here as well, otherwise typing during a request leaves Find disabled.
  var button = wrapper.querySelector('[data-action="search-location"]');
  if (button) button.disabled = false;
  var region = wrapper.querySelector('[data-location-results]');
  if (region) region.setAttribute('aria-busy', 'false');
}

function clearPickerMap(wrapper) {
  var holder = wrapper.querySelector('[data-location-pin-map]');
  if (!holder) return;
  if (holder._waypointMap) holder._waypointMap.remove();
  holder._waypointMap = null;
  holder.classList.remove('is-open');
}

function invalidatePickerBoundary(wrapper, clearStored) {
  if (wrapper._boundaryController) wrapper._boundaryController.abort();
  wrapper._boundaryController = null;
  wrapper._boundary = null;
  var prefix = wrapper.dataset.boundaryPrefix;
  if (prefix && clearStored) {
    pickerSet(wrapper, prefix + 'Ref', '');
    pickerSet(wrapper, prefix + 'Quality', 'none');
    pickerSet(wrapper, prefix + 'Bbox', '');
  }
}

function disposeLocationPickers(scope) {
  if (!scope) return;
  Array.prototype.forEach.call(scope.querySelectorAll('[data-location-picker]'), function (wrapper) {
    abortLocationSearch(wrapper);
    invalidatePickerBoundary(wrapper, false);
    clearPickerMap(wrapper);
  });
}

function localAirportLocationResults(query) {
  var q = (query || '').trim();
  if (q.length < 2) return [];
  return searchAirports(q).slice(0, 6).map(function (airport) {
    var coords = airportCoordsForCode(airport.code);
    return {
      locationRef: 'local:airport:' + airport.code,
      name: airportDisplay(airport),
      formattedAddress: [airport.city, airport.country].filter(Boolean).join(', '),
      kindLabel: 'Airport', lat: coords && coords.lat, lng: coords && coords.lng,
      granularity: 'airport', bbox: null, boundaryRef: ''
    };
  }).filter(function (candidate) { return Number.isFinite(candidate.lat) && Number.isFinite(candidate.lng); });
}

function renderLocationResults(wrapper, results) {
  var el = wrapper.querySelector('[data-location-results]');
  if (!el) return;
  var prefix = wrapper.dataset.locationPrefix;
  locationPickerResults[prefix] = results;
  if (!results.length) {
    el.innerHTML = '<div class="suggest-empty">No matching places found. You can keep the text or set a pin manually.</div>';
  } else {
    el.innerHTML = results.map(function (result, i) {
      return '<button type="button" class="location-result" data-action="select-location-result" data-location-index="' + i + '">' +
        '<span class="location-result-title"><span>' + esc(result.name) + '</span><span class="location-result-kind">' + esc(result.kindLabel || 'Place') + '</span></span>' +
        '<span class="location-result-address">' + esc(result.formattedAddress || '') + '</span></button>';
    }).join('');
  }
  el.setAttribute('aria-busy', 'false');
  el.hidden = false;
}

async function searchLocationPicker(wrapper) {
  abortLocationSearch(wrapper);
  var query = wrapper.querySelector('[data-location-query]');
  if (!query) return;
  var text = query.value.trim();
  if (text.length < 2) { pickerHint(wrapper, 'Enter at least two characters to search.', true); return; }
  var context = wrapper.dataset.locationContext || 'transport';
  var kind = wrapper.dataset.locationKind || 'point';
  var local = context === 'airport' ? localAirportLocationResults(text) : [];
  if (local.length) { renderLocationResults(wrapper, local); pickerHint(wrapper, 'Airport results are from Waypoint’s local airport data.'); return; }
  var controller = new AbortController();
  wrapper._locationSearchController = controller;
  var resultsRegion = wrapper.querySelector('[data-location-results]');
  if (resultsRegion) resultsRegion.setAttribute('aria-busy', 'true');
  var searchButton = wrapper.querySelector('[data-action="search-location"]');
  if (searchButton) searchButton.disabled = true;
  var params = new URLSearchParams({ q: text, context: context, kind: kind });
  var form = wrapper.closest('form');
  var destinationId = form && form.querySelector('[name="destinationId"]');
  var trip = currentTrip();
  if (destinationId && destinationId.value && trip) {
    var destination = byId(trip.destinations, destinationId.value, 'destinationId');
    if (destination && Number.isFinite(destination.lat) && Number.isFinite(destination.lng)) {
      params.set('lat', destination.lat); params.set('lng', destination.lng);
    }
  }
  var countryKey = wrapper.dataset.locationCountryKey;
  var countryInput = countryKey && form && form.querySelector('[name="' + countryKey + '"]');
  if (countryInput && /^[A-Za-z]{2}$/.test(countryInput.value.trim())) params.set('country', countryInput.value.trim());
  pickerHint(wrapper, 'Searching…');
  try {
    var response = await fetch('/WayPoint/api/location-search?' + params.toString(), { signal: controller.signal });
    var data = await response.json();
    if (wrapper._locationSearchController !== controller) return;
    if (!response.ok) throw new Error(data.error || 'Location search failed.');
    renderLocationResults(wrapper, data.results || []);
    pickerHint(wrapper, data.attribution ? data.attribution.label : '');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    if (wrapper._locationSearchController !== controller) return;
    renderLocationResults(wrapper, []);
    pickerHint(wrapper, err.message || 'Location search failed. You can still use typed text or set a pin manually.', true);
  } finally {
    if (wrapper._locationSearchController === controller) {
      wrapper._locationSearchController = null;
      if (searchButton) searchButton.disabled = false;
      if (resultsRegion) resultsRegion.setAttribute('aria-busy', 'false');
    }
  }
}

function selectLocationResult(wrapper, result) {
  abortLocationSearch(wrapper);
  invalidatePickerBoundary(wrapper, true);
  clearPickerMap(wrapper);
  var prefix = wrapper.dataset.locationPrefix;
  var query = wrapper.querySelector('[data-location-query]');
  if (query) query.value = wrapper.dataset.locationValue === 'address' ? (result.formattedAddress || result.name || '') : (result.name || result.formattedAddress || '');
  var addressKey = wrapper.dataset.locationAddressKey;
  if (addressKey) pickerSet(wrapper, addressKey, result.formattedAddress || '');
  pickerSet(wrapper, prefix + 'Lat', result.lat);
  pickerSet(wrapper, prefix + 'Lng', result.lng);
  pickerSet(wrapper, prefix + 'LocationRef', result.locationRef || '');
  pickerSet(wrapper, prefix + 'LocationMethod', 'selected');
  pickerSet(wrapper, prefix + 'LocationGranularity', result.granularity || 'unknown');
  pickerSet(wrapper, prefix + 'LocationStale', 'false');
  pickerSet(wrapper, prefix + 'LocationKindLabel', result.kindLabel || '');
  var results = wrapper.querySelector('[data-location-results]');
  if (results) { results.hidden = true; results.innerHTML = ''; }
  pickerSummary(wrapper, 'Mapped', false);
  var actions = wrapper.querySelector('.location-picker-actions');
  if (actions && !actions.querySelector('[data-action="preview-location"]')) {
    actions.insertAdjacentHTML('beforeend', '<button type="button" class="btn btn-ghost" data-action="preview-location">View on map</button>');
  }
  pickerHint(wrapper, 'Location selected.');
  if (query) { query.dispatchEvent(new Event('change', { bubbles: true })); query.focus(); }
  if (wrapper.dataset.boundaryPrefix && result.boundaryRef) loadLocationBoundary(wrapper, result.boundaryRef);
}

async function loadLocationBoundary(wrapper, ref) {
  var prefix = wrapper.dataset.boundaryPrefix;
  invalidatePickerBoundary(wrapper, false);
  var controller = new AbortController();
  wrapper._boundaryController = controller;
  pickerHint(wrapper, 'Loading destination area…');
  try {
    var response = await fetch('/WayPoint/api/location-boundary?ref=' + encodeURIComponent(ref), { signal: controller.signal });
    var data = await response.json();
    if (wrapper._boundaryController !== controller || !wrapper.isConnected) return;
    if (!response.ok) throw new Error(data.error || 'No destination boundary available.');
    wrapper._boundary = data;
    pickerSet(wrapper, prefix + 'Ref', ref);
    pickerSet(wrapper, prefix + 'Quality', data.geometryQuality || 'none');
    pickerSet(wrapper, prefix + 'Bbox', JSON.stringify(data.bbox || []));
    pickerHint(wrapper, data.geometry ? 'Destination area ready — view it on the map to check it.' : 'Destination saved as a point.');
  } catch (err) {
    if (wrapper._boundaryController !== controller || !wrapper.isConnected || err.name === 'AbortError') return;
    pickerSet(wrapper, prefix + 'Ref', ''); pickerSet(wrapper, prefix + 'Quality', 'none'); pickerSet(wrapper, prefix + 'Bbox', '');
    pickerHint(wrapper, err.message || 'No area boundary is available; this destination will use a point.', false);
  }
}

function openLocationPickerMap(wrapper, allowPlacement) {
  var holder = wrapper.querySelector('[data-location-pin-map]');
  if (!holder) return;
  if (holder._waypointMap && holder._allowPlacement === allowPlacement) { holder._waypointMap.invalidateSize(); return; }
  // Rebuild when switching between preview and editing: the old event closure
  // intentionally did not allow placement, so reusing it would do nothing.
  clearPickerMap(wrapper);
  holder.classList.add('is-open');
  holder._allowPlacement = allowPlacement;
  var prefix = wrapper.dataset.locationPrefix;
  var rawLat = (pickerInput(wrapper, prefix + 'Lat') || {}).value;
  var rawLng = (pickerInput(wrapper, prefix + 'Lng') || {}).value;
  var lat = rawLat === '' || rawLat == null ? NaN : Number(rawLat);
  var lng = rawLng === '' || rawLng == null ? NaN : Number(rawLng);
  var mapped = Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
  var map = L.map(holder, { scrollWheelZoom: true }).setView(mapped ? [lat, lng] : [20, 0], mapped ? 13 : 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors' }).addTo(map);
  holder._waypointMap = map;
  var marker = null;
  var setMarker = function (point, manual) {
    if (marker) marker.setLatLng(point); else {
      marker = L.marker(point, { draggable: allowPlacement }).addTo(map);
      if (allowPlacement) marker.on('dragend', function () { setMarker(marker.getLatLng(), true); });
    }
    if (allowPlacement && manual && editingAvailable()) {
      abortLocationSearch(wrapper);
      invalidatePickerBoundary(wrapper, true);
      pickerSet(wrapper, prefix + 'Lat', point.lat); pickerSet(wrapper, prefix + 'Lng', point.lng);
      pickerSet(wrapper, prefix + 'LocationRef', ''); pickerSet(wrapper, prefix + 'LocationMethod', 'manual');
      pickerSet(wrapper, prefix + 'LocationGranularity', 'unknown'); pickerSet(wrapper, prefix + 'LocationKindLabel', ''); pickerSet(wrapper, prefix + 'LocationStale', 'false');
      if (wrapper.dataset.boundaryPrefix) {
        var boundaryPrefix = wrapper.dataset.boundaryPrefix;
        pickerSet(wrapper, boundaryPrefix + 'Ref', ''); pickerSet(wrapper, boundaryPrefix + 'Quality', 'none'); pickerSet(wrapper, boundaryPrefix + 'Bbox', '');
      }
      pickerSummary(wrapper, 'Manual pin', false); pickerHint(wrapper, 'Pin set. Drag it or click the map to adjust.');
    }
  };
  if (mapped) setMarker(L.latLng(lat, lng), false);
  if (allowPlacement) pickerHint(wrapper, 'Click the map or drag the pin to choose a location. Opening the map does not change your saved location.');
  var boundary = wrapper._boundary;
  if (boundary && boundary.geometry) {
    var destinationColor = cssToken('--wp-map-destination');
    var layer = L.geoJSON(boundary.geometry, { style: { color: destinationColor, weight: 2, fillColor: destinationColor, fillOpacity: 0.18 } }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [16, 16] });
  }
  if (allowPlacement) {
    map.on('click', function (event) { setMarker(event.latlng, true); });
  }
  setTimeout(function () { if (holder._waypointMap === map) map.invalidateSize(); }, 0);
}

document.addEventListener('input', function (e) {
  if (!e.target.matches('[data-location-query]')) return;
  var wrapper = e.target.closest('[data-location-picker]');
  if (!wrapper) return;
  abortLocationSearch(wrapper);
  invalidatePickerBoundary(wrapper, false);
  var oldResults = wrapper.querySelector('[data-location-results]');
  if (oldResults) { oldResults.hidden = true; oldResults.innerHTML = ''; }
  var prefix = wrapper.dataset.locationPrefix;
  var latInput = pickerInput(wrapper, prefix + 'Lat');
  if (latInput && latInput.value !== '') {
    pickerSet(wrapper, prefix + 'LocationStale', 'true');
    pickerSummary(wrapper, 'Location may not match', true);
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target.matches('[data-location-query]')) return;
  e.preventDefault();
  var wrapper = e.target.closest('[data-location-picker]');
  if (wrapper) searchLocationPicker(wrapper);
});

// Holds coordinates the most recent successful flight lookup (in the

var lastFlightLookupCoords = { from: null, to: null };

function openCompanionForm(trip, existing) {
  // A "user" grant only ever reaches this via "Add companion" (rowActions()
  // never shows Edit/Delete to anything less than full-scope), so
  // `existing` shouldn't be set for them, but the shorter field list is
  // chosen from the actual permission either way, so it can't silently
  // show a field that would just be dropped on save.
  var fields = canFullyEditTrip(trip) ? COMPANION_FIELDS : COMPANION_FIELDS_LIMITED;
  // `smileyColor` is a flat form field but lives nested in storage
  // (`avatar.smiley`) — flatten it here, fold it back in onSubmit below.
  var initial = existing ? Object.assign({}, existing, { smileyColor: (existing.avatar && existing.avatar.smiley) || '' }) : {};
  openForm({
    title: existing ? 'Edit companion' : 'Add companion', fields: fields,
    initial: initial, trip: trip, submitLabel: 'Save',
    onSubmit: function (v) {
      updateState(function (next) {
        var t = byId(next.trips, trip.tripId, 'tripId');
        var rec = { companionId: existing ? existing.companionId : newId(), name: v.name };
        // notes is only on the full COMPANION_FIELDS list -- v.notes is
        // undefined for a "user" grant's COMPANION_FIELDS_LIMITED, so
        // this naturally comes out as '' without an extra check.
        rec.notes = v.notes || '';
        if (v.smileyColor) rec.avatar = { smiley: v.smileyColor };
        // Deliberately no `accountId` here, ever -- the Worker reasserts
        // any existing link from its own stored truth regardless (see
        // reconcileCompanionAccountLinks() in src/worker.js).
        if (existing) t.companions[t.companions.findIndex(function (x) { return x.companionId === existing.companionId; })] = rec;
        else t.companions.push(rec);
        // No need to touch other records to rename a tag -- every tag is
        // stored as just the companion's id and looked up by name at
        // render time, so a rename is instantly reflected everywhere.

        // Keep the optimistic render's companionAvatars map in sync too --
        // persist() re-renders immediately from this locally-mutated
        // clone, before the server's recomputed map comes back. Without
        // this a just-added/recoloured companion's marker would render
        // blank until the next reload. Mirrors resolveCompanionAvatars()'s
        // "smiley" branch in src/worker.js. Never "account": linking is
        // its own action (openCompanionLinkForm()), and recolouring an
        // already-linked companion doesn't affect its marker at all.
        if (!existing || !existing.accountId) {
          t.companionAvatars = t.companionAvatars || {};
          var smileyToken = (v.smileyColor && avatarColorHex(v.smileyColor)) ? v.smileyColor : AVATAR_COLORS[deterministicAvatarIndex(rec.companionId, AVATAR_COLORS.length)].token;
          t.companionAvatars[rec.companionId] = { type: 'smiley', color: smileyToken };
        }
      });
    }
  });
}

/* ---------- Link (or unlink) a companion to an account, AND manage
   their privilege level on this trip. Superuser/Admin only
   (canLinkCompanion()). Two small dedicated endpoints do the work --
   /api/companions/link for the account link, /api/trip-grants (and
   /trip-grants/revoke) for the privilege level -- rather than the normal
   save path, since this is identity/access data needing its own
   server-side permission check (see handleCompanionLink()/
   handleTripGrantsUpsert() and COMPANIONS & AVATARS in src/worker.js).
   See submitCompanionAccess() below for how the calls fit together. --- */
var GRANT_ROLE_LABELS = {
  admin: 'Admin — full read/write',
  user: 'User — read/write, own items only',
  viewer: 'Viewer — read-only, own items only'
};

function openCompanionLinkForm(trip, companion) {
  var isLinked = isCompanionLinked(trip, companion);
  // Prefills the current username when there is one to show -- only
  // possible for a full-scope role (both receive `trip.grants`). If this
  // companion is linked to an account not shared on this trip, the field
  // just starts blank rather than guessing.
  var currentGrant = companion.accountId ? (trip.grants || []).find(function (g) { return g.accountId === companion.accountId; }) : null;
  var currentUsername = currentGrant ? currentGrant.username : '';
  // The privilege level to prefill, resolved the same way the
  // access-level tag on their row is (renderCompanionsTab()) --
  // 'superuser'/'admin'/'user'/'viewer', or undefined for none.
  var currentRole = trip.companionAccessLevels && trip.companionAccessLevels[companion.companionId];
  var iCanGrantAdmin = canGrantAdminRole(trip);
  // Two cases where the level can't be changed from this form -- shown
  // as a disabled select, not hidden, so their standing is still clear:
  //   - 'superuser' means this account IS the trip's owner (or uber-user)
  //     -- not a `grants` entry, nothing to upsert or revoke.
  //   - 'admin' when I can't grant Admin myself (only the real owner can).
  var roleLocked = currentRole === 'superuser' || (currentRole === 'admin' && !iCanGrantAdmin);
  var roleSelectHtml;
  if (roleLocked) {
    var lockedLabel = currentRole === 'superuser' ? 'Owner — can\'t be changed here' : GRANT_ROLE_LABELS.admin;
    roleSelectHtml = '<select disabled><option selected>' + esc(lockedLabel) + '</option></select>' +
      '<div class="field-hint">' + (currentRole === 'superuser'
        ? 'This account already owns this trip (or is the site owner) — its access can\'t be managed here.'
        : 'Only this trip\'s owner can change or remove another Admin\'s access.') + '</div>';
  } else {
    roleSelectHtml = '<select name="role">' +
      '<option value=""' + (!currentRole ? ' selected' : '') + '>No trip access (just linked)</option>' +
      '<option value="user"' + (currentRole === 'user' ? ' selected' : '') + '>' + esc(GRANT_ROLE_LABELS.user) + '</option>' +
      '<option value="viewer"' + (currentRole === 'viewer' ? ' selected' : '') + '>' + esc(GRANT_ROLE_LABELS.viewer) + '</option>' +
      (iCanGrantAdmin ? '<option value="admin"' + (currentRole === 'admin' ? ' selected' : '') + '>' + esc(GRANT_ROLE_LABELS.admin) + '</option>' : '') +
      '</select>' +
      '<div class="field-hint">Choosing a level shares this trip with them, scoped to ' + esc(companion.name) + '\'s own tagged items (or fully, for Admin) — leave "No trip access" if they should just get their own avatar without being able to see or edit this trip.</div>';
  }
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>' + esc(companion.name) + ': account &amp; access</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal" aria-label="Close dialog" title="Close">' + icon('close') + '</button></div>' +
        '<form id="companion-link-form" data-trip-id="' + esc(trip.tripId) + '" data-companion-id="' + esc(companion.companionId) + '" data-prior-account-id="' + esc(companion.accountId || '') + '">' +
          '<div class="modal-body">' +
            '<div class="field"><label>Username</label><input type="text" name="username" placeholder="an existing account" value="' + esc(currentUsername) + '">' +
            '<div class="field-hint">' + (isLinked && !currentUsername
              ? 'Already linked to an account, but its username isn\'t shown here (no access has been granted) — retype it if you want to change their access level below.'
              : 'Leave blank and save to remove the current link.') + '</div></div>' +
            '<div class="field"><label>Privilege level</label>' + roleSelectHtml + '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Save</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
}

// The one function both openCompanionLinkForm() above and
// openAddLinkedCompanionForm() below submit through -- reconciles a
// companion's account link and access grant in one go.
//
//   payload.username  -- '' unlinks (or never links, for a new companion).
//   payload.role       -- '' means "No trip access" was chosen (revoke
//                         any existing grant); a real role shares the
//                         trip as that role, replacing any existing
//                         grant; `undefined` means the select was
//                         disabled (roleLocked) and shouldn't be touched
//                         -- a disabled <select> is never in FormData,
//                         which is how these two cases are told apart.
//   payload.priorAccountId -- the account this companion was linked to
//                         before this submit, so a switch to "No trip
//                         access" knows whose grant to revoke, or a new
//                         grant knows which stale grant to replace.
async function submitCompanionAccess(payload) {
  var username = (payload.username || '').trim();
  var accessForm = document.getElementById('companion-link-form') || document.getElementById('add-linked-companion-form');
  if (payload.role && !username) {
    var form = document.getElementById('companion-link-form');
    showFormError(form, 'Enter the username to grant them access.', form && form.elements.username);
    return;
  }
  try {
    // Step 1: reconcile the account link.
    var linkRes = await fetch('/WayPoint/api/companions/link', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tripId: payload.tripId, companionId: payload.companionId, username: username })
    });
    var linkBody = await linkRes.json().catch(function () { return {}; });
    if (!linkRes.ok) { showFormError(accessForm, linkBody.error || 'Could not update that link.', accessForm && accessForm.elements.username); return; }

    // Step 2: reconcile the access grant to match whatever privilege
    // level was actually submitted (see this function's own comment
    // above for what each value of payload.role means).
    if (payload.role) {
      var grantRes = await fetch('/WayPoint/api/trip-grants', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tripId: payload.tripId,
          username: username,
          role: payload.role,
          companionId: payload.companionId,
          replaceAccountId: payload.priorAccountId || ''
        })
      });
      var grantBody = await grantRes.json().catch(function () { return {}; });
      if (!grantRes.ok) {
        // Linked successfully, but sharing failed (e.g. only the trip's
        // real owner may grant Admin) -- still refresh so the successful
        // link shows up, but say clearly the access level didn't stick.
        showFormError(accessForm, grantBody.error || 'Linked, but could not set their access level.', accessForm && accessForm.elements.role);
        state = await loadInitialState();
        render();
        return;
      }
    } else if (payload.role === '' && payload.priorAccountId) {
      // "No trip access" was explicitly chosen for someone who
      // previously had a real grant. Treat a failed revoke as a failed
      // access update; silently claiming success here could leave the old
      // account able to open the trip after the UI says access was removed.
      var revokeRes = await fetch('/WayPoint/api/trip-grants/revoke', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tripId: payload.tripId, accountId: payload.priorAccountId })
      });
      var revokeBody = await revokeRes.json().catch(function () { return {}; });
      if (!revokeRes.ok) {
        showFormError(accessForm, revokeBody.error || 'Linked, but could not remove the previous access grant.', accessForm && accessForm.elements.role);
        state = await loadInitialState();
        render();
        return;
      }
    }

    closeModal();
    setSaveStatus('saved');
    // Reloads rather than patching `state` in place -- simplest way to
    // pick up the server's freshly-recomputed `companionAvatars`/
    // `companionAccessLevels` (and, for a full-scope role, the
    // companion's own now-changed accountId) rather than trying to
    // guess what they'd now be.
    state = await loadInitialState();
    render();
  } catch (err) {
    showToast('Could not update that companion\'s access — check your connection and try again.', 'error');
  }
}

/* ---- "Add companion" -- the one-step Guest+link+share flow -----------
   Superuser/Admin only (canLinkCompanion(), same bar as managing an
   existing companion's access above). This is deliberately NOT a new
   server-side endpoint: it's the same three actions a Superuser/Admin
   could already do by hand -- add a guest, link them to a username, and
   share the trip with them -- just chained together behind one form so
   they don't have to leave the Companions tab and come back. See
   submitAddLinkedCompanion() below for why they run strictly in that
   order, one fully finished before the next starts. --------------------- */
function openAddLinkedCompanionForm(trip) {
  var iCanGrantAdmin = canGrantAdminRole(trip);
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>Add companion</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal" aria-label="Close dialog" title="Close">' + icon('close') + '</button></div>' +
        '<form id="add-linked-companion-form" data-trip-id="' + esc(trip.tripId) + '">' +
          '<div class="modal-body">' +
            '<p class="field-hint companion-form-intro">A companion is someone with their own Waypoint login — their marker uses their own account\'s colour + animal instead of a smiley, and this shares the trip with them right away at whatever privilege level you pick below.</p>' +
            '<div class="field"><label>Name</label><input type="text" name="name" required placeholder="e.g. Sarah"></div>' +
            '<div class="field"><label>Username</label><input type="text" name="username" required placeholder="an existing account"></div>' +
            '<div class="field"><label>Privilege level</label><select name="role" required>' +
              '<option value="user" selected>' + esc(GRANT_ROLE_LABELS.user) + '</option>' +
              '<option value="viewer">' + esc(GRANT_ROLE_LABELS.viewer) + '</option>' +
              (iCanGrantAdmin ? '<option value="admin">' + esc(GRANT_ROLE_LABELS.admin) + '</option>' : '') +
            '</select></div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Add companion</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
}

// Polls until the save queue is empty -- see persist() above for why
// only one POST /api/data is ever in flight. submitAddLinkedCompanion()
// below needs to know the new companion it added has actually reached
// the server before linking it (handleCompanionLink() 404s otherwise). A
// short poll is simpler than threading a promise through
// updateState()/persist()/sendSave() for this rare, explicit action.
function waitForSaveToSettle() {
  return new Promise(function (resolve) {
    (function check() {
      if (!saveInFlight && !pendingSaveState) resolve();
      else setTimeout(check, 50);
    })();
  });
}

async function submitAddLinkedCompanion(payload) {
  var name = (payload.name || '').trim();
  var username = (payload.username || '').trim();
  var role = payload.role || 'user';
  var form = document.getElementById('add-linked-companion-form');
  if (!name) { showFormError(form, 'Enter a name.', form && form.elements.name); return; }
  if (!username) { showFormError(form, 'Enter the username to link.', form && form.elements.username); return; }

  var newCompanionId = newId();
  // Step 1: add them as an ordinary Guest first, through the same
  // optimistic updateState()/persist() pipeline every other edit uses --
  // going through the normal queued save means this can never race an
  // unrelated in-flight save and clobber it.
  updateState(function (next) {
    var t = byId(next.trips, payload.tripId, 'tripId');
    t.companions.push({ companionId: newCompanionId, name: name });
  });
  // Step 2: wait for that save to finish, so the companion exists
  // server-side before asking to link/share it.
  await waitForSaveToSettle();
  // Step 3: link and share it in one go (see submitCompanionAccess()).
  // priorAccountId is null: this companion didn't exist a moment ago.
  // If this fails, the person still ends up added as a Guest rather than
  // not existing -- the row's "Manage account & access" button can retry.
  await submitCompanionAccess({ tripId: payload.tripId, companionId: newCompanionId, username: username, role: role, priorAccountId: null });
}

// modal after a swatch click -- reads the two hidden inputs' CURRENT

function updateAvatarPickerPreview(form) {

async function submitAvatarPick(payload) {
  var form = document.getElementById('avatar-pick-form');
  try {
    var res = await fetch('/WayPoint/api/account/avatar', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) { showFormError(form, body.error || 'Could not save your avatar.'); return; }
    // Trust the server's re-resolved avatar rather than echoing what was sent.
    currentUser.avatar = body.avatar || payload;
    applyAuthUI();
    closeModal();
    setSaveStatus('saved');
    // Any companion linked to this account needs its companionAvatars
    // entry updated too, on every trip it's shared on -- simplest is to
    // reload state rather than patching each trip's map by hand.
    state = await loadInitialState();
    render();
  } catch (err) {
    showToast('Could not save your avatar — check your connection and try again.', 'error');
  }
}

function openExpenseForm(trip, existing) {

          amount: v.amount, currency: (v.currency || '').toUpperCase(), rateOverride: v.rateOverride || '',
          receiptRef: v.receiptRef || '', contactId: v.contactId || '', notes: v.notes || ''
        };

        else t.expenses.push(rec);

}

function deleteEntity(trip, section, id, label) {

  openConfirm({

    onConfirm: function () {

function deleteTrip(id) {

/* ---------- 9. Cost / expense aggregation --------------------------
   Every bookable item (activity, transport leg, accommodation stay)
   can carry its own cost; on top of that a trip can have standalone
   expenses (meals, taxis, souvenirs...). allCostLines() flattens all
   of it into one list so the Expenses tab and the CSV export both
   work from a single, consistent ledger. */

function allCostLines(trip) {
  var lines = [];
  trip.activities.forEach(function (a) {
    if (a.costAmount) lines.push({ date: activityStartDate(a), type: 'Activity', section: 'activity', item: a, desc: a.title, amount: a.costAmount, currency: a.costCurrency, rateOverride: a.costRate, receiptRef: a.receiptRef, bookingRef: a.bookingRef, category: 'Activities' });
  });
  trip.transport.forEach(function (t) {
    if (t.costAmount) lines.push({ date: dateOnly(t.departDateTime), type: 'Transport', section: 'transport', item: t, desc: transportLabel(t), amount: t.costAmount, currency: t.costCurrency, rateOverride: t.costRate, receiptRef: t.receiptRef, bookingRef: t.bookingRef, category: 'Transport' });
  });
  trip.accommodation.forEach(function (ac) {
    if (ac.costAmount) lines.push({ date: dateOnly(ac.checkIn), type: 'Accommodation', section: 'accommodation', item: ac, desc: ac.name, amount: ac.costAmount, currency: ac.costCurrency, rateOverride: ac.costRate, receiptRef: ac.receiptRef, bookingRef: ac.bookingRef, category: 'Accommodation' });
  });
  trip.expenses.forEach(function (e) {
    lines.push({ date: e.date, type: 'Expense', section: 'expense', item: e, desc: e.description, amount: e.amount, currency: e.currency, rateOverride: e.rateOverride, receiptRef: e.receiptRef, bookingRef: '', category: e.category || 'Other' });
  });
  lines.sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  return lines;
}

function usedCurrencies(trip) {
  var set = {};
  allCostLines(trip).forEach(function (l) { if (l.currency && l.currency !== trip.homeCurrency) set[l.currency] = true; });
  return Object.keys(set).sort();
}

function csvEscape(v) {
  var s = String(v === undefined || v === null ? '' : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildCsv(trip) {
  var lines = allCostLines(trip);
  var header = ['Date', 'Type', 'Category', 'Description', 'Amount', 'Currency', 'Rate used', 'Converted (' + trip.homeCurrency + ')', 'Booking ref', 'Receipt ref'];
  var rows = lines.map(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    return [l.date, l.type, l.category, l.desc, l.amount, l.currency, hv.rateUsed == null ? '' : hv.rateUsed, hv.known ? hv.value.toFixed(2) : 'unknown', l.bookingRef, l.receiptRef];
  });
  return [header].concat(rows).map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
}

// Builds the CSV text (see buildCsv() above) and hands it to the
// browser as a normal file download. This is the standard vanilla-JS
// download trick: wrap the text in a Blob, make a temporary object URL
// for it, click a hidden link pointing at that URL, then clean both up
// straight away. No server round-trip needed for this one.
function exportCsv(trip) {
  var csv = buildCsv(trip);
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = slug(trip.name) + '-expenses.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  // Give the browser a moment to actually start the download before we
  // revoke the URL it's reading from.
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ---------- 10. Timeline logic --------------------------------------
   This is the heart of the "multi-leg, overnight, several areas in a
   day" requirement: it builds one chronological agenda per trip that
   folds together destinations, activities, transport and
   accommodation, and makes overnight travel and multi-night stays
   visible instead of splitting them awkwardly across days. */

function tripDayList(trip) {
  var dates = {};
  function add(d) { if (d) dates[d] = true; }
  add(trip.startDate); add(trip.endDate);
  trip.destinations.forEach(function (d) { add(d.arriveDate); add(d.departDate); });
  trip.activities.forEach(function (a) { add(activityStartDate(a)); add(activityEndDate(a)); });
  trip.transport.forEach(function (t) { add(dateOnly(t.departDateTime)); add(dateOnly(t.arriveDateTime)); });
  trip.accommodation.forEach(function (a) { add(dateOnly(a.checkIn)); add(dateOnly(a.checkOut)); });
  var keys = Object.keys(dates).sort();
  if (keys.length === 0) return [];
  var out = []; var cur = keys[0]; var end = keys[keys.length - 1];
  while (cur <= end) { out.push(cur); cur = addDays(cur, 1); }
  return out;
}

function eventsForDay(trip, day) {
  var events = [];
  trip.activities.forEach(function (a) {
    if (!activityOccursOn(a, day)) return;
    var startsToday = activityStartDate(a) === day;
    events.push({
      time: activityIsAllDay(a) || !startsToday ? '00:00' : (a.startTime || '00:00'),
      displayTime: activityIsAllDay(a) ? 'All day' : (startsToday ? (a.startTime || 'Time TBD') : 'Continues'),
      kind: 'activity', data: a, continues: !startsToday
    });
  });
  trip.accommodation.forEach(function (ac) {
    if (dateOnly(ac.checkIn) === day) events.push({ time: timeOnly(ac.checkIn) || '15:00', kind: 'checkin', data: ac });
    if (dateOnly(ac.checkOut) === day) events.push({ time: timeOnly(ac.checkOut) || '11:00', kind: 'checkout', data: ac });
  });
  trip.transport.forEach(function (t) {
    if (dateOnly(t.departDateTime) === day) events.push({ time: timeOnly(t.departDateTime) || '00:00', kind: 'depart', data: t });
    if (dateOnly(t.arriveDateTime) === day && dateOnly(t.arriveDateTime) !== dateOnly(t.departDateTime)) {
      events.push({ time: timeOnly(t.arriveDateTime) || '00:00', kind: 'arrive', data: t });
    }
  });
  events.sort(function (a, b) { return a.time.localeCompare(b.time); });
  return events;
}

function overnightStay(trip, day) {
  var stay = trip.accommodation.find(function (ac) { return dateOnly(ac.checkIn) <= day && day < dateOnly(ac.checkOut); });
  if (stay) return { kind: 'stay', data: stay };
  var nextDay = addDays(day, 1);
  var leg = trip.transport.find(function (t) { return dateOnly(t.departDateTime) === day && dateOnly(t.arriveDateTime) === nextDay; });
  if (leg) return { kind: 'transit', data: leg };
  return null;
}

function areasForDay(trip, day) {
  return trip.destinations.filter(function (d) { return d.arriveDate <= day && day <= d.departDate; });
}

/* ---------- 11. Trip-level stats ------------------------------------ */

function tripStatus(trip) {
  var today = todayStr();
  if (trip.startDate && trip.endDate) {
    if (today < trip.startDate) return 'upcoming';
    if (today > trip.endDate) return 'past';
    return 'ongoing';
  }
  if (trip.startDate && today < trip.startDate) return 'upcoming';
  if (trip.endDate && today > trip.endDate) return 'past';
  return 'upcoming';
}

function tripSpend(trip) {
  var known = 0, unknownCount = 0;
  allCostLines(trip).forEach(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    if (hv.known) known += hv.value; else unknownCount++;
  });
  return { known: known, unknownCount: unknownCount };
}

// One exceptional-state component serves empty data, recoverable failures and
// permission limits. The semantic icon changes by context; the quiet dotted
// route and tilted journal stamp keep every instance recognisably Waypoint.
function emptyStateHtml(kind, iconName, title, body, actionsHtml, compact) {
  return '<div class="empty-state is-' + esc(kind || 'empty') + (compact ? ' is-compact' : '') + '">' +
    '<span class="empty-state-mark">' + icon(iconName) + '</span><h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' +
    (actionsHtml ? '<div class="empty-state-actions">' + actionsHtml + '</div>' : '') + '</div>';
}

/* ---------- 12. Render: Dashboard ------------------------------------ */

function renderDashboard() {
  // "New trip" is always shown — creating one is open to any logged-in
  // account, not gated by any per-trip permission (there's nothing to
  // check permission against yet; whoever creates it becomes its
  // Superuser automatically — see openTripForm()).
  if (state.trips.length === 0) {
    if (!stateIsTrustworthy) {
      return '<div class="section-head"><h1 data-page-heading tabindex="-1">Your trips</h1></div>' +
        emptyStateHtml(connectionState === 'offline' ? 'offline' : 'error', connectionState === 'offline' ? 'offline' : 'warning', connectionState === 'offline' ? 'You are offline' : 'Trips could not be loaded', 'Your saved data has not been changed. Reconnect and retry before editing.', '<button type="button" class="btn btn-primary" data-action="retry-connection">Retry now</button>');
    }
    return (
      '<div class="section-head"><h1 data-page-heading tabindex="-1">Your trips</h1>' +
        '<button class="btn btn-accent" data-action="new-trip">' + icon('add') + ' New trip</button></div>' +
      emptyStateHtml('empty', 'brand', 'No trips yet', 'Add a trip to start planning destinations, activities, transport and accommodation — with expenses tracked across currencies as you go.')
    );
  }
  var sorted = state.trips.slice().sort(function (a, b) { return (a.startDate || '9999') < (b.startDate || '9999') ? -1 : 1; });
  var cards = sorted.map(function (trip) {
    var status = tripStatus(trip);
    var spend = tripSpend(trip);
    var statusLabel = status === 'ongoing' ? 'In progress' : (status === 'past' ? 'Past' : 'Upcoming');
    // Edit/Delete on the card itself are full-scope-only (Superuser,
    // admin grant, or the uber-user) — a "user"/"viewer" grant can see
    // this trip's card (it's in their `state.trips` at all) but never
    // touch the trip's own name/dates, let alone delete it.
    var cardActions = canFullyEditTrip(trip)
      ? '<div class="card-actions">' +
          '<button class="btn btn-icon btn-ghost" data-action="edit-trip" data-id="' + trip.tripId + '" aria-label="Edit trip" title="Edit trip">' + icon('edit') + '</button>' +
          '<button class="btn btn-icon btn-ghost" data-action="delete-trip" data-id="' + trip.tripId + '" aria-label="Delete trip" title="Delete trip">' + icon('delete') + '</button>' +
        '</div>'
      : '';
    return (
      '<article class="trip-card">' +
        '<button type="button" class="trip-card-open" data-action="open-trip" data-id="' + trip.tripId + '" aria-label="Open trip ' + esc(trip.name) + '">' +
        '<span class="trip-card-top">' +
          '<span><span class="trip-card-title">' + esc(trip.name) + '</span><span class="trip-dates">' +
            (trip.startDate ? formatDateShort(trip.startDate) : 'No dates set') +
            (trip.endDate ? ' – ' + formatDateShort(trip.endDate) : '') + '</span></span>' +
          '<span class="pill pill-' + status + '">' + statusLabel + '</span>' +
        '</span>' +
        '<span class="trip-stats">' +
          '<span>' + icon('destination') + ' <b>' + trip.destinations.length + '</b> areas</span>' +
          '<span>' + icon('expenses') + ' <b>' + money(spend.known, trip.homeCurrency) + '</b>' + (spend.unknownCount ? ' <span class="rate-missing">+' + spend.unknownCount + ' need rate</span>' : '') + '</span>' +
        '</span>' +
        tripCardAvatarsHtml(trip) +
        '</button>' +
        cardActions +
      '</article>'
    );
  }).join('');
  return (
    '<div class="intro-note"><strong>Waypoint</strong> keeps every trip\'s destinations, activities, transport and accommodation in one place, with a day-by-day timeline that shows overnight travel and multi-area days clearly, plus expenses tracked across currencies.</div>' +
    '<div class="section-head"><h1 data-page-heading tabindex="-1">Your trips</h1>' +
      '<button class="btn btn-accent" data-action="new-trip">' + icon('add') + ' New trip</button></div>' +
    '<div class="trip-grid">' + cards + '</div>'
  );
}

/* ---------- 13. Render: Trip view shell (header + tabs) -------------- */

// The two "big picture" views of a trip — see the day-by-day agenda, or
// see it on a map — are surfaced as large hero buttons. The data-entry
// views are grouped by purpose, so someone planning a trip sees the
// itinerary-building tools together and doesn't have to parse one long,
// undifferentiated tab row. Every button still uses the same simple
// "switch-tab" click handler below.
var HERO_TABS = [
  { key: 'timeline', label: 'Timeline', icon: 'timeline' },
  { key: 'map', label: 'Map', icon: 'map' }
];

var TAB_GROUPS = [
  { label: 'Plan', tabs: [
    { key: 'destinations', label: 'Destinations', icon: 'destination' },
    { key: 'transport', label: 'Transport', icon: 'flight' },
    { key: 'accommodation', label: 'Accommodation', icon: 'stay' },
    { key: 'activities', label: 'Activities', icon: 'activity' }
  ] },
  { label: 'People', tabs: [
    { key: 'companions', label: 'Companions', icon: 'companions' },
    { key: 'contacts', label: 'Contacts', icon: 'contacts' }
  ] },
  { label: 'Manage', tabs: [
    // Expenses is hidden for a scoped "user"/"viewer" grant because the
    // server strips it from their trip data; an empty financial tab would
    // be misleading rather than useful.
    { key: 'expenses', label: 'Expenses', icon: 'expenses' },
    { key: 'settings', label: 'Settings', icon: 'settings' }
  ] }
];

// The groups to actually show for THIS trip — full scope gets everything;
// scoped roles lose only Expenses. Settings stays visible because it still
// contains useful read-only trip information for them.
function tabGroupsForTrip(trip) {
  return TAB_GROUPS.map(function (group) {
    return {
      label: group.label,
      tabs: group.tabs.filter(function (tab) { return canFullyEditTrip(trip) || tab.key !== 'expenses'; })
    };
  }).filter(function (group) { return group.tabs.length > 0; });
}

var MOBILE_DESTINATIONS = [
  { key: 'overview', label: 'Overview', icon: 'overview' },
  { key: 'plan', label: 'Plan', icon: 'plan' },
  { key: 'people', label: 'People', icon: 'people' },
  { key: 'more', label: 'More', icon: 'more' }
];

function mobileDestinationForTab(tab) {
  if (tab === 'timeline' || tab === 'map') return 'overview';
  if (['destinations', 'transport', 'accommodation', 'activities'].indexOf(tab) !== -1) return 'plan';
  if (tab === 'companions' || tab === 'contacts') return 'people';
  return 'more';
}

function tabsForMobileDestination(destination, trip) {
  if (destination === 'overview') return HERO_TABS;
  var groupLabel = destination === 'plan' ? 'Plan' : destination === 'people' ? 'People' : 'Manage';
  var group = tabGroupsForTrip(trip).find(function (item) { return item.label === groupLabel; });
  return group ? group.tabs : [];
}

function rememberMobileChild(tab) {
  var destination = mobileDestinationForTab(tab);
  if (destination !== 'more') mobileLastTab[destination] = tab;
}

function mobileDestinationTarget(destination, trip) {
  if (destination === 'more') return 'more';
  var tabs = tabsForMobileDestination(destination, trip);
  var remembered = mobileLastTab[destination];
  return tabs.some(function (tab) { return tab.key === remembered; }) ? remembered : (tabs[0] ? tabs[0].key : 'timeline');
}

function renderMobileChildNav(trip, destination) {
  if (destination === 'more') return '';
  var tabs = tabsForMobileDestination(destination, trip);
  return '<nav class="mobile-child-nav' + (destination === 'overview' ? ' mobile-overview-switch' : '') + '" aria-label="' + esc(destination === 'overview' ? 'Overview view' : destination + ' sections') + '">' +
    tabs.map(function (tab) {
      return '<button id="mobile-tab-' + tab.key + '" class="mobile-child-btn ' + (currentTab === tab.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + tab.key + '" aria-controls="trip-panel"' + (currentTab === tab.key ? ' aria-current="page"' : '') + '>' + icon(tab.icon) + esc(tab.label) + '</button>';
    }).join('') +
  '</nav>';
}

function renderMobileDestinationNav(trip) {
  var activeDestination = mobileDestinationForTab(currentTab);
  return '<nav class="mobile-destination-nav" aria-label="Trip destinations">' + MOBILE_DESTINATIONS.map(function (destination) {
    var active = activeDestination === destination.key;
    return '<button id="mobile-destination-' + destination.key + '" class="mobile-destination-btn ' + (active ? 'active' : '') + '" data-action="switch-mobile-destination" data-destination="' + destination.key + '"' + (active ? ' aria-current="page"' : '') + '>' + icon(destination.icon) + '<span>' + destination.label + '</span></button>';
  }).join('') + '</nav>';
}

function renderMobileMoreTab(trip) {
  var items = [];
  if (canFullyEditTrip(trip)) {
    items.push({ key: 'expenses', icon: 'expenses', label: 'Expenses', description: 'Review trip spending and currencies' });
  }
  items.push({ key: 'settings', icon: 'settings', label: 'Settings', description: 'Trip details, export and access information' });
  return '<div class="tab-panel-head"><h2>More</h2></div><div class="mobile-more-list">' + items.map(function (item) {
    return '<button class="mobile-more-card" data-action="switch-tab" data-tab="' + item.key + '">' + icon(item.icon) + '<span class="mobile-more-card-copy"><span class="mobile-more-card-title">' + item.label + '</span><span class="mobile-more-card-description">' + item.description + '</span></span>' + icon('forward') + '</button>';
  }).join('') + '</div>';
}

function renderTripView() {
  var trip = currentTrip();
  if (!trip) { currentView = 'dashboard'; return renderDashboard(); }
  // A scoped role landing on a tab that's just been filtered out (e.g.
  // sessionStorage restored "expenses" from a previous, full-scope
  // account on this same browser) falls back to the Timeline rather
  // than rendering a panel for a tab that's no longer in the tab bar.
  if (currentTab === 'expenses' && !canFullyEditTrip(trip)) currentTab = 'timeline';
  var spend = tripSpend(trip);
  var status = tripStatus(trip);
  var heroHtml = HERO_TABS.map(function (t) {
    return '<button id="trip-nav-' + t.key + '" class="hero-btn ' + (currentTab === t.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + t.key + '" aria-controls="trip-panel"' + (currentTab === t.key ? ' aria-current="page"' : '') + '>' +
      icon(t.icon) + t.label + '</button>';
  }).join('');
  var tabsHtml = tabGroupsForTrip(trip).map(function (group) {
    var buttons = group.tabs.map(function (t) {
      return '<button id="trip-nav-' + t.key + '" class="tab-btn ' + (currentTab === t.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + t.key + '" aria-controls="trip-panel"' + (currentTab === t.key ? ' aria-current="page"' : '') + '>' +
        icon(t.icon) + t.label + '</button>';
    }).join('');
    return '<div class="tab-group"><div class="tab-group-label">' + esc(group.label) + '</div><div class="tab-group-tabs">' + buttons + '</div></div>';
  }).join('');
  var panel;
  switch (currentTab) {
    case 'destinations': panel = renderDestinationsTab(trip); break;
    case 'activities': panel = renderActivitiesTab(trip); break;
    case 'transport': panel = renderTransportTab(trip); break;
    case 'accommodation': panel = renderAccommodationTab(trip); break;
    case 'map': panel = renderMapTab(trip); break;
    case 'contacts': panel = renderContactsTab(trip); break;
    case 'companions': panel = renderCompanionsTab(trip); break;
    case 'expenses': panel = renderExpensesTab(trip); break;
    case 'settings': panel = renderSettingsTab(trip); break;
    case 'more': panel = renderMobileMoreTab(trip); break;
    default: panel = renderTimelineTab(trip);
  }
  var headerActions = canFullyEditTrip(trip)
    ? '<div class="card-actions">' +
        '<button class="btn btn-icon btn-ghost" data-action="edit-trip" data-id="' + trip.tripId + '" aria-label="Edit trip" title="Edit trip">' + icon('edit') + '</button>' +
        '<button class="btn btn-icon btn-ghost" data-action="delete-trip" data-id="' + trip.tripId + '" aria-label="Delete trip" title="Delete trip">' + icon('delete') + '</button>' +
      '</div>'
    : '';
  return (
    '<div class="trip-header">' +
