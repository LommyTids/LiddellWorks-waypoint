<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Leaflet (the Map tab's mapping library) is vendored locally under
     vendor/leaflet/ rather than pulled from a CDN, so the Map tab still
     works even if some external CDN happens to be unreachable. Only the
     map tiles themselves and the place-name lookups (see the Map section
     of the main script below) need the open internet at runtime.
     Deliberately an absolute path (starting with /WayPoint/), not a
     relative one — a relative path here resolves differently depending
     on whether the visited URL ends in "/WayPoint" or "/WayPoint/", and
     would silently 404 in the no-trailing-slash case. -->
<link rel="stylesheet" href="/WayPoint/vendor/leaflet/leaflet.css">
<style>
[hidden] { display: none !important; }
/* ============================================================
   WAYPOINT — a multi-trip travel planner
   ------------------------------------------------------------
   This stylesheet is organised top-to-bottom as:
     1. Design tokens (colors/type/spacing) for light + dark mode
     2. Reset & base element styles
     3. Layout shell (top bar, page container)
     4. Components (cards, tabs, timeline, forms, modal, toast)
   ============================================================ */

/* ---- 1. Design tokens --------------------------------------- */
:root {
  /* Primitive interface palette. Avatar data colours and translucent
     shadow/overlay effects are documented exceptions. */
  --wp-color-mist-100: #eef0ec;
  --wp-color-paper-0: #ffffff;
  --wp-color-mist-200: #e3e6dd;
  --wp-color-ink-900: #1a2233;
  --wp-color-ink-600: #56607a;
  --wp-color-ink-500: #5c6676;
  --wp-color-ink-400: #838d9e;
  --wp-color-line-300: #d5d9cd;
  --wp-color-brass-600: #a6752b;
  --wp-color-brass-700: #966820;
  --wp-color-brass-100: #f3e6d2;
  --wp-color-teal-700: #1f6f63;
  --wp-color-teal-100: #dcefe9;
  --wp-color-red-700: #b24444;
  --wp-color-red-100: #f6e1df;
  --wp-color-green-700: #2f7d4f;
  --wp-color-green-100: #dff0e3;
  --wp-color-night-950: #12161c;
  --wp-color-night-900: #1b212b;
  --wp-color-night-800: #232b37;
  --wp-color-night-line: #2c3542;
  --wp-color-paper-50: #edefea;
  --wp-color-slate-300: #a2acbe;
  --wp-color-slate-400: #8c97aa;
  --wp-color-slate-500: #6e788c;
  --wp-color-brass-400: #d9a24b;
  --wp-color-brass-900: #3a2d15;
  --wp-color-teal-400: #4fbfae;
  --wp-color-teal-900: #16302c;
  --wp-color-red-400: #e08585;
  --wp-color-red-900: #3a2020;
  --wp-color-green-400: #6fcb94;
  --wp-color-green-900: #1c3527;
  --wp-color-map-blue: #1e88ff;
  --wp-color-map-pink: #ff2d78;
  --wp-color-map-orange: #ff8c1a;
  --wp-color-map-blue-dark: #63adff;
  --wp-color-map-pink-dark: #ff6aa0;
  --wp-color-map-orange-dark: #ffad5c;

  /* Semantic colour roles used by application components. */
  --wp-bg-canvas: var(--wp-color-mist-100);
  --wp-bg-surface: var(--wp-color-paper-0);
  --wp-bg-subdued: var(--wp-color-mist-200);
  --wp-text-primary: var(--wp-color-ink-900);
  --wp-text-secondary: var(--wp-color-ink-600);
  --wp-text-muted: var(--wp-color-ink-500);
  --wp-text-on-strong: var(--wp-color-paper-0);
  --wp-border-default: var(--wp-color-line-300);
  --wp-border-strong: var(--wp-color-ink-400);
  --wp-action-primary: var(--wp-color-ink-900);
  --wp-action-accent: var(--wp-color-brass-600);
  --wp-action-accent-strong: var(--wp-color-brass-700);
  --wp-action-accent-subtle: var(--wp-color-brass-100);
  --wp-focus-ring: var(--wp-color-teal-700);
  --wp-context-location: var(--wp-color-teal-700);
  --wp-context-location-subtle: var(--wp-color-teal-100);
  --wp-state-danger: var(--wp-color-red-700);
  --wp-state-danger-subtle: var(--wp-color-red-100);
  --wp-state-success: var(--wp-color-green-700);
  --wp-state-success-subtle: var(--wp-color-green-100);
  --wp-map-destination: var(--wp-context-location);
  --wp-map-transport: var(--wp-color-map-blue);
  --wp-map-accommodation: var(--wp-color-map-pink);
  --wp-map-activity: var(--wp-color-map-orange);
  --wp-map-destination-subtle: var(--wp-context-location-subtle);
  --wp-map-transport-subtle: color-mix(in srgb, var(--wp-map-transport) 14%, var(--wp-bg-subdued));
  --wp-map-accommodation-subtle: color-mix(in srgb, var(--wp-map-accommodation) 14%, var(--wp-bg-subdued));
  --wp-map-activity-subtle: color-mix(in srgb, var(--wp-map-activity) 14%, var(--wp-bg-subdued));
  --wp-shadow-surface: 0 1px 2px rgba(26,34,51,.06), 0 8px 24px -12px rgba(26,34,51,.18);

  /* Six approved typography roles. */
  --wp-font-display: "Fraunces", Georgia, serif;
  --wp-font-body: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --wp-font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --wp-type-display-size: 36px;
  --wp-type-display-leading: 42px;
  --wp-type-heading-size: 24px;
  --wp-type-heading-leading: 30px;
  --wp-type-body-size: 16px;
  --wp-type-body-leading: 24px;
  --wp-type-label-size: 14px;
  --wp-type-label-leading: 20px;
  --wp-type-meta-size: 12px;
  --wp-type-meta-leading: 18px;
  --wp-type-micro-size: 11px;
  --wp-type-micro-leading: 16px;
  --wp-type-display: 700 var(--wp-type-display-size)/var(--wp-type-display-leading) var(--wp-font-display);
  --wp-type-heading: 600 var(--wp-type-heading-size)/var(--wp-type-heading-leading) var(--wp-font-display);
  --wp-type-body: 400 var(--wp-type-body-size)/var(--wp-type-body-leading) var(--wp-font-body);
  --wp-type-label: 600 var(--wp-type-label-size)/var(--wp-type-label-leading) var(--wp-font-body);
  --wp-type-meta: 500 var(--wp-type-meta-size)/var(--wp-type-meta-leading) var(--wp-font-mono);
  --wp-type-micro: 600 var(--wp-type-micro-size)/var(--wp-type-micro-leading) var(--wp-font-body);

  /* Glyphs are visual assets rather than text, but still use named sizes. */
  --wp-glyph-xs: 12px;
  --wp-glyph-sm: 14px;
  --wp-glyph-md: 16px;
  --wp-glyph-lg: 18px;

  /* SVG artwork uses a separate five-step optical scale. Keeping icons on
     these sizes prevents the previous accumulation of one-off 11–34px rules. */
  --wp-icon-xs: 12px;
  --wp-icon-sm: 16px;
  --wp-icon-md: 20px;
  --wp-icon-lg: 24px;
  --wp-icon-xl: 32px;

  --radius: 12px;
  --radius-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wp-bg-canvas: var(--wp-color-night-950);
    --wp-bg-surface: var(--wp-color-night-900);
    --wp-bg-subdued: var(--wp-color-night-800);
    --wp-text-primary: var(--wp-color-paper-50);
    --wp-text-secondary: var(--wp-color-slate-300);
    --wp-text-muted: var(--wp-color-slate-400);
    --wp-text-on-strong: var(--wp-color-night-950);
    --wp-border-default: var(--wp-color-night-line);
    --wp-border-strong: var(--wp-color-slate-500);
    --wp-action-primary: var(--wp-color-paper-50);
    --wp-action-accent: var(--wp-color-brass-400);
    --wp-action-accent-strong: var(--wp-color-brass-400);
    --wp-action-accent-subtle: var(--wp-color-brass-900);
    --wp-focus-ring: var(--wp-color-brass-400);
    --wp-context-location: var(--wp-color-teal-400);
    --wp-context-location-subtle: var(--wp-color-teal-900);
    --wp-state-danger: var(--wp-color-red-400);
    --wp-state-danger-subtle: var(--wp-color-red-900);
    --wp-state-success: var(--wp-color-green-400);
    --wp-state-success-subtle: var(--wp-color-green-900);
    --wp-map-transport: var(--wp-color-map-blue-dark);
    --wp-map-accommodation: var(--wp-color-map-pink-dark);
    --wp-map-activity: var(--wp-color-map-orange-dark);
    --wp-shadow-surface: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --wp-bg-canvas: var(--wp-color-night-950);
  --wp-bg-surface: var(--wp-color-night-900);
  --wp-bg-subdued: var(--wp-color-night-800);
  --wp-text-primary: var(--wp-color-paper-50);
  --wp-text-secondary: var(--wp-color-slate-300);
  --wp-text-muted: var(--wp-color-slate-400);
  --wp-text-on-strong: var(--wp-color-night-950);
  --wp-border-default: var(--wp-color-night-line);
  --wp-border-strong: var(--wp-color-slate-500);
  --wp-action-primary: var(--wp-color-paper-50);
  --wp-action-accent: var(--wp-color-brass-400);
  --wp-action-accent-strong: var(--wp-color-brass-400);
  --wp-action-accent-subtle: var(--wp-color-brass-900);
  --wp-focus-ring: var(--wp-color-brass-400);
  --wp-context-location: var(--wp-color-teal-400);
  --wp-context-location-subtle: var(--wp-color-teal-900);
  --wp-state-danger: var(--wp-color-red-400);
  --wp-state-danger-subtle: var(--wp-color-red-900);
  --wp-state-success: var(--wp-color-green-400);
  --wp-state-success-subtle: var(--wp-color-green-900);
  --wp-map-transport: var(--wp-color-map-blue-dark);
  --wp-map-accommodation: var(--wp-color-map-pink-dark);
  --wp-map-activity: var(--wp-color-map-orange-dark);
  --wp-shadow-surface: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

/* ---- 2. Reset & base ------------------------------------------ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--wp-bg-canvas);
  color: var(--wp-text-primary);
  font: var(--wp-type-body);
  -webkit-font-smoothing: antialiased;
}
h1 { font: var(--wp-type-display); }
h2, h3, h4 { font: var(--wp-type-heading); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--wp-context-location); }
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: var(--wp-type-body-size); line-height: var(--wp-type-body-leading); }
.icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); display: inline-block; vertical-align: -0.15em; flex: 0 0 auto; }
::selection { background: var(--wp-action-accent-subtle); }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }
:focus-visible { outline: 3px solid var(--wp-focus-ring); outline-offset: 2px; }
.skip-link { position: fixed; z-index: 1000; top: 8px; left: 8px; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--wp-action-primary); color: var(--wp-text-on-strong); transform: translateY(-160%); }
.skip-link:focus { transform: translateY(0); }

/* ---- 3. Layout shell -------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 20px;
  background: var(--wp-bg-surface); border-bottom: 1px solid var(--wp-border-default);
}
.brand { display: flex; align-items: center; gap: 8px; font: var(--wp-type-heading); letter-spacing: .01em; }
.brand .icon { width: var(--wp-icon-lg); height: var(--wp-icon-lg); color: var(--wp-action-accent); }
.save-indicator { font: var(--wp-type-meta); color: var(--wp-text-muted); min-width: 90px; text-align: right; }
.save-indicator[data-kind="saving"] { color: var(--wp-text-secondary); }
.save-indicator[data-kind="error"] { color: var(--wp-state-danger); }
.save-indicator[data-kind="readonly"] { color: var(--wp-state-danger); }
.save-indicator[data-kind="saved"] { color: var(--wp-state-success); }
.system-banner { display: none; position: sticky; top: var(--wp-shell-bar-height, 61px); z-index: 19; align-items: center; justify-content: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--wp-border-default); background: var(--wp-action-accent-subtle); color: var(--wp-text-primary); font: var(--wp-type-label); }
.system-banner.is-visible { display: flex; }
.system-banner[data-kind="offline"], .system-banner[data-kind="error"] { background: var(--wp-state-danger-subtle); }
.system-banner .icon { color: var(--wp-state-danger); }
.system-banner-message { min-width: 0; }
.system-banner .btn { min-height: 32px; padding: 4px 10px; }
.status-badge { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 3px 8px; border: 1px solid var(--wp-border-default); border-radius: 999px; background: var(--wp-bg-subdued); color: var(--wp-text-secondary); font: var(--wp-type-meta); white-space: nowrap; }
.status-badge .icon { width: var(--wp-icon-xs); height: var(--wp-icon-xs); }
.status-badge.is-readonly { border-color: var(--wp-border-strong); }
.status-badge.is-limited { border-color: var(--wp-context-location); background: var(--wp-context-location-subtle); color: var(--wp-text-primary); }

/* Accounts/login: who's signed in, "Manage accounts" (site owner only),
   Log out — lives in the topbar next to the save indicator. See
   applyAuthUI(). */
.account-bar { display: flex; align-items: center; gap: 8px; }
.account-label { font: var(--wp-type-label); color: var(--wp-text-secondary); margin-right: 2px; white-space: nowrap; }
.account-label-inline { margin-right: 0; }
.account-desktop-actions { display: flex; align-items: center; gap: 8px; }
.account-menu { display: none; position: relative; }
.account-menu-toggle { padding: 3px; min-width: 38px; min-height: 38px; justify-content: center; }
.account-popover {
  position: absolute; z-index: 40; top: calc(100% + 8px); right: 0; width: min(260px, calc(100vw - 24px));
  padding: 6px; border: 1px solid var(--wp-border-default); border-radius: var(--radius);
  background: var(--wp-bg-surface); box-shadow: var(--wp-shadow-surface);
}
.account-popover-name { padding: 9px 10px 8px; border-bottom: 1px solid var(--wp-border-default); font: var(--wp-type-label); color: var(--wp-text-secondary); overflow: hidden; text-overflow: ellipsis; }
.account-menu-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--wp-text-primary); font: var(--wp-type-label); text-align: left; cursor: pointer; }
.account-menu-item:hover { background: var(--wp-bg-subdued); }
.account-menu-item .icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); color: var(--wp-text-secondary); }

/* ---- Avatars (Companions/Avatars feature) ---------------------------
   One small circle marker, used in three slightly different contexts:
   (a) the account-holder swatch button in the topbar (bigger, clickable
   -- see .account-avatar-btn below), (b) inline next to a name in an
   item row / trip card / timeline / tag-picker (small, see
   avatarMarkerHtml() in the JS), and (c) the swatch options inside the
   avatar-picker modal itself. All three share the same base look so a
   marker always means the same thing wherever it shows up. Colours are
   always set inline from avatarColorHex()/AVATAR_GREY_HEX -- see that
   function's own comment in data/avatars.js for why that's safe (it
   only ever returns one of a fixed, allowlisted set of hex codes, never
   a raw stored value) -- never write a raw token into one of these
   style attributes directly. */
.avatar-marker {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 20px; height: 20px; border-radius: 50%; font-size: var(--wp-glyph-xs); line-height: 1;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.avatar-marker-smiley { font-size: var(--wp-glyph-xs); font-weight: 700; }
.avatar-row { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.account-avatar-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none;
  border-radius: 999px; padding: 3px 8px 3px 3px; cursor: pointer; color: var(--wp-text-primary);
}
.account-avatar-btn:hover { border-color: var(--wp-border-default); background: var(--wp-bg-subdued); }
.account-avatar-btn .avatar-marker { width: 24px; height: 24px; font-size: var(--wp-glyph-sm); }
.trip-card-avatars { margin-top: -2px; }
/* Overflow bubble for a trip card with more companions than fit — see
   MAX_CARD_AVATARS in tripCardAvatarsHtml(). Reuses .avatar-marker's size
   so it lines up with the real markers beside it, but with a flat neutral
   background/text instead of an inline avatar colour (it isn't a real
   person's marker, so it deliberately doesn't look like one). */
.avatar-marker-overflow { background: var(--wp-bg-subdued); color: var(--wp-text-secondary); font-size: var(--wp-type-micro-size); font-weight: 700; box-shadow: inset 0 0 0 1px var(--wp-border-default); }

/* The avatar-picker modal: two small swatch grids (colours, then
   animals), each option rendered as its own little circle button --
   clicking one just updates which is `.is-selected` (client-side only,
   see openAvatarPicker()'s click handling) until Save actually submits
   the pair together. */
.avatar-picker-section { margin-bottom: 16px; }
.avatar-picker-section h4 { font: var(--wp-type-label); color: var(--wp-text-secondary); margin-bottom: 8px; }
.avatar-swatch-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.avatar-swatch-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; font-size: var(--wp-glyph-md);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  /* This class is used both on the non-interactive <span> the 'avatar-color'
     form field renders (its background always set inline per swatch -- see
     fieldHtml()'s 'avatar-color' case) AND on the real <button> elements
     openAvatarPicker()'s animal grid renders (no inline background there,
     since an animal swatch's colour is the neutral chip below, not a
     colour choice itself). padding/font/background here undo the browser's
     default button chrome so both uses look identical either way. */
  padding: 0; font-family: inherit; background: var(--wp-bg-subdued);
}
.avatar-swatch-btn.is-selected { border-color: var(--wp-text-primary); }
/* The 'avatar-color' form-field case in fieldHtml() uses real (visually
   hidden) radio inputs rather than JS click-handling — this is the CSS
   that actually shows which one is picked. */
.avatar-swatch-label { position: relative; display: inline-block; cursor: pointer; line-height: 0; }
.avatar-swatch-radio { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.avatar-swatch-radio:checked + .avatar-swatch-btn { border-color: var(--wp-text-primary); }
.avatar-swatch-radio:focus-visible + .avatar-swatch-btn { outline: 2px solid var(--wp-action-accent); outline-offset: 2px; }
.avatar-picker-preview { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px; background: var(--wp-bg-subdued); border-radius: var(--radius-sm); }
.avatar-picker-preview .avatar-marker { width: 36px; height: 36px; font-size: var(--wp-glyph-lg); }

/* NOTE: there used to be a single blanket "read-only-mode" body class
   here that hid every Add/Edit/Delete control at once for a non-Admin
   account. That doesn't work anymore now that permissions are PER TRIP
   (and, for a "user" grant, per ITEM within a trip) rather than one
   global role — see canFullyEditTrip()/canEditItem() in the JS further
   down. Every Add/Edit/Delete control is now included in a render's HTML
   string, or left out of it, based on those functions — a plain "is this
   button even in the page" check, not a CSS toggle. As ever, this is a
   courtesy for a nicer UI, not the real security boundary: the Worker
   independently refuses any write it doesn't allow, regardless of what
   the page shows (see the big "SAVING SAFELY" comment in src/worker.js). */
/* A small row of buttons that sit right next to each other, e.g. the
   "Add companion"/"Add guest" pair on the Companions tab (see
   renderCompanionsTab()) -- without this, two buttons dropped straight
   into a header that also has `justify-content: space-between` (see
   .tab-panel-head below) become two SEPARATE flex items and end up
   pushed apart to fill the row, rather than sitting adjacent to each
   other the way they visually should. Wrapping them in one of these
   makes the pair itself a single flex item instead. */
.head-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
/* A shared heading role inside a tab body, splitting it into named
   sections -- e.g. "Companions" vs "Guests" on the Companions tab. */
.section-subhead { font: var(--wp-type-heading); margin-bottom: 8px; }
.section-subhead:not(:first-child) { margin-top: 28px; }

/* Login / first-run setup screen — shown instead of the normal app
   whenever there's no valid session (see renderAuthScreen()/renderBoot()). */
.auth-screen { display: flex; justify-content: center; padding: 60px 20px; }
.auth-card { width: 100%; max-width: 360px; background: var(--wp-bg-surface); border: 1px solid var(--wp-border-default); border-radius: var(--radius); padding: 28px; box-shadow: var(--wp-shadow-surface); }
.auth-card h1 { font: var(--wp-type-heading); margin-bottom: 6px; }
.auth-card .field-hint { margin-bottom: 16px; }
.auth-error { background: var(--wp-state-danger-subtle); color: var(--wp-state-danger); border-radius: var(--radius-sm); padding: 8px 10px; font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading); margin-bottom: 14px; }

.page { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

/* ---- 4a. Buttons & form controls --------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--wp-border-default); background: var(--wp-bg-surface); color: var(--wp-text-primary);

}

.btn-primary:hover { opacity: .9; border-color: var(--wp-action-primary); }
.btn-accent { background: var(--wp-action-accent-strong); color: var(--wp-text-on-strong); border-color: var(--wp-action-accent-strong); }

label { display: block; font: var(--wp-type-label); color: var(--wp-text-secondary); margin-bottom: 4px; }

}

.field { margin-bottom: 14px; }

.form-details-body { padding: 2px 12px 2px; }

.checkbox-field { display: flex; align-items: center; gap: 8px; cursor: pointer; font: var(--wp-type-label); }

.journey { display: flex; flex-direction: column; gap: 10px; min-width: 0; margin: 0 0 14px; padding: 0; border: 0; }

.journey-date-time-row { display: grid; grid-template-columns: minmax(0,1fr) 126px; gap: 10px; }
.journey-date-time-row .field { margin: 0; display: grid; grid-template-columns: var(--wp-icon-sm) minmax(0,1fr); grid-template-areas: 'icon label' 'icon input'; column-gap: 8px; align-items: center; min-height: 64px; padding: 8px 10px; border: 1px solid var(--wp-border-strong); border-radius: 10px; background: var(--wp-bg-subdued); }
.journey-date-time-row .field > .icon { grid-area: icon; color: var(--wp-action-accent); }

.journey-duration-label { padding: 5px 9px; border-radius: 999px; background: var(--wp-action-accent-subtle); color: var(--wp-text-primary); font: var(--wp-type-meta); font-weight: 600; white-space: nowrap; }

/* The People "tag-picker" field (see fieldHtml()'s 'tag-picker' case)
   — a row of small pill-shaped checkboxes for the Trip Owner and each

.tag-picker { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-picker-item {
  display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading);
  padding: 6px 10px; border: 1px solid var(--wp-border-default); border-radius: 999px; background: var(--wp-bg-subdued);
}
.tag-picker-item input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--wp-action-accent); }
.tag-picker-role, .tag-role {
  color: var(--wp-action-accent); font: var(--wp-type-micro); letter-spacing: .04em; text-transform: uppercase;
}
.tag-picker-role { margin-left: 2px; }
.tag-role { margin-left: 3px; }
.flight-lookup-row { display: flex; gap: 8px; }
.flight-lookup-row input { flex: 1; }
.flight-lookup-code { text-transform: uppercase; }
.flight-lookup-date { flex: 0 0 150px !important; }
.flight-lookup-row .btn { flex-shrink: 0; white-space: nowrap; }
.flight-lookup-status { font: var(--wp-type-micro); color: var(--wp-text-muted); margin-top: 6px; min-height: var(--wp-type-micro-leading); }
.flight-lookup-status.is-error { color: var(--wp-state-danger); }
.flight-lookup-status.is-ok { color: var(--wp-text-secondary); }
.airport-resolve-hint.is-ok { color: var(--wp-state-success); }
.airport-resolve-hint.is-unresolved { color: var(--wp-text-muted); }
.location-picker { position: relative; }
.location-picker-row { display: flex; gap: 8px; }

.location-picker-row input, .flight-lookup-row input { min-width: 0; }
.location-picker-row .btn { flex-shrink: 0; white-space: nowrap; }
.location-results { max-height: 288px; margin-top: 8px; border: 1px solid var(--wp-border-default); border-radius: var(--radius-sm); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--wp-bg-surface); }
.location-result { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--wp-border-default); background: transparent; padding: 9px 10px; color: var(--wp-text-primary); cursor: pointer; }
.location-result:last-child { border-bottom: 0; }
.location-result:hover, .location-result:focus { background: var(--wp-bg-subdued); }
.location-result-title { display: flex; justify-content: space-between; gap: 10px; font: var(--wp-type-label); }
.location-result-kind { font: var(--wp-type-micro); color: var(--wp-text-secondary); white-space: nowrap; }
.location-result-address { margin-top: 2px; color: var(--wp-text-secondary); font: var(--wp-type-micro); }
.location-result-title > span:first-child, .location-result-address, .item-notes { overflow-wrap: anywhere; }
.location-selected { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; margin-top: 8px; border: 1px solid var(--wp-border-default); border-radius: var(--radius-sm); background: var(--wp-bg-subdued); font: var(--wp-type-meta); }
.location-selected.is-stale { border-color: var(--wp-state-danger-subtle); }
.location-selected-status { color: var(--wp-state-success); font-weight: 650; }
.location-selected.is-stale .location-selected-status { color: var(--wp-state-danger); }
.location-picker-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 7px; }
.location-picker-actions .btn { padding: 5px 8px; font-size: var(--wp-type-meta-size); line-height: var(--wp-type-meta-leading); }
.location-pin-map { display: none; height: 220px; margin-top: 9px; border: 1px solid var(--wp-border-default); border-radius: var(--radius-sm); overflow: hidden; }
.location-pin-map.is-open { display: block; }
/* Leaflet uses large internal z-indices. Contain them below dialogs, sticky
   navigation and account menus, both on the main map and within forms. */
.map-shell, .map-canvas, .location-pin-map { isolation: isolate; z-index: 0; position: relative; }
/* Generic suggestion dropdown — shared by EVERY field with app-managed
   suggestions (currency, country, city, timezone, airport; see
   suggestInputHtml() and the "Generic suggestion dropdown" section in
   the JS further down), so they all look and behave identically. It
   replaces what used to be a native <datalist> for these fields (a
   couple of real problems drove that: a native datalist popup can't be
   repositioned by CSS at all, and rebuilding its options while it's
   open was interrupting typing on some devices/browsers — see the JS
   comment for the full story). `.suggest-input-wrap` is the
   positioning anchor for the dropdown, scoped to just the input so the
   dropdown's `top: 100%` sits right under the input itself, not under
   any hint text below it (airport's resolve-hint, timezone's offset
   hint). */
.suggest-input-wrap { position: relative; }
.suggest-list {
  display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
  background: var(--wp-bg-surface); border: 1px solid var(--wp-border-default); border-radius: var(--radius-sm);
  box-shadow: var(--wp-shadow-surface); max-height: 220px; overflow-y: auto; z-index: 50;
}
.suggest-list.is-open { display: block; }
.suggest-item { padding: 8px 10px; font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading); cursor: pointer; }
.suggest-item.is-active, .suggest-item:hover { background: var(--wp-bg-subdued); }
.suggest-empty { padding: 8px 10px; font: var(--wp-type-label); color: var(--wp-text-muted); }

/* ---- 4b. Dashboard ------------------------------------------------ */
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
.section-head h1 { font: var(--wp-type-display); }

  padding: 18px; cursor: pointer; box-shadow: var(--wp-shadow-surface); display: flex; flex-direction: column; gap: 10px;
  transition: transform .12s;
}

.card-actions { display: flex; gap: 4px; }
.empty-state { text-align: center; padding: 52px 20px; color: var(--wp-text-secondary); border: 1px dashed var(--wp-border-default); border-radius: var(--radius); background: var(--wp-bg-surface); }
.empty-state-mark { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 62px; height: 62px; margin-bottom: 12px; border: 1px solid var(--wp-border-default); border-radius: 50%; color: var(--wp-text-muted); transform: rotate(-2deg); }
.empty-state-mark::after { content: ""; position: absolute; width: 80px; height: 22px; left: 36px; top: 37px; border-top: 2px dotted var(--wp-border-default); border-radius: 50%; transform: rotate(14deg); pointer-events: none; }

.empty-state.is-permission .empty-state-mark { color: var(--wp-text-secondary); }
.empty-state.is-compact { padding: 28px 18px; }
.auth-primary { width: 100%; }
.auth-footer { margin-top: 14px; }
.manage-users-intro { margin-bottom: 16px; }
.form-details-hint { margin: 0 0 12px; }
.companion-form-intro { margin-bottom: 14px; }
.item-notes { margin-top: 6px; }
.intro-note { background: var(--wp-bg-surface); border: 1px solid var(--wp-border-default); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 22px; font: var(--wp-type-label); color: var(--wp-text-secondary); }
.intro-note strong { color: var(--wp-text-primary); }
.settings-stack { display: grid; gap: 16px; }
.settings-section { padding: 20px; border: 1px solid var(--wp-border-default); border-radius: var(--radius); background: var(--wp-bg-surface); }
.settings-section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.settings-section-head p { margin-top: 4px; color: var(--wp-text-secondary); font: var(--wp-type-label); }
.settings-section .field:last-child { margin-bottom: 0; }

/* ---- 4c. Trip header & tabs ---------------------------------------- */
.trip-header { margin-bottom: 22px; }
.back-link { display: inline-flex; align-items: center; gap: 4px; font: var(--wp-type-label); color: var(--wp-text-secondary); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 10px; }
.back-link .icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); }
.back-label-compact { display: none; }
.trip-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.trip-heading-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.trip-title-row h1 { font: var(--wp-type-display); }
.trip-meta { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading); color: var(--wp-text-secondary); }

.warn-link { color: var(--wp-state-danger); cursor: pointer; background: none; border: none; font: var(--wp-type-label); padding: 0; text-decoration: underline; }

/* Navigation is deliberately grouped by the job someone is doing: View
   (Timeline/Map), Plan, People and Manage. The groups wrap rather than
   disappear on small screens, so the structure makes the many trip views
   easier to scan without reintroducing the old hidden-tab problem. */
.nav-group-label { margin-top: 18px; font: var(--wp-type-micro); text-transform: uppercase; letter-spacing: .08em; color: var(--wp-text-muted); }
/* The two "big picture" views (Timeline, Map) — larger and more prominent
   than the regular data-entry tabs below, since they're the main thing
   most people open a trip to look at. */
.hero-row { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
.hero-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px; border-radius: var(--radius); border: 1px solid var(--wp-border-default);
  background: var(--wp-bg-surface); color: var(--wp-text-primary); box-shadow: var(--wp-shadow-surface);
  font: var(--wp-type-body); font-weight: 600; cursor: pointer;
  transition: transform .12s, border-color .15s;
}
.hero-btn .icon { width: var(--wp-icon-md); height: var(--wp-icon-md); color: var(--wp-action-accent); }
.hero-btn:hover { transform: translateY(-1px); }
.hero-btn.active { background: var(--wp-action-primary); color: var(--wp-text-on-strong); border-color: var(--wp-action-primary); }
.hero-btn.active .icon { color: var(--wp-action-accent); }

/* Each group owns its own short tab row. This keeps related controls
   together on wide screens and still lets every group wrap in full on a
   phone, rather than hiding tabs in a horizontal scroll strip. */
.tabbar { display: flex; flex-wrap: wrap; gap: 12px 20px; margin: 20px 0 22px; overflow-x: visible; }
.tab-group { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tab-group-label { font: var(--wp-type-micro); text-transform: uppercase; letter-spacing: .08em; color: var(--wp-text-muted); }
.tab-group-tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--wp-border-default); }
.tab-btn {
  padding: 9px 14px; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--wp-text-secondary); font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading); font-weight: 500; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab-btn:hover { color: var(--wp-text-primary); }
.tab-btn.active { color: var(--wp-text-primary); border-bottom-color: var(--wp-action-accent); font-weight: 600; }
.tab-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.tab-panel-head h2 { font: var(--wp-type-heading); }

/* The mobile shell exists alongside, rather than replacing, the complete
   desktop navigation. CSS chooses one representation at the breakpoint;
   both call the same switch-tab action and therefore share permissions and
   panel rendering rather than creating a second navigation state machine. */
.mobile-trip-shell, .mobile-destination-nav { display: none; }
.mobile-child-nav { display: flex; gap: 4px; margin: 0 0 18px; padding: 4px; border: 1px solid var(--wp-border-default); border-radius: var(--radius); background: var(--wp-bg-subdued); overflow-x: auto; scrollbar-width: none; }
.mobile-child-nav::-webkit-scrollbar { display: none; }
.mobile-child-btn { flex: 1 0 auto; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 11px; border: 0; border-radius: calc(var(--radius) - 4px); background: transparent; color: var(--wp-text-secondary); font: var(--wp-type-label); cursor: pointer; white-space: nowrap; }
.mobile-child-btn.active { background: var(--wp-bg-surface); color: var(--wp-text-primary); box-shadow: 0 1px 3px rgba(26,34,51,.12); font-weight: 650; }
.mobile-child-btn .icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); }
.mobile-overview-switch .mobile-child-btn.active .icon { color: var(--wp-action-accent); }
.mobile-more-list { display: grid; gap: 10px; }
.mobile-more-card { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--wp-border-default); border-radius: var(--radius); background: var(--wp-bg-surface); color: var(--wp-text-primary); text-align: left; cursor: pointer; box-shadow: var(--wp-shadow-surface); }
.mobile-more-card > .icon { width: var(--wp-icon-lg); height: var(--wp-icon-lg); color: var(--wp-action-accent); }
.mobile-more-card-copy { flex: 1; min-width: 0; }
.mobile-more-card-title { display: block; font: var(--wp-type-label); font-weight: 650; }
.mobile-more-card-description { display: block; margin-top: 2px; color: var(--wp-text-secondary); font: var(--wp-type-meta); }
.mobile-more-card .icon:last-child { width: var(--wp-icon-sm); height: var(--wp-icon-sm); color: var(--wp-text-muted); }
.mobile-more-return { display: none; }

/* ---- 4d. The card (every list: Plan, Timeline, Map, People) ---------
   One component, laid out from ITEM_CARD_LAYOUTS. A card is a stack of
   lines; a line is a row of slots. Context variants below adjust padding
   and emphasis only -- never the structure, which is the layout table's
   job. */
.item-list { display: flex; flex-direction: column; gap: 10px; }
.item-row {
  display: flex; flex-direction: column; gap: 3px;
  padding: 8px 12px 10px;
  border: 1px solid var(--wp-border-default); border-left-width: 3px; border-radius: var(--radius-sm);
  background: var(--wp-bg-surface);
}
.item-row-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
.item-row-line[data-item-line="title"] { align-items: baseline; flex-wrap: wrap; gap: 8px; }
/* Pushes everything after it to the right edge. Deliberately not content:
   a line holding only a spacer does not render. */
.item-row-spacer { flex: 1 1 auto; }

/* A category stripe in the record's existing Map colour, so a flight and a
   coffee no longer carry identical weight -- they differed only by a small
   tinted glyph. Transport gets a little more, a faint tint and a heavier
   title, because it is the part of a day you cannot be late for. */
.item-row[data-item-section="activity"] { border-left-color: var(--wp-map-activity); }
.item-row[data-item-section="accommodation"] { border-left-color: var(--wp-map-accommodation); }
.item-row[data-item-section="destination"] { border-left-color: var(--wp-context-location); }
.item-row[data-item-section="transport"] { border-left-color: var(--wp-map-transport); background: color-mix(in srgb, var(--wp-map-transport) 4%, var(--wp-bg-surface)); }
.item-row[data-item-section="transport"] .item-title { font-weight: 650; }

.item-row .item-icon {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--wp-bg-subdued); color: var(--wp-text-secondary);
}
.item-row .item-icon .icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); }
/* The People lists put a person's own marker in the icon slot. */
.item-row .item-icon.item-icon-avatar { background: none; }
.item-row .item-icon.item-icon-avatar .avatar-marker { width: 26px; height: 26px; font-size: var(--wp-glyph-sm); }
.item-row-time { flex: 0 0 auto; color: var(--wp-text-secondary); font: var(--wp-type-meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item-title { min-width: 0; font: var(--wp-type-label); overflow-wrap: anywhere; }
.item-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.item-row-cost { flex: 0 0 auto; color: var(--wp-action-accent-strong); font: var(--wp-type-meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item-row-cost.rate-missing { color: var(--wp-state-danger); }
.item-sub { font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading); color: var(--wp-text-secondary); margin-top: 2px; }

/* Metadata flows as one wrapping run. It used to be a column of groups,
   which at 390px collapsed to one chip per line -- twelve chips over
   fifteen rows, 384px of a 517px card. The groups survive as ordering
   only. */
.item-metadata { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; min-width: 0; }
.item-meta-group { display: contents; }
.item-meta-group[data-item-meta="datetime"] { order: 1; }
.item-meta-group[data-item-meta="location"] { order: 2; }
.item-meta-group[data-item-meta="category"] { order: 3; }
.item-meta-group[data-item-meta="people"] { order: 4; }
.item-meta-group[data-item-meta="commerce"] { order: 5; }
/* Past ITEM_META_CAP chips the rest move behind a native disclosure, so a
   busy record stays one or two lines tall. */
.item-meta-more { order: 6; }
.item-meta-more-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border: 1px dashed var(--wp-border-strong); border-radius: 6px;
  color: var(--wp-text-muted); font: var(--wp-type-meta); cursor: pointer; list-style: none;
}
.item-meta-more-btn::-webkit-details-marker { display: none; }
.item-meta-more-btn:hover { color: var(--wp-text-primary); border-color: var(--wp-text-muted); }
.item-meta-more-btn .icon { width: var(--wp-icon-xs); height: var(--wp-icon-xs); }
.item-meta-more-rest { display: flex; flex-wrap: wrap; gap: 5px 6px; margin-top: 5px; }

/* People get their own line along the bottom and scroll sideways rather
   than wrapping, so a record with two companions and one with twelve are
   the same height. Focusable so the run can be panned from the keyboard,
   and the only part of a card allowed to scroll horizontally. */
.item-people {
  flex: 1 1 auto; min-width: 0;
  display: flex; gap: 6px; flex-wrap: nowrap;
  margin-top: 3px; padding-top: 7px; padding-bottom: 2px;
  border-top: 1px solid var(--wp-border-default);
  overflow-x: auto; overscroll-behavior-x: contain;
  scrollbar-width: thin; scrollbar-color: var(--wp-border-strong) transparent;
}
.item-people::-webkit-scrollbar { height: 6px; }
.item-people::-webkit-scrollbar-thumb { background: var(--wp-border-strong); border-radius: 999px; }
.item-people::-webkit-scrollbar-track { background: transparent; }
.item-people .tag { flex: 0 0 auto; }

.item-supporting { color: var(--wp-text-secondary); font: var(--wp-type-meta); overflow-wrap: anywhere; }
.item-status { color: var(--wp-state-danger); font: var(--wp-type-meta); display: flex; align-items: center; gap: 5px; }
.item-status .icon { width: var(--wp-icon-xs); height: var(--wp-icon-xs); }

/* Timeline: the one context that drops metadata entirely and clamps its
   supporting line to two, so a day reads as a scan. The text stays in the
   DOM -- it is only visually shortened, and assistive technology reads it
   all -- and pressing the card opens the rest in place. */
.item-row--timeline .item-supporting {
  display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
}
.item-row--timeline.is-expanded .item-supporting {
  display: block; -webkit-line-clamp: none; line-clamp: none; overflow: visible;
}
/* Only a note that is really cut off gets a control, so a short one does not
   advertise an action that would do nothing. markTruncatedNotes() measures
   after layout and sets the attribute. */
.item-more {
  display: none; align-self: flex-start;
  margin-top: 1px; padding: 2px 0;
  border: 0; background: none;
  color: var(--wp-action-accent-strong); font: var(--wp-type-meta);
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
}
.item-row--timeline[data-truncated="true"] .item-more,
.item-row--timeline.is-expanded .item-more { display: inline-flex; }
.item-row--timeline[data-truncated="true"], .item-row--timeline.is-expanded { cursor: pointer; }
/* The controls inside keep their own pointer, so the card-wide press never
   looks like it owns them. */
.item-row--timeline .item-actions, .item-row--timeline .item-people,
.item-row--timeline .item-meta-more { cursor: auto; }
/* Map popovers sit inside Leaflet's own chrome, so they drop the card
   frame and separate with a rule instead. */
.item-row--map { padding: 7px 0; border: 0; border-radius: 0; box-shadow: none; background: transparent; }
.item-row--map + .item-row--map { border-top: 1px solid var(--wp-border-default); }
.item-row--map .item-actions .btn-icon { width: 32px; height: 32px; }

.item-icon.tone-activity { background: var(--wp-map-activity-subtle); color: var(--wp-map-activity); }
.item-icon.tone-transport { background: var(--wp-map-transport-subtle); color: var(--wp-map-transport); }
.item-icon.tone-stay { background: var(--wp-map-accommodation-subtle); color: var(--wp-map-accommodation); }
.item-icon.tone-destination { background: var(--wp-context-location-subtle); color: var(--wp-context-location); }
.item-tags { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.tag { font: var(--wp-type-meta); color: var(--wp-text-secondary); background: var(--wp-bg-subdued); border-radius: 6px; padding: 2px 7px; display: inline-flex; align-items: center; gap: 4px; }
.tag .icon { width: var(--wp-icon-xs); height: var(--wp-icon-xs); }
.tag-cost { color: var(--wp-action-accent); background: var(--wp-action-accent-subtle); }
/* Companions tab: Guest vs Companion, and a Companion's access-level tag
   (Owner/Admin/User/Viewer) -- see renderCompanionsTab() and the
   COMPANIONS & AVATARS comment in src/worker.js's resolveCompanionAccessLevels()
   for what these mean and who can see them (everyone on the trip, unlike
   the raw `grants` list itself). Colour is purely a visual hint of
   "how much this person can do here" -- Owner/Admin get the same warm
   accent colour already used for cost tags elsewhere (most privileged,
   most worth noticing at a glance); User/Viewer and Guest stay the plain
   neutral grey `.tag` already used for everything else, since they're
   not something you need to specifically notice. */
/* NB: the class name below is built by concatenation from the STORED role
   string ("superuser"), not from the label shown to the reader ("Owner") --
   see renderCompanionsTab()'s `' tag-role-' + accessRole`. The display
   wording and the stored role deliberately differ; don't "fix" this to
   match the label or the rule stops matching any element. */
.tag-role-superuser, .tag-role-admin { color: var(--wp-action-accent); background: var(--wp-action-accent-subtle); }
.item-actions { display: flex; gap: 2px; flex-shrink: 0; }
.copy-btn { min-width: 24px; min-height: 24px; align-items: center; justify-content: center; background: none; border: none; color: var(--wp-text-muted); cursor: pointer; padding: 2px; display: inline-flex; }
.copy-btn:hover { color: var(--wp-text-primary); }
.copy-btn .icon { width: var(--wp-icon-xs); height: var(--wp-icon-xs); }

/* ---- 4e. Timeline -------------------------------------------------
   Three pieces: a toolbar for moving through a long trip, one card per
   day, and the event cards inside it. A day card is a rail (the spine
   plus its date badge) beside a body (the heading disclosure, the add
   menu, and the day's events). */

/* Sticky on desktop only. Below 768px .trip-header is itself sticky and
   its height is not measured into a custom property, so a second sticky
   layer there would risk sitting on top of it. */
.timeline-toolbar {
  position: sticky; z-index: 15;
  top: calc(var(--wp-shell-bar-height, 61px) + var(--wp-shell-banner-height, 0px));
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px; padding: 8px 0; background: var(--wp-bg-canvas);
}
.timeline-progress { display: flex; align-items: center; gap: 9px; margin-right: auto; color: var(--wp-text-secondary); font: var(--wp-type-meta); }
.timeline-progress strong { color: var(--wp-text-primary); }
.timeline-progress-track { width: 88px; height: 4px; border-radius: 999px; background: var(--wp-border-default); overflow: hidden; }
.timeline-progress-fill { display: block; height: 100%; width: var(--wp-timeline-progress, 0%); border-radius: 999px; background: var(--wp-action-accent); }
.timeline-tool { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 12px; border: 1px solid var(--wp-border-default); border-radius: 999px; background: var(--wp-bg-surface); color: var(--wp-text-secondary); font: var(--wp-type-micro); cursor: pointer; }
.timeline-tool:hover { border-color: var(--wp-text-muted); color: var(--wp-text-primary); }
.timeline-tool .icon { width: var(--wp-icon-xs); height: var(--wp-icon-xs); }
.timeline-tool.is-today { border-color: var(--wp-action-accent-strong); color: var(--wp-action-accent-strong); }

.day-card { position: relative; display: flex; gap: 14px; margin-bottom: 10px; }
.day-card:last-child { margin-bottom: 0; }
.day-rail { position: relative; display: flex; justify-content: center; width: 40px; flex-shrink: 0; }
/* The spine is absolutely positioned so it cannot collapse. As a flex
   child it took its height from the day body and measured 0px on every
   collapsed day, breaking the line exactly where continuity matters. */
.day-rail::before {
  content: ""; position: absolute; top: 8px; bottom: -14px; left: 50%;
  width: 2px; margin-left: -1px;
  background: color-mix(in srgb, var(--wp-border-strong) 45%, var(--wp-border-default));
}
.day-card:last-child .day-rail::before { display: none; }
/* A date badge, not a control: the disclosure is the whole heading row
   beside it, which is a far larger target than a 34px circle. */
.day-num {
  position: relative; z-index: 1; width: 36px; height: 36px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--wp-bg-canvas); border-radius: 50%;
  background: var(--wp-action-primary); color: var(--wp-text-on-strong);
  font: var(--wp-type-meta); font-weight: 600; font-variant-numeric: tabular-nums;
}
.day-card.is-today .day-num { background: var(--wp-action-accent-strong); box-shadow: 0 0 0 3px var(--wp-action-accent-subtle); }
.day-card.is-outside .day-num { background: var(--wp-bg-canvas); border: 1px dashed var(--wp-border-strong); color: var(--wp-text-muted); }

.day-body { flex: 1; min-width: 0; padding-bottom: 6px; }
.day-headrow { display: flex; align-items: center; gap: 8px; }
.day-head {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  min-height: 44px; padding: 4px 8px 4px 0;
  border: 0; border-radius: var(--radius-sm); background: transparent;
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.day-head:hover { background: var(--wp-bg-subdued); }
.day-head-copy { flex: 1; min-width: 0; }
.day-date-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day-date { font: var(--wp-type-heading); }
.day-card.is-outside .day-date { color: var(--wp-text-muted); }
.day-area { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--wp-text-secondary); font: var(--wp-type-label); }
.day-flag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; background: var(--wp-action-accent-strong); color: var(--wp-text-on-strong); font: var(--wp-type-micro); letter-spacing: .06em; text-transform: uppercase; }
.day-flag.is-quiet { background: transparent; color: var(--wp-text-muted); border: 1px dashed var(--wp-border-strong); }
/* The summary is what a collapsed day says about itself. Without it a
   closed day was 38px of nothing and an empty day looked like a full one. */
.day-summary { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: var(--wp-text-muted); font: var(--wp-type-meta); font-variant-numeric: tabular-nums; }
.day-summary-spend { color: var(--wp-text-secondary); }
.day-summary-dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; }
.day-chevron { flex: 0 0 auto; color: var(--wp-text-muted); transition: transform .16s ease; }
.day-chevron .icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); }
.day-card:not(.is-collapsed) .day-chevron { transform: rotate(180deg); }

/* One add control per day rather than three: a fortnight previously carried
   42 permanently visible buttons competing with the itinerary. This one
   recedes until the day is hovered or focused -- by dropping its outline
   rather than its opacity, so it is never an invisible target a pointer can
   land on or a screen reader can reach ahead of sighted readers. */
.day-add { position: relative; flex: 0 0 auto; }
.day-add-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 5px 11px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--wp-text-muted); font: var(--wp-type-micro); cursor: pointer; list-style: none; transition: color .14s ease, border-color .14s ease; }
.day-card:hover .day-add-btn, .day-card:focus-within .day-add-btn, .day-add[open] .day-add-btn { border-color: var(--wp-border-default); background: var(--wp-bg-surface); color: var(--wp-text-secondary); }
.day-add-btn::-webkit-details-marker { display: none; }
.day-add-btn:hover { border-color: var(--wp-action-accent-strong); color: var(--wp-action-accent-strong); }
.day-add-btn .icon { width: var(--wp-icon-xs); height: var(--wp-icon-xs); }
.day-add-menu { position: absolute; z-index: 18; top: calc(100% + 6px); right: 0; min-width: 172px; padding: 6px; border: 1px solid var(--wp-border-default); border-radius: var(--radius); background: var(--wp-bg-surface); box-shadow: var(--wp-shadow-surface); }
.day-add-item { width: 100%; display: flex; align-items: center; gap: 9px; min-height: 38px; padding: 8px 10px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--wp-text-primary); font: var(--wp-type-label); text-align: left; cursor: pointer; }
.day-add-item:hover { background: var(--wp-bg-subdued); }
.day-add-item .icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); color: var(--wp-text-secondary); }

.day-content { display: flex; flex-direction: column; gap: 7px; padding-top: 4px; }
.day-events { display: flex; flex-direction: column; gap: 7px; }
.overnight-note { display: flex; align-items: center; gap: 7px; padding: 4px 0 2px; color: var(--wp-text-muted); font-size: var(--wp-type-meta-size); line-height: var(--wp-type-meta-leading); }
.overnight-note.is-unbooked { color: var(--wp-state-danger); }
.overnight-note .icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); }
.no-day-events { display: flex; align-items: center; gap: 8px; padding: 6px 0; color: var(--wp-text-muted); font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading); }
.no-day-events .icon { width: var(--wp-icon-sm); height: var(--wp-icon-sm); }

@media (max-width: 768px) {
  .timeline-toolbar { position: static; }
}
@media (max-width: 640px) {
  /* Narrow screens collapse the add control to one plus, kept inline with
     the date rather than given a full-width row of its own. */
  .day-add-label { display: none; }
  .day-add-btn { width: 44px; min-width: 44px; padding: 0; justify-content: center; border-radius: 50%; }
  .day-add-btn .icon { width: var(--wp-icon-md); height: var(--wp-icon-md); }
  .day-headrow { gap: 2px; }
  .day-card { gap: 10px; }
  .day-rail { width: 36px; }
  .timeline-progress-track { width: 64px; }
}

/* ---- 4f. Expenses table ------------------------------------------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 18px; }
.stat-tile { background: var(--wp-bg-surface); border: 1px solid var(--wp-border-default); border-radius: var(--radius-sm); padding: 12px 14px; }
.stat-tile .stat-label { font: var(--wp-type-micro); text-transform: uppercase; letter-spacing: .04em; color: var(--wp-text-muted); }
.stat-tile .stat-value { font: var(--wp-type-heading); margin-top: 4px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--wp-border-default); border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading); min-width: 640px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--wp-border-default); }
th { font: var(--wp-type-micro); text-transform: uppercase; letter-spacing: .03em; color: var(--wp-text-muted); background: var(--wp-bg-subdued); }
td.num, th.num { text-align: right; font: var(--wp-type-meta); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
.rate-missing { color: var(--wp-state-danger); font: var(--wp-type-micro); }
.rate-table label { margin: 0; }
.rate-table .field-row { grid-template-columns: 1fr 1fr; align-items: end; }
.expenses-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.expense-rate-warning { border-color: var(--wp-state-danger-subtle); }
.expense-ledger { display: none; }
.expense-ledger-day { margin-bottom: 18px; }
.expense-ledger-date { margin-bottom: 7px; color: var(--wp-text-secondary); font: var(--wp-type-meta); }
.expense-ledger-list { display: grid; gap: 8px; }
.expense-ledger-row { padding: 12px; border: 1px solid var(--wp-border-default); border-radius: var(--radius-sm); background: var(--wp-bg-surface); }
.expense-ledger-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.expense-ledger-title { min-width: 0; font: var(--wp-type-label); overflow-wrap: anywhere; }
.expense-ledger-type { flex: 0 0 auto; color: var(--wp-text-muted); font: var(--wp-type-micro); text-transform: uppercase; letter-spacing: .04em; }
.expense-ledger-reference { margin-top: 2px; color: var(--wp-text-secondary); font: var(--wp-type-meta); overflow-wrap: anywhere; }
.expense-ledger-amounts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.expense-ledger-amount { min-width: 0; padding-top: 8px; border-top: 1px solid var(--wp-border-default); }
.expense-ledger-amount-label { display: block; color: var(--wp-text-muted); font: var(--wp-type-micro); text-transform: uppercase; letter-spacing: .04em; }
.expense-ledger-amount-value { display: block; margin-top: 2px; color: var(--wp-text-primary); font: var(--wp-type-meta); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* ---- 4g. Modal & toast --------------------------------------------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,18,24,.5); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
.modal { display: flex; flex-direction: column; background: var(--wp-bg-surface); border-radius: var(--radius); max-width: 560px; width: 100%; max-height: calc(100dvh - 80px); overflow: hidden; box-shadow: var(--wp-shadow-surface); }
.modal form { display: flex; flex: 1 1 auto; flex-direction: column; min-height: 0; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--wp-border-default); }
.modal-head { flex: 0 0 auto; }
.modal-head h2 { font: var(--wp-type-heading); min-width: 0; overflow-wrap: anywhere; }
.modal-body { flex: 1 1 auto; min-height: 0; padding: 18px 20px; overflow-y: auto; }
.modal-foot { position: sticky; bottom: 0; flex: 0 0 auto; display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--wp-border-default); background: var(--wp-bg-surface); box-shadow: 0 -5px 16px rgba(26,34,51,.06); }
.confirm-text { font: var(--wp-type-label); color: var(--wp-text-secondary); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--wp-action-primary); color: var(--wp-text-on-strong); padding: 10px 18px; border-radius: 999px; font: var(--wp-type-label); box-shadow: var(--wp-shadow-surface); z-index: 200; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

.map-range-input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--wp-text-primary); outline-offset: 2px; }
.map-range-input:focus-visible::-moz-range-thumb { outline: 2px solid var(--wp-text-primary); outline-offset: 2px; }

/* The little direction-of-travel triangle dropped at the midpoint of
   each transport leg (see addDirectionArrow() in the Map tab section).
   A plain CSS border-triangle rather than an image, so it's crisp at
   any zoom and its colour always matches the line it belongs to. The
   custom classname sidesteps Leaflet's default divIcon box (a white
   square with a border) — we want just the triangle, nothing around it.
   Points right (0deg) by default; JS rotates it to match each leg. */
.transport-arrow-icon { background: transparent; border: none; }
.transport-arrow {
  width: 0; height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-left: 11px solid; /* color set inline per-leg */
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
}
/* Leaflet's popup chrome is styled inline by the library; these few rules
   just make it sit comfortably against the app's own card/surface look
   instead of Leaflet's plain-white default. */
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--wp-bg-surface); color: var(--wp-text-primary); }
.leaflet-popup-content { font-size: var(--wp-type-label-size); line-height: var(--wp-type-label-leading); }
/* Leaflet adds .leaflet-popup-scrolled once a popup's content exceeds the
   maxHeight set in mapPopupOptions(). Without a visible scrollbar there was
   nothing to say the text continued, which on a phone left no obvious way to
   reach it; `contain` keeps the gesture in the note instead of panning the
   map underneath. */
.leaflet-popup-content.leaflet-popup-scrolled {
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding-right: 6px; border-bottom: 1px solid var(--wp-border-default);
  scrollbar-width: thin; scrollbar-color: var(--wp-border-strong) transparent;
}
.leaflet-popup-content.leaflet-popup-scrolled::-webkit-scrollbar { width: 8px; }
.leaflet-popup-content.leaflet-popup-scrolled::-webkit-scrollbar-thumb { background: var(--wp-border-strong); border-radius: 999px; }
.leaflet-popup-content.leaflet-popup-scrolled::-webkit-scrollbar-track { background: transparent; }
/* A scrollbar is not an affordance on a phone: touch platforms draw overlay
   scrollbars that appear only while a scroll is already happening, so at rest
   there is nothing to say the text continues. This fade is always visible.
   It is a sticky last child of the scroller rather than an overlay on the
   wrapper, which keeps it working without :has() and without Leaflet's own
   inline sizing having to cooperate. */
.leaflet-popup-content.leaflet-popup-scrolled::after {
  content: ""; display: block; position: sticky; bottom: 0;
  height: 28px; margin-top: -28px; pointer-events: none;
  background: linear-gradient(to top, var(--wp-bg-surface), transparent);
}

  <div id="app"></div>
