      '<button class="back-link" data-action="back-to-dashboard">' + icon('back') + '<span class="back-label-wide">All trips</span><span class="back-label-compact">Back</span></button>' +
      '<div class="trip-title-row">' +
        '<div><div class="trip-heading-line"><h1 data-page-heading tabindex="-1">' + esc(trip.name) + '</h1>' + tripAccessBadgeHtml(trip) + '</div>' +
          '<div class="trip-meta">' +
            '<span class="trip-date-range">' + (trip.startDate ? formatDateShort(trip.startDate) : '?') + ' – ' + (trip.endDate ? formatDateShort(trip.endDate) : '?') + '</span>' +
            (canFullyEditTrip(trip) ? '<span class="trip-spend-meta"><b>' + money(spend.known, trip.homeCurrency) + '</b> spent so far' +
              (spend.unknownCount ? ' · <button class="warn-link" data-action="switch-tab" data-tab="settings">' + spend.unknownCount + ' need an exchange rate</button>' : '') +
            '</span>' : '') +
          '</div>' +
        '</div>' +
        headerActions +
      '</div>' +
    '</div>' +
      '<nav class="desktop-trip-nav" aria-label="Trip sections"><div class="nav-group-label">View</div><div class="hero-row">' + heroHtml + '</div>' +
    '<div class="tabbar">' + tabsHtml + '</div></nav>' +
    '<div class="mobile-trip-shell">' + renderMobileChildNav(trip, mobileDestinationForTab(currentTab)) +
      (mobileDestinationForTab(currentTab) === 'more' && currentTab !== 'more' ? '<button class="back-link mobile-more-return" data-action="switch-mobile-destination" data-destination="more">' + icon('back') + ' More</button>' : '') +
    '</div>' +
    '<section id="trip-panel" class="trip-panel" tabindex="-1" ' + (currentTab === 'more' ? 'aria-label="More"' : 'aria-labelledby="trip-nav-' + currentTab + '"') + '>' + panel + '</section>' +
    renderMobileDestinationNav(trip)
  );
}

/* ---------- 14. Shared row-rendering helpers -------------------------- */

function copyBtn(value, label) {
  if (!value) return '';
  return '<button class="copy-btn" data-action="copy-text" data-value="' + esc(value) + '" aria-label="Copy ' + esc(label) + '" title="Copy ' + esc(label) + '">' + icon('copy') + '</button>';
}

function mapsLink(address) {
  if (!address) return '';
  var url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">Open in Maps ' + icon('forward') + '</a>';
}

function costTag(trip, amount, currency, rateOverride) {
  if (!amount) return '';
  var hv = homeValue(trip, amount, currency, rateOverride);
  var label = money(amount, currency);
  if (currency && currency !== trip.homeCurrency) {
    label += hv.known ? ' (≈ ' + money(hv.value, trip.homeCurrency) + ')' : ' (rate needed)';
  }
  return '<span class="tag tag-cost">' + icon('expenses') + label + '</span>';
}

// Edit/Delete buttons for one item row — depends on this account's
// permission on `trip` (see "Per-trip permissions" near currentTrip()).
// `taggable` should be true for the four per-companion-scoped item types,
// false for companion/contact/expense (never editable by a "user" grant).
// Returns '' if this account can't do anything to this row.
function rowActions(trip, section, item) {
  var taggable = ['destination', 'activity', 'transport', 'accommodation'].indexOf(section) !== -1;
  var canEdit = taggable ? canEditItem(trip, item) : canFullyEditTrip(trip);
  // Deleting is always full-scope-only -- even a "user" grant can never
  // delete an item (mergeUserScopedList() in src/worker.js silently
  // keeps it even if missing from what they submit).
  var canDelete = canFullyEditTrip(trip);
  if (!canEdit && !canDelete) return '';
  var itemId = item[ENTITY_ID_FIELDS[section]];
  return '<div class="item-actions">' +
    (canEdit ? '<button class="btn btn-icon btn-ghost" data-action="edit-' + section + '" data-id="' + itemId + '" aria-label="Edit ' + section + '" title="Edit">' + icon('edit') + '</button>' : '') +
    (canDelete ? '<button class="btn btn-icon btn-ghost" data-action="delete-' + section + '" data-id="' + itemId + '" aria-label="Delete ' + section + '" title="Delete">' + icon('delete') + '</button>' : '') +
  '</div>';
}

var ITEM_META_ORDER = ['datetime', 'location', 'category', 'people', 'commerce'];

// How many metadata chips a card shows before the rest move behind a
// "+N more" disclosure. One number, tuned in one place; 0 never caps.
var ITEM_META_CAP = 3;

/* ---------- ItemRow: one card, many layouts -------------------------
   A card is a stack of lines; a line is a list of slot names. This table
   is the whole configuration surface -- a new context is an entry here,
   never a branch in the renderer. Before this, the Plan lists, the
   Timeline, the Map popovers and the three People lists had each drifted
   into their own markup for the same thing.

   Two rules let one layout serve a bare record and a fully populated one:
   a slot with nothing to show renders nothing, and a line whose slots are
   all empty does not render at all. `spacer` pushes what follows to the
   right edge and never keeps a line alive by itself. */
var ITEM_CARD_LAYOUTS = {
  plan:     [['time', 'icon', 'spacer', 'cost', 'actions'], ['title', 'badges'], ['metadata'], ['supporting'], ['status'], ['people']],
  timeline: [['time', 'icon', 'spacer', 'cost', 'actions'], ['title', 'badges'], ['supporting'], ['status']],
  map:      [['icon', 'spacer', 'actions'], ['title', 'badges'], ['datetime', 'location'], ['supporting'], ['people']],
  person:   [['avatar', 'icon', 'spacer', 'actions'], ['title', 'badges'], ['metadata'], ['supporting'], ['status']]
};

function itemMetaDescriptorHtml(meta) {
  if (!meta || !meta.text) return '';
  var content = (meta.icon ? icon(meta.icon) : '') + esc(meta.text);
  if (meta.mapsAddress) content += ' ' + mapsLink(meta.mapsAddress);
  if (meta.copyValue) content += copyBtn(meta.copyValue, meta.copyLabel || meta.text);
  return '<span class="tag' + (meta.tone === 'cost' ? ' tag-cost' : '') + '">' + content + '</span>';
}

// The one metadata renderer. `slots` chooses which groups, `cap` how many
// chips appear before a disclosure takes the rest. itemMetadataHtml() is
// this with every group and no cap, so there is a single implementation
// rather than a capped copy alongside an uncapped one.
function itemMetaBlockHtml(trip, metadata, slots, cap) {
  var shown = 0;
  var overflow = [];
  var groups = slots.map(function (slot) {
    // companionTags() returns one joined run, so people count as a single
    // unit here. In the shipped layouts they sit on their own uncapped
    // line instead, so this only matters to itemMetadataHtml().
    var chips = slot === 'people'
      ? [companionTags(trip, metadata.people || [])]
      : (metadata[slot] || []).map(itemMetaDescriptorHtml);
    var present = chips.filter(function (chip) { return chip; });
    if (!present.length) return '';
    var visible = present.filter(function (chip) {
      if (cap && shown >= cap) { overflow.push(chip); return false; }
      shown++;
      return true;
    }).join('');
    return visible ? '<div class="item-meta-group" data-item-meta="' + slot + '">' + visible + '</div>' : '';
  }).join('');
  var more = overflow.length
    ? '<details class="item-meta-more"><summary class="item-meta-more-btn">' + icon('expand') + '+' + overflow.length + ' more</summary>' +
      '<div class="item-meta-more-rest">' + overflow.join('') + '</div></details>'
    : '';
  // Tested against the joined result, not inside the map callback: an
  // earlier version referenced a callback-local variable and threw on
  // every populated trip while empty ones appeared to work.
  return (groups || more) ? '<div class="item-metadata">' + groups + more + '</div>' : '';
}

function itemMetadataHtml(trip, metadata) {
  return itemMetaBlockHtml(trip, metadata, ITEM_META_ORDER, 0);
}

/* Each slot draws one thing and knows nothing about which context asked
   for it. The third argument is the set of metadata groups the catch-all
   `metadata` slot still owns -- see itemRowHtml() below. */
var ITEM_CARD_SLOTS = {
  time: function (trip, model) {
    return model.leadingTime ? '<span class="item-row-time">' + esc(model.leadingTime) + '</span>' : '';
  },
  icon: function (trip, model) {
    if (!model.icon) return '';
    return '<span class="item-icon tone-' + esc(model.tone || model.section || 'destination') + '">' + icon(model.icon) + '</span>';
  },
  // A person's own marker in place of a category glyph, which is how the
  // Companions rows already differed from every other list.
  avatar: function (trip, model) {
    return model.avatarHtml ? '<span class="item-icon item-icon-avatar">' + model.avatarHtml + '</span>' : '';
  },
  title: function (trip, model) {
    return '<span class="item-title">' + esc(model.title) + '</span>';
  },
  // Small tags that belong beside the title rather than in the metadata
  // run: a contact's role, a companion's access level, "Guest".
  badges: function (trip, model) {
    return model.badgesHtml ? '<span class="item-badges">' + model.badgesHtml + '</span>' : '';
  },
  cost: function (trip, model) {
    if (!model.cost) return '';
    return '<span class="item-row-cost' + (model.cost.known ? '' : ' rate-missing') + '">' + model.cost.text + '</span>';
  },
  actions: function (trip, model) {
    var extra = model.extraActionsHtml || '';
    var own = model.showRecordActions === false ? '' : rowActions(trip, model.section, model.item);
    return extra + own;
  },
  spacer: function () { return '<span class="item-row-spacer"></span>'; },
  // People scroll sideways rather than wrapping: a record with six
  // companions otherwise added six rows to every card in the list.
  // Focusable so the run can be panned from the keyboard.
  people: function (trip, model) {
    var tags = companionTags(trip, (model.metadata && model.metadata.people) || []);
    if (!tags) return '';
    return '<div class="item-people" tabindex="0" role="group" aria-label="People on this record">' + tags + '</div>';
  },
  metadata: function (trip, model, groups) {
    return itemMetaBlockHtml(trip, model.metadata || {}, groups, ITEM_META_CAP);
  },
  supporting: function (trip, model) {
    if (!model.supporting) return '';
    var note = '<div class="item-supporting">' + esc(model.supporting) + '</div>';
    // A clamped note carries the control that opens it. Whether notes clamp is
    // the caller's to declare -- the card does not know which context it is
    // drawing. markTruncatedNotes() then decides which cards really need one.
    if (!model.expandableNote) return note;
    return note + '<button type="button" class="item-more" data-action="toggle-card-text" aria-expanded="false">More</button>';
  },
  status: function (trip, model) {
    if (!model.status) return '';
    return '<div class="item-status">' + icon(model.status.icon || 'warning') + esc(model.status.text) + '</div>';
  }
};

// The other four groups can also be placed individually, so a context can
// spread them across lines (the Map does). `people` is not among them --
// it has its own scrolling slot above.
['datetime', 'location', 'category', 'commerce'].forEach(function (metaSlot) {
  ITEM_CARD_SLOTS[metaSlot] = function (trip, model) {
    return itemMetaBlockHtml(trip, model.metadata || {}, [metaSlot], 0);
  };
});

function itemRowHtml(trip, model) {
  var layout = ITEM_CARD_LAYOUTS[model.context] || ITEM_CARD_LAYOUTS.plan;
  // A metadata group named anywhere in this layout drops out of the
  // catch-all `metadata` slot, so moving `people` onto its own line
  // cannot render it twice -- and there is no exclusion list to maintain.
  var placed = {};
  layout.forEach(function (slots) {
    slots.forEach(function (slot) { if (ITEM_META_ORDER.indexOf(slot) !== -1) placed[slot] = true; });
  });
  var catchAll = ITEM_META_ORDER.filter(function (slot) { return !placed[slot]; });

  var lines = layout.map(function (slots) {
    var filled = false;
    var html = slots.map(function (slot) {
      var render = ITEM_CARD_SLOTS[slot];
      var rendered = render ? render(trip, model, catchAll) : '';
      if (rendered && slot !== 'spacer') filled = true;
      return rendered;
    }).join('');
    return filled ? '<div class="item-row-line" data-item-line="' + esc(slots[0]) + '">' + html + '</div>' : '';
  }).join('');

  var itemId = model.item && model.section && ENTITY_ID_FIELDS[model.section] ? model.item[ENTITY_ID_FIELDS[model.section]] : '';
  // Pressing a card with a clamped note anywhere opens it. The nearest
  // [data-action] wins, so the edit, delete and add controls inside are
  // unaffected; the handler excludes the gestures that are their own.
  var pressable = model.expandableNote && model.supporting ? ' data-action="toggle-card-text"' : '';
  return '<article class="item-row item-row--' + esc(model.context || 'plan') + '" data-item-section="' + esc(model.section || '') + '"' +
    (itemId ? ' data-item-id="' + esc(itemId) + '"' : '') + pressable + '>' + lines + '</article>';
}

// A record's cost, for the card's own cost slot. Reported in the trip's home
// currency so a list of them compares down the column and reconciles with the
// trip total; when no rate is known the original amount is shown instead and
// flagged. This lives on row one rather than among the metadata chips because
// that run is capped -- and a price hidden behind "+N more" is worse than no
// price at all.
function recordCostLabel(trip, item) {
  if (!item || !item.costAmount) return null;
  var converted = homeValue(trip, item.costAmount, item.costCurrency, item.costRate);
  if (converted.known) return { text: money(converted.value, trip.homeCurrency), known: true };
  return { text: money(item.costAmount, item.costCurrency) + ' · rate needed', known: false };
}

function destinationItemRowModel(trip, destination, context) {
  var datetime = [{ icon: 'date', text: formatDateShort(destination.arriveDate) + ' – ' + formatDateShort(destination.departDate) }];
  if (destination.timezone) datetime.push({ icon: 'time', text: destination.timezone + (tzOffsetLabel(destination.timezone) ? ' (' + tzOffsetLabel(destination.timezone) + ')' : '') });
  return { context: context, section: 'destination', item: destination, icon: 'destination', tone: 'destination', title: destination.name + (destination.country ? ', ' + destination.country : ''), metadata: { datetime: datetime, location: destination.country ? [{ icon: 'location', text: destination.country }] : [], category: [], people: destination.companions || [], commerce: [] }, supporting: destination.notes || '', status: destination.locationStale ? { text: 'Location needs review' } : null };
}

function activityItemRowModel(trip, activity, context) {
  var destination = activity.destinationId ? byId(trip.destinations, activity.destinationId, 'destinationId') : null;
  var contact = activity.contactId ? byId(trip.contacts, activity.contactId, 'contactId') : null;
  var commerce = [];
  if (activity.bookingRef) commerce.push({ icon: 'booking', text: activity.bookingRef, copyValue: activity.bookingRef, copyLabel: 'booking reference' });
  if (contact) commerce.push({ icon: 'person', text: contact.name });
  if (activity.receiptRef) commerce.push({ icon: 'receipt', text: activity.receiptRef, copyValue: activity.receiptRef, copyLabel: 'receipt reference' });
  var locations = [];
  if (activity.location) locations.push({ icon: 'location', text: activity.location });
  if (activity.address) locations.push({ icon: 'location', text: activity.address, mapsAddress: activity.address });
  if (destination) locations.push({ icon: 'destination', text: destination.name });
  return { context: context, section: 'activity', item: activity, cost: recordCostLabel(trip, activity), icon: activityIsAllDay(activity) ? 'allDay' : 'activity', tone: 'activity', title: activity.title, metadata: { datetime: [{ icon: activityIsAllDay(activity) ? 'allDay' : 'time', text: activityDateTimeLabel(activity) }], location: locations, category: [{ icon: 'category', text: activity.category || 'Other' }], people: activity.companions || [], commerce: commerce }, supporting: activity.notes || '', status: activity.addressLocationStale ? { text: 'Location needs review' } : null };
}

function transportItemRowModel(trip, transport, context) {
  var contact = transport.contactId ? byId(trip.contacts, transport.contactId, 'contactId') : null;
  var overnight = dateOnly(transport.departDateTime) !== dateOnly(transport.arriveDateTime);
  var category = [{ icon: transportIconKey(transport.mode), text: transport.mode || 'Transport' }];
  if (transport.carrier) category.push({ text: transport.carrier });
  if (transport.flightNumber) category.push({ icon: 'flight', text: transport.flightNumber, copyValue: transport.flightNumber, copyLabel: 'flight number' });
  if (transport.licensePlate) category.push({ text: transport.licensePlate });
  if (overnight) category.push({ icon: 'overnight', text: 'Overnight' });
  var commerce = [];
  if (transport.bookingRef) commerce.push({ icon: 'booking', text: transport.bookingRef, copyValue: transport.bookingRef, copyLabel: 'booking reference' });
  if (contact) commerce.push({ icon: 'person', text: contact.name });
  if (transport.pointsAmount) commerce.push({ icon: 'points', text: transport.pointsAmount + (transport.pointsProgram ? ' ' + transport.pointsProgram : ' points') });
  if (transport.receiptRef) commerce.push({ icon: 'receipt', text: transport.receiptRef, copyValue: transport.receiptRef, copyLabel: 'receipt reference' });
  return { context: context, section: 'transport', item: transport, cost: recordCostLabel(trip, transport), icon: transportIconKey(transport.mode), tone: 'transport', title: transport.fromLocation + ' → ' + transport.toLocation, metadata: { datetime: [{ icon: 'time', text: formatDateShort(dateOnly(transport.departDateTime)) + ' ' + timeOnly(transport.departDateTime) + ' → ' + formatDateShort(dateOnly(transport.arriveDateTime)) + ' ' + timeOnly(transport.arriveDateTime) }], location: [{ icon: 'location', text: transport.fromLocation + ' → ' + transport.toLocation }], category: category, people: transport.companions || [], commerce: commerce }, supporting: transport.notes || '', status: transport.fromLocationStale || transport.toLocationStale ? { text: 'One or more locations need review' } : null };
}

function accommodationItemRowModel(trip, accommodation, context) {
  var destination = accommodation.destinationId ? byId(trip.destinations, accommodation.destinationId, 'destinationId') : null;
  var contact = accommodation.contactId ? byId(trip.contacts, accommodation.contactId, 'contactId') : null;
  var commerce = [];
  if (accommodation.bookingRef) commerce.push({ icon: 'booking', text: accommodation.bookingRef, copyValue: accommodation.bookingRef, copyLabel: 'booking reference' });
  if (contact) commerce.push({ icon: 'person', text: contact.name });
  if (accommodation.receiptRef) commerce.push({ icon: 'receipt', text: accommodation.receiptRef, copyValue: accommodation.receiptRef, copyLabel: 'receipt reference' });
  var locations = [];
  if (accommodation.address) locations.push({ icon: 'location', text: accommodation.address, mapsAddress: accommodation.address });
  if (destination) locations.push({ icon: 'destination', text: destination.name });
  return { context: context, section: 'accommodation', item: accommodation, cost: recordCostLabel(trip, accommodation), icon: 'stay', tone: 'stay', title: accommodation.name, metadata: { datetime: [{ icon: 'time', text: formatDateShort(dateOnly(accommodation.checkIn)) + ' ' + timeOnly(accommodation.checkIn) + ' → ' + formatDateShort(dateOnly(accommodation.checkOut)) + ' ' + timeOnly(accommodation.checkOut) }], location: locations, category: [{ icon: 'category', text: accommodation.type || 'Other' }], people: accommodation.companions || [], commerce: commerce }, supporting: accommodation.notes || '', status: accommodation.locationStale ? { text: 'Location needs review' } : null };
}

function recordItemRowModel(trip, section, item, context) {
  if (section === 'destination') return destinationItemRowModel(trip, item, context);
  if (section === 'activity') return activityItemRowModel(trip, item, context);
  if (section === 'transport') return transportItemRowModel(trip, item, context);
  return accommodationItemRowModel(trip, item, context);
}

// The "Add X" button/empty-state prompt: only ever shown to a full-scope
// role (Superuser/admin/uber) — a "user"/"viewer" grant can never create
// a new item of any kind, only edit ones already tagged to them (see
// canEditItem()'s comment).
function emptyTab(trip, iconName, title, body, addAction, addLabel) {
  var action = canFullyEditTrip(trip) ? '<button class="btn btn-accent" data-action="' + addAction + '">' + icon('add') + ' ' + esc(addLabel) + '</button>' : '';
  return emptyStateHtml('empty', iconName, title, body, action);
}

function tabHead(trip, title, addAction, addLabel) {
  return '<div class="tab-panel-head"><h2>' + esc(title) + '</h2>' +
    (canFullyEditTrip(trip) ? '<button class="btn btn-accent" data-action="' + addAction + '">' + icon('add') + ' ' + esc(addLabel) + '</button>' : '') +
    '</div>';
}

/* ---------- 15. Render: Destinations tab ------------------------------ */

function renderDestinationsTab(trip) {
  if (trip.destinations.length === 0) return emptyTab(trip, 'destination', 'No destinations yet', 'Add the places or areas you\'ll be based in — activities and accommodation can then be tagged to them.', 'new-destination', 'Add destination');
  var sorted = trip.destinations.slice().sort(function (a, b) { return (a.arriveDate || '') < (b.arriveDate || '') ? -1 : 1; });
  var rows = sorted.map(function (d) { return itemRowHtml(trip, destinationItemRowModel(trip, d, 'plan')); }).join('');
  return tabHead(trip, 'Destinations', 'new-destination', 'Add destination') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 16. Render: Activities tab -------------------------------- */

function renderActivitiesTab(trip) {
  if (trip.activities.length === 0) return emptyTab(trip, 'activity', 'No activities yet', 'Tours, museum visits, dinner reservations — anything with a date and time.', 'new-activity', 'Add activity');
  var sorted = trip.activities.slice().sort(function (a, b) { return (activityStartDate(a) + (a.startTime || '')) < (activityStartDate(b) + (b.startTime || '')) ? -1 : 1; });
  var rows = sorted.map(function (a) { return itemRowHtml(trip, activityItemRowModel(trip, a, 'plan')); }).join('');
  return tabHead(trip, 'Activities', 'new-activity', 'Add activity') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 17. Render: Transport tab ---------------------------------- */

function renderTransportTab(trip) {
  if (trip.transport.length === 0) return emptyTab(trip, 'flight', 'No transport legs yet', 'Flights, trains, buses, ferries or drives — each leg can span overnight, and will show up on both days in the Timeline.', 'new-transport', 'Add transport leg');
  var sorted = trip.transport.slice().sort(function (a, b) { return (a.departDateTime || '') < (b.departDateTime || '') ? -1 : 1; });
  var rows = sorted.map(function (t) { return itemRowHtml(trip, transportItemRowModel(trip, t, 'plan')); }).join('');
  return tabHead(trip, 'Transport', 'new-transport', 'Add transport leg') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 18. Render: Accommodation tab ------------------------------- */

function renderAccommodationTab(trip) {
  if (trip.accommodation.length === 0) return emptyTab(trip, 'stay', 'No accommodation yet', 'Hotels, hostels, apartments — check-in and check-out can each carry their own time.', 'new-accommodation', 'Add accommodation');
  var sorted = trip.accommodation.slice().sort(function (a, b) { return (a.checkIn || '') < (b.checkIn || '') ? -1 : 1; });
  var rows = sorted.map(function (ac) { return itemRowHtml(trip, accommodationItemRowModel(trip, ac, 'plan')); }).join('');
  return tabHead(trip, 'Accommodation', 'new-accommodation', 'Add accommodation') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 19. Render: Contacts tab -------------------------------------- */

function renderContactsTab(trip) {
  if (trip.contacts.length === 0) return emptyTab(trip, 'contacts', 'No contacts yet', 'Hotel front desks, tour operators, guides — save them here to link from activities, transport and accommodation.', 'new-contact', 'Add contact');
  var rows = trip.contacts.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (c) {
    // Phone and email stay icon-less: the icon set has no glyph for either,
    // and inventing one would say something the record doesn't.
    var reach = [];
    if (c.phone) reach.push({ text: c.phone, copyValue: c.phone, copyLabel: 'phone' });
    if (c.email) reach.push({ text: c.email, copyValue: c.email, copyLabel: 'email' });
    return itemRowHtml(trip, {
      context: 'person', section: 'contact', item: c, icon: 'person',
      title: c.name,
      badgesHtml: c.role ? '<span class="tag">' + esc(c.role) + '</span>' : '',
      metadata: {
        datetime: [], category: [], people: [],
        location: c.address ? [{ icon: 'location', text: c.address, mapsAddress: c.address }] : [],
        commerce: reach
      },
      supporting: c.notes || ''
    });
  }).join('');
  return tabHead(trip, 'Contacts', 'new-contact', 'Add contact') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 19b. Render: Companions tab ------------------------------- */

// Companions are who to tag on individual items (see 'tag-picker' in
// fieldHtml()) — this tab is where you add people, not tag them. No
// "used on N items" count: that would mean scanning every other list on
// each render for a number nobody's asked for.
function companionTags(trip, companionIds) {
  return (companionIds || [])
    .map(function (id) { return taggablePersonById(trip, id); })
    .filter(Boolean)
    .map(function (c) { return '<span class="tag">' + companionAvatarHtml(trip, c.companionId, c.name) + esc(c.name) + (c.isSuperuser ? '<span class="tag-role">Trip Owner</span>' : '') + '</span>'; })
    .join('');
}

// The Companions tab is the one place you manage everyone on a trip --
// both "who's traveling" (companions, tagged to items) and "who can log
// in and see/edit this" (accounts, via sharing). See
// claude/waypoint-companions-plan.md for the design discussion.
//
// GUEST vs COMPANION is product vocabulary, not a new data field: every
// person is stored the same way (COMPANION_FIELDS above), and whether
// they're a "Guest" or "Companion" is purely whether `accountId` is set
// (a Waypoint login). The list is visually split into two sections
// (renderCompanionsTab()).
//   - A GUEST has no login. Anyone who canAddCompanion() (a "user" grant
//     included) can add one -- name + smiley colour only.
//   - A COMPANION has one. Only canLinkCompanion() (Superuser/Admin) can
//     create one directly, or upgrade a Guest by linking a username --
//     see openAddLinkedCompanionForm()/openCompanionLinkForm() below.
//     Either action also asks for a privilege level (Admin/User/Viewer,
//     or "no trip access") in the same form and grants it automatically.
// A Companion who also has access to this trip gets an extra tag showing
// that level -- Owner/Admin/User/Viewer, from resolveCompanionAccessLevels()
// in src/worker.js, sent as `trip.companionAccessLevels`. Unlike raw
// `grants`, that map goes to every role that can see the trip, so these
// tags render the same for the Trip Owner and a scoped Viewer alike.
//
// The KEYS here are the roles as the server stores them; the VALUES are
// only ever shown to a reader. That split is deliberate: "superuser" is
// load-bearing in permissionForTrip() (src/worker.js), in every
// myGrant.role check below, and in a CSS class name built by
// concatenation -- so the word on screen was changed to "Owner" without
// touching the stored role anywhere.
var COMPANION_ACCESS_LEVEL_LABELS = { superuser: 'Owner', admin: 'Admin', user: 'User', viewer: 'Viewer' };

// Reads `trip.companionAvatars[...].type` rather than `c.accountId` to
// decide Guest vs Companion -- accountId is stripped from a scoped
// "user"/"viewer" role's own companion list (buildVisibleTrip() in
// src/worker.js), so it's always falsy for them even when genuinely
// linked. `companionAvatars` is sent to every role and its `type`
// ('account' vs 'smiley') already encodes this same fact, so Guest/
// Companion always agrees with the marker shown, including for a
// deleted linked account (which falls back to 'smiley' too).
function isCompanionLinked(trip, c) {
  return !!(trip.companionAvatars && trip.companionAvatars[c.companionId] && trip.companionAvatars[c.companionId].type === 'account');
}

function renderCompanionsTab(trip) {
  var canAddGuest = canAddCompanion(trip);
  var canAddLinked = canLinkCompanion(trip);
  // Superuser/Admin get two explicit choices (link an existing login and
  // share in one step, or add someone with no login); a "user" grant
  // only gets the second -- enforced server-side by
  // mergeUserScopedCompanions() in src/worker.js.
  //
  // "Add companion" gets the accent button, "Add guest" the plain grey
  // one -- matching the colour-coding already used for their markers
  // elsewhere (a Companion's marker is their account's colour+animal, a
  // Guest's is the plain grey circle). Wrapped
  // in a shared .head-btn-row so the pair sits right next to each other
  // (see that class's own comment for why that needs a wrapper at all).
  var addButtons =
    (canAddLinked ? '<button class="btn btn-accent" data-action="new-linked-companion">' + icon('add') + ' Add companion</button>' : '') +
    (canAddGuest ? '<button class="btn" data-action="new-companion">' + icon('add') + ' Add guest</button>' : '');
  var addButtonsRow = addButtons ? '<div class="head-btn-row">' + addButtons + '</div>' : '';
  var head = '<div class="tab-panel-head"><h2>Companions</h2>' + addButtonsRow + '</div>';

  if (trip.companions.length === 0) {
    return head + emptyStateHtml('empty', 'companions', 'No one added yet', 'Add people as companions when they have a Waypoint login, or as guests when they do not, then tag who is joining each part of the trip.', addButtonsRow);
  }

  // One row-renderer shared by both sections below -- a Companion row
  // and a Guest row differ only in which tags/actions apply, not in
  // their overall shape, so there's no reason to duplicate the HTML
  // structure itself.
  function companionRowHtml(c) {
    var linkedAccount = c.accountId ? (trip.grants || []).find(function (g) { return g.accountId === c.accountId; }) : null;
    // A companion can be linked to an account not shared on this trip
    // (e.g. "no trip access", see openCompanionLinkForm()). `trip.grants`
    // only exists for full-scope roles, so the linked-tag below just
    // says "has a login" when there's nothing to look the username up in.
    var linkedTag = c.accountId
      ? '<span class="tag">' + icon('person') + (linkedAccount ? esc(linkedAccount.username) : 'has a login') + '</span>'
      : '';
    // The access-level tag -- see the comment above this function. A
    // Guest always reads "Guest". A Companion shows their resolved
    // access level (Super/Admin/User/Viewer), or a generic "Companion"
    // tag when linked but with no actual access to this trip.
    var isLinked = isCompanionLinked(trip, c);
    var accessRole = trip.companionAccessLevels && trip.companionAccessLevels[c.companionId];
    var accessTag = isLinked
      ? '<span class="tag' + (accessRole ? ' tag-role-' + accessRole : '') + '">' + (accessRole ? esc(COMPANION_ACCESS_LEVEL_LABELS[accessRole] || accessRole) : 'Companion') + '</span>'
      : '<span class="tag">Guest</span>';
    // A separate, second `.item-actions` group rather than trying to
    // merge into rowActions()'s own -- both are just small icon-button
    // clusters, so two side by side reads identically to one, without
    // needing rowActions() itself to know anything about linking.
    var linkLabel = isLinked ? 'Manage account link and access level' : 'Upgrade guest to companion';
    var linkAction = canAddLinked
      ? '<div class="item-actions"><button class="btn btn-icon btn-ghost" data-action="link-companion" data-id="' + c.companionId + '" aria-label="' + linkLabel + '" title="' + linkLabel + '">' + icon('companions') + '</button></div>'
      : '';
    // Through the shared card like every other list: this row used to be
    // built by hand and had drifted -- its access level was a tag where a
    // contact's role was an .item-sub, and neither got a category stripe.
    return itemRowHtml(trip, {
      context: 'person', section: 'companion', item: c,
      avatarHtml: companionAvatarHtml(trip, c.companionId, c.name),
      title: c.name,
      badgesHtml: accessTag + linkedTag,
      extraActionsHtml: linkAction,
      metadata: {},
      supporting: c.notes || ''
    });
  }

  var sorted = trip.companions.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  var companionRows = sorted.filter(function (c) { return isCompanionLinked(trip, c); });
  var guestRows = sorted.filter(function (c) { return !isCompanionLinked(trip, c); });

  // Segregated into two clearly-labelled lists rather than one mixed
  // one -- this is what replaced the old "Share access" panel's spot at
  // the bottom of the tab (see the big comment above this function).
  var companionsSection = '<h3 class="section-subhead">Companions</h3>' +
    (companionRows.length
      ? '<div class="item-list">' + companionRows.map(companionRowHtml).join('') + '</div>'
      : '<p class="field-hint">Nobody with a Waypoint login on this trip yet.</p>');
  var guestsSection = '<h3 class="section-subhead">Guests</h3>' +
    (guestRows.length
      ? '<div class="item-list">' + guestRows.map(companionRowHtml).join('') + '</div>'
      : '<p class="field-hint">Nobody without a login on this trip yet.</p>');

  return head + companionsSection + guestsSection;
}

/* ---------- 19b. Map tab ---------------------------------------------------
   Plots saved locations on one interactive map, using Leaflet (vendored
   under vendor/leaflet/) and OpenStreetMap tiles. Coordinates are
   selected in the shared location picker and stored with each entry; the
   map doesn't silently geocode free text in the browser.

   The tricky part: this app normally redraws #app from scratch (see
   render()) on every change, but a map needs to be built once with
   L.map(...) and updated in place, not rebuilt constantly (it would
   flicker and lose zoom/pan). So this section keeps its own state
   (`mapState` below) outside the normal render() pipeline, mounts
   Leaflet imperatively (initMap()) whenever the Map tab's HTML is drawn,
   and updates it directly (see "toggle-map-layer") for anything that
   doesn't need a full re-render.
   ---------------------------------------------------------------------- */

// One layer group per category, so checkboxes can show/hide each kind of
// pin independently. `color` is used for markers and the checkbox dot.
//
// Destinations keep a muted "anchor point" shade, while activities/
// transport/accommodation get bright, distinct hues so they pop against
// the OpenStreetMap tiles.
var MAP_LAYER_META = [
  { key: 'destinations', label: 'Destinations', color: cssToken('--wp-map-destination'), soft: 'var(--wp-map-destination-subtle)' },
  { key: 'transport', label: 'Transport', color: cssToken('--wp-map-transport'), soft: 'var(--wp-map-transport-subtle)' },
  { key: 'accommodation', label: 'Accommodation', color: cssToken('--wp-map-accommodation'), soft: 'var(--wp-map-accommodation-subtle)' },
  { key: 'activities', label: 'Activities', color: cssToken('--wp-map-activity'), soft: 'var(--wp-map-activity-subtle)' }
];

// Everything the Map tab needs to remember between renders that isn't
// part of the saved trip data -- which Leaflet map/layers are mounted,
// which are checked, and a `generation` counter (see initMap()). None of
// this is saved or shared, resets to these defaults on a fresh load.
var mapState = {
  instance: null,
  layers: null,
  generation: 0,
  tripId: '',
  rangeStart: '',
  rangeEnd: '',
  visibility: { destinations: true, activities: true, transport: true, accommodation: true },
  boundaries: {},
  boundaryRequests: {},
  routeArrows: [],
  visibleBounds: null,
  refreshFrame: null,
  currentTrip: null,
  worldCenter: 0,
  worldBoundsKey: '',
  minimumZoom: 0
};

// Both the Timeline and the Map open on today while a trip is under way, and
// at its start otherwise -- the day you most likely want is the one you are on.
function tripFocusDay(days, today) {
  if (!days || !days.length) return '';
  // `today` is injectable for the same reason timelineDayExpanded() takes it:
  // a date-dependent default is only testable if the date can be supplied.
  var day = today || timelineLocalTodayStr();
  return days.indexOf(day) !== -1 ? day : days[0];
}

function ensureMapRange(trip) {
  var days = tripDayList(trip);
  if (!days.length) {
    mapState.tripId = trip.tripId;
    mapState.rangeStart = '';
    mapState.rangeEnd = '';
    return days;
  }
  // A range belongs to one rendered trip only. A newly opened trip, or a
  // trip whose dates changed, sensibly starts as the whole trip rather than
  // inheriting a stale date from whatever was viewed before it.
  if (mapState.tripId !== trip.tripId || days.indexOf(mapState.rangeStart) === -1 || days.indexOf(mapState.rangeEnd) === -1) {
    mapState.tripId = trip.tripId;
    mapState.rangeStart = tripFocusDay(days);
    mapState.rangeEnd = days[days.length - 1];
  }
  return days;
}

function mapRangeVisible(start, end) {
  if (!mapState.rangeStart || !mapState.rangeEnd) return true;
  // Inclusive overlap: a multi-day stay, destination or overnight route is
  // retained whenever any part of it falls inside the selected range.
  return (!start || start <= mapState.rangeEnd) && (!end || end >= mapState.rangeStart);
}

function savedCoords(item, latKey, lngKey) {
  return (typeof item[latKey] === 'number' && typeof item[lngKey] === 'number') ? { lat: item[latKey], lng: item[lngKey] } : null;
}

// The Map tab is deliberately a view of saved locations only. Text-only
// records remain visible in their own tabs, but are not guessed at by an
// external service when a person opens the map.
function mapPointsForTrip(trip) {
  var points = [];
  (trip.destinations || []).forEach(function (d) {
    if (!mapRangeVisible(d.arriveDate, d.departDate)) return;
    points.push({ category: 'destinations', section: 'destination', item: d, coords: savedCoords(d, 'lat', 'lng'), label: d.name, sub: d.country, boundaryRef: d.boundaryRef || '', boundaryQuality: d.boundaryQuality || '', stale: d.locationStale });
  });
  (trip.activities || []).forEach(function (a) {
    if (!mapRangeVisible(activityStartDate(a), activityEndDate(a))) return;
    var addressCoords = savedCoords(a, 'addressLat', 'addressLng');
    // The venue is a note, not a geocoded place. Activity pins are always
    // driven by their separately selected or manually pinned street address.
    if (addressCoords) points.push({ category: 'activities', section: 'activity', item: a, coords: addressCoords, label: a.title, sub: (a.location ? 'Venue: ' + a.location + ' · ' : '') + 'Address: ' + (a.address || 'Saved address'), stale: a.addressLocationStale });
  });
  (trip.accommodation || []).forEach(function (ac) {
    // Checkout day is included: a place is still useful map context until
    // the traveller actually leaves it.
    if (!mapRangeVisible(dateOnly(ac.checkIn), dateOnly(ac.checkOut))) return;
    points.push({ category: 'accommodation', section: 'accommodation', item: ac, coords: savedCoords(ac, 'lat', 'lng'), label: ac.name, sub: ac.address, stale: ac.locationStale });
  });
  return points;
}

// Transport legs become lines rather than pins — one per leg with both a
// from- and a to-location filled in. There's no fallback for a missing
// location here (unlike activities above) since a transport leg with only
// one end known can't usefully be drawn as a line.
//
// fromCoords/toCoords carry through whatever real coordinate was
// resolved and saved at the time this leg was created/edited — null when
// an endpoint still needs a selected location or manual pin.
function mapLegsForTrip(trip) {
  return (trip.transport || []).filter(function (t) {
    return t.fromLocation && t.toLocation && mapRangeVisible(dateOnly(t.departDateTime), dateOnly(t.arriveDateTime));
  }).map(function (t) {
    return {
      label: transportLabel(t), mode: t.mode,
      section: 'transport', item: t,
      fromCoords: savedCoords(t, 'fromLat', 'fromLng'), toCoords: savedCoords(t, 'toLat', 'toLng'),
      fromStale: t.fromLocationStale, toStale: t.toLocationStale,
      from: t.fromLocation, to: t.toLocation,
      departDateTime: t.departDateTime, arriveDateTime: t.arriveDateTime
    };
  });
}

function mapRangeDateLabel(day) {
  if (!day) return '';
  var parts = day.split('-').map(Number);
  return parts[2] + ' ' + MONTHS[parts[1] - 1];
}

function mapRangeDayCount(trip) {
  var days = ensureMapRange(trip);
  var start = days.indexOf(mapState.rangeStart), end = days.indexOf(mapState.rangeEnd);
  return start >= 0 && end >= start ? end - start + 1 : days.length;
}

function mapViewIsDefault(trip) {
  var days = ensureMapRange(trip);
  // "Default" is the range the Map opens on, which is today onward during a
  // trip -- so Reset returns you there rather than to the whole trip.
  var fullRange = !days.length || (mapState.rangeStart === tripFocusDay(days) && mapState.rangeEnd === days[days.length - 1]);
  var allLayers = MAP_LAYER_META.every(function (meta) { return mapState.visibility[meta.key]; });
  return fullRange && allLayers;
}

function mapVisibleCounts(trip) {
  var counts = { destinations: 0, activities: 0, transport: 0, accommodation: 0 };
  mapPointsForTrip(trip).forEach(function (point) { counts[point.category]++; });
  counts.transport = mapLegsForTrip(trip).length;
  return counts;
}

function mapLayerIconName(layer) {
  if (layer === 'destinations') return 'destination';
  if (layer === 'activities') return 'activity';
  if (layer === 'accommodation') return 'stay';
  return 'flight';
}

function mapRangeControlsHtml(trip) {
  var days = ensureMapRange(trip);
  if (!days.length) return '';
  var max = days.length - 1;
  var startIndex = days.indexOf(mapState.rangeStart);
  var endIndex = days.indexOf(mapState.rangeEnd);
  var startPercent = max ? (startIndex / max * 100) : 0;
  var endPercent = max ? (endIndex / max * 100) : 100;
  return '<div class="map-range-controls">' +
    '<div class="map-range-summary">' +
      '<strong data-map-range-summary>' + esc(mapRangeDateLabel(mapState.rangeStart)) + ' — ' + esc(mapRangeDateLabel(mapState.rangeEnd)) + '</strong>' +
      '<span class="map-range-summary-actions"><span class="map-range-days" data-map-range-days>' + mapRangeDayCount(trip) + ' day' + (mapRangeDayCount(trip) === 1 ? '' : 's') + '</span>' +
      '<button type="button" class="btn btn-ghost map-reset" data-action="reset-map-view"' + (mapViewIsDefault(trip) ? ' disabled' : '') + '>' + icon('reset') + ' Reset</button></span>' +
    '</div>' +
    '<div class="map-range-slider' + (endPercent - startPercent < 20 ? ' labels-overlap' : '') + '" data-map-range-slider style="--range-start:' + startPercent + '%;--range-end:' + endPercent + '%" aria-label="Map date range">' +
      '<div class="map-range-rail"></div><div class="map-range-fill"></div>' +
      '<input class="map-range-input" data-map-range-handle="start" type="range" min="0" max="' + max + '" step="1" value="' + startIndex + '" aria-label="Map range start: ' + esc(formatDateHeading(mapState.rangeStart)) + '">' +
      '<input class="map-range-input" data-map-range-handle="end" type="range" min="0" max="' + max + '" step="1" value="' + endIndex + '" aria-label="Map range end: ' + esc(formatDateHeading(mapState.rangeEnd)) + '">' +
      '<span class="map-range-handle-label is-start" data-map-range-start-label>' + esc(mapRangeDateLabel(mapState.rangeStart)) + '</span>' +
      '<span class="map-range-handle-label is-end" data-map-range-end-label>' + esc(mapRangeDateLabel(mapState.rangeEnd)) + '</span>' +
    '</div>' +
  '</div>';
}

function mapFiltersHtml(trip) {
  var counts = mapVisibleCounts(trip);
  return '<div class="map-filter-bar" role="group" aria-label="Map layers">' + MAP_LAYER_META.map(function (meta) {
    var active = !!mapState.visibility[meta.key];
    return '<button type="button" class="map-filter-chip' + (active ? ' is-active' : '') + '" data-action="toggle-map-layer" data-layer="' + meta.key + '" aria-pressed="' + active + '" style="--map-color:' + meta.color + ';--map-soft:' + meta.soft + '">' +
      icon(mapLayerIconName(meta.key)) + '<span>' + esc(meta.label) + '</span><span class="map-filter-count">' + counts[meta.key] + '</span></button>';
  }).join('') + '</div>';
}

function mapUnmappedRecords(trip) {
  var records = [];
  (trip.destinations || []).forEach(function (item) {
    if (!mapRangeVisible(item.arriveDate, item.departDate)) return;
    if (!savedCoords(item, 'lat', 'lng') && !item.boundaryRef) records.push({ section: 'destination', item: item, title: item.name || 'Destination', reason: 'No map location saved' });
    else if (item.locationStale) records.push({ section: 'destination', item: item, title: item.name || 'Destination', reason: 'Saved location needs review' });
  });
  (trip.activities || []).forEach(function (item) {
    if (!mapRangeVisible(activityStartDate(item), activityEndDate(item))) return;
    if (!savedCoords(item, 'addressLat', 'addressLng')) records.push({ section: 'activity', item: item, title: item.title || 'Activity', reason: 'No address pin saved' });
    else if (item.addressLocationStale) records.push({ section: 'activity', item: item, title: item.title || 'Activity', reason: 'Saved address needs review' });
  });
  (trip.accommodation || []).forEach(function (item) {
    if (!mapRangeVisible(dateOnly(item.checkIn), dateOnly(item.checkOut))) return;
    if (!savedCoords(item, 'lat', 'lng')) records.push({ section: 'accommodation', item: item, title: item.name || 'Accommodation', reason: 'No address pin saved' });
    else if (item.locationStale) records.push({ section: 'accommodation', item: item, title: item.name || 'Accommodation', reason: 'Saved location needs review' });
  });
  (trip.transport || []).forEach(function (item) {
    if (!mapRangeVisible(dateOnly(item.departDateTime), dateOnly(item.arriveDateTime))) return;
    var missingFrom = !savedCoords(item, 'fromLat', 'fromLng');
    var missingTo = !savedCoords(item, 'toLat', 'toLng');
    if (missingFrom || missingTo) records.push({ section: 'transport', item: item, title: transportLabel(item), reason: missingFrom && missingTo ? 'Both route endpoints need locations' : (missingFrom ? 'Departure location needs a pin' : 'Arrival location needs a pin') });
    else if (item.fromLocationStale || item.toLocationStale) records.push({ section: 'transport', item: item, title: transportLabel(item), reason: 'One or more route locations need review' });
  });
  return records;
}

function mapUnmappedHtml(trip) {
  var records = mapUnmappedRecords(trip);
  if (!records.length) return '';
  var rows = records.map(function (record) {
    var itemId = record.item[ENTITY_ID_FIELDS[record.section]];
    var canRepair = canEditItem(trip, record.item);
    return '<div class="map-unmapped-row"><span class="item-icon k-' + esc(record.section) + '">' + icon(mapLayerIconName(record.section === 'destination' ? 'destinations' : record.section === 'accommodation' ? 'accommodation' : record.section === 'activity' ? 'activities' : 'transport')) + '</span>' +
      '<span class="map-unmapped-copy"><span class="map-unmapped-title">' + esc(record.title) + '</span><span class="map-unmapped-reason">' + esc(record.reason) + '</span></span>' +
      (canRepair ? '<button type="button" class="btn btn-ghost" data-action="review-map-location" data-section="' + esc(record.section) + '" data-id="' + esc(itemId) + '">Find location / Set pin</button>' : '<span class="status-badge is-readonly">' + icon('readonly') + ' Ask an editor</span>') + '</div>';
  }).join('');
  // Keep the warning visible without letting a potentially long repair list
  // dominate the map. Native <details> supplies keyboard and screen-reader
  // disclosure behaviour, and omitting `open` makes it collapsed each time
  // the Map tab is mounted, as requested.
  return '<aside class="map-unmapped" aria-labelledby="map-unmapped-title"><details><summary class="map-unmapped-head">' + icon('warning') + '<div><h3 id="map-unmapped-title">Locations needing attention</h3><p>These records stay in the itinerary but cannot be shown reliably on the map.</p></div><span class="map-unmapped-summary">' + records.length + ' record' + (records.length === 1 ? '' : 's') + icon('collapse') + '</span></summary><div class="map-unmapped-list">' + rows + '</div></details></aside>';
}

function renderMapTab(trip) {
  ensureMapRange(trip);
  var points = mapPointsForTrip(trip);
  var legs = mapLegsForTrip(trip);

  if (!points.length && !legs.length && !(trip.destinations || []).length && !(trip.activities || []).length && !(trip.transport || []).length && !(trip.accommodation || []).length) {
    return '<div class="tab-panel-head"><h2>Map</h2></div>' + emptyStateHtml('empty', 'map', 'Nothing to show yet', 'Add a destination, activity, transport leg or place of accommodation, then use Find location or Set pin to place it on the map.');
  }

  return (
    '<div class="map-workspace">' +
      '<div class="map-toolbar">' +
        '<div class="map-actions">' + mapFiltersHtml(trip) +
          '<button type="button" class="btn btn-ghost" data-action="map-fit-selection">Fit selection</button>' +
          '<button type="button" class="btn btn-icon" data-action="map-toggle-fullscreen" aria-label="Expand map" title="Expand map">' + icon('expand') + '</button>' +
        '</div>' +
        mapRangeControlsHtml(trip) +
      '</div>' +
      '<div id="map-shell" class="map-shell">' +
        '<div id="map-canvas" class="map-canvas"></div>' +
        '<div id="map-status" class="map-status">Loading map…</div>' +
      '</div>' + mapUnmappedHtml(trip) +
    '</div>'
  );
}

function mapLayerMeta(key) {
  return MAP_LAYER_META.filter(function (meta) { return meta.key === key; })[0];
}

function normalizeLongitude(lng) {
  while (lng > 180) lng -= 360;
  while (lng < -180) lng += 360;
  return lng;
}

// Leaflet accepts longitudes outside the conventional -180°…+180° range.
// Keeping every vector in one deliberately chosen 360° window lets a
// Pacific trip use 139°…242° while still showing only one visible Earth.
function longitudeNear(lng, referenceLongitude) {
  return lng + 360 * Math.round((referenceLongitude - lng) / 360);
}

function mapWorldCenterForCoordinates(coords) {
  if (!coords.length) return 0;
  var anchor = coords[0].lng;
  var minLongitude = Infinity, maxLongitude = -Infinity;
  coords.forEach(function (coord) {
    var longitude = longitudeNear(coord.lng, anchor);
    minLongitude = Math.min(minLongitude, longitude);
    maxLongitude = Math.max(maxLongitude, longitude);
  });
  return (minLongitude + maxLongitude) / 2;
}

function mapWorldWindow(centerLongitude) {
  return { west: centerLongitude - 180, east: centerLongitude + 180 };
}

// At this zoom a 256px Leaflet world is at least as wide as the map canvas,
// so the furthest-out view cannot reveal a second horizontal copy.
function mapMinimumWorldZoom(canvasWidth) {
  var safeWidth = Math.max(256, Number(canvasWidth) || 256);
  return Math.log(safeWidth / 256) / Math.LN2;
}

function toRadians(value) { return value * Math.PI / 180; }
function toDegrees(value) { return value * 180 / Math.PI; }

// A transport leg is a schematic connection, not a road or rail route.
// For long-haul trips, though, drawing the shortest path over the globe is
// both more honest and much easier to read than a flat diagonal across a
// Mercator map. The route is sampled along a great circle and its longitude
// stays *unwrapped*: Tokyo → Los Angeles, for example, becomes 139° → 242°
// rather than 139° → -118°. That lets Leaflet draw one continuous vector
// across the Pacific instead of two pieces that appear broken at map edges.
function greatCircleRoute(from, to) {
  var lat1 = toRadians(from.lat), lng1 = toRadians(from.lng);
  var lat2 = toRadians(to.lat), lng2 = toRadians(to.lng);
  var cosAngle = Math.sin(lat1) * Math.sin(lat2) + Math.cos(lat1) * Math.cos(lat2) * Math.cos(lng2 - lng1);
  var angle = Math.acos(Math.max(-1, Math.min(1, cosAngle)));
  var segmentCount = Math.max(12, Math.min(96, Math.ceil(toDegrees(angle) / 2)));
  var points = [];

  for (var i = 0; i <= segmentCount; i++) {
    var fraction = i / segmentCount;
    var weightA, weightB;
    if (angle < 0.000001 || Math.abs(Math.sin(angle)) < 0.000001) {
      weightA = 1 - fraction; weightB = fraction;
    } else {
      var sinAngle = Math.sin(angle);
      weightA = Math.sin((1 - fraction) * angle) / sinAngle;
      weightB = Math.sin(fraction * angle) / sinAngle;
    }
    var x = weightA * Math.cos(lat1) * Math.cos(lng1) + weightB * Math.cos(lat2) * Math.cos(lng2);
    var y = weightA * Math.cos(lat1) * Math.sin(lng1) + weightB * Math.cos(lat2) * Math.sin(lng2);
    var z = weightA * Math.sin(lat1) + weightB * Math.sin(lat2);
    var longitude = normalizeLongitude(toDegrees(Math.atan2(y, x)));
    if (points.length) {
      var previousLongitude = points[points.length - 1].lng;
      while (longitude - previousLongitude > 180) longitude -= 360;
      while (longitude - previousLongitude < -180) longitude += 360;
    }
    points.push({ lat: toDegrees(Math.atan2(z, Math.sqrt(x * x + y * y))), lng: longitude });
  }

  var arrowIndex = Math.max(1, Math.min(points.length - 1, Math.round((points.length - 1) * 0.58)));
  return { points: points, arrowBefore: points[arrowIndex - 1], arrowAfter: points[arrowIndex] };
}

// Reposition the entire unwrapped route into the map's selected world window.
// Keeping one shared offset preserves both the short route and arrow direction.
function routeForMapView(route, centerLongitude) {
  var first = route.points[0].lng;
  var last = route.points[route.points.length - 1].lng;
  var routeMidpoint = (first + last) / 2;
  var offset = 360 * Math.round((centerLongitude - routeMidpoint) / 360);
  function copyPoint(point) { return { lat: point.lat, lng: point.lng + offset }; }
  return {
    points: route.points.map(copyPoint),
    arrowBefore: copyPoint(route.arrowBefore),
    arrowAfter: copyPoint(route.arrowAfter)
  };
}

function prepareMapGeometry(points, legs) {
  var worldCoordinates = [];
  var preparedLegs = [];
  var missingLegs = 0;

  // Routes are added first so a date-line crossing establishes the useful
  // unwrapped longitude sequence before ordinary markers are folded near it.
  legs.forEach(function (leg) {
    if (!leg.fromCoords || !leg.toCoords) { missingLegs++; return; }
    var route = greatCircleRoute(leg.fromCoords, leg.toCoords);
    preparedLegs.push({ leg: leg, route: route });
    route.points.forEach(function (point) { worldCoordinates.push(point); });
  });
  points.forEach(function (point) {
    if (point.coords) worldCoordinates.push(point.coords);
  });

  return {
    preparedLegs: preparedLegs,
    missingLegs: missingLegs,
    worldCenter: mapWorldCenterForCoordinates(worldCoordinates)
  };
}

function applyMapWorldWindow(map, centerLongitude) {
  var world = mapWorldWindow(centerLongitude);
  var boundsKey = world.west.toFixed(5) + '|' + world.east.toFixed(5);
  mapState.worldCenter = centerLongitude;
  if (mapState.worldBoundsKey !== boundsKey) {
    mapState.worldBoundsKey = boundsKey;
    map.setMaxBounds([[-85.05112878, world.west], [85.05112878, world.east]]);
  }
  return world;
}

function routeStyleForMode(mode) {
  var normalized = String(mode || '').toLowerCase();
  return {
    color: mapLayerMeta('transport').color,
    weight: normalized === 'flight' ? 4.5 : 4,
    opacity: normalized === 'car' || normalized === 'bus' ? 0.76 : 0.9,
    dashArray: normalized === 'flight' ? '10 8' : (normalized === 'ferry' ? '3 8' : null)
  };
}

function routePopupHtml(leg, trip) {
  var model = transportItemRowModel(trip, leg.item, 'map');
  model.supporting = 'Route shown as a direct travel arc.';
  return itemRowHtml(trip, model);
}

function mapMarkerIcon(category, stale, count) {
  var meta = mapLayerMeta(category);
  return L.divIcon({
    className: 'map-marker-icon',
    html: '<div class="map-marker' + (stale ? ' is-stale' : '') + '" style="--map-color:' + meta.color + '">' + icon(mapLayerIconName(category)) + (count > 1 ? '<span class="map-marker-count">' + count + '</span>' : '') + '</div>',
    iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28]
  });
}

function pointPopupHtml(points, trip) {
  return '<div class="map-marker-popup">' + points.map(function (point) {
    var model = recordItemRowModel(trip, point.section, point.item, 'map');
    if (point.stale) model.status = { text: 'Location needs review' };
    return itemRowHtml(trip, model);
  }).join('') + '</div>';
}

function addRouteArrow(map, layer, before, after, color) {
  var icon = L.divIcon({
    className: 'transport-arrow-icon',
    html: '<div class="transport-arrow" style="border-left-color:' + color + '"></div>',
    iconSize: [16, 16], iconAnchor: [8, 8]
  });
  var marker = L.marker([after.lat, after.lng], { icon: icon, interactive: false, keyboard: false }).addTo(layer);
  mapState.routeArrows.push({ marker: marker, before: before, after: after });
}

function updateMapRouteArrows() {
  var map = mapState.instance;
  if (!map) return;
  mapState.routeArrows.forEach(function (routeArrow) {
    var fromPoint = map.latLngToLayerPoint([routeArrow.before.lat, routeArrow.before.lng]);
    var toPoint = map.latLngToLayerPoint([routeArrow.after.lat, routeArrow.after.lng]);
    var angle = Math.atan2(toPoint.y - fromPoint.y, toPoint.x - fromPoint.x) * 180 / Math.PI;
    var markerEl = routeArrow.marker.getElement();
    var arrowEl = markerEl && markerEl.querySelector('.transport-arrow');
    if (arrowEl) arrowEl.style.transform = 'rotate(' + angle + 'deg)';
  });
}

function updateMapStatus(placed, missing) {
  var statusEl = document.getElementById('map-status');
  if (!statusEl) return;
  if (missing > 0) {
    statusEl.textContent = placed + ' mapped item' + (placed === 1 ? '' : 's') + ' in range · ' + missing + ' ' + (missing === 1 ? 'entry needs' : 'entries need') + ' a location.';
    statusEl.classList.add('has-warning');
  } else if (placed) {
    statusEl.textContent = placed + ' mapped item' + (placed === 1 ? '' : 's') + ' in range.';
    statusEl.classList.remove('has-warning');
  } else {
    statusEl.textContent = 'No mapped items in this date range yet.';
    statusEl.classList.remove('has-warning');
  }
}

function refreshMapLayers(trip, fitToSelection) {
  if (!mapState.instance || !mapState.layers) return;
  var map = mapState.instance;
  mapState.currentTrip = trip;
  var layers = mapState.layers;
  Object.keys(layers).forEach(function (key) { layers[key].clearLayers(); });
  mapState.routeArrows = [];

  var points = mapPointsForTrip(trip);
  var legs = mapLegsForTrip(trip);
  var geometry = prepareMapGeometry(points, legs);
  var worldCenter = geometry.worldCenter;
  applyMapWorldWindow(map, worldCenter);
  var pointGroups = {};
  var bounds = L.latLngBounds([]);
  var placed = 0, missing = geometry.missingLegs;

  function trackPoint(lat, lng) {
    bounds.extend([lat, lng]);
  }

  function addDestinationArea(point) {
    var boundary = mapState.boundaries[point.boundaryRef];
    if (!boundary || !boundary.geometry) return false;
    var meta = mapLayerMeta('destinations');
    var area = L.geoJSON(boundary.geometry, {
      style: { color: meta.color, weight: 2, opacity: point.stale ? 0.45 : 0.8, fillColor: meta.color, fillOpacity: point.stale ? 0.08 : 0.18, dashArray: point.stale ? '4 4' : null },
      coordsToLatLng: function (coords) {
        return L.latLng(coords[1], longitudeNear(coords[0], worldCenter), coords[2]);
      }
    }).bindPopup(pointPopupHtml([point], trip), mapPopupOptions());
    area.addTo(layers.destinations);
    if (area.getBounds && area.getBounds().isValid()) {
      var areaBounds = area.getBounds();
      bounds.extend(areaBounds);
    }
    return true;
  }

  points.forEach(function (point) {
    var areaDrawn = point.category === 'destinations' && addDestinationArea(point);
    if (!point.coords) {
      if (areaDrawn) placed++;
      else missing++;
      return;
    }
    var coordinateKey = point.category + '|' + point.coords.lat.toFixed(5) + '|' + point.coords.lng.toFixed(5);
    if (!pointGroups[coordinateKey]) pointGroups[coordinateKey] = [];
    pointGroups[coordinateKey].push(point);
  });

  Object.keys(pointGroups).forEach(function (key) {
    var groupedPoints = pointGroups[key];
    var first = groupedPoints[0];
    var needsReview = groupedPoints.some(function (point) { return !!point.stale; });
    var renderedLongitude = longitudeNear(first.coords.lng, worldCenter);
    L.marker([first.coords.lat, renderedLongitude], { icon: mapMarkerIcon(first.category, needsReview, groupedPoints.length) })
      .bindPopup(pointPopupHtml(groupedPoints, trip), mapPopupOptions()).addTo(layers[first.category]);
    trackPoint(first.coords.lat, renderedLongitude);
    placed += groupedPoints.length;
  });

  geometry.preparedLegs.forEach(function (prepared) {
    var style = routeStyleForMode(prepared.leg.mode);
    var renderedRoute = routeForMapView(prepared.route, worldCenter);
    L.polyline(renderedRoute.points.map(function (point) { return [point.lat, point.lng]; }), style)
      .bindPopup(routePopupHtml(prepared.leg, trip), mapPopupOptions()).addTo(layers.transport);
    addRouteArrow(map, layers.transport, renderedRoute.arrowBefore, renderedRoute.arrowAfter, style.color);
    renderedRoute.points.forEach(function (point) { trackPoint(point.lat, point.lng); });
    placed++;
  });

  mapState.visibleBounds = bounds.isValid() ? bounds : null;
  updateMapStatus(placed, missing);
  requestAnimationFrame(updateMapRouteArrows);
  if (fitToSelection && mapState.visibleBounds) map.fitBounds(mapState.visibleBounds, { padding: [34, 34], maxZoom: 12 });
}

function showMapLoadError(error) {
  var statusEl = document.getElementById('map-status');
  if (statusEl) {
    statusEl.textContent = 'Map could not load. Refresh the page or try another date range.';
    statusEl.classList.add('has-warning');
  }
  console.error('Map rendering failed:', error);
}

function safelyRefreshMapLayers(trip, fitToSelection) {
  try {
    refreshMapLayers(trip, fitToSelection);
    return true;
  } catch (error) {
    showMapLoadError(error);
    return false;
  }
}

function loadMapBoundaries(trip, generation) {
  var refs = mapPointsForTrip(trip)
    .filter(function (point) { return point.category === 'destinations' && point.boundaryRef && !mapState.boundaries[point.boundaryRef] && !mapState.boundaryRequests[point.boundaryRef]; })
    .map(function (point) { return point.boundaryRef; })
    .filter(function (ref, index, all) { return all.indexOf(ref) === index; })
    .slice(0, 20);
  if (!refs.length) return Promise.resolve();
  refs.forEach(function (ref) { mapState.boundaryRequests[ref] = true; });
  return fetch('/WayPoint/api/location-boundaries', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refs: refs })
  }).then(function (response) {
    return response.ok ? response.json() : null;
  }).then(function (data) {
    if (!data || mapState.generation !== generation) return;
    Object.assign(mapState.boundaries, data.boundaries || {});
    safelyRefreshMapLayers(trip, false);
  }).catch(function () {
    // A boundary is a visual enhancement. A transient failure must never stop
    // pins or routes rendering, and retries remain possible on a later range.
  }).finally(function () {
    refs.forEach(function (ref) { delete mapState.boundaryRequests[ref]; });
  });
}

function fitMapToSelection() {
  if (mapState.instance && mapState.visibleBounds) mapState.instance.fitBounds(mapState.visibleBounds, { padding: [34, 34], maxZoom: 12 });
}

function updateMapRangeUi(trip) {
  var days = ensureMapRange(trip);
  if (!days.length) return;
  var startIndex = days.indexOf(mapState.rangeStart), endIndex = days.indexOf(mapState.rangeEnd), max = days.length - 1;
  var startPercent = max ? startIndex / max * 100 : 0;
  var endPercent = max ? endIndex / max * 100 : 100;
  var slider = document.querySelector('[data-map-range-slider]');
  if (slider) {
    slider.style.setProperty('--range-start', startPercent + '%');
    slider.style.setProperty('--range-end', endPercent + '%');
    slider.classList.toggle('labels-overlap', endPercent - startPercent < 20);
    var startInput = slider.querySelector('[data-map-range-handle="start"]');
    var endInput = slider.querySelector('[data-map-range-handle="end"]');
    if (startInput) { startInput.value = startIndex; startInput.setAttribute('aria-label', 'Map range start: ' + formatDateHeading(mapState.rangeStart)); }
    if (endInput) { endInput.value = endIndex; endInput.setAttribute('aria-label', 'Map range end: ' + formatDateHeading(mapState.rangeEnd)); }
  }
  var summary = document.querySelector('[data-map-range-summary]');
  var dayCount = mapRangeDayCount(trip);
  var count = document.querySelector('[data-map-range-days]');
  var startLabel = document.querySelector('[data-map-range-start-label]');
  var endLabel = document.querySelector('[data-map-range-end-label]');
  if (summary) summary.textContent = mapRangeDateLabel(mapState.rangeStart) + ' — ' + mapRangeDateLabel(mapState.rangeEnd);
  if (count) count.textContent = dayCount + ' day' + (dayCount === 1 ? '' : 's');
  if (startLabel) startLabel.textContent = mapRangeDateLabel(mapState.rangeStart);
  if (endLabel) endLabel.textContent = mapRangeDateLabel(mapState.rangeEnd);
  var layerCounts = mapVisibleCounts(trip);
  MAP_LAYER_META.forEach(function (meta) {
    var chip = document.querySelector('[data-action="toggle-map-layer"][data-layer="' + meta.key + '"]');
    var chipCount = chip && chip.querySelector('.map-filter-count');
    if (chipCount) chipCount.textContent = layerCounts[meta.key];
  });
  var reset = document.querySelector('[data-action="reset-map-view"]');
  if (reset) reset.disabled = mapViewIsDefault(trip);
}

function resetMapView(trip) {
  var days = ensureMapRange(trip);
  if (days.length) {
    mapState.rangeStart = days[0];
    mapState.rangeEnd = days[days.length - 1];
  }
  MAP_LAYER_META.forEach(function (meta) {
    mapState.visibility[meta.key] = true;
    if (mapState.instance && mapState.layers && mapState.layers[meta.key] && !mapState.instance.hasLayer(mapState.layers[meta.key])) {
      mapState.layers[meta.key].addTo(mapState.instance);
    }
    var chip = document.querySelector('[data-action="toggle-map-layer"][data-layer="' + meta.key + '"]');
    if (chip) { chip.classList.add('is-active'); chip.setAttribute('aria-pressed', 'true'); }
  });
  updateMapRangeUi(trip);
  safelyRefreshMapLayers(trip, true);
  loadMapBoundaries(trip, mapState.generation);
  announceStatus('Map restored to the full trip and all layers');
}

function scheduleMapRefresh(trip) {
  if (mapState.refreshFrame) cancelAnimationFrame(mapState.refreshFrame);
  mapState.refreshFrame = requestAnimationFrame(function () {
    mapState.refreshFrame = null;
    safelyRefreshMapLayers(trip, false);
    loadMapBoundaries(trip, mapState.generation);
  });
}

function updateMapMinimumWorldZoom() {
  var map = mapState.instance;
  var canvas = document.getElementById('map-canvas');
  if (!map || !canvas) return;
  var width = canvas.clientWidth || canvas.getBoundingClientRect().width;
  var minimumZoom = mapMinimumWorldZoom(width);
  mapState.minimumZoom = minimumZoom;
  map.setMinZoom(minimumZoom);
  if (map.getZoom() < minimumZoom) map.setZoom(minimumZoom);
}

// Builds the Leaflet map only when the Map tab itself is mounted. Changing
// filters or either date handle below deliberately updates layers in place.
async function initMap(trip) {
  var canvas = document.getElementById('map-canvas');
  if (!canvas) return;
  try {
    ensureMapRange(trip);
    mapState.generation++;
    var myGeneration = mapState.generation;
    if (mapState.instance) { mapState.instance.remove(); mapState.instance = null; mapState.layers = null; }

    var initialGeometry = prepareMapGeometry(mapPointsForTrip(trip), mapLegsForTrip(trip));
    var initialWorldCenter = initialGeometry.worldCenter;
    var initialWorld = mapWorldWindow(initialWorldCenter);
    var canvasWidth = canvas.clientWidth || canvas.getBoundingClientRect().width;
    var minimumZoom = mapMinimumWorldZoom(canvasWidth);
    var map = L.map('map-canvas', {
      scrollWheelZoom: true,
      worldCopyJump: false,
      minZoom: minimumZoom,
      zoomSnap: 0,
      zoomDelta: 0.5,
      maxBounds: [[-85.05112878, initialWorld.west], [85.05112878, initialWorld.east]],
      maxBoundsViscosity: 1
    }).setView([20, initialWorldCenter], minimumZoom);
    // Tile addressing may wrap internally so a Pacific-centred window can use
    // longitudes above 180°, but maxBounds plus minZoom expose only one Earth.
    // These tile options are never toggled after startup.
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
    }).addTo(map);
    var layers = { destinations: L.layerGroup(), activities: L.layerGroup(), transport: L.layerGroup(), accommodation: L.layerGroup() };
    Object.keys(layers).forEach(function (key) { if (mapState.visibility[key]) layers[key].addTo(map); });
    mapState.instance = map;
    mapState.layers = layers;
    mapState.worldCenter = initialWorldCenter;
    mapState.worldBoundsKey = initialWorld.west.toFixed(5) + '|' + initialWorld.east.toFixed(5);
    mapState.minimumZoom = minimumZoom;
    map.on('zoomend', updateMapRouteArrows);
    map.on('resize', function () {
      updateMapMinimumWorldZoom();
      updateMapRouteArrows();
    });

    if (!safelyRefreshMapLayers(trip, true)) return;
    await loadMapBoundaries(trip, myGeneration);
  } catch (error) {
    showMapLoadError(error);
  }
}

/* ---------- 20. Render: Timeline tab ---------------------------------------
   One card per day: the date heading, every event in time order,
   and — when relevant — a note about where the night is spent (a
   booked stay, or travelling overnight through to the next day). */

// A record's cost belongs to exactly one day, matching allCostLines(): the
// departure day for a leg, the check-in day for a stay, the start day for an
// activity. Without that, a return leg or a checkout would show the same money
// a second time and stop reconciling with the day total in the heading.
// "LHR — London Heathrow" -> "LHR". The Timeline is a scan, and a flight's
// full airport names spent most of a phone's line width saying twice what the
// code says once. Only flights: a rail or ferry endpoint is a place name, and
// the pattern deliberately matches nothing that is not a leading IATA code.
function transportEndpointLabel(transport, text) {
  if (!transport || transport.mode !== 'Flight') return text || '';
  var code = /^\s*([A-Z]{3})\b/.exec(String(text || ''));
  return code ? code[1] : (text || '');
}

function timelineTransportTitle(transport) {
  return (transport.mode || 'Transport') + (transport.flightNumber ? ' ' + transport.flightNumber : '') +
    ': ' + transportEndpointLabel(transport, transport.fromLocation) + ' → ' + transportEndpointLabel(transport, transport.toLocation);
}

function timelineArrivalTitle(transport) {
  return 'Arrive: ' + transportEndpointLabel(transport, transport.toLocation) +
    ' (from ' + transportEndpointLabel(transport, transport.fromLocation) + ')';
}

function timelineEventCarriesCost(ev) {
  return ev.kind === 'depart' || ev.kind === 'checkin' || (ev.kind === 'activity' && !ev.continues);
}

// Row three of a Timeline card: the event's own context line, then whatever
// was typed into the record's notes. Empty parts drop out.
function timelineDetail(context, notes) {
  return [context, notes].filter(function (part) { return part; }).join(' · ');
}

function eventRowHtml(trip, ev) {
  var section = ev.kind === 'activity' ? 'activity' : ((ev.kind === 'checkin' || ev.kind === 'checkout') ? 'accommodation' : 'transport');
  var model = recordItemRowModel(trip, section, ev.data, 'timeline');
  model.leadingTime = ev.displayTime || ev.time;
  // Timeline is the quick chronological scan. Full metadata remains on the
  // Plan lists and Map popovers; omitting it here keeps each event to one clear
  // headline without address, destination, companion or commerce tag pills.
  model.metadata = {};
  model.expandableNote = true;
  // Shown only on the day that owns it, so nothing bills twice.
  if (!timelineEventCarriesCost(ev)) model.cost = null;
  if (ev.kind === 'activity' && ev.continues) { model.title = 'Continues: ' + ev.data.title; model.icon = 'continues'; }
  else if (ev.kind === 'checkin') { model.title = 'Check in: ' + ev.data.name; model.icon = 'checkIn'; }
  else if (ev.kind === 'checkout') { model.title = 'Check out: ' + ev.data.name; model.icon = 'checkOut'; }
  else if (ev.kind === 'depart') {
    model.title = timelineTransportTitle(ev.data);
    var overnight = dateOnly(ev.data.departDateTime) !== dateOnly(ev.data.arriveDateTime);
    model.supporting = timelineDetail(overnight ? 'Arrives ' + formatDateShort(dateOnly(ev.data.arriveDateTime)) + ' at ' + timeOnly(ev.data.arriveDateTime) : 'Arrives ' + timeOnly(ev.data.arriveDateTime), ev.data.notes);
  } else if (ev.kind === 'arrive') {
    model.title = timelineArrivalTitle(ev.data);
    model.supporting = timelineDetail('Overnight ' + (ev.data.mode || 'travel') + (ev.data.flightNumber ? ' ' + ev.data.flightNumber : '') + ' from ' + formatDateShort(dateOnly(ev.data.departDateTime)), ev.data.notes);
  }
  return itemRowHtml(trip, model);
}

function timelineDaySeed(trip, day) {
  var areas = areasForDay(trip, day);
  // A single active area is the unambiguous useful default. On transfer
  // days with multiple areas, leave the choice blank rather than guessing.
  return areas.length === 1 ? { destinationId: areas[0].destinationId } : {};
}

// Built once per render: summing allCostLines() inside the day loop would
// rebuild the whole list for every date. These are the same lines the Expenses
// ledger and the trip total use, so a day's figure always reconciles with the
// header -- and a multi-night stay counts once, on its check-in day.
function timelineSpendByDay(trip) {
  var byDay = {};
  allCostLines(trip).forEach(function (line) {
    if (!line.date) return;
    var entry = byDay[line.date] || (byDay[line.date] = { known: 0, unknown: 0 });
    var converted = homeValue(trip, line.amount, line.currency, line.rateOverride);
    if (converted.known) entry.known += converted.value; else entry.unknown++;
  });
  return byDay;
}

// One quiet area name per day. A day spanning two areas names both, in arrival
// order, rather than going blank -- a transfer day is exactly when the reader
// most needs to know where they are.
function timelineDayAreaLabel(trip, day) {
  var areas = areasForDay(trip, day);
  if (!areas.length) return '';
  return areas.slice().sort(function (a, b) {
    return String(a.arriveDate || '').localeCompare(String(b.arriveDate || ''));
  }).map(function (area) { return area.name; }).join(' → ');
}

// tripDayList() spans every record, so an outbound leg the day before the
// trip's own start date pulls a day into the Timeline that the trip header's
// range does not cover. Mark it rather than letting it pass as an ordinary day.
function timelineDayFlag(trip, day, today) {
  if (day === today) return { label: 'Today', quiet: false };
  if (trip.startDate && day < trip.startDate) return { label: 'Before trip', quiet: true };
  if (trip.endDate && day > trip.endDate) return { label: 'After trip', quiet: true };
  return null;
}

// What a day says about itself while collapsed -- previously a collapsed day
// was 38px of nothing, so an empty day and a packed one looked identical. The
// area is deliberately not repeated here; it already sits beside the date.
function timelineDaySummaryHtml(trip, eventCount, spend) {
  var parts = [eventCount ? eventCount + (eventCount === 1 ? ' event' : ' events') : 'Nothing planned'];
  if (spend && spend.known > 0) parts.push('<span class="day-summary-spend">' + money(spend.known, trip.homeCurrency) + '</span>');
  if (spend && spend.unknown) parts.push('<span class="rate-missing">' + spend.unknown + ' need rate</span>');
  return '<span class="day-summary">' + parts.join('<span class="day-summary-dot"></span>') + '</span>';
}

function timelineDayActionsHtml(trip, day) {
  if (!canFullyEditTrip(trip)) return '';
  var heading = esc(formatDateHeading(day));
  // One control per day instead of three: a fortnight previously carried 42
  // permanently visible add buttons against the itinerary. A native <details>
  // keeps the menu keyboard-operable without a bespoke popover, the same way
  // the Map's locations-needing-attention panel does.
  return '<details class="day-add"><summary class="day-add-btn" aria-label="Add to ' + heading + '" title="Add to ' + heading + '">' +
      icon('add') + '<span class="day-add-label">Add</span></summary>' +
    '<div class="day-add-menu">' +
      '<button type="button" class="day-add-item" data-action="timeline-add-activity" data-day="' + esc(day) + '">' + icon('activity') + ' Activity</button>' +
      '<button type="button" class="day-add-item" data-action="timeline-add-accommodation" data-day="' + esc(day) + '">' + icon('stay') + ' Stay</button>' +
      '<button type="button" class="day-add-item" data-action="timeline-add-transport" data-day="' + esc(day) + '">' + icon('route') + ' Travel</button>' +
    '</div></details>';
}

// Where you are in the trip, and how to move through it: a fortnight rendered
// roughly 3,500px of page with no way to get anywhere in it.
function timelineToolbarHtml(trip, days, today) {
  var anyCollapsed = days.some(function (day) { return !timelineDayExpanded(trip.tripId, day, today); });
  var progress = '';
  if (trip.startDate && trip.endDate && today >= trip.startDate && today <= trip.endDate) {
    var total = daysBetween(trip.startDate, trip.endDate) + 1;
    var current = daysBetween(trip.startDate, today) + 1;
    // A live percentage computed from real dates, so it reaches CSS as a custom
    // property -- the same documented exception the Map's range slider uses.
    progress = '<span class="timeline-progress"><span><strong>Day ' + current + '</strong> of ' + total + '</span>' +
      '<span class="timeline-progress-track"><span class="timeline-progress-fill" style="--wp-timeline-progress: ' + Math.round((current / total) * 100) + '%"></span></span></span>';
  }
  return '<div class="timeline-toolbar">' + progress +
