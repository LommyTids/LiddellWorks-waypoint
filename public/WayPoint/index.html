function openCompanionForm(trip, existing) {
  // A "user" grant only ever reaches this via "Add companion" (rowActions()
  // never shows Edit/Delete for a companion to anything less than
  // full-scope — see its own comment) — so `existing` should never be set
  // for them in practice, but the shorter field list is chosen from the
  // ACTUAL permission either way, not from whether this is an edit,
  // exactly so this can't silently show a field that would just be
  // dropped on save (see COMPANION_FIELDS_LIMITED's own comment).
  var fields = canFullyEditTrip(trip) ? COMPANION_FIELDS : COMPANION_FIELDS_LIMITED;
  // `smileyColor` is a flat form field but lives nested in storage
  // (`avatar.smiley`) — flatten it out here for the form to show, and
  // fold it back into the nested shape in onSubmit below.
  var initial = existing ? Object.assign({}, existing, { smileyColor: (existing.avatar && existing.avatar.smiley) || '' }) : {};
  openForm({
    title: existing ? 'Edit companion' : 'Add companion', fields: fields,
    initial: initial, trip: trip, submitLabel: 'Save',
    onSubmit: function (v) {
      updateState(function (next) {
        var t = byId(next.trips, trip.tripId, 'tripId');
        var rec = { companionId: existing ? existing.companionId : newId(), name: v.name };
        // notes is only ever on the full COMPANION_FIELDS list -- v.notes
        // is simply undefined when a "user" grant submitted this via
        // COMPANION_FIELDS_LIMITED, so this naturally comes out as ''
        // rather than needing an extra check for which list was used.
        rec.notes = v.notes || '';
        if (v.smileyColor) rec.avatar = { smiley: v.smileyColor };
        // Deliberately no `accountId` here, ever -- see COMPANION_FIELDS'
        // own comment. If this companion is already linked (editing an
        // existing one), the Worker reasserts that link from its own
        // stored truth regardless of what this save contains (see
        // reconcileCompanionAccountLinks() in src/worker.js) -- so simply
        // never mentioning it here is enough; there's no need to (and no
        // safe way to) carry it forward by hand.
        if (existing) t.companions[t.companions.findIndex(function (x) { return x.companionId === existing.companionId; })] = rec;
        else t.companions.push(rec);
        // Deliberately NOT touching every destination/activity/
        // accommodation/transport record here to rename a tag — nothing
        // needs to, since every tag is stored as just the companion's id
        // (see readTagPicker()) and looked up by name at render time
        // (see e.g. renderActivitiesTab()'s tag list) — so a rename here
        // is instantly reflected everywhere that companion is tagged,
        // with nothing else to keep in sync.

        // Keep the OPTIMISTIC render's companionAvatars map in sync too —
        // persist() (see below) re-renders immediately from THIS
        // locally-mutated clone, before the server's own freshly-
        // recomputed map comes back on the next full reload. Without
        // this, a just-added (or just-recoloured) companion's marker
        // would render blank until something else happened to trigger a
        // reload. Mirrors resolveCompanionAvatars()'s "smiley" branch in
        // src/worker.js exactly (using the client-side twin of its
        // deterministic-default logic, deterministicAvatarIndex() in
        // data/avatars.js) — only ever the "smiley" shape here, never
        // "account": linking is its own separate action (see
        // openCompanionLinkForm()/submitCompanionAccess() below), and
        // changing an already-linked companion's smiley doesn't affect
        // its resolved marker at all (the server always prefers the
        // linked account's own avatar), so there's nothing to recompute
        // for that case — just leave whatever's already there.
        if (!existing || !existing.accountId) {
          t.companionAvatars = t.companionAvatars || {};
          var smileyToken = (v.smileyColor && avatarColorHex(v.smileyColor)) ? v.smileyColor : AVATAR_COLORS[deterministicAvatarIndex(rec.companionId, AVATAR_COLORS.length)].token;
          t.companionAvatars[rec.companionId] = { type: 'smiley', color: smileyToken };
        }
      });
    }
  });
}

/* ---------- Link (or unlink) a companion to an account, AND manage
   their privilege level on this trip -- Phase 2 of the Companions/
   Avatars feature, revised to fold the old standalone "Share access"
   panel into this same form. Superuser/Admin only (canLinkCompanion()).
   Two small dedicated endpoints do the actual work -- /api/companions/link
   for the account link, /api/trip-grants (and /trip-grants/revoke) for
   the privilege level -- rather than the normal save path, for the same
   reason as ever: this is identity/access data, not ordinary trip
   content, and needs its own server-side permission check regardless of
   what a save would otherwise allow (see handleCompanionLink()/
   handleTripGrantsUpsert() and the big COMPANIONS & AVATARS comment in
   src/worker.js). See submitCompanionAccess() below for how the two
   calls fit together in one submit. ------------------------------------ */
var GRANT_ROLE_LABELS = {
  admin: 'Admin — full read/write',
  user: 'User — read/write, own items only',
  viewer: 'Viewer — read-only, own items only'
};

function openCompanionLinkForm(trip, companion) {
  var isLinked = isCompanionLinked(trip, companion);
  // Prefills the current username when we actually have one to show --
  // only possible for a full-scope role (Superuser/admin both receive
  // `trip.grants`; a scoped role never does, and never reaches this form
  // at all, since canLinkCompanion() requires full-scope anyway). If
  // this companion is linked to an account that ISN'T (or is no longer)
  // shared on this trip, there's simply nothing to look the username up
  // in -- the field just starts blank, same as an unlinked companion,
  // rather than guessing.
  var currentGrant = companion.accountId ? (trip.grants || []).find(function (g) { return g.accountId === companion.accountId; }) : null;
  var currentUsername = currentGrant ? currentGrant.username : '';
  // The privilege level to prefill the select with. Resolved the exact
  // same way the access-level TAG on their row is (see
  // renderCompanionsTab()) -- 'superuser'/'admin'/'user'/'viewer', or
  // undefined for "linked but no access" / not linked at all.
  var currentRole = trip.companionAccessLevels && trip.companionAccessLevels[companion.companionId];
  var iCanGrantAdmin = canGrantAdminRole(trip);
  // Two cases where the privilege level can't be changed from THIS form
  // at all -- shown as a disabled select rather than hidden outright, so
  // it's still obvious what their current standing actually is:
  //   - 'superuser' means this account IS the trip's owner (or the
  //     site's uber-user) -- that's not a `grants` entry at all, so
  //     there's nothing here to upsert or revoke.
  //   - 'admin' when *I* can't grant Admin myself (only the trip's real
  //     owner can) -- same restriction that already applied to revoking
  //     an Admin grant from the old Share panel, just carried over here.
  var roleLocked = currentRole === 'superuser' || (currentRole === 'admin' && !iCanGrantAdmin);
  var roleSelectHtml;
  if (roleLocked) {
    var lockedLabel = currentRole === 'superuser' ? 'Owner — can\'t be changed here' : GRANT_ROLE_LABELS.admin;
    roleSelectHtml = '<select disabled><option selected>' + esc(lockedLabel) + '</option></select>' +
      '<div class="field-hint">' + (currentRole === 'superuser'
        ? 'This account already owns this trip (or is the site owner) — its access can\'t be managed here.'
        : 'Only this trip\'s owner can change or remove another Admin\'s access.') + '</div>';
  } else {
    roleSelectHtml = '<select name="role">' +
      '<option value=""' + (!currentRole ? ' selected' : '') + '>No trip access (just linked)</option>' +
      '<option value="user"' + (currentRole === 'user' ? ' selected' : '') + '>' + esc(GRANT_ROLE_LABELS.user) + '</option>' +
      '<option value="viewer"' + (currentRole === 'viewer' ? ' selected' : '') + '>' + esc(GRANT_ROLE_LABELS.viewer) + '</option>' +
      (iCanGrantAdmin ? '<option value="admin"' + (currentRole === 'admin' ? ' selected' : '') + '>' + esc(GRANT_ROLE_LABELS.admin) + '</option>' : '') +
      '</select>' +
      '<div class="field-hint">Choosing a level shares this trip with them, scoped to ' + esc(companion.name) + '\'s own tagged items (or fully, for Admin) — leave "No trip access" if they should just get their own avatar without being able to see or edit this trip.</div>';
  }
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>' + esc(companion.name) + ': account &amp; access</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('close') + '</button></div>' +
        '<form id="companion-link-form" data-trip-id="' + esc(trip.tripId) + '" data-companion-id="' + esc(companion.companionId) + '" data-prior-account-id="' + esc(companion.accountId || '') + '">' +
          '<div class="modal-body">' +
            '<div class="field"><label>Username</label><input type="text" name="username" placeholder="an existing account" value="' + esc(currentUsername) + '"></div>' +
            '<div class="field-hint">' + (isLinked && !currentUsername
              ? 'Already linked to an account, but its username isn\'t shown here (no access has been granted) — retype it if you want to change their access level below.'
              : 'Leave blank and save to remove the current link.') + '</div>' +
            '<div class="field"><label>Privilege level</label>' + roleSelectHtml + '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Save</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
}

// The one function both openCompanionLinkForm() above and
// openAddLinkedCompanionForm() below submit through -- reconciles a
// companion's account LINK and their ACCESS grant in one go, since the
// old "Share access" panel is gone and every place that used to grant
// access now does it right alongside linking instead.
//
//   payload.username  -- '' unlinks (or, for a brand-new companion,
//                         just never links at all).
//   payload.role       -- '' explicitly means "No trip access" was
//                         chosen (revoke whatever grant is there, if
//                         any); a real role ('admin'/'user'/'viewer')
//                         shares the trip as that role, replacing any
//                         existing grant; `undefined` means the
//                         privilege select was DISABLED (roleLocked, see
//                         openCompanionLinkForm()) and shouldn't be
//                         touched at all -- a disabled <select> is never
//                         included in a submitted FormData, which is
//                         exactly how the caller tells these two "no
//                         role" cases apart.
//   payload.priorAccountId -- the account (if any) this companion was
//                         linked to BEFORE this submit, so a switch to
//                         "No trip access" knows whose grant to revoke,
//                         or a new grant knows which stale grant it must
//                         atomically replace when the username changes.
async function submitCompanionAccess(payload) {
  var username = (payload.username || '').trim();
  if (payload.role && !username) { showToast('Enter the username to grant them access.'); return; }
  try {
    // Step 1: reconcile the account link.
    var linkRes = await fetch('/WayPoint/api/companions/link', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tripId: payload.tripId, companionId: payload.companionId, username: username })
    });
    var linkBody = await linkRes.json().catch(function () { return {}; });
    if (!linkRes.ok) { showToast(linkBody.error || 'Could not update that link.'); return; }

    // Step 2: reconcile the access grant to match whatever privilege
    // level was actually submitted (see this function's own comment
    // above for what each value of payload.role means).
    if (payload.role) {
      var grantRes = await fetch('/WayPoint/api/trip-grants', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tripId: payload.tripId,
          username: username,
          role: payload.role,
          companionId: payload.companionId,
          replaceAccountId: payload.priorAccountId || ''
        })
      });
      var grantBody = await grantRes.json().catch(function () { return {}; });
      if (!grantRes.ok) {
        // Linked successfully, but sharing failed (e.g. only the trip's
        // real owner may grant Admin) -- still refresh so the successful
        // link shows up, but say clearly the access level didn't stick.
        showToast(grantBody.error || 'Linked, but could not set their access level.');
        closeModal();
        state = await loadInitialState();
        render();
        return;
      }
    } else if (payload.role === '' && payload.priorAccountId) {
      // "No trip access" was explicitly chosen for someone who
      // previously had a real grant. Treat a failed revoke as a failed
      // access update; silently claiming success here could leave the old
      // account able to open the trip after the UI says access was removed.
      var revokeRes = await fetch('/WayPoint/api/trip-grants/revoke', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tripId: payload.tripId, accountId: payload.priorAccountId })
      });
      var revokeBody = await revokeRes.json().catch(function () { return {}; });
      if (!revokeRes.ok) {
        showToast(revokeBody.error || 'Linked, but could not remove the previous access grant.');
        closeModal();
        state = await loadInitialState();
        render();
        return;
      }
    }

    closeModal();
    showToast(!username ? 'Link removed' : (payload.role ? 'Shared with ' + username : 'Linked to ' + username));
    // Reloads rather than patching `state` in place -- simplest way to
    // pick up the server's freshly-recomputed `companionAvatars`/
    // `companionAccessLevels` (and, for a full-scope role, the
    // companion's own now-changed accountId) rather than trying to
    // guess what they'd now be.
    state = await loadInitialState();
    render();
  } catch (err) {
    showToast('Could not update that companion\'s access — check your connection and try again.');
  }
}

/* ---- "Add companion" -- the one-step Guest+link+share flow -----------
   Superuser/Admin only (canLinkCompanion(), same bar as managing an
   existing companion's access above). This is deliberately NOT a new
   server-side endpoint: it's the same three actions a Superuser/Admin
   could already do by hand -- add a guest, link them to a username, and
   share the trip with them -- just chained together behind one form so
   they don't have to leave the Companions tab and come back. See
   submitAddLinkedCompanion() below for why they run strictly in that
   order, one fully finished before the next starts. --------------------- */
function openAddLinkedCompanionForm(trip) {
  var iCanGrantAdmin = canGrantAdminRole(trip);
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>Add companion</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('close') + '</button></div>' +
        '<form id="add-linked-companion-form" data-trip-id="' + esc(trip.tripId) + '">' +
          '<div class="modal-body">' +
            '<p class="field-hint" style="margin-bottom:14px">A companion is someone with their own Waypoint login — their marker uses their own account\'s colour + animal instead of a smiley, and this shares the trip with them right away at whatever privilege level you pick below.</p>' +
            '<div class="field"><label>Name</label><input type="text" name="name" required placeholder="e.g. Sarah"></div>' +
            '<div class="field"><label>Username</label><input type="text" name="username" required placeholder="an existing account"></div>' +
            '<div class="field"><label>Privilege level</label><select name="role" required>' +
              '<option value="user" selected>' + esc(GRANT_ROLE_LABELS.user) + '</option>' +
              '<option value="viewer">' + esc(GRANT_ROLE_LABELS.viewer) + '</option>' +
              (iCanGrantAdmin ? '<option value="admin">' + esc(GRANT_ROLE_LABELS.admin) + '</option>' : '') +
            '</select></div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Add companion</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
}

// Polls until the save queue is completely empty -- see persist()'s own
// big comment further up for why only ONE POST /api/data is ever allowed
// in flight at a time, and how a later edit collapses onto
// `pendingSaveState` rather than firing its own overlapping request.
// submitAddLinkedCompanion() below needs to know the NEW companion it
// just asked updateState() to add has actually reached the server before
// it tries to link that companion id -- handleCompanionLink() 404s on a
// companion id the server doesn't know about yet. A short poll is a lot
// simpler (and just as reliable) than threading a promise all the way
// through updateState()/persist()/sendSave() for what is, in practice, a
// rare, explicitly user-triggered action rather than a hot path.
function waitForSaveToSettle() {
  return new Promise(function (resolve) {
    (function check() {
      if (!saveInFlight && !pendingSaveState) resolve();
      else setTimeout(check, 50);
    })();
  });
}

async function submitAddLinkedCompanion(payload) {
  var name = (payload.name || '').trim();
  var username = (payload.username || '').trim();
  var role = payload.role || 'user';
  if (!name) { showToast('Enter a name.'); return; }
  if (!username) { showToast('Enter the username to link.'); return; }

  var newCompanionId = newId();
  // Step 1: add them as an ordinary Guest first, through the SAME
  // optimistic updateState()/persist() pipeline every other edit in this
  // app uses -- see openCompanionForm() above for the twin of this
  // mutator. Going through the normal queued save (rather than posting
  // directly ourselves here) means this can never race an unrelated
  // in-flight save and clobber it.
  updateState(function (next) {
    var t = byId(next.trips, payload.tripId, 'tripId');
    t.companions.push({ companionId: newCompanionId, name: name });
  });
  // Step 2: wait for that save (and anything it was already queued
  // behind) to actually finish, so the companion genuinely exists
  // server-side before asking to link/share it.
  await waitForSaveToSettle();
  // Step 3: link AND share it in one go -- see submitCompanionAccess()'s
  // own comment for exactly what that does. priorAccountId is
  // deliberately null: this companion didn't exist a moment ago, so
  // there's nothing to revoke regardless of what role ends up chosen. If
  // this step fails (e.g. the username doesn't exist), the person still
  // ends up added as an ordinary Guest rather than not existing at all --
  // submitCompanionAccess()'s own error toast explains what went wrong,
  // and the row's "Manage account & access" button (see
  // renderCompanionsTab()) is right there to retry once it's sorted out.
  await submitCompanionAccess({ tripId: payload.tripId, companionId: newCompanionId, username: username, role: role, priorAccountId: null });
}

// Self-service avatar picker (Phase 1b) -- every logged-in account can
// change ONLY its own colour+animal here (see handleAccountAvatarUpdate()
// in src/worker.js -- it always writes to `user.id` from the session, so
// there's no id field in this form at all to worry about tampering with).
// Hand-written rather than run through the generic openForm() machinery,
// since two linked swatch grids feeding one shared live preview doesn't
// fit that helper's one-field-at-a-time model. Selection is tracked in
// two hidden inputs (name="color"/"animal") that the swatch clicks below
// update directly, so the actual <form> submit still works the ordinary
// way (read via FormData in the submit-delegation listener).
function openAvatarPicker() {
  // currentUser.avatar is always a real {color,animal} pair once logged
  // in (see applyAuthUI()'s own comment) -- this fallback only guards
  // against a malformed/missing response, so the picker still opens
  // showing SOMETHING rather than breaking.
  var current = currentUser.avatar || { color: AVATAR_COLORS[0].token, animal: AVATAR_ANIMALS[0].token };
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>Choose your avatar</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('close') + '</button></div>' +
        '<form id="avatar-pick-form">' +
          '<div class="modal-body">' +
            '<div class="avatar-picker-preview">' +
              '<span class="avatar-marker" id="avatar-picker-preview-marker" style="background:' + (avatarColorHex(current.color) || AVATAR_GREY_HEX) + '">' + (avatarAnimalEmoji(current.animal) || '') + '</span>' +
              '<span>' + esc(currentUser.username) + '</span>' +
            '</div>' +
            '<input type="hidden" name="color" value="' + esc(current.color) + '">' +
            '<input type="hidden" name="animal" value="' + esc(current.animal) + '">' +
            '<div class="avatar-picker-section"><h4>Colour</h4><div class="avatar-swatch-grid">' +
              AVATAR_COLORS.map(function (c) {
                return '<button type="button" class="avatar-swatch-btn' + (c.token === current.color ? ' is-selected' : '') + '" style="background:' + c.hex + '" data-action="pick-avatar-swatch" data-kind="color" data-value="' + c.token + '" title="' + esc(c.token) + '" aria-label="' + esc(c.token) + '"></button>';
              }).join('') +
            '</div></div>' +
            '<div class="avatar-picker-section"><h4>Animal</h4><div class="avatar-swatch-grid">' +
              AVATAR_ANIMALS.map(function (a) {
                return '<button type="button" class="avatar-swatch-btn' + (a.token === current.animal ? ' is-selected' : '') + '" data-action="pick-avatar-swatch" data-kind="animal" data-value="' + a.token + '" title="' + esc(a.token) + '" aria-label="' + esc(a.token) + '">' + a.emoji + '</button>';
              }).join('') +
            '</div></div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Save</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
}

// Redraws just the live preview marker in the (still open) avatar-picker
// modal after a swatch click -- reads the two hidden inputs' CURRENT
// values (already updated by the click handler just before this runs)
// rather than taking color/animal as arguments, so it always reflects
// both selections together even though each swatch grid only knows about
// its own kind.
function updateAvatarPickerPreview(form) {
  var marker = document.getElementById('avatar-picker-preview-marker');
  if (!marker) return;
  var color = form.querySelector('input[name="color"]').value;
  var animal = form.querySelector('input[name="animal"]').value;
  marker.style.background = avatarColorHex(color) || AVATAR_GREY_HEX;
  marker.textContent = avatarAnimalEmoji(animal) || '';
}

async function submitAvatarPick(payload) {
  try {
    var res = await fetch('/WayPoint/api/account/avatar', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) { showToast(body.error || 'Could not save your avatar.'); return; }
    // Trust the server's own (re-resolved) avatar back rather than just
    // echoing what we sent -- same defensive habit as everywhere else in
    // this file that a save's response is the source of truth, not the
    // request that produced it.
    currentUser.avatar = body.avatar || payload;
    applyAuthUI();
    closeModal();
    showToast('Avatar saved');
    // Any companion linked to this account needs its resolved
    // companionAvatars entry (on every trip it's shared on) to pick up
    // the change too -- simplest correct way is the same "reload state"
    // pattern used after submitCompanionAccess(), rather than trying to
    // patch every trip's companionAvatars map by hand.
    state = await loadInitialState();
    render();
  } catch (err) {
    showToast('Could not save your avatar — check your connection and try again.');
  }
}

function openExpenseForm(trip, existing) {
  openForm({
    title: existing ? 'Edit expense' : 'Add expense', fields: EXPENSE_FIELDS,
    initial: existing || { category: 'Other' }, trip: trip, submitLabel: 'Save',
    onSubmit: function (v) {
      updateState(function (next) {
        var t = byId(next.trips, trip.tripId, 'tripId');
        var rec = {
          expenseId: existing ? existing.expenseId : newId(), description: v.description, category: v.category || 'Other', date: v.date,
          amount: v.amount, currency: (v.currency || '').toUpperCase(), rateOverride: v.rateOverride || '',
          receiptRef: v.receiptRef || '', contactId: v.contactId || '', notes: v.notes || ''
        };
        if (existing) t.expenses[t.expenses.findIndex(function (x) { return x.expenseId === existing.expenseId; })] = rec;
        else t.expenses.push(rec);
      });
    }
  });
}

function deleteEntity(trip, section, id, label) {
  var idField = ENTITY_ID_FIELDS[section];
  openConfirm({
    title: 'Delete ' + label + '?', message: 'This can\'t be undone.', confirmLabel: 'Delete',
    onConfirm: function () {
      updateState(function (next) {
        var t = byId(next.trips, trip.tripId, 'tripId');
        t[section] = t[section].filter(function (x) { return x[idField] !== id; });
      });
    }
  });
}

function deleteTrip(id) {
  var t = byId(state.trips, id, 'tripId');
  openConfirm({
    title: 'Delete trip?', message: 'This deletes "' + t.name + '" and everything in it — destinations, activities, transport, accommodation, contacts, companions and expenses. This can\'t be undone.', confirmLabel: 'Delete trip',
    onConfirm: function () {
      updateState(function (next) { next.trips = next.trips.filter(function (x) { return x.tripId !== id; }); });
      currentView = 'dashboard'; currentTripId = null;
    }
  });
}

/* ---------- 9. Cost / expense aggregation --------------------------
   Every bookable item (activity, transport leg, accommodation stay)
   can carry its own cost; on top of that a trip can have standalone
   expenses (meals, taxis, souvenirs...). allCostLines() flattens all
   of it into one list so the Expenses tab and the CSV export both
   work from a single, consistent ledger. */

function allCostLines(trip) {
  var lines = [];
  trip.activities.forEach(function (a) {
    if (a.costAmount) lines.push({ date: a.date, type: 'Activity', desc: a.title, amount: a.costAmount, currency: a.costCurrency, rateOverride: a.costRate, receiptRef: a.receiptRef, bookingRef: a.bookingRef, category: 'Activities' });
  });
  trip.transport.forEach(function (t) {
    if (t.costAmount) lines.push({ date: dateOnly(t.departDateTime), type: 'Transport', desc: transportLabel(t), amount: t.costAmount, currency: t.costCurrency, rateOverride: t.costRate, receiptRef: t.receiptRef, bookingRef: t.bookingRef, category: 'Transport' });
  });
  trip.accommodation.forEach(function (ac) {
    if (ac.costAmount) lines.push({ date: dateOnly(ac.checkIn), type: 'Accommodation', desc: ac.name, amount: ac.costAmount, currency: ac.costCurrency, rateOverride: ac.costRate, receiptRef: ac.receiptRef, bookingRef: ac.bookingRef, category: 'Accommodation' });
  });
  trip.expenses.forEach(function (e) {
    lines.push({ date: e.date, type: 'Expense', desc: e.description, amount: e.amount, currency: e.currency, rateOverride: e.rateOverride, receiptRef: e.receiptRef, bookingRef: '', category: e.category || 'Other' });
  });
  lines.sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  return lines;
}

function usedCurrencies(trip) {
  var set = {};
  allCostLines(trip).forEach(function (l) { if (l.currency && l.currency !== trip.homeCurrency) set[l.currency] = true; });
  return Object.keys(set).sort();
}

function csvEscape(v) {
  var s = String(v === undefined || v === null ? '' : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildCsv(trip) {
  var lines = allCostLines(trip);
  var header = ['Date', 'Type', 'Category', 'Description', 'Amount', 'Currency', 'Rate used', 'Converted (' + trip.homeCurrency + ')', 'Booking ref', 'Receipt ref'];
  var rows = lines.map(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    return [l.date, l.type, l.category, l.desc, l.amount, l.currency, hv.rateUsed == null ? '' : hv.rateUsed, hv.known ? hv.value.toFixed(2) : 'unknown', l.bookingRef, l.receiptRef];
  });
  return [header].concat(rows).map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
}

// Builds the CSV text (see buildCsv() above) and hands it to the
// browser as a normal file download. This is the standard vanilla-JS
// download trick: wrap the text in a Blob, make a temporary object URL
// for it, click a hidden link pointing at that URL, then clean both up
// straight away. No server round-trip needed for this one.
function exportCsv(trip) {
  var csv = buildCsv(trip);
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = slug(trip.name) + '-expenses.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  // Give the browser a moment to actually start the download before we
  // revoke the URL it's reading from.
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ---------- 10. Timeline logic --------------------------------------
   This is the heart of the "multi-leg, overnight, several areas in a
   day" requirement: it builds one chronological agenda per trip that
   folds together destinations, activities, transport and
   accommodation, and makes overnight travel and multi-night stays
   visible instead of splitting them awkwardly across days. */

function tripDayList(trip) {
  var dates = {};
  function add(d) { if (d) dates[d] = true; }
  add(trip.startDate); add(trip.endDate);
  trip.destinations.forEach(function (d) { add(d.arriveDate); add(d.departDate); });
  trip.activities.forEach(function (a) { add(a.date); });
  trip.transport.forEach(function (t) { add(dateOnly(t.departDateTime)); add(dateOnly(t.arriveDateTime)); });
  trip.accommodation.forEach(function (a) { add(dateOnly(a.checkIn)); add(dateOnly(a.checkOut)); });
  var keys = Object.keys(dates).sort();
  if (keys.length === 0) return [];
  var out = []; var cur = keys[0]; var end = keys[keys.length - 1];
  while (cur <= end) { out.push(cur); cur = addDays(cur, 1); }
  return out;
}

function eventsForDay(trip, day) {
  var events = [];
  trip.activities.forEach(function (a) {
    if (a.date === day) events.push({ time: a.startTime || '00:00', kind: 'activity', data: a });
  });
  trip.accommodation.forEach(function (ac) {
    if (dateOnly(ac.checkIn) === day) events.push({ time: timeOnly(ac.checkIn) || '15:00', kind: 'checkin', data: ac });
    if (dateOnly(ac.checkOut) === day) events.push({ time: timeOnly(ac.checkOut) || '11:00', kind: 'checkout', data: ac });
  });
  trip.transport.forEach(function (t) {
    if (dateOnly(t.departDateTime) === day) events.push({ time: timeOnly(t.departDateTime) || '00:00', kind: 'depart', data: t });
    if (dateOnly(t.arriveDateTime) === day && dateOnly(t.arriveDateTime) !== dateOnly(t.departDateTime)) {
      events.push({ time: timeOnly(t.arriveDateTime) || '00:00', kind: 'arrive', data: t });
    }
  });
  events.sort(function (a, b) { return a.time.localeCompare(b.time); });
  return events;
}

function overnightStay(trip, day) {
  var stay = trip.accommodation.find(function (ac) { return dateOnly(ac.checkIn) <= day && day < dateOnly(ac.checkOut); });
  if (stay) return { kind: 'stay', data: stay };
  var nextDay = addDays(day, 1);
  var leg = trip.transport.find(function (t) { return dateOnly(t.departDateTime) === day && dateOnly(t.arriveDateTime) === nextDay; });
  if (leg) return { kind: 'transit', data: leg };
  return null;
}

function areasForDay(trip, day) {
  return trip.destinations.filter(function (d) { return d.arriveDate <= day && day <= d.departDate; });
}

/* ---------- 11. Trip-level stats ------------------------------------ */

function tripStatus(trip) {
  var today = todayStr();
  if (trip.startDate && trip.endDate) {
    if (today < trip.startDate) return 'upcoming';
    if (today > trip.endDate) return 'past';
    return 'ongoing';
  }
  if (trip.startDate && today < trip.startDate) return 'upcoming';
  if (trip.endDate && today > trip.endDate) return 'past';
  return 'upcoming';
}

function tripSpend(trip) {
  var known = 0, unknownCount = 0;
  allCostLines(trip).forEach(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    if (hv.known) known += hv.value; else unknownCount++;
  });
  return { known: known, unknownCount: unknownCount };
}

/* ---------- 12. Render: Dashboard ------------------------------------ */

function renderDashboard() {
  // "New trip" is always shown — creating one is open to any logged-in
  // account, not gated by any per-trip permission (there's nothing to
  // check permission against yet; whoever creates it becomes its
  // Superuser automatically — see openTripForm()).
  if (state.trips.length === 0) {
    return (
      '<div class="section-head"><h1>Your trips</h1>' +
        '<button class="btn btn-accent" data-action="new-trip">' + icon('plus') + ' New trip</button></div>' +
      '<div class="empty-state">' + icon('compass') +
        '<h3>No trips yet</h3>' +
        '<p>Add a trip to start planning destinations, activities, transport and accommodation — with expenses tracked across currencies as you go.</p>' +
      '</div>'
    );
  }
  var sorted = state.trips.slice().sort(function (a, b) { return (a.startDate || '9999') < (b.startDate || '9999') ? -1 : 1; });
  var cards = sorted.map(function (trip) {
    var status = tripStatus(trip);
    var spend = tripSpend(trip);
    var statusLabel = status === 'ongoing' ? 'In progress' : (status === 'past' ? 'Past' : 'Upcoming');
    // Edit/Delete on the card itself are full-scope-only (Superuser,
    // admin grant, or the uber-user) — a "user"/"viewer" grant can see
    // this trip's card (it's in their `state.trips` at all) but never
    // touch the trip's own name/dates, let alone delete it.
    var cardActions = canFullyEditTrip(trip)
      ? '<div class="card-actions">' +
          '<button class="btn btn-icon btn-ghost" data-action="edit-trip" data-id="' + trip.tripId + '" title="Edit trip">' + icon('edit') + '</button>' +
          '<button class="btn btn-icon btn-ghost" data-action="delete-trip" data-id="' + trip.tripId + '" title="Delete trip">' + icon('trash') + '</button>' +
        '</div>'
      : '';
    return (
      '<div class="trip-card" data-action="open-trip" data-id="' + trip.tripId + '">' +
        '<div class="trip-card-top">' +
          '<div><h3>' + esc(trip.name) + '</h3><div class="trip-dates">' +
            (trip.startDate ? formatDateShort(trip.startDate) : 'No dates set') +
            (trip.endDate ? ' – ' + formatDateShort(trip.endDate) : '') + '</div></div>' +
          '<span class="pill pill-' + status + '">' + statusLabel + '</span>' +
        '</div>' +
        '<div class="trip-stats">' +
          '<span>' + icon('pin') + ' <b>' + trip.destinations.length + '</b> areas</span>' +
          '<span>' + icon('wallet') + ' <b>' + money(spend.known, trip.homeCurrency) + '</b>' + (spend.unknownCount ? ' <span class="rate-missing">+' + spend.unknownCount + ' need rate</span>' : '') + '</span>' +
        '</div>' +
        tripCardAvatarsHtml(trip) +
        cardActions +
      '</div>'
    );
  }).join('');
  return (
    '<div class="intro-note"><strong>Waypoint</strong> keeps every trip\'s destinations, activities, transport and accommodation in one place, with a day-by-day timeline that shows overnight travel and multi-area days clearly, plus expenses tracked across currencies.</div>' +
    '<div class="section-head"><h1>Your trips</h1>' +
      '<button class="btn btn-accent" data-action="new-trip">' + icon('plus') + ' New trip</button></div>' +
    '<div class="trip-grid">' + cards + '</div>'
  );
}

/* ---------- 13. Render: Trip view shell (header + tabs) -------------- */

// The two "big picture" views of a trip — see the day-by-day agenda, or
// see it on a map — are surfaced as large hero buttons. The data-entry
// views are grouped by purpose, so someone planning a trip sees the
// itinerary-building tools together and doesn't have to parse one long,
// undifferentiated tab row. Every button still uses the same simple
// "switch-tab" click handler below.
var HERO_TABS = [
  { key: 'timeline', label: 'Timeline', icon: 'calendar' },
  { key: 'map', label: 'Map', icon: 'map' }
];

var TAB_GROUPS = [
  { label: 'Plan', tabs: [
    { key: 'destinations', label: 'Destinations', icon: 'pin' },
    { key: 'transport', label: 'Transport', icon: 'plane' },
    { key: 'accommodation', label: 'Accommodation', icon: 'bed' },
    { key: 'activities', label: 'Activities', icon: 'ticket' }
  ] },
  { label: 'People', tabs: [
    { key: 'companions', label: 'Companions', icon: 'companion' },
    { key: 'contacts', label: 'Contacts', icon: 'users' }
  ] },
  { label: 'Manage', tabs: [
    // Expenses is hidden for a scoped "user"/"viewer" grant because the
    // server strips it from their trip data; an empty financial tab would
    // be misleading rather than useful.
    { key: 'expenses', label: 'Expenses', icon: 'wallet' },
    { key: 'settings', label: 'Settings', icon: 'gear' }
  ] }
];

// The groups to actually show for THIS trip — full scope gets everything;
// scoped roles lose only Expenses. Settings stays visible because it still
// contains useful read-only trip information for them.
function tabGroupsForTrip(trip) {
  return TAB_GROUPS.map(function (group) {
    return {
      label: group.label,
      tabs: group.tabs.filter(function (tab) { return canFullyEditTrip(trip) || tab.key !== 'expenses'; })
    };
  }).filter(function (group) { return group.tabs.length > 0; });
}

function renderTripView() {
  var trip = currentTrip();
  if (!trip) { currentView = 'dashboard'; return renderDashboard(); }
  // A scoped role landing on a tab that's just been filtered out (e.g.
  // sessionStorage restored "expenses" from a previous, full-scope
  // account on this same browser) falls back to the Timeline rather
  // than rendering a panel for a tab that's no longer in the tab bar.
  if (currentTab === 'expenses' && !canFullyEditTrip(trip)) currentTab = 'timeline';
  var spend = tripSpend(trip);
  var status = tripStatus(trip);
  var heroHtml = HERO_TABS.map(function (t) {
    return '<button class="hero-btn ' + (currentTab === t.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + t.key + '">' +
      icon(t.icon) + t.label + '</button>';
  }).join('');
  var tabsHtml = tabGroupsForTrip(trip).map(function (group) {
    var buttons = group.tabs.map(function (t) {
      return '<button class="tab-btn ' + (currentTab === t.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + t.key + '">' +
        icon(t.icon) + t.label + '</button>';
    }).join('');
    return '<div class="tab-group"><div class="tab-group-label">' + esc(group.label) + '</div><div class="tab-group-tabs">' + buttons + '</div></div>';
  }).join('');
  var panel;
  switch (currentTab) {
    case 'destinations': panel = renderDestinationsTab(trip); break;
    case 'activities': panel = renderActivitiesTab(trip); break;
    case 'transport': panel = renderTransportTab(trip); break;
    case 'accommodation': panel = renderAccommodationTab(trip); break;
    case 'map': panel = renderMapTab(trip); break;
    case 'contacts': panel = renderContactsTab(trip); break;
    case 'companions': panel = renderCompanionsTab(trip); break;
    case 'expenses': panel = renderExpensesTab(trip); break;
    case 'settings': panel = renderSettingsTab(trip); break;
    default: panel = renderTimelineTab(trip);
  }
  var headerActions = canFullyEditTrip(trip)
    ? '<div class="card-actions">' +
        '<button class="btn btn-icon btn-ghost" data-action="edit-trip" data-id="' + trip.tripId + '" title="Edit trip">' + icon('edit') + '</button>' +
        '<button class="btn btn-icon btn-ghost" data-action="delete-trip" data-id="' + trip.tripId + '" title="Delete trip">' + icon('trash') + '</button>' +
      '</div>'
    : '';
  return (
    '<div class="trip-header">' +
      '<button class="back-link" data-action="back-to-dashboard">' + icon('back') + ' All trips</button>' +
      '<div class="trip-title-row">' +
        '<div><h1>' + esc(trip.name) + '</h1>' +
          '<div class="trip-meta">' +
            '<span>' + (trip.startDate ? formatDateShort(trip.startDate) : '?') + ' – ' + (trip.endDate ? formatDateShort(trip.endDate) : '?') + '</span>' +
            (canFullyEditTrip(trip) ? '<span><b>' + money(spend.known, trip.homeCurrency) + '</b> spent so far' +
              (spend.unknownCount ? ' · <button class="warn-link" data-action="switch-tab" data-tab="settings">' + spend.unknownCount + ' need an exchange rate</button>' : '') +
            '</span>' : '') +
          '</div>' +
        '</div>' +
        headerActions +
      '</div>' +
    '</div>' +
      '<div class="nav-group-label">View</div><div class="hero-row">' + heroHtml + '</div>' +
    '<div class="tabbar">' + tabsHtml + '</div>' +
    '<div>' + panel + '</div>'
  );
}

/* ---------- 14. Shared row-rendering helpers -------------------------- */

function copyBtn(value, label) {
  if (!value) return '';
  return '<button class="copy-btn" data-action="copy-text" data-value="' + esc(value) + '" title="Copy ' + esc(label) + '">' + icon('copy') + '</button>';
}

function mapsLink(address) {
  if (!address) return '';
  var url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">Open in Maps ' + icon('arrowRight') + '</a>';
}

function costTag(trip, amount, currency, rateOverride) {
  if (!amount) return '';
  var hv = homeValue(trip, amount, currency, rateOverride);
  var label = money(amount, currency);
  if (currency && currency !== trip.homeCurrency) {
    label += hv.known ? ' (≈ ' + money(hv.value, trip.homeCurrency) + ')' : ' (rate needed)';
  }
  return '<span class="tag tag-cost">' + icon('wallet') + label + '</span>';
}

// Edit/Delete buttons for one item row — which ones actually show up
// depends on this account's permission on `trip` (see the "Per-trip
// permissions" helpers near currentTrip() above). `taggable` should be
// true for the four per-companion-scoped item types (destination/
// activity/transport/accommodation), false for everything else
// (companion/contact/expense) — those aren't tagged to a companion at
// all, so a "user" grant never gets to edit them, only full-scope roles
// do. Returns '' (no actions block at all) if this account can't do
// anything to this particular row.
function rowActions(trip, section, item) {
  var taggable = ['destination', 'activity', 'transport', 'accommodation'].indexOf(section) !== -1;
  var canEdit = taggable ? canEditItem(trip, item) : canFullyEditTrip(trip);
  // Deleting is always full-scope-only — even a "user" grant, which CAN
  // edit their own tagged items, can never delete one (see
  // mergeUserScopedList() in src/worker.js, which silently keeps an item
  // even if it's missing from what they submit).
  var canDelete = canFullyEditTrip(trip);
  if (!canEdit && !canDelete) return '';
  var itemId = item[ENTITY_ID_FIELDS[section]];
  return '<div class="item-actions">' +
    (canEdit ? '<button class="btn btn-icon btn-ghost" data-action="edit-' + section + '" data-id="' + itemId + '" title="Edit">' + icon('edit') + '</button>' : '') +
    (canDelete ? '<button class="btn btn-icon btn-ghost" data-action="delete-' + section + '" data-id="' + itemId + '" title="Delete">' + icon('trash') + '</button>' : '') +
  '</div>';
}

// The "Add X" button/empty-state prompt: only ever shown to a full-scope
// role (Superuser/admin/uber) — a "user"/"viewer" grant can never create
// a new item of any kind, only edit ones already tagged to them (see
// canEditItem()'s comment).
function emptyTab(trip, iconName, title, body, addAction, addLabel) {
  return '<div class="empty-state">' + icon(iconName) + '<h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' +
    (canFullyEditTrip(trip) ? '<div style="margin-top:14px"><button class="btn btn-accent" data-action="' + addAction + '">' + icon('plus') + ' ' + esc(addLabel) + '</button></div>' : '') +
    '</div>';
}

function tabHead(trip, title, addAction, addLabel) {
  return '<div class="tab-panel-head"><h2>' + esc(title) + '</h2>' +
    (canFullyEditTrip(trip) ? '<button class="btn btn-accent" data-action="' + addAction + '">' + icon('plus') + ' ' + esc(addLabel) + '</button>' : '') +
    '</div>';
}

/* ---------- 15. Render: Destinations tab ------------------------------ */

function renderDestinationsTab(trip) {
  if (trip.destinations.length === 0) return emptyTab(trip, 'pin', 'No destinations yet', 'Add the places or areas you\'ll be based in — activities and accommodation can then be tagged to them.', 'new-destination', 'Add destination');
  var sorted = trip.destinations.slice().sort(function (a, b) { return (a.arriveDate || '') < (b.arriveDate || '') ? -1 : 1; });
  var rows = sorted.map(function (d) {
    var tzOffset = d.timezone ? tzOffsetLabel(d.timezone) : '';
    var tzTag = d.timezone ? '<span class="tag">' + icon('clock') + esc(d.timezone) + (tzOffset ? ' (' + esc(tzOffset) + ')' : '') + '</span>' : '';
    var destTags = tzTag + companionTags(trip, d.companions);
    return '<div class="item-row"><div class="item-icon">' + icon('pin') + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(d.name) + (d.country ? ', ' + esc(d.country) : '') + '</span></div>' +
      '<div class="item-sub">' + formatDateShort(d.arriveDate) + ' – ' + formatDateShort(d.departDate) + '</div>' +
      (destTags ? '<div class="item-tags">' + destTags + '</div>' : '') +
      (d.notes ? '<div class="item-sub">' + esc(d.notes) + '</div>' : '') +
      '</div>' + rowActions(trip, 'destination', d) + '</div>';
  }).join('');
  return tabHead(trip, 'Destinations', 'new-destination', 'Add destination') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 16. Render: Activities tab -------------------------------- */

function renderActivitiesTab(trip) {
  if (trip.activities.length === 0) return emptyTab(trip, 'ticket', 'No activities yet', 'Tours, museum visits, dinner reservations — anything with a date and time.', 'new-activity', 'Add activity');
  var sorted = trip.activities.slice().sort(function (a, b) { return ((a.date || '') + (a.startTime || '')) < ((b.date || '') + (b.startTime || '')) ? -1 : 1; });
  var rows = sorted.map(function (a) {
    var dest = a.destinationId ? byId(trip.destinations, a.destinationId, 'destinationId') : null;
    var contact = a.contactId ? byId(trip.contacts, a.contactId, 'contactId') : null;
    var tags = [];
    tags.push('<span class="tag">' + esc(a.category || 'Other') + '</span>');
    if (a.location) tags.push('<span class="tag">' + esc(a.location) + '</span>');
    if (dest) tags.push('<span class="tag">' + icon('pin') + esc(dest.name) + '</span>');
    if (a.bookingRef) tags.push('<span class="tag">' + icon('ticket') + esc(a.bookingRef) + copyBtn(a.bookingRef, 'booking ref') + '</span>');
    if (contact) tags.push('<span class="tag">' + icon('user') + esc(contact.name) + '</span>');
    if (a.costAmount) tags.push(costTag(trip, a.costAmount, a.costCurrency, a.costRate));
    if (a.companions && a.companions.length) tags.push(companionTags(trip, a.companions));
    return '<div class="item-row"><div class="item-icon">' + icon('ticket') + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(a.title) + '</span><span class="item-sub">' + formatDateShort(a.date) + (a.startTime ? ' · ' + a.startTime : '') + (a.endTime ? '–' + a.endTime : '') + '</span></div>' +
      (a.address ? '<div class="item-sub">' + esc(a.address) + ' ' + mapsLink(a.address) + '</div>' : '') +
      '<div class="item-tags">' + tags.join('') + '</div>' +
      (a.notes ? '<div class="item-sub" style="margin-top:6px">' + esc(a.notes) + '</div>' : '') +
      '</div>' + rowActions(trip, 'activity', a) + '</div>';
  }).join('');
  return tabHead(trip, 'Activities', 'new-activity', 'Add activity') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 17. Render: Transport tab ---------------------------------- */

function renderTransportTab(trip) {
  if (trip.transport.length === 0) return emptyTab(trip, 'plane', 'No transport legs yet', 'Flights, trains, buses, ferries or drives — each leg can span overnight, and will show up on both days in the Timeline.', 'new-transport', 'Add transport leg');
  var sorted = trip.transport.slice().sort(function (a, b) { return (a.departDateTime || '') < (b.departDateTime || '') ? -1 : 1; });
  var rows = sorted.map(function (t) {
    var contact = t.contactId ? byId(trip.contacts, t.contactId, 'contactId') : null;
    var overnight = dateOnly(t.departDateTime) !== dateOnly(t.arriveDateTime);
    var tags = [];
    if (t.carrier) tags.push('<span class="tag">' + esc(t.carrier) + '</span>');
    if (t.flightNumber) tags.push('<span class="tag">' + icon('plane') + esc(t.flightNumber) + copyBtn(t.flightNumber, 'flight number') + '</span>');
    if (t.licensePlate) tags.push('<span class="tag">' + esc(t.licensePlate) + '</span>');
    if (t.bookingRef) tags.push('<span class="tag">' + icon('ticket') + esc(t.bookingRef) + copyBtn(t.bookingRef, 'booking ref') + '</span>');
    if (contact) tags.push('<span class="tag">' + icon('user') + esc(contact.name) + '</span>');
    if (overnight) tags.push('<span class="tag">' + icon('moon') + 'Overnight</span>');
    if (t.costAmount) tags.push(costTag(trip, t.costAmount, t.costCurrency, t.costRate));
    if (t.pointsAmount) tags.push('<span class="tag">' + icon('star') + esc(t.pointsAmount) + (t.pointsProgram ? ' ' + esc(t.pointsProgram) : ' points') + '</span>');
    if (t.companions && t.companions.length) tags.push(companionTags(trip, t.companions));
    return '<div class="item-row"><div class="item-icon">' + icon(transportIconKey(t.mode)) + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(t.fromLocation) + ' ' + icon('arrowRight') + ' ' + esc(t.toLocation) + (t.flightNumber ? ' <span class="item-sub" style="display:inline">(' + esc(t.flightNumber) + ')</span>' : '') + '</span></div>' +
      '<div class="item-sub">' + formatDateShort(dateOnly(t.departDateTime)) + ' ' + timeOnly(t.departDateTime) +
        ' → ' + formatDateShort(dateOnly(t.arriveDateTime)) + ' ' + timeOnly(t.arriveDateTime) + '</div>' +
      '<div class="item-tags">' + tags.join('') + '</div>' +
      (t.notes ? '<div class="item-sub" style="margin-top:6px">' + esc(t.notes) + '</div>' : '') +
      '</div>' + rowActions(trip, 'transport', t) + '</div>';
  }).join('');
  return tabHead(trip, 'Transport', 'new-transport', 'Add transport leg') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 18. Render: Accommodation tab ------------------------------- */

function renderAccommodationTab(trip) {

    if (contact) tags.push('<span class="tag">' + icon('user') + esc(contact.name) + '</span>');
    if (ac.costAmount) tags.push(costTag(trip, ac.costAmount, ac.costCurrency, ac.costRate));
    if (ac.companions && ac.companions.length) tags.push(companionTags(trip, ac.companions));
