// Returns the icon key that best represents a transport mode, so the
// timeline and transport list show a plane for flights, a train icon
// for trains, and so on.
function transportIconKey(mode) {
  var m = (mode || '').toLowerCase();
  if (m === 'flight') return 'plane';
  if (m === 'train') return 'train';
  if (m === 'bus') return 'bus';
  if (m === 'car') return 'car';
  if (m === 'ferry') return 'ferry';
  return 'arrowRight';
}

// One-line label for a transport leg, e.g. "Flight BA15: LHR → HND" or
// plain "Car: Hotel → Airport" for modes with no flight number. Shared
// by the Transport tab, the Timeline and the expense ledger so the
// same leg always reads the same way everywhere.
function transportLabel(t) {
  return (t.mode || 'Transport') + (t.flightNumber ? ' ' + t.flightNumber : '') + ': ' + t.fromLocation + ' → ' + t.toLocation;
}

function icon(name, extraClass) {
  var body = ICONS[name] || ICONS.pin;
  return '<svg class="icon ' + (extraClass || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
}

/* ---------- 3b. Avatars (Companions/Avatars feature) ------------------
   One small helper, used everywhere a companion or account's marker
   needs to be drawn: item rows, trip cards, the timeline, and the
   tag-picker (see companionTags()/renderTripCardAvatars()/eventRowHtml()/
   the 'tag-picker' case in fieldHtml() further down). The actual
   resolution — which companion gets an animal vs. a smiley, and which
   colour/animal that is — always happens server-side (see
   resolveCompanionAvatars() in src/worker.js and the `companionAvatars`
   map on every trip this page ever receives); this function's only job
   is turning that already-resolved `{ type, color, animal }` into HTML,
   through avatarColorHex()/avatarAnimalEmoji() (data/avatars.js) so a
   colour/animal token NEVER gets written straight into a `style`
   attribute — see that file's own comment for why that specifically
   matters (a CSS-injection-style risk if a stored value were ever
   trusted directly). `name` is always shown as a title/tooltip — colour
   (or even the animal) alone should never be the only thing telling two
   people apart. */
function avatarMarkerHtml(avatar, name, extraClass) {
  if (!avatar) return '';
  var title = ' title="' + esc(name || '') + '" aria-label="' + esc(name || '') + '"';
  if (avatar.type === 'account') {
    var bg = avatarColorHex(avatar.color) || AVATAR_GREY_HEX;
    var glyph = avatarAnimalEmoji(avatar.animal) || '';
    return '<span class="avatar-marker ' + (extraClass || '') + '" style="background:' + bg + '"' + title + '>' + glyph + '</span>';
  }
  // Non-account companion: fixed grey circle (never a choice — see
  // AVATAR_GREY_HEX's own comment), coloured smiley per whoever added
  // them.
  var smileyHex = avatarColorHex(avatar.color) || '#6b7280';
  return '<span class="avatar-marker ' + (extraClass || '') + '" style="background:' + AVATAR_GREY_HEX + '"' + title + '>' +
    '<span class="avatar-marker-smiley" style="color:' + smileyHex + '">☺</span></span>';
}

// Looks up companion `companionId`'s resolved marker on `trip` and draws
// it via avatarMarkerHtml() above, paired with their name. Returns '' if
// the trip has no resolved avatar for that id at all (shouldn't happen
// for a real companion — every one gets an entry, even before anyone's
// picked anything, thanks to the deterministic default — but a
// dangling/removed companion id, same as everywhere else in this file,
// degrades to "nothing shown" rather than an error).
function companionAvatarHtml(trip, companionId, name) {
  var avatar = trip.companionAvatars && trip.companionAvatars[companionId];
  return avatarMarkerHtml(avatar, name);
}

// Dashboard trip cards: "who's on this trip at a glance" (plan §5's last
// placement). Deliberately bare markers with NO '.tag' pill around them
// (unlike companionTags() above) — a trip card is already dense with the
// name/dates/status/stats, so this renders as a plain row of small circles
// wrapped in .avatar-row rather than the larger .item-tags pill treatment
// used inside a trip's own tabs. Capped at MAX_CARD_AVATARS so a trip with
// a long companion list still fits on one card; any overflow collapses
// into a single "+N" bubble (title lists the remaining names) rather than
// wrapping the card onto extra lines. Every account and viewer role sees
// this (trip.companions/companionAvatars are already scoped/stripped
// server-side per buildVisibleTrip(), same as everywhere else avatars are
// drawn), so there's nothing extra to permission-check here.
var MAX_CARD_AVATARS = 6;
function tripCardAvatarsHtml(trip) {
  var companions = trip.companions || [];
  if (companions.length === 0) return '';
  var shown = companions.slice(0, MAX_CARD_AVATARS);
  var overflow = companions.length - shown.length;
  var html = shown.map(function (c) { return companionAvatarHtml(trip, c.companionId, c.name); }).join('');
  if (overflow > 0) {
    var remainingNames = companions.slice(MAX_CARD_AVATARS).map(function (c) { return c.name; }).join(', ');
    html += '<span class="avatar-marker avatar-marker-overflow" title="' + esc(remainingNames) + '">+' + overflow + '</span>';
  }
  return '<div class="avatar-row trip-card-avatars">' + html + '</div>';
}

/* ---------- 4. Application state & persistence --------------------
   `state` holds every trip and is the single source of truth for
   everything on screen. `currentView` / `currentTripId` / `currentTab`
   track where the viewer is right now (dashboard vs. a trip, which
   tab) — that's per-viewer navigation, not trip data, so it is kept
   out of `state` and never saved into the page. */

var state = { trips: [] };
var currentView = 'dashboard';
var currentTripId = null;
var currentTab = 'timeline';

// ---- Accounts / login (see section 4b, "Auth", further down) ----------
// `currentUser` is null until checkAuth() resolves at boot, and stays
// null for the whole session if nobody's logged in — in that state
// renderBoot() shows the login screen instead of any trip data at all.
// { id, username, isUberUser } once set. There's deliberately no global
// "role" here anymore — what an account can do is entirely PER TRIP now
// (see each trip's own `myGrant`, annotated by the server — src/worker.js's
// buildResponseState() — and the canFullyEditTrip()/canEditItem() helpers
// further down). `isUberUser` is the one exception: it's this account's
// own flag, returned only in responses that describe the CALLER's own
// account (login/whoami/setup), never anywhere that describes OTHER
// accounts — see the "undisclosed" explanation in src/worker.js. It's
// used only to decide whether to show the "Manage accounts" button.
var currentUser = null;
// Set by checkAuth() from the whoami response: true only when NO
// accounts exist yet anywhere, meaning the login screen should offer
// first-run setup (create the site owner's own account) instead of an
// ordinary username/password form. See renderAuthScreen().
var setupNeeded = false;
// The account list as last fetched for the "Manage accounts" screen
// (site owner / uber-user only) — see
// loadAndRenderManageUsers()/renderManageUsersView().
var managedUsers = [];

// Self-hosted version: state no longer lives inside the page's own HTML
// (that was the Claude Artifact "publish" trick). Instead, the very
// first thing this page does (see the init() function at the bottom of
// this file) is fetch() the saved data from our own tiny JSON API,
// which is backed by Cloudflare KV (see src/worker.js in this repo).
// This function does the fetching and always resolves to a valid
// { trips: [...] } object, even if the request fails, so the rest of
// the app never has to worry about a missing or malformed response.
// True only while `state` is known to be a faithful copy of what the
// server actually holds. Set to false the moment a load fails, which is
// what stops persist() (below) from ever saving over real data with a
// state that was never really loaded.
//
// WHY THIS EXISTS — this is the most dangerous failure mode this whole
// app has. A trip is deleted by being LEFT OUT of what the browser sends
// back (there's no separate delete endpoint — see "SAVING SAFELY" in
// src/worker.js). So if a load fails and we fall back to "no trips at
// all", the very next edit would POST an empty list and the server would
// read that as "delete everything this account can see". For the site
// owner's account, which can see EVERY trip, that's the entire site's
// data gone, from one failed request and one subsequent click. The
// server refuses a save that would delete more than one trip at once as
// its own backstop, but the browser shouldn't be sending it in the first
// place.
var stateIsTrustworthy = false;

async function loadInitialState() {
  try {
    var res = await fetch('/WayPoint/api/data', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('Server responded with status ' + res.status);
    var parsed = await res.json();
    if (!parsed || typeof parsed !== 'object') parsed = {};
    if (!parsed.trips) parsed.trips = [];
    stateIsTrustworthy = true;
    return parsed;
  } catch (e) {
    console.error('Waypoint: could not load saved data from the server', e);
    stateIsTrustworthy = false;
    showToastSafe('Could not load your trips. Your data is safe on the server, but this page can\'t show it — refresh to try again. Editing is turned off until then, so nothing here can overwrite it.');
    return { trips: [] };
  }
}

// showToast() itself isn't defined yet at the point loadInitialState()
// first runs (script order), and toast-root may not exist yet either if
// something goes very wrong very early — this tiny wrapper just makes
// sure a failed load never throws a *second*, more confusing error on
// top of the first one.
function showToastSafe(message) {
  try { showToast(message); } catch (e) { console.error(message); }
}


function setSaveStatus(kind, message) {
  var el = document.getElementById('save-indicator');
  if (!el) return;
  el.dataset.kind = kind;
  var labels = { saving: 'Saving…', saved: 'Saved', error: message || 'Save failed', readonly: 'Read-only', unsaved: message || 'Not saved' };
  el.textContent = labels[kind] || '';
}

// Every mutation in the app goes through here: `mutator` receives a
// deep clone of the current state and edits it in place (push into an
// array, change a field, etc). We then hand that clone to persist(),
// which saves it to the server (see below). Using a clone means a save
// that fails partway through never leaves the on-screen state
// half-changed.
function updateState(mutator) {
  var next = cloneState(state);
  mutator(next);
  persist(next);
}

// Every mutation in the app goes through updateState() -> persist():
// updateState() hands persist() a full, already-mutated copy of the
// trips data, and persist() is the only place that talks to the
// network. It (a) swaps it in as the live `state`, (b) re-renders
// immediately so the UI feels instant, and (c) saves it to the server
// in the background, updating the little "Saved" / "Saving…" label in
// the top bar so you can always tell whether your last change actually
// made it to the server.
// Save queue. Only ever ONE POST to /api/data is in flight at a time,
// and if more edits happen while one is running, only the newest state
// is sent afterwards (intermediate ones are already superseded by it —
// every POST carries the whole picture, not a diff).
//
// Two real problems this avoids. First, ordering: two overlapping saves
// can finish in either order, so without this an older state could land
// last and quietly undo the newer edit. Second, and worse: deleting two
// trips in quick succession used to put two requests in flight whose
// bodies BOTH omitted the second trip, which the server (rightly) treats
// as a suspicious multi-trip deletion and rejects outright.
var saveInFlight = false;
var pendingSaveState = null;
var lastSaveStartedAt = 0;
var MIN_SAVE_INTERVAL_MS = 1100;

function waitMs(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

async function persist(newState) {
  state = newState;
  try {
    sessionStorage.setItem('waypoint-nav', JSON.stringify({ view: currentView, tripId: currentTripId, tab: currentTab }));
  } catch (e) { /* sessionStorage may be unavailable in some browsers/private modes; nav just won't be restored */ }

  render();

  // See stateIsTrustworthy's comment above: refuse to save at all rather
  // than risk writing a state we never successfully loaded over real
  // data. The edit stays on screen so nothing typed is lost visually,
  // but it is NOT saved, and the indicator says so plainly.
  if (!stateIsTrustworthy) {
    setSaveStatus('unsaved', 'Not saved — refresh');
    showToast('This change was NOT saved. This page couldn\'t load your trips from the server, so it won\'t write anything back over them. Refresh the page, then make the change again.');
    return;
  }

  if (saveInFlight) { pendingSaveState = state; return; }
  sendSave(state);
}

// The actual network half of persist(), split out so that draining the
// queue below doesn't re-run persist()'s render() — re-rendering for a
// save that changed nothing on screen would, among other things, tear
// down and rebuild the Leaflet map mid-view (see render()).
async function sendSave(toSave) {
  saveInFlight = true;
  setSaveStatus('saving');
  try {
    // Cloudflare KV permits only one write per second to a given key. The
    // queue already prevents overlap; this spacing also prevents the next
    // queued snapshot from immediately following the previous request.
    var spacing = MIN_SAVE_INTERVAL_MS - (Date.now() - lastSaveStartedAt);
    if (spacing > 0) await waitMs(spacing);

    var res;
    for (var attempt = 0; attempt < 3; attempt++) {
      lastSaveStartedAt = Date.now();
      res = await fetch('/WayPoint/api/data', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toSave)
      });
      if (res.status !== 429 || attempt === 2) break;
      var retryAfter = Number(res.headers.get('Retry-After')) || Math.pow(2, attempt + 1);
      await waitMs(Math.min(retryAfter * 1000, 8000));
    }
    if (!res.ok) {
      // The server sends a human-readable explanation for a refused save
      // (e.g. the multi-trip-deletion guard) — show that rather than a
      // bare status code, since it tells the person what to actually do.
      var body = await res.json().catch(function () { return {}; });
      throw new Error(body.error || ('Server responded with status ' + res.status));
    }
    var savedBody = await res.json().catch(function () { return {}; });
    var revisions = savedBody.revisions || {};
    [state, pendingSaveState, toSave].forEach(function (snapshot) {
      if (!snapshot || !Array.isArray(snapshot.trips)) return;
      snapshot.trips.forEach(function (trip) {
        if (Object.prototype.hasOwnProperty.call(revisions, trip.tripId)) trip.revision = revisions[trip.tripId];
      });
    });
    setSaveStatus('saved');
  } catch (err) {
    console.error('Waypoint: save failed', err);
    setSaveStatus('error', 'Could not save');
    showToast('Could not save your change: ' + (err && err.message ? err.message : 'unknown error'));
  } finally {
    saveInFlight = false;
    if (pendingSaveState) {
      var queued = pendingSaveState;
      pendingSaveState = null;
      sendSave(queued);
    }
  }
}

/* ---------- 4b. Auth: login / setup / logout / per-trip permissions ---
   Everything about WHO is using the app right now, as opposed to WHAT
   trip data they're looking at (that's `state`, above). See the big
   comment at the top of src/worker.js for the server side of all of
   this — this section is just the frontend's half: show a login screen
   when there's no session, and remember who's logged in once there is
   one. What that account can actually DO is decided per trip (and, for
   a "user" grant, per item) — see canFullyEditTrip()/canEditItem() near
   currentTrip() further down, not anything in this section. */

// Asks the server "is there a valid session on this browser right now,
// and if so who?" — always resolves (never throws), leaving currentUser
// null on any failure so the rest of the app safely falls back to
// showing the login screen rather than a half-broken page.
async function checkAuth() {
  try {
    var res = await fetch('/WayPoint/api/whoami', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    var body = await res.json();
    if (body && body.loggedIn) {
      currentUser = { id: body.id, username: body.username, isUberUser: !!body.isUberUser, avatar: body.avatar || null };
    } else {
      currentUser = null;
      setupNeeded = !!(body && body.setupNeeded);
    }
  } catch (err) {
    currentUser = null;
  }
}

// Keeps the topbar's "who's logged in" area in sync with `currentUser`.
// Called any time currentUser changes (after checkAuth(), after a
// successful login/setup, after logout). There's no global read-only
// styling to apply here anymore — see the big CSS comment near
// .account-bar for why permissions moved from "one global role" to "per
// trip", which every trip/item-level render now checks for itself.
function applyAuthUI() {
  var el = document.getElementById('account-bar');
  if (!el) return;
  if (!currentUser) { el.innerHTML = ''; return; }
  // The avatar swatch itself IS the "change your avatar" control -- a
  // single clickable button showing your current colour+animal, rather
  // than a separate "Edit avatar" link next to a static preview. See
  // openAvatarPicker() for the modal it opens. currentUser.avatar is
  // always a real {color,animal} pair once logged in -- resolveAccountAvatar()
  // on the server never sends back nothing, even before you've picked one
  // yourself (see that function's own comment in src/worker.js) -- so
  // there's no "avatar not set yet" case to special-case here.
  el.innerHTML =
    '<button class="account-avatar-btn" data-action="open-avatar-picker" title="Change your avatar">' +
      avatarMarkerHtml(currentUser.avatar ? { type: 'account', color: currentUser.avatar.color, animal: currentUser.avatar.animal } : null, currentUser.username) +
      '<span class="account-label" style="margin-right:0">' + esc(currentUser.username) + '</span>' +
    '</button>' +
    (currentUser.isUberUser ? '<button class="btn btn-ghost" data-action="open-manage-users">Manage accounts</button>' : '') +
    '<button class="btn btn-ghost" data-action="logout">Log out</button>';
}

// Builds the login screen (or, if no account exists anywhere yet, the
// one-time "set up your Admin account" screen instead — see setupNeeded,
// set by checkAuth() from the whoami response). `errorMessage`, when
// given, is shown above the form — e.g. "Incorrect username or password."
// after a failed attempt.
function renderAuthScreen(errorMessage) {
  var errorHtml = errorMessage ? '<p class="auth-error">' + esc(errorMessage) + '</p>' : '';
  if (setupNeeded) {
    return '<div class="auth-screen"><div class="auth-card">' +
      '<h1>Set up Waypoint</h1>' +
      '<p class="field-hint">No accounts exist yet — create your own account to get started. It becomes the site owner\'s account, with full access to everything. You\'ll need the setup key (the <code>WAYPOINT_PASSWORD</code> secret set in the Cloudflare dashboard when this was first deployed).</p>' +
      errorHtml +
      '<form id="setup-form">' +
        '<div class="field"><label>Setup key</label><input type="password" name="setupKey" required autocomplete="off"></div>' +
        '<div class="field"><label>Choose a username</label><input type="text" name="username" required autocomplete="username"></div>' +
        '<div class="field"><label>Choose a password</label><input type="password" name="password" required autocomplete="new-password"><div class="field-hint">At least 8 characters.</div></div>' +
        '<button type="submit" class="btn btn-primary" style="width:100%">Create account</button>' +
      '</form>' +
    '</div></div>';
  }
  return '<div class="auth-screen"><div class="auth-card">' +
    '<h1>Log in to Waypoint</h1>' +
    errorHtml +
    '<form id="login-form">' +
      '<div class="field"><label>Username</label><input type="text" name="username" required autocomplete="username"></div>' +
      '<div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>' +
      '<button type="submit" class="btn btn-primary" style="width:100%">Log in</button>' +
    '</form>' +
    '<p class="field-hint" style="margin-top:14px">Don\'t have an account? Ask the site owner to set one up for you.</p>' +
  '</div></div>';
}

// Shared by both the login form and the first-run setup form (see the
// 'login-form'/'setup-form' branches in the submit listener further
// down) — POSTs credentials to whichever endpoint, and either lands in
// the app (on success) or re-shows the same screen with an error message
// (on failure) rather than leaving the form silently stuck.
async function submitAuthForm(url, payload) {
  try {
    var res = await fetch(url, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      document.getElementById('app').innerHTML = renderAuthScreen(body.error || 'Something went wrong — try again.');
      return;
    }
    currentUser = { id: body.id, username: body.username, isUberUser: !!body.isUberUser, avatar: body.avatar || null };
    clearSavedNav();
    await renderBoot();
  } catch (err) {
    document.getElementById('app').innerHTML = renderAuthScreen('Could not reach the server — check your connection and try again.');
  }
}

// Forgets "which trip/tab was last open" (see persist()'s own
// sessionStorage.setItem, and renderBoot()'s read of it) whenever the
// logged-in account changes — on the app's very first login, and again
// on every subsequent login/logout. Without this, logging out of one
// account and straight into a DIFFERENT one on the same browser tab
// (the exact scenario a shared family device makes routine — see the
// "Proper login page" choice in the big auth comment above) could land
// the new account inside whatever trip the PREVIOUS account happened to
// be viewing, rather than starting fresh at the dashboard — a real bug
// this project's own tests caught (see test-auth-roles.js).
function clearSavedNav() {
  try { sessionStorage.removeItem('waypoint-nav'); } catch (e) { /* sessionStorage may be unavailable */ }
}

async function doLogout() {
  try {
    await fetch('/WayPoint/api/logout', { method: 'POST', credentials: 'same-origin' });
  } catch (err) {
    // Worst case the server-side cookie check still thinks we're logged
    // in until it expires — but we still drop back to the login screen
    // client-side either way, and every real data endpoint re-checks
    // the session itself regardless of what this page believes.
  }
  state = { trips: [] };
  currentView = 'dashboard'; currentTripId = null; currentTab = 'timeline';
  clearSavedNav();
  // Re-run checkAuth() (rather than just setting currentUser = null
  // directly) so setupNeeded gets refreshed too — without this, logging
  // out after the very first-ever setup would show the SETUP screen
  // again instead of an ordinary login form, because setupNeeded was
  // last computed back when no account existed yet at all.
  await checkAuth();
  await renderBoot();
}

// The single entry point that decides what the page actually shows:
// the login/setup screen (no session), or the normal app (a valid one).
// Called once at boot (see init() at the bottom of this file) and again
// after every login/setup/logout, so it's always this function — never
// render() directly — that's responsible for that top-level decision.
async function renderBoot() {
  applyAuthUI();
  if (!currentUser) {
    document.getElementById('app').innerHTML = renderAuthScreen();
    return;
  }
  state = await loadInitialState();
  try {
    var nav = JSON.parse(sessionStorage.getItem('waypoint-nav') || 'null');
    if (nav && nav.view === 'trip' && byId(state.trips, nav.tripId, 'tripId')) {
      currentView = 'trip'; currentTripId = nav.tripId; currentTab = nav.tab || 'timeline';
    }
  } catch (e) { /* ignore malformed/unavailable sessionStorage */ }
  render();
}

/* ---------- 4c. Manage accounts (site owner / uber-user only) ---------
   A trip-agnostic screen (currentView === 'manage-users') for creating,
   renaming, resetting the password of, and deleting LOGINS. Deliberately
   minimal now that permissions live on trips, not accounts (see the big
   comment near currentTrip() further down) — this screen no longer has
   anything to do with roles or which trips someone can see; that's
   entirely up to each trip's own Superuser (or Admin) now, via that
   trip's own Companions tab (see openCompanionLinkForm()/
   openAddLinkedCompanionForm() further down). Reached via
   the "Manage accounts" button in the topbar (see applyAuthUI()), which
   only ever appears for the account that's actually the uber-user — the
   server enforces the same rule independently (see src/worker.js's
   /api/users routes), so this isn't the only thing stopping anyone else
   from reaching it, just the normal way in. */

async function loadAndRenderManageUsers() {
  currentView = 'manage-users';
  try {
    var res = await fetch('/WayPoint/api/users', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    var body = await res.json();
    managedUsers = (body && body.users) || [];
  } catch (err) {
    managedUsers = [];
    showToastSafe('Could not load accounts.');
  }
  render();
}

function renderManageUsersView() {
  var rows = managedUsers.slice().sort(function (a, b) { return a.username.localeCompare(b.username); }).map(function (u) {
    return '<div class="item-row"><div class="item-icon">' + icon('user') + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(u.username) + '</span></div>' +
      '</div><div class="item-actions">' +
        '<button class="btn btn-icon btn-ghost" data-action="edit-user" data-id="' + u.id + '" title="Edit">' + icon('edit') + '</button>' +
        '<button class="btn btn-icon btn-ghost" data-action="delete-user" data-id="' + u.id + '" title="Delete">' + icon('trash') + '</button>' +
      '</div></div>';
  }).join('');
  return '<button class="back-link" data-action="back-to-dashboard">' + icon('back') + ' All trips</button>' +
    '<div class="tab-panel-head"><h2>Manage accounts</h2>' +
      '<button class="btn btn-accent" data-action="new-user">' + icon('plus') + ' Add account</button></div>' +
    '<p class="field-hint" style="margin-bottom:16px">You set every account\'s username and password yourself and share it with them directly — there\'s no self-signup or "forgot password" flow. Creating an account here just gives someone a login; it doesn\'t give them access to any trip. Whoever creates a trip becomes that trip\'s owner, and can then share it with any of these accounts from that trip\'s own Settings tab.</p>' +
    (managedUsers.length ? '<div class="item-list">' + rows + '</div>' : '<p class="field-hint">No accounts yet.</p>');
}

// Opens the Add/Edit account modal. Built directly (rather than through
// the openForm()/fieldHtml() system every OTHER form in this app uses)
// since it's such a small, fixed shape that pulling in the generic
// machinery wouldn't save anything. Uses the same visual chrome (.modal,
// .field, .btn classes) by hand instead, so it still looks identical to
// every other modal in the app.
function openUserForm(existing) {
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>' + (existing ? 'Edit account' : 'Add account') + '</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('close') + '</button></div>' +
        '<form id="user-form" data-existing-id="' + (existing ? esc(existing.id) : '') + '">' +
          '<div class="modal-body">' +
            '<div class="field"><label>Username</label><input type="text" name="username" value="' + esc(existing ? existing.username : '') + '" required></div>' +
            '<div class="field"><label>' + (existing ? 'New password' : 'Password') + '</label>' +
              '<input type="password" name="password" autocomplete="new-password" placeholder="' + (existing ? 'Leave blank to keep the current password' : 'At least 8 characters') + '">' +
              (existing ? '' : '<div class="field-hint">You set this directly and share it with them — there\'s no self-signup or "forgot password" flow.</div>') +
            '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Save</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
}

async function saveUserAccount(payload) {
  try {
    var res = await fetch('/WayPoint/api/users', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) { showToast(body.error || 'Could not save that account.'); return; }
    closeModal();
    showToast('Account saved');
    await loadAndRenderManageUsers();
  } catch (err) {
    showToast('Could not save that account — check your connection and try again.');
  }
}

function deleteUserAccount(id) {
  var u = managedUsers.find(function (x) { return x.id === id; });
  if (!u) return;
  openConfirm({
    title: 'Delete this account?', message: 'This deletes the login for "' + u.username + '". This can\'t be undone.', confirmLabel: 'Delete',
    onConfirm: async function () {
      try {
        var res = await fetch('/WayPoint/api/users/delete', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        });
        var body = await res.json().catch(function () { return {}; });
        if (!res.ok) { showToast(body.error || 'Could not delete that account.'); return; }
        showToast('Account deleted');
        await loadAndRenderManageUsers();
      } catch (err) {
        showToast('Could not delete that account — check your connection and try again.');
      }
    }
  });
}

/* ---------- 5. Toast & confirm dialog ------------------------------ */

function showToast(message) {
  var root = document.getElementById('toast-root');
  var div = document.createElement('div');
  div.className = 'toast';
  div.textContent = message;
  root.appendChild(div);
  requestAnimationFrame(function () { div.classList.add('show'); });
  setTimeout(function () {
    div.classList.remove('show');
    setTimeout(function () { div.remove(); }, 250);
  }, 3200);
}

var pendingConfirm = null;

function openConfirm(opts) {
  pendingConfirm = opts.onConfirm;
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>' + esc(opts.title || 'Are you sure?') + '</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('close') + '</button></div>' +
        '<div class="modal-body"><p class="confirm-text">' + esc(opts.message) + '</p></div>' +
        '<div class="modal-foot">' +
          '<button class="btn" data-action="close-modal">Cancel</button>' +
          '<button class="btn btn-danger" data-action="confirm-yes">' + esc(opts.confirmLabel || 'Delete') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  window.__formConfig = null;
  pendingConfirm = null;
}

/* ---------- 6. Generic form-field schemas & modal builder ----------
   Rather than hand-writing six near-identical forms, every entity
   (trip, destination, activity, transport, accommodation, contact,
   expense) describes its fields as a small array. fieldHtml() turns
   one field description into the right input, and openForm() wires
   the whole array up into a modal with Cancel/Save buttons. */

// Shared markup for every field with app-rendered suggestions
// (currency, country, city, timezone, airport) — see the "Generic
// suggestion dropdown" section further down for the JS that actually
// drives it. `suggestType` names one of SUGGEST_SOURCES' keys, written
// as `data-suggest-type` so the generic event listeners know which
// search/display functions to use without caring which specific field
// this is. `extraAttrs` is a raw attribute string for whatever a given
// field type needs beyond the basics (maxlength, uppercase styling,
// ...); `placeholderFallback` is used only when the field itself
// didn't specify one.
// Reads a 'tag-picker' field's selections back out of a submitted form's
// values object. A tag-picker renders one checkbox per companion, each
// with its OWN unique name ("<field.key>__<companionId>") rather than
// several checkboxes sharing one name — see the 'tag-picker' case in
// fieldHtml() below for exactly why (currentFormValues()'s handling of
// repeated names is the short version). This is the matching read-back
// half: it scans every key in `values` for that "<key>__" prefix and
// pulls the companion id back out of whichever ones were checked.
function readTagPicker(values, key) {
  var prefix = key + '__';
  var ids = [];
  for (var k in values) {
    if (Object.prototype.hasOwnProperty.call(values, k) && k.indexOf(prefix) === 0 && values[k]) {
      ids.push(k.slice(prefix.length));
    }
  }
  return ids;
}

// Returns a shallow copy of `fields` with its 'tag-picker' field (if it
// has one) marked `locked: true` — see fieldHtml()'s 'tag-picker' case
// for what that actually does (disables the checkboxes, adds an
// explanatory hint). Used whenever an item's edit form is opened by a
// "user" grant editing one of their own tagged items: they can change
// that item's OTHER fields, but never retag it — the Worker's
// mergeUserScopedList() (src/worker.js) silently keeps the stored tags
// no matter what a submitted form claims anyway, so this is just making
// the UI honest about that rather than showing a control that wouldn't
// do anything. `fields` may itself be a function (e.g. Transport's
// mode-dependent field list) — this wraps it transparently either way.
function fieldsWithTagPickerLock(fields, locked) {
  if (!locked) return fields;
  var lockOne = function (list) {
    return list.map(function (f) { return f.type === 'tag-picker' ? Object.assign({}, f, { locked: true }) : f; });
  };
  return (typeof fields === 'function') ? function (values) { return lockOne(fields(values)); } : lockOne(fields);
}

function sectionsWithTagPickerLock(sections, locked) {
  if (!locked) return sections;
  return sections.map(function (section) {
    return Object.assign({}, section, { fields: fieldsWithTagPickerLock(section.fields, true) });
  });
}

function suggestInputHtml(field, val, req, suggestType, extraAttrs, placeholderFallback) {
  var placeholder = field.placeholder || placeholderFallback || '';
  return '<div class="suggest-input-wrap">' +
    '<input type="text" autocomplete="off" data-suggest-type="' + suggestType + '" ' + (extraAttrs || '') +
    ' name="' + field.key + '" value="' + esc(val) + '" ' + req +
    ' placeholder="' + esc(placeholder) + '">' +
    '<div class="suggest-list" id="' + field.key + '-suggest"></div>' +
    '</div>';
}

// One shared location control used by destinations, activities, stays and
// both transport endpoints. The parent form chooses its query field and a
// prefix for the normalized hidden values; the interaction itself stays the
// same everywhere, including local airport and manual-pin paths.
function locationPickerHtml(field, val, req, trip, allValues) {
  var prefix = field.locationPrefix;
  var values = allValues || {};
  var lat = values[prefix + 'Lat'];
  var lng = values[prefix + 'Lng'];
  var method = values[prefix + 'LocationMethod'] || '';
  var stale = values[prefix + 'LocationStale'] === true || values[prefix + 'LocationStale'] === 'true';
  var mapped = lat !== '' && lat !== undefined && lat !== null && lng !== '' && lng !== undefined && lng !== null;
  var summary = mapped
    ? '<div class="location-selected' + (stale ? ' is-stale' : '') + '" data-location-summary>' +
        '<span class="location-selected-status">' + (stale ? 'Location may not match' : (method === 'manual' ? 'Manual pin' : 'Mapped')) + '</span>' +
        '<span>' + esc(field.summaryLabel || '') + '</span></div>'
    : '<div class="location-selected" data-location-summary hidden><span class="location-selected-status"></span><span></span></div>';
  var hidden = [
    [prefix + 'Lat', lat], [prefix + 'Lng', lng], [prefix + 'LocationRef', values[prefix + 'LocationRef'] || ''],
    [prefix + 'LocationMethod', method], [prefix + 'LocationGranularity', values[prefix + 'LocationGranularity'] || ''],
    [prefix + 'LocationStale', stale ? 'true' : 'false'], [prefix + 'LocationKindLabel', values[prefix + 'LocationKindLabel'] || '']
  ];
  if (field.boundaryPrefix) {
    hidden.push([field.boundaryPrefix + 'Ref', values[field.boundaryPrefix + 'Ref'] || '']);
    hidden.push([field.boundaryPrefix + 'Quality', values[field.boundaryPrefix + 'Quality'] || '']);
    var boundaryBbox = values[field.boundaryPrefix + 'Bbox'];
    hidden.push([field.boundaryPrefix + 'Bbox', boundaryBbox ? (typeof boundaryBbox === 'string' ? boundaryBbox : JSON.stringify(boundaryBbox)) : '']);
  }
  if (field.addressKey) hidden.push([field.addressKey, values[field.addressKey] || '']);
  var hiddenHtml = hidden.map(function (pair) { return '<input type="hidden" name="' + esc(pair[0]) + '" value="' + esc(pair[1]) + '">'; }).join('');
  return '<div class="location-picker" data-location-picker data-location-prefix="' + esc(prefix) + '" data-location-context="' + esc(field.locationContext) + '" data-location-kind="' + esc(field.locationKind || 'point') + '"' +
    (field.addressKey ? ' data-location-address-key="' + esc(field.addressKey) + '"' : '') +
    (field.locationValue ? ' data-location-value="' + esc(field.locationValue) + '"' : '') +
    (field.countryKey ? ' data-location-country-key="' + esc(field.countryKey) + '"' : '') +
    (field.boundaryPrefix ? ' data-boundary-prefix="' + esc(field.boundaryPrefix) + '"' : '') + '>' +
    '<div class="location-picker-row"><input type="text" autocomplete="off" name="' + field.key + '" value="' + esc(val) + '" ' + req + ' placeholder="' + esc(field.placeholder || '') + '" data-location-query>' +
    '<button type="button" class="btn" data-action="search-location">Find location</button></div>' +
    hiddenHtml + '<div class="location-results" data-location-results hidden role="listbox"></div>' + summary +
    '<div class="location-picker-actions"><button type="button" class="btn btn-ghost" data-action="use-typed-location">Use typed location</button>' +
    '<button type="button" class="btn btn-ghost" data-action="set-location-pin">Set pin manually</button>' +
    (mapped ? '<button type="button" class="btn btn-ghost" data-action="preview-location">View on map</button>' : '') + '</div>' +
    '<div class="location-pin-map" data-location-pin-map></div><div class="field-hint" data-location-hint></div></div>';
}

function fieldHtml(field, value, trip, allValues) {
  // allValues (optional): every value currently in the form (initial
  // values, or the live values on a reactive re-render — see
  // fieldsHtml() below), so a field can peek at a sibling field's
  // value while building its own HTML. Only the 'flight-lookup' case
  // uses this today (to default its date input from "Depart date").
  var val = (value === undefined || value === null) ? '' : value;
  var req = field.required ? 'required' : '';
  var full = field.wide ? 'style="grid-column:1/-1"' : '';

  // Rendered separately from every other type below: a checkbox reads
  // naturally with its label right next to it on one line ("[x] Use a
  // different exchange rate for this leg"), not the standard pattern
  // of a block label sitting above the input. Always full-width (see
  // callers, which mark every checkbox field `wide: true`) so it never
  // gets paired into a two-column row next to an unrelated field.
  if (field.type === 'checkbox') {
    return '<div class="field" ' + full + '><label class="checkbox-field">' +
      '<input type="checkbox" name="' + field.key + '"' + (val ? ' checked' : '') + '> ' + esc(field.label) + '</label>' +
      (field.hint ? '<div class="field-hint">' + esc(field.hint) + '</div>' : '') + '</div>';
  }

  // Also rendered separately, for the same reason as 'checkbox' above: a
  // multi-select (several companions can be tagged to one item) doesn't
  // fit the "one <input>, one value" shape the switch below assumes. See
  // readTagPicker() just above for the read-back side, and its comment
  // for why each checkbox gets its own unique name rather than sharing
  // `field.key` the way every other field's single <input> does.
  if (field.type === 'tag-picker') {
    var companions = (trip && trip.companions) || [];
    if (companions.length === 0) {
      return '<div class="field" ' + full + '><label>' + esc(field.label) + '</label>' +
        '<div class="field-hint">No companions added yet — add some on the Companions tab to tag them here.</div></div>';
    }
    var pickerItems = companions.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (c) {
      // Checked if this render came from the record's saved value (`val`
      // is the plain array of companion ids in that case), OR — on a
      // reactive re-render, where `val` itself is blank because there's
      // no single flat "companions" key in live form data — if the
      // uniquely-named checkbox for this companion shows up checked in
      // `allValues` instead. Either source is enough; checking both means
      // this reads correctly whichever situation produced this render.
      var checked = (Array.isArray(val) && val.indexOf(c.companionId) !== -1) || (allValues && allValues[field.key + '__' + c.companionId]);
      // `field.locked` (see fieldsWithTagPickerLock()) disables every
      // checkbox — a disabled checkbox is left out of the submitted
      // FormData entirely, so readTagPicker() sees no change for this
      // item regardless, matching what the Worker enforces server-side.
      return '<label class="tag-picker-item"><input type="checkbox" name="' + field.key + '__' + c.companionId + '"' + (checked ? ' checked' : '') + (field.locked ? ' disabled' : '') + '> ' + companionAvatarHtml(trip, c.companionId, c.name) + esc(c.name) + '</label>';
    }).join('');
    return '<div class="field" ' + full + '><label>' + esc(field.label) + '</label><div class="tag-picker">' + pickerItems + '</div>' +
      (field.locked ? '<div class="field-hint">Who this is tagged to isn\'t something you can change.</div>' : '') +
      '</div>';
  }

  var inputHtml;
  switch (field.type) {
    case 'location-picker':
      inputHtml = locationPickerHtml(field, val, req, trip, allValues);
      break;
    case 'text':
      inputHtml = '<input type="text" name="' + field.key + '" value="' + esc(val) + '" ' + req +
        ' placeholder="' + esc(field.placeholder || '') + '">';
      break;
    case 'number':
      inputHtml = '<input type="number" step="0.01" name="' + field.key + '" value="' + esc(val) + '" ' + req + '>';
      break;
    case 'date':
      inputHtml = '<input type="date" name="' + field.key + '" value="' + esc(val) + '" ' + req + '>';
      break;
    case 'time':
      inputHtml = '<input type="time" name="' + field.key + '" value="' + esc(val) + '">';
      break;
    case 'textarea':
      inputHtml = '<textarea name="' + field.key + '" rows="3" placeholder="' + esc(field.placeholder || '') + '">' + esc(val) + '</textarea>';
      break;
    case 'select':
      inputHtml = '<select name="' + field.key + '">' + field.options.map(function (o) {
        return '<option value="' + esc(o) + '" ' + (o === val ? 'selected' : '') + '>' + esc(o) + '</option>';
      }).join('') + '</select>';
      break;
    case 'currency':
      inputHtml = suggestInputHtml(field, val, req, 'currency', 'maxlength="6" style="text-transform:uppercase"', 'GBP');
      break;
    case 'country':
      inputHtml = suggestInputHtml(field, val, req, 'country', 'maxlength="60"');
      break;
    case 'city':
      // Same idea as 'country' — a suggestion list of common cities,
      // but the input still happily accepts anything typed (a smaller
      // town that isn't in the shortlist, a neighbourhood name, etc).
      inputHtml = suggestInputHtml(field, val, req, 'city', 'maxlength="80"');
      break;
    case 'airport':
      // Suggestions are shown as "CODE — Name" but nothing forces the
      // value to match that shape — typing just the 3-letter code (or
      // a city name for a mode where a full airport isn't really the
      // right concept) is equally valid. Uses the same suggestInputHtml()
      // dropdown as currency/country/city/timezone (see the "Generic
      // suggestion dropdown" section further down) — airport was the
      // first field converted from a native <datalist> to this, for the
      // reasons explained there, and the rest followed for consistency.
      //
      // The hint underneath is airport-specific, on top of the shared
      // dropdown: a live, honest signal of whether whatever's typed so
      // far actually resolves to a real coordinate — checked against
      // the SAME two sources (COMMON_AIRPORTS, then AIRPORT_DB) that
      // openTransportForm()'s onSubmit uses when the leg is actually
      // saved, via airportCoordsFromText(). Computed once here for
      // whatever the field already contains (e.g. editing an existing
      // leg, or the field list re-rendering after a mode switch), then
      // kept live after that by the shared 'input' listener (see its
      // airport-specific branch).
      var airportResolved = airportCoordsFromText(val);
      var airportHintText = !val ? ''
        : (airportResolved ? '✓ Mapped precisely for the Map tab' : 'No exact airport match yet — the map will try to search by name instead.');
      var airportHintClass = 'field-hint airport-resolve-hint' + (val ? (airportResolved ? ' is-ok' : ' is-unresolved') : '');
      inputHtml = suggestInputHtml(field, val, req, 'airport', 'maxlength="80"', 'e.g. LHR or Heathrow') +
        '<div class="' + airportHintClass + '" id="' + field.key + '-resolve-hint">' + esc(airportHintText) + '</div>';
      break;
    case 'flight-lookup':
      // A text input, a date input, and a "Look up" button — clicking
      // it calls our /WayPoint/api/flight-lookup endpoint (see the
      // click delegation handler's 'lookup-flight' branch) and, on
      // success, fills in Airline/From/To/times right in this same
      // open form. AeroDataBox looks flights up by number AND date;
      // that date used to only come from "Depart date" further down
      // this same form (not visible yet at the point someone's just
      // typed a flight number, which was awkward — see
      // performFlightLookup()'s comment for the full story). The date
      // input right here is deliberately NOT a named form field (no
      // `name` attribute, so it isn't submitted with the rest of the
      // form) — it's just a convenient place to type/confirm the date
      // for the lookup itself; performFlightLookup() falls back to the
      // real "Depart date" field if this one's left blank, and copies
      // whichever date was actually used back into "Depart date" on a
      // successful lookup, so the two never end up disagreeing. It's
      // pre-filled from "Depart date" here (via the 4th `allValues`
      // argument fieldHtml() gets — see fieldsHtml()) when editing an
      // existing leg or when the mode was just switched to Flight with
      // a date already typed. The status line underneath reports what
      // happened (looking up / not found / filled in), since there's
      // nowhere else in a modal form to show that feedback.
      var lookupDateDefault = (allValues && allValues.departDate) || '';
      inputHtml = '<div class="flight-lookup-row">' +
        '<input type="text" maxlength="10" style="text-transform:uppercase" ' +
        'name="' + field.key + '" value="' + esc(val) + '" ' + req +
        ' placeholder="' + esc(field.placeholder || '') + '">' +
        '<input type="date" id="flight-lookup-date" style="flex:0 0 150px" value="' + esc(lookupDateDefault) + '">' +
        '<button type="button" class="btn" data-action="lookup-flight">Look up</button>' +
        '</div>' +
        '<div class="field-hint">Pick the date to look up right here — defaults to "Depart date" below once that\'s filled in, and fills it back in for you either way.</div>' +
        '<div class="flight-lookup-status" id="flight-lookup-status"></div>';
      break;
    case 'timezone':
      inputHtml = suggestInputHtml(field, val, req, 'timezone', 'maxlength="40"') +
        (val ? '<div class="field-hint">Currently ' + esc(tzOffsetLabel(val) || 'unrecognised') + '</div>' : '');
      break;
    case 'select-destination':
      inputHtml = '<select name="' + field.key + '"><option value="">—</option>' + (trip.destinations || []).map(function (d) {
        return '<option value="' + d.destinationId + '" ' + (d.destinationId === val ? 'selected' : '') + '>' + esc(d.name) + '</option>';
      }).join('') + '</select>';
      break;
    case 'select-contact':
      inputHtml = '<select name="' + field.key + '"><option value="">—</option>' + (trip.contacts || []).map(function (c) {
        return '<option value="' + c.contactId + '" ' + (c.contactId === val ? 'selected' : '') + '>' + esc(c.name) + '</option>';
      }).join('') + '</select>';
      break;
    // A row of colour swatches, native radio buttons underneath (visually
    // hidden — see the .avatar-swatch-radio CSS rule) so this needs no
    // custom click-handling JS at all, the same way every other field
    // here just relies on FormData at submit time. Used for a
    // companion's smiley colour (see COMPANION_FIELDS/
    // COMPANION_FIELDS_LIMITED and openCompanionForm() further down) --
    // the account-holder picker (a bigger, two-step colour+animal choice)
    // is its own dedicated modal, openAvatarPicker(), rather than a
    // field in this generic form system. `c.hex` here is interpolated
    // straight from AVATAR_COLORS, a fixed local constant this page
    // ships with — never a stored/network value — so this is NOT the
    // "never put a raw stored token in a style attribute" case that
    // avatarColorHex() exists to guard against elsewhere (see
    // avatarMarkerHtml()'s comment).
    case 'avatar-color':
      inputHtml = '<div class="avatar-swatch-grid">' + AVATAR_COLORS.map(function (c) {
        return '<label class="avatar-swatch-label" title="' + esc(c.token) + '">' +
          '<input type="radio" class="avatar-swatch-radio" name="' + field.key + '" value="' + c.token + '"' + (val === c.token ? ' checked' : '') + '>' +
          '<span class="avatar-swatch-btn" style="background:' + c.hex + '"></span>' +
          '</label>';
      }).join('') + '</div>';
      break;
    default:
      inputHtml = '';
  }
  return '<div class="field" ' + full + '><label>' + esc(field.label) + '</label>' + inputHtml +
    (field.hint ? '<div class="field-hint">' + esc(field.hint) + '</div>' : '') + '</div>';
}

// Groups adjacent short fields into two-column rows so the form
// doesn't feel like one long single column; textareas and any field
// marked `wide` always take the full width.
// Any single-line input type can share a row; only a textarea (or a
// field explicitly marked `wide`) always takes the full width. Kept
// as a blacklist rather than a whitelist so a new short-input field
// type (like "country") doesn't need this list updated too.
function isPairableField(f) {
  return f.type !== 'textarea' && !f.wide;
}

function fieldsHtml(fields, initial, trip) {
  var out = '';
  var i = 0;
  while (i < fields.length) {
    var f = fields[i];
    var pairable = isPairableField(f);
    var next = fields[i + 1];
    var nextPairable = next && isPairableField(next);
    if (pairable && nextPairable) {
      out += '<div class="field-row">' + fieldHtml(f, initial[f.key], trip, initial) + fieldHtml(next, initial[next.key], trip, initial) + '</div>';
      i += 2;
    } else {
      out += fieldHtml(f, initial[f.key], trip, initial);
      i += 1;
    }
  }
  return out;
}

function sectionHasSavedValues(section, initial) {
  return section.fields.some(function (field) {
    var value = initial[field.key];
    return Array.isArray(value) ? value.length > 0 : value !== undefined && value !== null && value !== '' && value !== false;
  });
}

// Activity and accommodation forms have enough optional booking/cost data
// that one undivided field list feels like work before someone has even
// recorded the core plan. Essentials stay visible; optional sections are
// progressive disclosure, and reopen automatically when editing data they
// already contain so nothing saved appears to have vanished.
function formSectionsHtml(sections, initial, trip) {
  return sections.map(function (section) {
    var heading = '<div class="form-section-head"><h3>' + esc(section.title) + '</h3>' +
      (section.hint ? '<p>' + esc(section.hint) + '</p>' : '') + '</div>';
    var fields = fieldsHtml(section.fields, initial, trip);
    if (section.collapsible) {
      var open = section.open || sectionHasSavedValues(section, initial);
      return '<details class="form-details"' + (open ? ' open' : '') + '><summary>' + esc(section.title) + '</summary>' +
        '<div class="form-details-body">' + (section.hint ? '<p class="field-hint" style="margin:0 0 12px">' + esc(section.hint) + '</p>' : '') + fields + '</div></details>';
    }
    return '<section class="form-section">' + heading + fields + '</section>';
  }).join('');
}

function formFieldsHtml(opts, values) {
  if (opts.sections) return formSectionsHtml(opts.sections, values, opts.trip || {});
  return fieldsHtml(resolveFields(opts, values), values, opts.trip || {});
}

// opts.fields is usually a plain array, but can instead be a function
// of the form's current values — that's how the transport form swaps
// in flight-only or car-only fields as soon as "Mode" changes. This
// always resolves it to a plain array.
function resolveFields(opts, values) {
  return (typeof opts.fields === 'function') ? opts.fields(values) : opts.fields;
}

// Reads every field currently in a live <form> into a plain object,
// so a reactive re-render (see openForm's `change` handling below)
// can carry over whatever the viewer already typed.
function currentFormValues(formEl) {
  var fd = new FormData(formEl);
  var values = {};
  fd.forEach(function (v, k) { values[k] = v; });
  return values;
}

function openForm(opts) {
  // opts: { title, fields|sections, initial, trip, submitLabel, onSubmit,
  //         reactiveKey } — reactiveKey names a field (e.g. "mode"), or
  // an array of them, that when changed should recompute a
  // function-valued `fields` and re-render just the field list,
  // keeping everything else typed.
  window.__formConfig = opts;
  var root = document.getElementById('modal-root');
  var initial = opts.initial || {};
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>' + esc(opts.title) + '</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('close') + '</button></div>' +
        '<form id="entity-form">' +
          '<div class="modal-body" id="modal-fields">' + formFieldsHtml(opts, initial) + '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">' + esc(opts.submitLabel || 'Save') + '</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
  // No <datalist> elements to seed here — every suggestible field
  // (currency, country, city, timezone, airport) renders its own
  // app-managed dropdown via suggestInputHtml(), built on demand as
  // each field is focused/typed into rather than seeded once here. See
  // the "Generic suggestion dropdown" section further down.
}

/* ---- Per-trip permissions ---------------------------------------------
   Every trip the server sends back carries a `myGrant` field (set by
   buildResponseState() in src/worker.js) saying exactly what THIS
   account may do with THIS trip, right now — there's no single global
   "role" anymore (compare the old `currentUser.role` this app used to
   have). `myGrant` is always one of:
     { role: 'superuser' }                    -- owner, or the uber-user.
     { role: 'admin' }                         -- full read/write, no sharing control.

     { role: 'viewer', companionId: '...' }    -- read-only, own tagged items only.
   These four little functions are the ONLY place the rest of the app
   asks "am I allowed to ___ on this trip/item?" — every render below
   goes through them rather than re-deriving the logic inline, so there's
   exactly one place to get this right. ------------------------------- */

// Full read/write on the trip itself (its own name/dates/notes, and
// every item on it) — true for a Superuser or an "admin" grant. False
// for a scoped "user"/"viewer" grant.
function canFullyEditTrip(trip) {
  var g = trip && trip.myGrant;
  return !!g && (g.role === 'superuser' || g.role === 'admin');
}

// A trip's Superuser (its owner, or the uber-user) can decide who else
// has access to it -- and, as of Phase 2 of the Companions/Avatars
// feature, so can an "admin" grant, though only as far as User/Viewer
// (see canGrantAdminRole() below for the one thing an Admin still can't
// do). See openCompanionLinkForm()/openAddLinkedCompanionForm() further
// down (their privilege-level select is gated on this), and
// handleTripGrantsUpsert()/handleTripGrantsRevoke() in src/worker.js for
// the server-side mirror of this exact check.
function canShareTrip(trip) {
  var g = trip && trip.myGrant;
  return !!g && (g.role === 'superuser' || g.role === 'admin');
}

// Only the trip's actual Superuser (its owner, or the uber-user) may
// grant someone ELSE Admin access -- an Admin grant can share the trip,
// but only as User or Viewer, so creating another Admin stays the
// owner's call alone. See openCompanionLinkForm()/
// openAddLinkedCompanionForm()'s own privilege-level dropdowns further
// down.
function canGrantAdminRole(trip) {
  var g = trip && trip.myGrant;
  return !!g && g.role === 'superuser';
}

// Can THIS account link a companion to an account -- either upgrading an
// existing Guest into a Companion (openCompanionLinkForm()), or adding a
// brand-new one already linked in one step (openAddLinkedCompanionForm())?
// Superuser/Admin only (Phase 2), same bar as sharing itself -- see
// canShareTrip() above. Note this is a DIFFERENT, lower bar than
// canAddCompanion() below: canAddCompanion() also covers a "user" grant
// adding a plain Guest (Phase 3), but a "user" grant may never link one
// to an account -- see mergeUserScopedCompanions() in src/worker.js for
// exactly what a "user" grant's own submission is allowed to contain.
function canLinkCompanion(trip) {
  return canShareTrip(trip);
}
// Can THIS account add a brand-new Guest (name + smiley colour, no
// login)? True for Superuser/Admin (who can also add a linked Companion
// instead -- see canLinkCompanion() above) PLUS a "user" grant, who may
// only ever append a Guest, never a Companion.
function canAddCompanion(trip) {
  if (canFullyEditTrip(trip)) return true;
  var g = trip && trip.myGrant;
  return !!g && g.role === 'user';
}

// The companion id a "user"/"viewer" grant is scoped to. Empty string
// for a full-scope role (Superuser/admin), which isn't tied to any one
// companion.
function myCompanionId(trip) {
  var g = trip && trip.myGrant;
  return (g && (g.role === 'user' || g.role === 'viewer')) ? (g.companionId || '') : '';
}

// Can THIS ONE item be edited? True everywhere canFullyEditTrip() is,
// PLUS for a "user" grant when `item` is tagged with their companion —
// never true for a "viewer" grant, however it's scoped (read-only is
// read-only). Only meaningful for the four taggable item types
// (destinations/activities/accommodation/transport); companions,
// contacts and expenses aren't per-companion scoped, so callers for
// those just use canFullyEditTrip() directly instead of this.
function canEditItem(trip, item) {
  if (canFullyEditTrip(trip)) return true;
  var g = trip && trip.myGrant;
  if (!g || g.role !== 'user') return false;
  return !!(item && item.companions && item.companions.indexOf(g.companionId) !== -1);
}

function defaultHomeCurrency() {
  var last = state.trips[state.trips.length - 1];
  return (last && last.homeCurrency) || 'GBP';
}

// Splits the "Who's coming with you?" textarea (see TRIP_FIELDS_NEW)
// into a list of trimmed, non-empty names -- one per line, but a comma
// also works as a separator in case someone types "Alex, Sam" on a
// single line instead. Duplicates aren't filtered out: if someone
// genuinely types the same name twice that's their call, and two
// guests are allowed to share a name anyway (companions are matched by
// id everywhere, never by name -- see e.g. readTagPicker()).
function parseCompanionNamesBox(text) {
  return (text || '').split(/[\n,]/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
}

function openTripForm(existing) {
  openForm({
    title: existing ? 'Edit trip' : 'New trip',
    // The extra "Who's coming with you?" box only makes sense while
    // FIRST setting a trip up -- see TRIP_FIELDS_NEW's own comment for
    // why it's deliberately left off the Edit form.
    fields: existing ? TRIP_FIELDS : TRIP_FIELDS_NEW,
    initial: existing || { homeCurrency: defaultHomeCurrency() },
    submitLabel: existing ? 'Save changes' : 'Create trip',
    onSubmit: function (v) {
      updateState(function (next) {
        if (existing) {
          var t = byId(next.trips, existing.tripId, 'tripId');
          t.name = v.name; t.startDate = v.startDate || ''; t.endDate = v.endDate || '';
          t.homeCurrency = (v.homeCurrency || 'GBP').toUpperCase(); t.notes = v.notes || '';
          // ownerId/grants/myGrant aren't touched here at all -- they
          // already carried over from `existing` via byId() above, and
          // the Worker only ever trusts its OWN stored copy of them
          // regardless (see "SAVING SAFELY" in src/worker.js).
        } else {
          // Turn whatever was typed into the "Who's coming with you?"
          // box into brand-new Guest companion records (name only, no
          // login, no smiley colour picked yet -- same minimal shape
          // openCompanionForm() creates when no colour is chosen). Each
          // needs its own fresh id, same as any other companion.
          var newCompanions = parseCompanionNamesBox(v.companionNames).map(function (name) {
            return { companionId: newId(), name: name, notes: '' };
          });
          next.trips.push({
            tripId: newId(), name: v.name, startDate: v.startDate || '', endDate: v.endDate || '',
            homeCurrency: (v.homeCurrency || 'GBP').toUpperCase(), notes: v.notes || '',
            currencyRates: {}, destinations: [], activities: [], transport: [], accommodation: [], contacts: [], companions: newCompanions, expenses: [],
            // Kept for backwards compatibility with existing trip records.
            // New map locations are saved directly on their entries.
            geocodeCache: {},
            // Creating a trip makes you its permanent Superuser (owner) --
            // the Worker enforces this for real when it actually saves a
            // brand-new trip id (see handlePost()'s "anything submitted
            // that ISN'T an existing trip id" branch), but setting it here
            // too means the UI shows the right controls (Edit/Delete trip,
            // "Add" buttons, the Share panel) immediately, on this very
            // first render, rather than only after the next reload.
            ownerId: currentUser.id, ownerUsername: currentUser.username, grants: [],
            myGrant: { role: 'superuser' }
          });
          currentTripId = next.trips[next.trips.length - 1].tripId;
          currentView = 'trip'; currentTab = 'timeline';
        }
      });
    }
  });
}

function openDestinationForm(trip, existing) {
  var initial = existing ? Object.assign({}, existing, pickerInitial(existing, 'destination'), {

  }) : {};

          lat: location.lat, lng: location.lng, locationRef: location.locationRef, locationMethod: location.locationMethod, locationGranularity: location.locationGranularity, locationStale: location.locationStale, locationKindLabel: location.locationKindLabel,

  var initial = existing ? Object.assign({ category: 'Other' }, existing, pickerInitial(existing, 'location')) : Object.assign({ category: 'Other' }, seed || {});
  openForm({
    title: existing ? 'Edit activity' : 'Add activity',

          location: v.location || '', address: v.address || '', lat: mapped.lat, lng: mapped.lng, locationRef: mapped.locationRef, locationMethod: mapped.locationMethod, locationGranularity: mapped.locationGranularity, locationStale: mapped.locationStale, locationKindLabel: mapped.locationKindLabel, bookingRef: v.bookingRef || '',
          contactId: v.contactId || '', costAmount: v.costAmount || '', costCurrency: (v.costCurrency || '').toUpperCase(),
