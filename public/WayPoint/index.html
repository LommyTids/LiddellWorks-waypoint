/* ---------- 19. Render: Contacts tab -------------------------------------- */

function renderContactsTab(trip) {
  if (trip.contacts.length === 0) return emptyTab(trip, 'users', 'No contacts yet', 'Hotel front desks, tour operators, guides — save them here to link from activities, transport and accommodation.', 'new-contact', 'Add contact');
  var rows = trip.contacts.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (c) {
    var tags = [];
    if (c.phone) tags.push('<span class="tag">' + esc(c.phone) + copyBtn(c.phone, 'phone') + '</span>');
    if (c.email) tags.push('<span class="tag">' + esc(c.email) + copyBtn(c.email, 'email') + '</span>');
    return '<div class="item-row"><div class="item-icon">' + icon('user') + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(c.name) + '</span>' + (c.role ? '<span class="item-sub">' + esc(c.role) + '</span>' : '') + '</div>' +
      (c.address ? '<div class="item-sub">' + esc(c.address) + ' ' + mapsLink(c.address) + '</div>' : '') +
      '<div class="item-tags">' + tags.join('') + '</div>' +
      (c.notes ? '<div class="item-sub" style="margin-top:6px">' + esc(c.notes) + '</div>' : '') +
      '</div>' + rowActions(trip, 'contact', c) + '</div>';
  }).join('');
  return tabHead(trip, 'Contacts', 'new-contact', 'Add contact') + '<div class="item-list">' + rows + '</div>';
}

/* ---------- 19b. Render: Companions tab ------------------------------- */

// Companions are who to tag on individual destinations/activities/
// accommodation/transport (see the 'tag-picker' field type in
// fieldHtml()) — this tab is just where you add the people, not where you
// tag them to anything. There's deliberately no "used on N items" count
// here: it'd mean scanning all four other lists on every render just for
// a number nobody's asked for — if you want to know what someone's tagged
// to, that's what each tab's own item tags already show.
function companionTags(trip, companionIds) {
  return (companionIds || [])
    .map(function (id) { return byId(trip.companions, id, 'companionId'); })
    .filter(Boolean)
    .map(function (c) { return '<span class="tag">' + companionAvatarHtml(trip, c.companionId, c.name) + esc(c.name) + '</span>'; })
    .join('');
}

// The Companions tab is deliberately the ONE place you manage everyone
// on a trip — both "who's traveling" (companions, tagged to items) and
// "who can log in and see/edit this" (accounts, via sharing). They used
// to be two separate screens (this tab for adding a person, Settings ->
// Share for giving an account access) that only made sense read
// together, and — as of this section's own revision below — the
// standalone "Share access" panel that used to sit under the companion
// list is GONE too, folded into the add/link actions themselves: see
// claude/waypoint-companions-plan.md ("The structural change", and its
// later "Access moves onto the companion itself" section) for the full
// reasoning.
//
// GUEST vs COMPANION -- this is product vocabulary, not a new data
// field: every person on this list is stored the same way (a plain
// "companion" record, see COMPANION_FIELDS above), and whether they're
// shown as a "Guest" or a "Companion" is purely whether `accountId` is
// set on them -- i.e. whether they have their own Waypoint login. The
// list itself is now visually SPLIT into two sections below (see
// renderCompanionsTab()) so the two kinds of person are never mixed
// together in one list the way they used to be.
//   - A GUEST has no login. Anyone who canAddCompanion() (a "user" grant
//     included, Phase 3) can add one -- name + smiley colour only.
//   - A COMPANION has one. Only canLinkCompanion() (Superuser/Admin) can
//     create one directly, or upgrade an existing Guest into one by
//     linking a username -- see openAddLinkedCompanionForm() and
//     openCompanionLinkForm() below. EITHER action now also asks for a
//     privilege level (Admin/User/Viewer, or "no trip access") right
//     there in the same form, and grants it automatically -- this is
//     what replaced the old separate "Share access" panel: adding or
//     linking a companion and sharing the trip with them used to be two
//     separate steps (add/link here, then go find them again in the
//     share panel below), and are now genuinely one.
// A Companion who DOES also have access to this trip (because they're
// its owner, the site's uber-user, or hold a grant) gets an extra tag
// showing that access level -- Super/Admin/User/Viewer, resolved
// server-side by resolveCompanionAccessLevels() in src/worker.js and
// sent down as `trip.companionAccessLevels`. Unlike the raw `grants`
// list, that map is sent to every role that can see the trip at all --
// a deliberate choice to make everyone's standing on a trip visible to
// everyone else on it (see resolveCompanionAccessLevels()'s own comment
// for exactly what it does and doesn't reveal) -- so these tags render
// the same for a Superuser and for a scoped Viewer looking at the very
// same trip.
var COMPANION_ACCESS_LEVEL_LABELS = { superuser: 'Super', admin: 'Admin', user: 'User', viewer: 'Viewer' };

// Deliberately reading `trip.companionAvatars[...].type` here rather than
// `c.accountId` to decide Guest vs Companion -- accountId is stripped
// from a scoped "user"/"viewer" role's own companion list (see
// buildVisibleTrip() in src/worker.js), so `c.accountId` is ALWAYS
// falsy for them even when a companion genuinely IS linked.
// `companionAvatars` doesn't have that problem: it's already sent to
// every role (same as `companionAccessLevels`), and its `type` ('account'
// vs 'smiley') already encodes exactly this same "does this person have
// a login" fact for the avatar marker -- reusing it here means
// Guest/Companion always agrees with what the marker itself is showing,
// for every role, including one whose linked account has since been
// deleted (resolveCompanionAvatars() quietly falls back to 'smiley' in
// that case too, so this then correctly reads as a Guest again rather
// than a dangling Companion). Used both to decide which of the two
// segregated lists below a companion belongs in, and by
// openCompanionLinkForm() to word its own title/hint correctly.
function isCompanionLinked(trip, c) {
  return !!(trip.companionAvatars && trip.companionAvatars[c.companionId] && trip.companionAvatars[c.companionId].type === 'account');
}

function renderCompanionsTab(trip) {
  var canAddGuest = canAddCompanion(trip);
  var canAddLinked = canLinkCompanion(trip);
  // Superuser/Admin get two explicit choices up front (add someone who
  // already has a login and share the trip with them in one step, or
  // add someone with no login at all); a "user" grant only ever gets
  // the second -- see COMPANION_FIELDS_LIMITED and
  // mergeUserScopedCompanions() in src/worker.js for the field-level
  // enforcement behind that restriction (this button is just the UI
  // reflection of it, not the actual security boundary).
  //
  // "Add companion" deliberately gets the ACCENT (coloured) button and
  // "Add guest" the plain grey one -- matching the same colour-coding
  // already used for their MARKERS elsewhere on this tab (a Companion's
  // marker is their own account's colour + animal; a Guest's is always
  // the plain grey circle, see companionAvatarHtml()) makes the two
  // buttons themselves an extension of that same visual language, rather
  // than an arbitrary choice of which one looks more "primary". Wrapped
  // in a shared .head-btn-row so the pair sits right next to each other
  // (see that class's own comment for why that needs a wrapper at all).
  var addButtons =
    (canAddLinked ? '<button class="btn btn-accent" data-action="new-linked-companion">' + icon('plus') + ' Add companion</button>' : '') +
    (canAddGuest ? '<button class="btn" data-action="new-companion">' + icon('plus') + ' Add guest</button>' : '');
  var addButtonsRow = addButtons ? '<div class="head-btn-row">' + addButtons + '</div>' : '';
  var head = '<div class="tab-panel-head"><h2>Companions</h2>' + addButtonsRow + '</div>';

  if (trip.companions.length === 0) {
    return head + '<div class="empty-state">' + icon('companion') + '<h3>No one added yet</h3>' +
      '<p>Add the people traveling with you as companions if they already have their own Waypoint login (this shares the trip with them too), or as guests if they don\'t, then tag them to destinations, activities, accommodation and transport to track who\'s on what.</p>' +
      (addButtonsRow ? '<div style="margin-top:14px">' + addButtonsRow + '</div>' : '') +
      '</div>';
  }

  // One row-renderer shared by both sections below -- a Companion row
  // and a Guest row differ only in which tags/actions apply, not in
  // their overall shape, so there's no reason to duplicate the HTML
  // structure itself.
  function companionRowHtml(c) {
    var linkedAccount = c.accountId ? (trip.grants || []).find(function (g) { return g.accountId === c.accountId; }) : null;
    // A companion can be linked to an account that ISN'T (or is no
    // longer) shared on THIS trip -- e.g. deliberately linked with "no
    // trip access" (see openCompanionLinkForm() below). `trip.grants`
    // only exists for a full-scope role anyway (see buildVisibleTrip()
    // in src/worker.js), so there's often nothing to look the username
    // up in even when `c.accountId` is present -- the linked-tag below
    // just quietly says "has a login" in that case rather than guessing.
    var linkedTag = c.accountId
      ? '<span class="tag">' + icon('user') + (linkedAccount ? esc(linkedAccount.username) : 'has a login') + '</span>'
      : '';
    // The access-level tag -- see the big comment above this function.
    // A Guest (no accountId) always just reads "Guest". A Companion
    // shows their actual resolved access level when there is one
    // (Super/Admin/User/Viewer), or a generic "Companion" tag when
    // they're linked but genuinely have no access to this trip (linked
    // purely for their avatar, or explicitly given "no trip access" in
    // openCompanionLinkForm() -- see resolveCompanionAccessLevels()'s
    // own comment on this case).
    var isLinked = isCompanionLinked(trip, c);
    var accessRole = trip.companionAccessLevels && trip.companionAccessLevels[c.companionId];
    var accessTag = isLinked
      ? '<span class="tag' + (accessRole ? ' tag-role-' + accessRole : '') + '">' + (accessRole ? esc(COMPANION_ACCESS_LEVEL_LABELS[accessRole] || accessRole) : 'Companion') + '</span>'
      : '<span class="tag">Guest</span>';
    // A separate, second `.item-actions` group rather than trying to
    // merge into rowActions()'s own -- both are just small icon-button
    // clusters, so two side by side reads identically to one, without
    // needing rowActions() itself to know anything about linking.
    var linkAction = canAddLinked
      ? '<div class="item-actions"><button class="btn btn-icon btn-ghost" data-action="link-companion" data-id="' + c.companionId + '" title="' + (isLinked ? 'Manage their account link and access level' : 'Upgrade to companion (link an account, and optionally share the trip)') + '">' + icon('users') + '</button></div>'
      : '';
    return '<div class="item-row"><div class="item-icon item-icon-avatar">' + companionAvatarHtml(trip, c.companionId, c.name) + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(c.name) + '</span>' + accessTag + linkedTag + '</div>' +
      (c.notes ? '<div class="item-sub">' + esc(c.notes) + '</div>' : '') +
      '</div>' + linkAction + rowActions(trip, 'companion', c) + '</div>';
  }

  var sorted = trip.companions.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  var companionRows = sorted.filter(function (c) { return isCompanionLinked(trip, c); });
  var guestRows = sorted.filter(function (c) { return !isCompanionLinked(trip, c); });

  // Segregated into two clearly-labelled lists rather than one mixed
  // one -- this is what replaced the old "Share access" panel's spot at
  // the bottom of the tab (see the big comment above this function).
  var companionsSection = '<h3 class="section-subhead">Companions</h3>' +
    (companionRows.length
      ? '<div class="item-list">' + companionRows.map(companionRowHtml).join('') + '</div>'
      : '<p class="field-hint">Nobody with a Waypoint login on this trip yet.</p>');
  var guestsSection = '<h3 class="section-subhead">Guests</h3>' +
    (guestRows.length
      ? '<div class="item-list">' + guestRows.map(companionRowHtml).join('') + '</div>'
      : '<p class="field-hint">Nobody without a login on this trip yet.</p>');

  return head + companionsSection + guestsSection;
}

/* ---------- 19b. Map tab ---------------------------------------------------
   Plots saved locations on one interactive map, using Leaflet (vendored
   under vendor/leaflet/) and OpenStreetMap tiles. Coordinates are selected
   in the shared location picker and stored with each entry; the map does
   not silently geocode free text in the browser.

   The tricky part is that this app normally redraws #app from scratch (see
   render() near the bottom of this file) every time anything changes —
   great for plain HTML, but a map needs to be built once with a JS library
   call (L.map(...)) and then updated in place, not thrown away and rebuilt
   constantly, or it would flicker and forget its zoom/pan position. So this
   section keeps its own little bit of state (`mapState`, below) outside of
   the normal `state`/render() pipeline, mounts the actual Leaflet map
   itself imperatively (see initMap()) whenever the Map tab's HTML has just
   been drawn, and updates it directly (see the "toggle-map-layer" handler
   in the click listener) for anything — like a layer checkbox — that
   doesn't need a full re-render.
   ---------------------------------------------------------------------- */

// One layer group per category, so the checkboxes in the tab can show/hide
// each kind of pin independently. `color` is used both for each category's
// map markers and for the little dot next to its checkbox label.
//
// Destinations keep a deliberately muted, "targeted" shade — they're the
// anchor points of the trip, not something that needs to shout — while
// activities/transport/accommodation get bright, clearly-distinct hues so
// they actually pop against the (fairly busy, fairly light) OpenStreetMap
// tiles instead of blending into the background.
var MAP_LAYER_META = [
  { key: 'destinations', label: 'Destinations', color: '#1f6f63' },
  { key: 'activities', label: 'Activities', color: '#ff8c1a' },
  { key: 'transport', label: 'Transport', color: '#1e88ff' },
  { key: 'accommodation', label: 'Accommodation', color: '#ff2d78' }
];

// Everything the Map tab needs to remember between renders that ISN'T part
// of the saved trip data — which Leaflet map/layers are currently mounted,
// which layers are currently checked on, and a `generation` counter (see
// initMap() for what that guards against). None of this is saved or
// shared — it just resets to the defaults below on a fresh page load.
var mapState = {
  instance: null,
  layers: null,
  generation: 0,
  day: '',
  wholeTrip: false,
  visibility: { destinations: true, activities: true, transport: true, accommodation: true }
};

function mapDayVisible(start, end, day) {
  return mapState.wholeTrip || !day || ((!start || start <= day) && (!end || end >= day));
}

function savedCoords(item, latKey, lngKey) {
  return (typeof item[latKey] === 'number' && typeof item[lngKey] === 'number') ? { lat: item[latKey], lng: item[lngKey] } : null;
}

// The Map tab is deliberately a view of saved locations only. Text-only
// records remain visible in their own tabs, but are not guessed at by an
// external service when a person opens the map.
function mapPointsForTrip(trip) {
  var points = [];
  (trip.destinations || []).forEach(function (d) {
    if (!mapDayVisible(d.arriveDate, d.departDate, mapState.day)) return;
    points.push({ category: 'destinations', coords: savedCoords(d, 'lat', 'lng'), label: d.name, sub: d.country, boundaryRef: d.boundaryRef || '', boundaryQuality: d.boundaryQuality || '', stale: d.locationStale });
  });
  (trip.activities || []).forEach(function (a) {
    if (!mapDayVisible(a.date, a.date, mapState.day)) return;
    points.push({ category: 'activities', coords: savedCoords(a, 'lat', 'lng'), label: a.title, sub: a.location || a.address, stale: a.locationStale });
  });
  (trip.accommodation || []).forEach(function (ac) {
    // Checkout day is included: a place is still useful map context until
    // the traveller actually leaves it.
    if (!mapDayVisible(dateOnly(ac.checkIn), dateOnly(ac.checkOut), mapState.day)) return;
    points.push({ category: 'accommodation', coords: savedCoords(ac, 'lat', 'lng'), label: ac.name, sub: ac.address, stale: ac.locationStale });
  });
  return points;
}

// Transport legs become lines rather than pins — one per leg with both a
// from- and a to-location filled in. There's no fallback for a missing
// location here (unlike activities above) since a transport leg with only
// one end known can't usefully be drawn as a line.
//
// fromCoords/toCoords carry through whatever real coordinate was
// resolved and saved at the time this leg was created/edited — null when
// an endpoint still needs a selected location or manual pin.
function mapLegsForTrip(trip) {
  return (trip.transport || []).filter(function (t) {
    return t.fromLocation && t.toLocation && mapDayVisible(dateOnly(t.departDateTime), dateOnly(t.arriveDateTime), mapState.day);
  }).map(function (t) {
    return {
      label: transportLabel(t), mode: t.mode,
      fromCoords: savedCoords(t, 'fromLat', 'fromLng'), toCoords: savedCoords(t, 'toLat', 'toLng'),
      fromStale: t.fromLocationStale, toStale: t.toLocationStale
    };
  });
}

function mapDayControlsHtml(trip) {
  var days = tripDayList(trip);
  if (!days.length) return '';
  if (days.indexOf(mapState.day) === -1) mapState.day = days[0];
  var index = days.indexOf(mapState.day);
  return '<div class="map-day-controls">' +
    '<span class="map-day-label">Map day</span>' +
    '<button type="button" class="btn btn-small" data-action="map-day-prev" aria-label="Previous map day" ' + (index <= 0 ? 'disabled' : '') + '>‹</button>' +
    '<input type="date" data-map-day-input aria-label="Map day" min="' + esc(days[0]) + '" max="' + esc(days[days.length - 1]) + '" value="' + esc(mapState.day) + '">' +
    '<button type="button" class="btn btn-small" data-action="map-day-next" aria-label="Next map day" ' + (index >= days.length - 1 ? 'disabled' : '') + '>›</button>' +
    '<button type="button" class="btn btn-small" data-action="map-show-whole-trip">' + (mapState.wholeTrip ? 'Show selected day' : 'Show whole trip') + '</button>' +
    (mapState.wholeTrip ? '<span class="field-hint">Showing whole trip</span>' : '') +
  '</div>';
}

function renderMapTab(trip) {
  var points = mapPointsForTrip(trip);
  var legs = mapLegsForTrip(trip);
  var toggles = MAP_LAYER_META.map(function (m) {
    var checked = mapState.visibility[m.key] ? 'checked' : '';
    return '<label class="map-toggle"><input type="checkbox" data-action="toggle-map-layer" data-layer="' + m.key + '" ' + checked + '>' +
      '<span class="map-toggle-dot" style="background:' + m.color + '"></span>' + esc(m.label) + '</label>';
  }).join('');

  if (!points.length && !legs.length && !(trip.destinations || []).length && !(trip.activities || []).length && !(trip.transport || []).length && !(trip.accommodation || []).length) {
    return '<div class="tab-panel-head"><h2>Map</h2></div><div class="empty-state">' + icon('map') +
      '<h3>Nothing to show yet</h3>' +
      '<p>Add a destination, activity, transport leg or place of accommodation, then use Find location or Set pin to place it on the map.</p></div>';
  }

  return (
    '<div class="tab-panel-head"><h2>Map</h2></div>' +
    mapDayControlsHtml(trip) +
    '<div class="map-toggles">' + toggles + '</div>' +
    '<div id="map-canvas" class="map-canvas"></div>' +
    '<div id="map-status" class="map-status">Loading map…</div>' +
    '<p class="field-hint" style="margin-top:8px">This map uses only locations you have selected or pinned. Find location in an entry to add it here; destination areas are shaded when boundary data is available.</p>'
  );
}

// Builds (or rebuilds) the actual Leaflet map inside #map-canvas from
// saved points, saved transport ends and cached destination boundaries.
// Called from render() whenever the Map tab's HTML has just been drawn.
async function initMap(trip) {
  var canvas = document.getElementById('map-canvas');
  if (!canvas) return; // the Map tab isn't the one currently on screen

  // A guard against a slow, still-running geocoding pass from an EARLIER
  // call to this function finishing after a NEWER call has already taken
  // over (e.g. the viewer switched away from the Map tab and back again
  // while lookups were still in flight). Every await below re-checks this
  // before touching mapState or the DOM, so a stale call just quietly
  // stops instead of clobbering whatever the newer call already built.
  mapState.generation++;
  var myGeneration = mapState.generation;

  if (mapState.instance) { mapState.instance.remove(); mapState.instance = null; mapState.layers = null; }

  var map = L.map('map-canvas', { scrollWheelZoom: true }).setView([20, 0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
  }).addTo(map);

  var layers = { destinations: L.layerGroup(), activities: L.layerGroup(), transport: L.layerGroup(), accommodation: L.layerGroup() };
  Object.keys(layers).forEach(function (key) { if (mapState.visibility[key]) layers[key].addTo(map); });

  mapState.instance = map;
  mapState.layers = layers;

  var bounds = [];

  function addPoint(category, coords, label, sub, stale) {
    if (!coords) return;
    var meta = MAP_LAYER_META.filter(function (m) { return m.key === category; })[0];
    // A white ring around a near-opaque fill reads far more clearly
    // against OpenStreetMap's busy, fairly light tiles than a
    // same-colour ring blending into its own fill did — the pin pops
    // instead of looking like a smudge, especially for the brighter
    // category colours.
    L.circleMarker([coords.lat, coords.lng], { radius: 8, color: '#ffffff', weight: 2, fillColor: meta.color, fillOpacity: stale ? 0.48 : 0.95, dashArray: stale ? '3 3' : null })
      .bindPopup('<strong>' + esc(label) + '</strong>' + (sub ? '<br>' + esc(sub) : '') + (stale ? '<br><em>Location needs review</em>' : ''))
      .addTo(layers[category]);
    bounds.push([coords.lat, coords.lng]);
  }

  function addDestinationArea(point, boundary) {
    if (!boundary || !boundary.geometry) return false;
    var meta = MAP_LAYER_META.filter(function (m) { return m.key === 'destinations'; })[0];
    var area = L.geoJSON(boundary.geometry, {
      style: { color: meta.color, weight: 2, opacity: point.stale ? 0.45 : 0.8, fillColor: meta.color, fillOpacity: point.stale ? 0.08 : 0.18, dashArray: point.stale ? '4 4' : null }
    }).bindPopup('<strong>' + esc(point.label) + '</strong>' + (point.sub ? '<br>' + esc(point.sub) : '') + (point.stale ? '<br><em>Location needs review</em>' : ''));
    area.addTo(layers.destinations);
    if (area.getBounds && area.getBounds().isValid()) bounds.push(area.getBounds());
    return true;
  }

  // A small rotated triangle, dropped at the midpoint of a transport leg's
  // line and pointing from "from" to "to", so the direction of travel is
  // visible at a glance rather than only inferable from the popup text.
  // Rotation is computed in the map's own projected pixel space (not raw
  // lat/lng) so it always matches the straight line Leaflet actually
  // draws on screen — and because that projection is conformal (angle
  // preserving) at any given moment, the angle stays correct as the
  // viewer zooms or pans afterwards; it's only ever recomputed here, when
  // the leg is first drawn.
  function addDirectionArrow(fromCoords, toCoords, color) {
    var fromPt = map.project([fromCoords.lat, fromCoords.lng], map.getZoom());
    var toPt = map.project([toCoords.lat, toCoords.lng], map.getZoom());
    var midPt = L.point((fromPt.x + toPt.x) / 2, (fromPt.y + toPt.y) / 2);
    var midLatLng = map.unproject(midPt, map.getZoom());
    var angleDeg = Math.atan2(toPt.y - fromPt.y, toPt.x - fromPt.x) * 180 / Math.PI;
    var icon = L.divIcon({
      className: 'transport-arrow-icon',
      html: '<div class="transport-arrow" style="border-left-color:' + color + ';transform:rotate(' + angleDeg + 'deg)"></div>',
      iconSize: [16, 16], iconAnchor: [8, 8]
    });
    L.marker(midLatLng, { icon: icon, interactive: false, keyboard: false }).addTo(layers.transport);
  }

  var points = mapPointsForTrip(trip);
  var legs = mapLegsForTrip(trip);
  var missing = 0, placed = 0;
  var statusEl = document.getElementById('map-status');

  // Boundaries are retrieved in one small batch from Waypoint's KV-backed
  // endpoint. It never calls the search provider while a map is opened.
  var boundaryRefs = points.filter(function (p) { return p.category === 'destinations' && p.boundaryRef; }).map(function (p) { return p.boundaryRef; });
  var boundaries = {};
  if (boundaryRefs.length) {
    try {
      var boundaryResponse = await fetch('/WayPoint/api/location-boundaries', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refs: boundaryRefs.slice(0, 20) })
      });
      if (boundaryResponse.ok) boundaries = (await boundaryResponse.json()).boundaries || {};
    } catch (err) { boundaries = {}; }
    if (myGeneration !== mapState.generation) return;
  }

  function updateStatus() {
    if (!statusEl) return;
    if (missing > 0) statusEl.textContent = placed + ' saved locations shown. ' + missing + ' ' + (missing === 1 ? 'entry needs' : 'entries need') + ' a selected location or pin.';
    else statusEl.textContent = placed ? 'All saved locations shown.' : 'No saved locations for this view yet. Use Find location or Set pin in an entry.';
  }

  for (var i = 0; i < points.length; i++) {
    var p = points[i];
    var areaDrawn = p.category === 'destinations' && addDestinationArea(p, boundaries[p.boundaryRef]);
    if (p.coords) { addPoint(p.category, p.coords, p.label, p.sub, p.stale); placed++; }
    else if (!areaDrawn) missing++;
    else placed++;
  }

  for (var j = 0; j < legs.length; j++) {
    var leg = legs[j];
    var fromCoords = leg.fromCoords;
    var toCoords = leg.toCoords;
    if (fromCoords && toCoords) {
      var lineMeta = MAP_LAYER_META.filter(function (m) { return m.key === 'transport'; })[0];
      L.polyline([[fromCoords.lat, fromCoords.lng], [toCoords.lat, toCoords.lng]], {
        color: lineMeta.color, weight: 4, opacity: 0.9, dashArray: leg.mode === 'Flight' ? '6 6' : null
      }).bindPopup('<strong>' + esc(leg.label) + '</strong>').addTo(layers.transport);
      addDirectionArrow(fromCoords, toCoords, lineMeta.color);
      bounds.push([fromCoords.lat, fromCoords.lng], [toCoords.lat, toCoords.lng]);
      placed++;
    } else {
      missing++;
    }
  }
  updateStatus();
  if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
}

/* ---------- 20. Render: Timeline tab ---------------------------------------
   One card per day: the date heading, chips for any destination whose
   stay covers that day, every event that falls on it in time order,
   and — when relevant — a note about where the night is spent (a
   booked stay, or travelling overnight through to the next day). */

function eventRowHtml(trip, ev) {
  var kindClass = (ev.kind === 'activity') ? 'k-activity' : (ev.kind === 'depart' || ev.kind === 'arrive') ? 'k-transport' : 'k-stay';
  var iconName, title, sub;
  if (ev.kind === 'activity') {
    iconName = 'ticket'; title = ev.data.title;
    sub = (ev.data.location || '') + (ev.data.costAmount ? ' · ' + money(ev.data.costAmount, ev.data.costCurrency) : '');
  } else if (ev.kind === 'checkin') {
    iconName = 'bed'; title = 'Check in: ' + ev.data.name; sub = ev.data.address || '';
  } else if (ev.kind === 'checkout') {
    iconName = 'bed'; title = 'Check out: ' + ev.data.name; sub = ev.data.address || '';
  } else if (ev.kind === 'depart') {
    iconName = transportIconKey(ev.data.mode);
    title = transportLabel(ev.data);
    var overnight = dateOnly(ev.data.departDateTime) !== dateOnly(ev.data.arriveDateTime);
    sub = overnight ? 'Arrives ' + formatDateShort(dateOnly(ev.data.arriveDateTime)) + ' at ' + timeOnly(ev.data.arriveDateTime) : ('Arrives ' + timeOnly(ev.data.arriveDateTime));
  } else { // arrive (overnight continuation, shown on the arrival day)
    iconName = transportIconKey(ev.data.mode);
    title = 'Arrive: ' + ev.data.toLocation + ' (from ' + ev.data.fromLocation + ')';
    sub = 'Overnight ' + (ev.data.mode || 'travel') + (ev.data.flightNumber ? ' ' + ev.data.flightNumber : '') + ' from ' + formatDateShort(dateOnly(ev.data.departDateTime));
  }
  // Who's tagged to whatever this event actually is — activities and
  // transport legs carry their own `companions` array (see the
  // 'tag-picker' field on their forms); a stay's check-in/check-out
  // shares the accommodation record's own tags. Markers here are the
  // same avatarMarkerHtml()-rendered ones as everywhere else, so the
  // Timeline reads consistently with the Companions tab and every item
  // list — see the plan's §5 for why this was worth adding (previously
  // the Timeline showed no companion info at all).
  // Wrapped in .item-tags (not .avatar-row) on purpose — companionTags()
  // always returns '.tag'-pill-classed spans, and .item-tags is the class
  // every OTHER tab (destinations/activities/transport/accommodation) uses
  // to wrap that exact same pill markup. .avatar-row is reserved for
  // contexts that show bare avatar markers with no pill styling around
  // them (e.g. a trip card's "who's on this trip" row) — using it here
  // too would give the Timeline's tags a different look from identical
  // tags everywhere else in the app.
  var eventCompanionIds = ev.data && ev.data.companions;
  var avatarsHtml = (eventCompanionIds && eventCompanionIds.length) ? '<div class="item-tags">' + companionTags(trip, eventCompanionIds) + '</div>' : '';
  // A timeline event is the same underlying itinerary record as its
  // corresponding Plan-tab row. Reusing rowActions keeps permissions
  // identical: scoped users may edit only an item tagged to them, while
  // deleting stays a full-scope action everywhere.
  var section = ev.kind === 'activity' ? 'activity' : ((ev.kind === 'checkin' || ev.kind === 'checkout') ? 'accommodation' : 'transport');
  var actionsHtml = rowActions(trip, section, ev.data);
  return '<div class="event-row"><span class="event-time">' + esc(ev.time) + '</span>' +
    '<span class="event-icon ' + kindClass + '">' + icon(iconName) + '</span>' +
    '<div class="event-main"><div class="event-title">' + esc(title) + '</div>' + (sub ? '<div class="event-sub">' + esc(sub) + '</div>' : '') + avatarsHtml + '</div>' + actionsHtml + '</div>';
}

function timelineDaySeed(trip, day) {
  var areas = areasForDay(trip, day);
  // A single active area is the unambiguous useful default. On transfer
  // days with multiple areas, leave the choice blank rather than guessing.
  return areas.length === 1 ? { destinationId: areas[0].destinationId } : {};
}

function timelineDayActionsHtml(trip, day) {
  if (!canFullyEditTrip(trip)) return '';
  return '<div class="day-actions" aria-label="Add to ' + esc(formatDateHeading(day)) + '">' +
    '<button class="timeline-add-btn" data-action="timeline-add-activity" data-day="' + esc(day) + '">' + icon('plus') + ' Activity</button>' +
    '<button class="timeline-add-btn" data-action="timeline-add-accommodation" data-day="' + esc(day) + '">' + icon('plus') + ' Stay</button>' +
    '<button class="timeline-add-btn" data-action="timeline-add-transport" data-day="' + esc(day) + '">' + icon('plus') + ' Travel</button>' +
  '</div>';
}

function renderTimelineTab(trip) {
  var days = tripDayList(trip);
  if (days.length === 0) {
    return '<div class="empty-state">' + icon('calendar') + '<h3>Nothing planned yet</h3>' +
      '<p>Add a destination, activity, transport leg or place to stay and this timeline will lay your trip out day by day — including overnight travel and stays that span several days.</p></div>';
  }
  var cards = days.map(function (day, i) {
    var events = eventsForDay(trip, day);
    var areas = areasForDay(trip, day);
    var stay = overnightStay(trip, day);
    var isLast = i === days.length - 1;
    var eventsHtml = events.length
      ? '<div class="day-events">' + events.map(function (ev) { return eventRowHtml(trip, ev); }).join('') + '</div>'
      : '<div class="no-day-events">Nothing logged for this day.</div>';
    var overnightHtml = '';
    if (!isLast) {
      if (stay && stay.kind === 'stay') overnightHtml = '<div class="overnight-note">' + icon('moon') + 'Sleeping at ' + esc(stay.data.name) + '</div>';
      else if (stay && stay.kind === 'transit') overnightHtml = '<div class="overnight-note">' + icon('moon') + 'Overnight ' + esc((stay.data.mode || 'travel').toLowerCase()) + ' to ' + esc(stay.data.toLocation) + '</div>';
      else overnightHtml = '<div class="overnight-note">' + icon('moon') + 'No accommodation logged for tonight</div>';
    }
    return '<div class="day-card"><div class="day-rail"><span class="day-num">' + day.slice(8, 10) + '</span>' + (isLast ? '' : '<span class="day-line"></span>') + '</div>' +
      '<div class="day-body"><div class="day-heading"><h3>' + formatDateHeading(day) + '</h3>' +
        (areas.length ? '<div class="day-areas">' + areas.map(function (a) {
          var off = a.timezone ? tzOffsetLabel(a.timezone) : '';
          return '<span class="area-chip">' + icon('pin') + esc(a.name) + (off ? ' · ' + esc(off) : '') + '</span>';
        }).join('') + '</div>' : '') +
        timelineDayActionsHtml(trip, day) + '</div>' + eventsHtml + overnightHtml + '</div></div>';
  }).join('');
  return cards;
}

/* ---------- 21. Render: Expenses tab ---------------------------------------- */

function renderExpensesTab(trip) {
  var lines = allCostLines(trip);
  var spend = tripSpend(trip);
  var byCategory = {};
  lines.forEach(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    if (!hv.known) return;
    byCategory[l.category] = (byCategory[l.category] || 0) + hv.value;
  });
  var catTiles = Object.keys(byCategory).sort(function (a, b) { return byCategory[b] - byCategory[a]; }).map(function (cat) {
    return '<div class="stat-tile"><div class="stat-label">' + esc(cat) + '</div><div class="stat-value">' + money(byCategory[cat], trip.homeCurrency) + '</div></div>';
  }).join('');
  // Expenses is a full-scope-only tab to begin with (see tabsForTrip() —
  // a scoped "user"/"viewer" grant never even gets a way to land here),
  // but "Add expense" is still gated explicitly rather than assumed, in
  // case that ever changes.
  var head = '<div class="tab-panel-head"><h2>Expenses</h2>' +
    '<div style="display:flex;gap:8px"><button class="btn" data-action="export-csv">' + icon('download') + ' Export CSV</button>' +
    (canFullyEditTrip(trip) ? '<button class="btn btn-accent" data-action="new-expense">' + icon('plus') + ' Add expense</button>' : '') + '</div></div>';

  if (lines.length === 0) {
    return head + '<div class="empty-state">' + icon('wallet') + '<h3>No expenses logged yet</h3>' +
      '<p>Costs added to activities, transport and accommodation show up here automatically — use "Add expense" for everything else, like meals, taxis and souvenirs.</p></div>';
  }

  var rows = lines.map(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    return '<tr><td>' + formatDateShort(l.date) + '</td><td>' + esc(l.type) + '</td><td>' + esc(l.desc) +
      (l.receiptRef ? '<div class="item-sub">' + esc(l.receiptRef) + '</div>' : '') + '</td>' +
      '<td class="num">' + money(l.amount, l.currency) + '</td>' +
      '<td class="num">' + (hv.known ? money(hv.value, trip.homeCurrency) : '<span class="rate-missing">rate needed</span>') + '</td></tr>';
  }).join('');

  return head +
    '<div class="stat-row"><div class="stat-tile"><div class="stat-label">Total (' + trip.homeCurrency + ')</div><div class="stat-value">' + money(spend.known, trip.homeCurrency) + '</div></div>' + catTiles + '</div>' +
    (spend.unknownCount ? '<div class="intro-note" style="border-color:var(--danger-soft)"><strong>' + spend.unknownCount + ' item(s)</strong> are in a currency with no exchange rate set — <button class="warn-link" data-action="switch-tab" data-tab="settings">set one in Settings</button> to include them in the total.</div>' : '') +
    '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th class="num">Amount</th><th class="num">' + esc(trip.homeCurrency) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

/* ---------- 21b. (formerly) the "Share this trip" panel ----------------
   Used to be embedded here, at the bottom of the Companions tab -- a
   standalone panel listing every grant with a revoke button, plus its
   own form to share the trip with an existing account. It's gone now:
   granting access moved onto the companion-link form itself (see
   openCompanionLinkForm()/openAddLinkedCompanionForm()/
   submitCompanionAccess() further up, and the Companions tab's own
   split into "Companions"/"Guests" sections in renderCompanionsTab()),
   so there's no separate place left that needs a dedicated list-plus-
   form UI just for sharing. GRANT_ROLE_LABELS, and the /api/trip-grants
   + /api/trip-grants/revoke endpoints this used to talk to, are all
   still very much alive -- see submitCompanionAccess() above for where
   they're used from instead. */

/* ---------- 22. Render: Settings tab ------------------------------------------ */

function renderSettingsTab(trip) {
  var currencies = usedCurrencies(trip);
  var canEdit = canFullyEditTrip(trip);
  var rateRows = currencies.map(function (cur) {
    var rate = trip.currencyRates[cur];
    return '<div class="field-row"><div class="field"><label>1 ' + esc(cur) + ' =</label>' +
      '<input type="number" step="0.0001" name="rate_' + cur + '" value="' + (rate !== undefined ? esc(rate) : '') + '" placeholder="e.g. 0.79"' + (canEdit ? '' : ' disabled') + '></div>' +
      '<div class="field"><label>&nbsp;</label><div class="field-hint" style="margin-top:11px">' + esc(trip.homeCurrency) + ' per 1 ' + esc(cur) + '</div></div></div>';
  }).join('');
  // The rates form itself is still shown to a scoped "user"/"viewer"
  // grant (it's useful, honest information — what currencies this trip
  // uses and at what rate), just with every input disabled and no Save
  // button, rather than hidden outright the way Add/Edit/Delete controls
  // are elsewhere. Trip-level settings like this aren't something a
  // "user" grant can change either way (see canFullyEditTrip()).
  return (
    '<div class="tab-panel-head"><h2>Settings</h2></div>' +
    '<form id="rates-form">' +
      '<div class="field"><label>Home currency</label>' +
      // Hand-built rather than through suggestInputHtml() (this form
      // isn't part of the fieldHtml()/openForm() modal system), but
      // uses the exact same `.suggest-input-wrap` + `data-suggest-type`
      // markup so it gets the identical dropdown as every other
      // currency/country/city/timezone/airport field — see the
      // "Generic suggestion dropdown" section further down.
      '<div class="suggest-input-wrap" style="max-width:140px">' +
        '<input type="text" autocomplete="off" data-suggest-type="currency" maxlength="6" style="text-transform:uppercase" name="homeCurrency" value="' + esc(trip.homeCurrency) + '"' + (canEdit ? '' : ' disabled') + '>' +
        '<div class="suggest-list" id="homeCurrency-suggest"></div>' +
      '</div>' +
      '<div class="field-hint">Every total on this trip converts into this currency.</div></div>' +
      (currencies.length
        ? '<div class="field"><label>Fixed exchange rates for this trip</label><div class="field-hint" style="margin-bottom:10px">Used whenever an item in that currency doesn\'t have its own rate override. One rate per currency for the whole trip, as you set up.</div><div class="rate-table">' + rateRows + '</div></div>'
        : '<p class="field-hint">No foreign-currency costs logged yet — rates will appear here once you add one.</p>') +
      (canEdit ? '<button type="submit" class="btn btn-primary">Save currency settings</button>' : '') +
    '</form>' +
    (canEdit ? '<div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--line)">' +
      '<h3 style="font-size:15px;margin-bottom:8px">Integrations</h3>' +
      '<p class="field-hint">The "Look up" button on the transport form (Flight number field) uses the ' +
      '<strong>AeroDataBox Free Tier, through RapidAPI</strong>, to fill in the airline, airports and ' +
      'scheduled times for a flight number + date. This is a per-site setup, not something stored in this ' +
      'trip — the API key lives only as a Cloudflare Worker secret, never in this app itself.</p>' +
    '</div>' : '') +
    // The old "Share this trip" form used to live here -- it's now part
    // of the Companions tab (see openCompanionLinkForm()/
    // openAddLinkedCompanionForm() above), since who can log in and see
    // this trip and who's tagged as a companion on it turned out to be
    // one and the same "who's on this trip" question. Just a pointer for
    // anyone who remembers it being here.
    (canShareTrip(trip) ? '<div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--line)">' +
      '<h3 style="font-size:15px;margin-bottom:8px">Sharing</h3>' +
      '<p class="field-hint">Manage who has access to this trip from the <button class="warn-link" data-action="switch-tab" data-tab="companions">Companions tab</button>.</p>' +
    '</div>' : '') +
    (canEdit ? '<div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--line)">' +
      '<h3 style="font-size:15px;margin-bottom:8px">Danger zone</h3>' +
      '<button class="btn btn-danger" data-action="delete-trip" data-id="' + trip.tripId + '">' + icon('trash') + ' Delete this trip</button>' +
    '</div>' : '')
  );
}

/* ---------- 23. Top-level render dispatcher ------------------------------------ */

function render() {
  var app = document.getElementById('app');
  if (currentView === 'manage-users') {
    app.innerHTML = renderManageUsersView();
  } else {
    app.innerHTML = (currentView === 'trip' && currentTripId) ? renderTripView() : renderDashboard();
  }

  if (currentView === 'trip' && currentTab === 'map') {
    // The Map tab's HTML (including a fresh, empty #map-canvas div) was
    // just drawn above — mount the actual Leaflet map into it. See the Map
    // section (19b) for why this can't just be part of the HTML string
    // like everything else on the page.
    var trip = currentTrip();
    if (trip) initMap(trip);
  } else if (mapState.instance) {
    // Left the Map tab (or the trip): tear down the Leaflet instance
    // rather than leaving it running against a #map-canvas element that
    // innerHTML just replaced out from under it.
    mapState.instance.remove();
    mapState.instance = null;
    mapState.layers = null;
  }
}

/* ---------- 24. Event delegation ------------------------------------------------
   One click listener and one submit listener handle every interaction
   in the app, keyed off `data-action` attributes. This means we never
   have to re-attach listeners after re-rendering a panel's HTML. */

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.dataset.action;
  var trip = currentTripId ? currentTrip() : null;

  if (action === 'close-modal') {
    // The backdrop itself has data-action="close-modal" too (click
    // outside the modal box to dismiss it, a common UI convention) —
    // but a click that starts inside the modal and simply has no more
    // specific data-action ancestor (e.g. tapping blank space in the
    // form body) would otherwise bubble up to that same backdrop and
    // close the form by accident. Only treat it as "clicked the
    // backdrop" when the click's actual target IS the backdrop
    // element, not merely a descendant of it. Explicit close controls
    // (the × button, "Cancel") are unaffected — el there is the
    // button itself, not the backdrop.
    if (el.classList.contains('modal-backdrop') && e.target !== el) return;
    closeModal();
    return;
  }
  if (action === 'confirm-yes') { var fn = pendingConfirm; closeModal(); if (fn) fn(); return; }
  if (action === 'copy-text') {
    var value = el.dataset.value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(value).then(function () { showToast('Copied'); }).catch(function () { showToast('Could not copy'); });
    }
    return;
  }
  if (action === 'open-trip') { currentView = 'trip'; currentTripId = el.dataset.id; currentTab = 'timeline'; render(); return; }
  if (action === 'back-to-dashboard') { currentView = 'dashboard'; currentTripId = null; render(); return; }
  if (action === 'switch-tab') { currentTab = el.dataset.tab; render(); return; }
  if (action === 'toggle-map-layer') {
    // Handled directly against the live Leaflet map/layers rather than
    // through updateState()/render() — this is a view preference, not
    // trip data, and re-rendering would tear down and rebuild the whole
    // map (see initMap()) just to flip one layer's visibility.
    var layerKey = el.dataset.layer;
    mapState.visibility[layerKey] = el.checked;
    if (mapState.instance && mapState.layers && mapState.layers[layerKey]) {
      if (el.checked) mapState.layers[layerKey].addTo(mapState.instance);
      else mapState.instance.removeLayer(mapState.layers[layerKey]);
    }
    return;
  }
  if (action === 'map-day-prev' || action === 'map-day-next') {
    if (!trip) return;
    var mapDays = tripDayList(trip);
    var mapDayIndex = mapDays.indexOf(mapState.day);
    var direction = action === 'map-day-prev' ? -1 : 1;
    if (mapDayIndex >= 0 && mapDays[mapDayIndex + direction]) {
      mapState.day = mapDays[mapDayIndex + direction];
      mapState.wholeTrip = false;
      render();
    }
    return;
  }
  if (action === 'map-show-whole-trip') {
    mapState.wholeTrip = !mapState.wholeTrip;
    render();
    return;
  }
  if (action === 'lookup-flight') { performFlightLookup(el); return; }
  if (action === 'logout') { doLogout(); return; }
  if (action === 'open-avatar-picker') { openAvatarPicker(); return; }
  if (action === 'pick-avatar-swatch') {
    // Client-side only until Save -- swap which swatch has .is-selected
    // within THIS kind's grid (colour and animal each track their own
    // selection independently), update that kind's hidden input, then
    // refresh the shared preview so it always shows both picks together.
    var swatchForm = el.closest('form');
    if (!swatchForm) return;
    var hiddenInput = swatchForm.querySelector('input[name="' + el.dataset.kind + '"]');
    if (hiddenInput) hiddenInput.value = el.dataset.value;
    var swatchGrid = el.closest('.avatar-swatch-grid');
    if (swatchGrid) {
      Array.prototype.forEach.call(swatchGrid.querySelectorAll('.avatar-swatch-btn'), function (btn) { btn.classList.remove('is-selected'); });
    }
    el.classList.add('is-selected');
    updateAvatarPickerPreview(swatchForm);
    return;
  }
  if (action === 'open-manage-users') { loadAndRenderManageUsers(); return; }
  if (action === 'new-user') { openUserForm(); return; }
  if (action === 'edit-user') { openUserForm(managedUsers.find(function (u) { return u.id === el.dataset.id; })); return; }
  if (action === 'delete-user') { deleteUserAccount(el.dataset.id); return; }
  if (action === 'new-trip') { openTripForm(); return; }
  if (action === 'edit-trip') { openTripForm(byId(state.trips, el.dataset.id, 'tripId')); return; }
  if (action === 'delete-trip') { deleteTrip(el.dataset.id); return; }
  if (action === 'export-csv') { exportCsv(trip); return; }

  if (action === 'search-location') {
    var searchPicker = el.closest('[data-location-picker]');
    if (searchPicker) searchLocationPicker(searchPicker);
    return;
  }
  if (action === 'select-location-result') {
    var resultPicker = el.closest('[data-location-picker]');
    var resultIndex = Number(el.dataset.locationIndex);
    var candidate = resultPicker && locationPickerResults[resultPicker.dataset.locationPrefix] && locationPickerResults[resultPicker.dataset.locationPrefix][resultIndex];
    if (resultPicker && candidate) selectLocationResult(resultPicker, candidate);
    return;
  }
  if (action === 'use-typed-location') {
    var typedPicker = el.closest('[data-location-picker]');
    if (typedPicker) {
      var typedPrefix = typedPicker.dataset.locationPrefix;
      ['Lat', 'Lng', 'LocationRef', 'LocationMethod', 'LocationGranularity', 'LocationKindLabel'].forEach(function (suffix) { pickerSet(typedPicker, typedPrefix + suffix, ''); });
      pickerSet(typedPicker, typedPrefix + 'LocationStale', 'false');
      if (typedPicker.dataset.boundaryPrefix) {
        var boundaryPrefix = typedPicker.dataset.boundaryPrefix;
        pickerSet(typedPicker, boundaryPrefix + 'Ref', ''); pickerSet(typedPicker, boundaryPrefix + 'Quality', 'none'); pickerSet(typedPicker, boundaryPrefix + 'Bbox', '');
      }
      var typedSummary = typedPicker.querySelector('[data-location-summary]');
      if (typedSummary) typedSummary.hidden = true;
      pickerHint(typedPicker, 'Saved as text only — it will remain unmapped until you search or set a pin.');
    }
    return;
  }
  if (action === 'set-location-pin') {
    var pinPicker = el.closest('[data-location-picker]');
    if (pinPicker) openLocationPickerMap(pinPicker, true);
    return;
  }
  if (action === 'preview-location') {
    var previewPicker = el.closest('[data-location-picker]');
    if (previewPicker) openLocationPickerMap(previewPicker, false);
    return;
  }

  if (!trip) return;
  if (action === 'timeline-add-activity') {
    openActivityForm(trip, null, Object.assign({ date: el.dataset.day }, timelineDaySeed(trip, el.dataset.day)));
    return;
  }
  if (action === 'timeline-add-accommodation') {
    openAccommodationForm(trip, null, Object.assign({ checkInDate: el.dataset.day, checkOutDate: addDays(el.dataset.day, 1) }, timelineDaySeed(trip, el.dataset.day)));
    return;
  }
  if (action === 'timeline-add-transport') {
    openTransportForm(trip, null, Object.assign({ departDate: el.dataset.day, arriveDate: el.dataset.day }, timelineDaySeed(trip, el.dataset.day)));
    return;
  }
  if (action === 'new-destination') { openDestinationForm(trip); return; }
  if (action === 'edit-destination') { openDestinationForm(trip, byId(trip.destinations, el.dataset.id, 'destinationId')); return; }
  if (action === 'delete-destination') { deleteEntity(trip, 'destinations', el.dataset.id, 'destination'); return; }
  if (action === 'new-activity') { openActivityForm(trip); return; }
  if (action === 'edit-activity') { openActivityForm(trip, byId(trip.activities, el.dataset.id, 'activityId')); return; }
  if (action === 'delete-activity') { deleteEntity(trip, 'activities', el.dataset.id, 'activity'); return; }
  if (action === 'new-transport') { openTransportForm(trip); return; }
  if (action === 'edit-transport') { openTransportForm(trip, byId(trip.transport, el.dataset.id, 'transportId')); return; }
  if (action === 'delete-transport') { deleteEntity(trip, 'transport', el.dataset.id, 'transport leg'); return; }
  if (action === 'new-accommodation') { openAccommodationForm(trip); return; }
  if (action === 'edit-accommodation') { openAccommodationForm(trip, byId(trip.accommodation, el.dataset.id, 'accommodationId')); return; }
  if (action === 'delete-accommodation') { deleteEntity(trip, 'accommodation', el.dataset.id, 'accommodation'); return; }
  if (action === 'new-contact') { openContactForm(trip); return; }
  if (action === 'edit-contact') { openContactForm(trip, byId(trip.contacts, el.dataset.id, 'contactId')); return; }
  if (action === 'delete-contact') { deleteEntity(trip, 'contacts', el.dataset.id, 'contact'); return; }
  if (action === 'new-companion') { openCompanionForm(trip); return; }
  if (action === 'edit-companion') { openCompanionForm(trip, byId(trip.companions, el.dataset.id, 'companionId')); return; }
  if (action === 'delete-companion') { deleteEntity(trip, 'companions', el.dataset.id, 'companion'); return; }
  if (action === 'link-companion') { openCompanionLinkForm(trip, byId(trip.companions, el.dataset.id, 'companionId')); return; }
  if (action === 'new-linked-companion') { openAddLinkedCompanionForm(trip); return; }
  if (action === 'new-expense') { openExpenseForm(trip); return; }
  if (action === 'edit-expense') { openExpenseForm(trip, byId(trip.expenses, el.dataset.id, 'expenseId')); return; }
  if (action === 'delete-expense') { deleteEntity(trip, 'expenses', el.dataset.id, 'expense'); return; }
});

// Powers "reactive" forms: when a field named by the open form's
// `reactiveKey` changes, we recompute the field list from the form's
// own current values and re-render only #modal-fields, so e.g.
// switching Flight → Car swaps in the right fields without discarding
// From/To, dates, cost, etc. `reactiveKey` can be a single field name
// (most forms) or an array of names — Transport's form watches three:
// "Mode" (swaps in flight-number vs. license-plate etc.), "Paid with"
// (swaps in the Cash/Points/Combo fields), and the exchange-rate
// checkbox (shows/hides its override input) — see openTransportForm().
document.addEventListener('change', function (e) {
  if (e.target.matches('[data-map-day-input]')) {
    mapState.day = e.target.value;
    mapState.wholeTrip = false;
    render();
    return;
  }
  var cfg = window.__formConfig;
  if (!cfg || !cfg.reactiveKey) return;
  var keys = Array.isArray(cfg.reactiveKey) ? cfg.reactiveKey : [cfg.reactiveKey];
  var form = e.target.closest('#entity-form');
  if (!form || keys.indexOf(e.target.name) === -1) return;
  var values = currentFormValues(form);
  var container = document.getElementById('modal-fields');
  if (container) container.innerHTML = formFieldsHtml(cfg, values);
});

document.addEventListener('submit', function (e) {
  if (e.target.id === 'login-form') {
    e.preventDefault();
    var fdLogin = new FormData(e.target);
    submitAuthForm('/WayPoint/api/login', { username: fdLogin.get('username'), password: fdLogin.get('password') });
    return;
  }
  if (e.target.id === 'setup-form') {
    e.preventDefault();
    var fdSetup = new FormData(e.target);
    submitAuthForm('/WayPoint/api/setup', { setupKey: fdSetup.get('setupKey'), username: fdSetup.get('username'), password: fdSetup.get('password') });
    return;
  }
  if (e.target.id === 'user-form') {
    e.preventDefault();
    var fdUser = new FormData(e.target);
    var existingId = e.target.dataset.existingId || '';
    var userPayload = { username: fdUser.get('username') || '' };
    var userPassword = fdUser.get('password') || '';
    if (userPassword) userPayload.password = userPassword;
    if (existingId) userPayload.id = existingId;
    saveUserAccount(userPayload);
    return;
  }
  if (e.target.id === 'companion-link-form') {
    e.preventDefault();
    var fdLink = new FormData(e.target);
    submitCompanionAccess({
      tripId: e.target.dataset.tripId,
      companionId: e.target.dataset.companionId,
      username: (fdLink.get('username') || '').trim(),
      // fd.has('role') is false when the privilege select was rendered
      // disabled (see openCompanionLinkForm()'s roleLocked case) -- a
      // disabled field is never included in a submitted FormData at
      // all, which is exactly how submitCompanionAccess() tells "leave
      // access untouched" apart from "'' was actually chosen" (see its
      // own comment on what each value of payload.role means).
      role: fdLink.has('role') ? (fdLink.get('role') || '') : undefined,
      priorAccountId: e.target.dataset.priorAccountId || null
    });
    return;
  }
  if (e.target.id === 'add-linked-companion-form') {
    e.preventDefault();
    var fdAddLinked = new FormData(e.target);
    submitAddLinkedCompanion({
      tripId: e.target.dataset.tripId,
      name: (fdAddLinked.get('name') || '').trim(),
      username: (fdAddLinked.get('username') || '').trim(),
      role: fdAddLinked.get('role') || 'user'
    });
    // Deliberately no closeModal() here -- submitAddLinkedCompanion()'s
    // own final step, submitCompanionAccess(), already closes it on
    // success (and leaves it open with an error toast on failure, same
    // as filling in the standalone link/access form wrong would).
    return;
  }
  if (e.target.id === 'avatar-pick-form') {
    e.preventDefault();
    var fdAvatar = new FormData(e.target);
    submitAvatarPick({ color: fdAvatar.get('color'), animal: fdAvatar.get('animal') });
    return;
  }
  if (e.target.id === 'entity-form') {
    e.preventDefault();
    var cfg = window.__formConfig;
    if (!cfg) return;
    // Read every field actually present in the form right now — for a
    // reactive form (e.g. Transport) that's whichever mode-specific
    // fields are currently shown, not a fixed list.
    var values = currentFormValues(e.target);
    cfg.onSubmit(values);
    closeModal();
    return;
  }
  if (e.target.id === 'rates-form') {
    e.preventDefault();
    // Every input in this form is rendered `disabled` for a scoped
    // "user"/"viewer" grant (see renderSettingsTab()), so this shouldn't
    // normally be reachable for one at all -- this check is just a
    // belt-and-braces guard against an unusual browser's implicit-submit
    // behavior with a form full of disabled fields. The Worker would
    // reject the resulting save either way (see "SAVING SAFELY" in
    // src/worker.js), but there's no reason to even try.
    if (!canFullyEditTrip(currentTrip())) return;
    var fd2 = new FormData(e.target);
    updateState(function (next) {
      var t = byId(next.trips, currentTripId, 'tripId');
      t.homeCurrency = (fd2.get('homeCurrency') || t.homeCurrency).toUpperCase();
      var rates = {};
      usedCurrencies(t).forEach(function (cur) {
        var v = fd2.get('rate_' + cur);
        if (v !== null && v !== '') rates[cur] = Number(v);
      });
      t.currencyRates = rates;
    });
    showToast('Currency settings saved');
  }
});

/* ---------- 25. Init ------------------------------------------------------------
   Restore whatever trip/tab the viewer was last looking at (stashed in
   sessionStorage right before a save-triggered reload), then draw the
   page for the first time. */

(async function init() {
  // Find out who (if anyone) is already logged in on this browser, then
  // hand off to renderBoot() to decide what to actually show — the login
  // screen, or (once state is loaded) the normal app. See section 4b,
  // "Auth", further up for both of these.
  await checkAuth();
  await renderBoot();
})();
</script>
