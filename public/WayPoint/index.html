<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Leaflet (the Map tab's mapping library) is vendored locally under
     vendor/leaflet/ rather than pulled from a CDN, so the Map tab still
     works even if some external CDN happens to be unreachable. Only the
     map tiles themselves and the place-name lookups (see the Map section
     of the main script below) need the open internet at runtime.
     Deliberately an absolute path (starting with /WayPoint/), not a
     relative one — a relative path here resolves differently depending
     on whether the visited URL ends in "/WayPoint" or "/WayPoint/", and
     would silently 404 in the no-trailing-slash case. -->
<link rel="stylesheet" href="/WayPoint/vendor/leaflet/leaflet.css">
<style>
/* ============================================================
   WAYPOINT — a multi-trip travel planner
   ------------------------------------------------------------
   This stylesheet is organised top-to-bottom as:
     1. Design tokens (colors/type/spacing) for light + dark mode
     2. Reset & base element styles
     3. Layout shell (top bar, page container)
     4. Components (cards, tabs, timeline, forms, modal, toast)
   ============================================================ */

/* ---- 1. Design tokens --------------------------------------- */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #e3e6dd;
  --ink: #1a2233;
  --ink-soft: #56607a;
  --ink-faint: #838d9e;
  --line: #d5d9cd;
  --accent: #a6752b;
  --accent-ink: #ffffff;
  --accent-soft: #f3e6d2;
  --teal: #1f6f63;
  --teal-soft: #dcefe9;
  --danger: #b24444;
  --danger-soft: #f6e1df;
  --success: #2f7d4f;
  --success-soft: #dff0e3;
  --shadow: 0 1px 2px rgba(26,34,51,.06), 0 8px 24px -12px rgba(26,34,51,.18);
  --radius: 12px;
  --radius-sm: 8px;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c;
    --surface: #1b212b;
    --surface-2: #232b37;
    --ink: #edefea;
    --ink-soft: #a2acbe;
    --ink-faint: #6e788c;
    --line: #2c3542;
    --accent: #d9a24b;
    --accent-ink: #1a1206;
    --accent-soft: #3a2d15;
    --teal: #4fbfae;
    --teal-soft: #16302c;
    --danger: #e08585;
    --danger-soft: #3a2020;
    --success: #6fcb94;
    --success-soft: #1c3527;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #12161c;
  --surface: #1b212b;
  --surface-2: #232b37;
  --ink: #edefea;
  --ink-soft: #a2acbe;
  --ink-faint: #6e788c;
  --line: #2c3542;
  --accent: #d9a24b;
  --accent-ink: #1a1206;
  --accent-soft: #3a2d15;
  --teal: #4fbfae;
  --teal-soft: #16302c;
  --danger: #e08585;
  --danger-soft: #3a2020;
  --success: #6fcb94;
  --success-soft: #1c3527;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

/* ---- 2. Reset & base ------------------------------------------ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--teal); }
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 14px; }
.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; }
::selection { background: var(--accent-soft); }

/* ---- 3. Layout shell -------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 20px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .01em; }
.brand .icon { width: 22px; height: 22px; color: var(--accent); }
.save-indicator { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); min-width: 90px; text-align: right; }
.save-indicator[data-kind="saving"] { color: var(--ink-soft); }
.save-indicator[data-kind="error"] { color: var(--danger); }
.save-indicator[data-kind="readonly"] { color: var(--danger); }
.save-indicator[data-kind="saved"] { color: var(--success); }

.page { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

/* ---- 4a. Buttons & form controls --------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 8px 16px; font-size: 13.5px; font-weight: 500;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--ink-faint); }
.btn-primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-primary:hover { opacity: .9; border-color: var(--ink); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-soft); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-icon { padding: 7px; border-radius: 8px; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink);
}
textarea { resize: vertical; min-height: 60px; }
.field { margin-bottom: 14px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-hint { font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; }

/* ---- 4b. Dashboard ------------------------------------------------ */
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
.section-head h1 { font-size: 26px; }
.trip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.trip-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
  transition: transform .12s;
}
.trip-card:hover { transform: translateY(-2px); }
.trip-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.trip-card h3 { font-size: 18px; }
.trip-dates { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.pill-upcoming { background: var(--teal-soft); color: var(--teal); }
.pill-ongoing { background: var(--accent-soft); color: var(--accent); }
.pill-past { background: var(--surface-2); color: var(--ink-faint); }
.trip-stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-soft); flex-wrap: wrap; }
.trip-stats b { color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
.card-actions { display: flex; gap: 4px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty-state .icon { width: 34px; height: 34px; color: var(--ink-faint); margin-bottom: 10px; }
.empty-state h3 { margin-bottom: 6px; color: var(--ink); }
.empty-state p { max-width: 440px; margin: 0 auto; font-size: 13.5px; }
.intro-note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 22px; font-size: 13px; color: var(--ink-soft); }
.intro-note strong { color: var(--ink); }

/* ---- 4c. Trip header & tabs ---------------------------------------- */
.trip-header { margin-bottom: 22px; }
.back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 10px; }
.back-link .icon { width: 14px; height: 14px; transform: rotate(180deg); }
.trip-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.trip-title-row h1 { font-size: 28px; }
.trip-meta { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.trip-meta b { font-family: var(--font-mono); color: var(--ink); }
.warn-link { color: var(--danger); cursor: pointer; background: none; border: none; font-size: 13px; padding: 0; text-decoration: underline; }

/* The two "big picture" views (Timeline, Map) — larger and more prominent
   than the regular data-entry tabs below, since they're the main thing
   most people open a trip to look at. */
.hero-row { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.hero-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  font-family: var(--font-display); font-weight: 600; font-size: 16px; cursor: pointer;
  transition: transform .12s, border-color .15s;
}
.hero-btn .icon { width: 20px; height: 20px; color: var(--accent); }
.hero-btn:hover { transform: translateY(-1px); }
.hero-btn.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.hero-btn.active .icon { color: var(--accent); }

.tabbar { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 20px 0 22px; overflow-x: auto; }
.tab-btn {
  padding: 9px 14px; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--ink-soft); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.tab-panel-head h2 { font-size: 18px; }

/* ---- 4d. Item list rows (destinations/activities/transport/etc) ------ */
.item-list { display: flex; flex-direction: column; gap: 10px; }
.item-row {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 13px 14px; display: flex; gap: 12px; align-items: flex-start;
}
.item-row .item-icon {
  width: 34px; height: 34px; border-radius: 9px; background: var(--surface-2); color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.item-row .item-icon .icon { width: 17px; height: 17px; }
.item-main { flex: 1; min-width: 0; }
.item-title-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item-title { font-weight: 600; font-size: 14.5px; }
.item-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.item-tags { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; font-family: var(--font-mono); color: var(--ink-soft); background: var(--surface-2); border-radius: 6px; padding: 2px 7px; display: inline-flex; align-items: center; gap: 4px; }
.tag .icon { width: 11px; height: 11px; }
.tag-cost { color: var(--accent); background: var(--accent-soft); }
.item-actions { display: flex; gap: 2px; flex-shrink: 0; }
.copy-btn { background: none; border: none; color: var(--ink-faint); cursor: pointer; padding: 2px; display: inline-flex; }
.copy-btn:hover { color: var(--ink); }
.copy-btn .icon { width: 12px; height: 12px; }

/* ---- 4e. Timeline ------------------------------------------------- */
.day-card { display: flex; gap: 14px; margin-bottom: 22px; }
.day-rail { display: flex; flex-direction: column; align-items: center; width: 46px; flex-shrink: 0; }
.day-num { font-family: var(--font-mono); font-weight: 600; font-size: 15px; background: var(--ink); color: var(--surface); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.day-line { flex: 1; width: 2px; background: var(--line); margin-top: 4px; }
.day-body { flex: 1; min-width: 0; padding-bottom: 4px; }
.day-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.day-heading h3 { font-size: 15.5px; }
.day-areas { display: flex; gap: 6px; flex-wrap: wrap; }
.area-chip { font-size: 11px; background: var(--teal-soft); color: var(--teal); border-radius: 999px; padding: 2px 9px; display: inline-flex; align-items: center; gap: 4px; }
.day-events { display: flex; flex-direction: column; gap: 8px; }
.event-row { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; }
.event-time { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); width: 44px; flex-shrink: 0; padding-top: 1px; }
.event-icon { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.event-icon .icon { width: 14px; height: 14px; }
.event-icon.k-activity { background: var(--accent-soft); color: var(--accent); }
.event-icon.k-transport { background: var(--teal-soft); color: var(--teal); }
.event-icon.k-stay { background: var(--surface-2); color: var(--ink-soft); }
.event-main { flex: 1; min-width: 0; }
.event-title { font-weight: 600; font-size: 13.5px; }
.event-sub { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
.overnight-note { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-faint); margin-top: 8px; padding-left: 2px; }
.overnight-note .icon { width: 13px; height: 13px; }
.no-day-events { font-size: 12.5px; color: var(--ink-faint); font-style: italic; padding: 4px 0; }

/* ---- 4f. Expenses table ------------------------------------------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 18px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; }
.stat-tile .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); font-weight: 600; }
.stat-tile .stat-value { font-family: var(--font-mono); font-size: 19px; font-weight: 600; margin-top: 4px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); background: var(--surface-2); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
.rate-missing { color: var(--danger); font-size: 11.5px; }
.rate-table label { margin: 0; }
.rate-table .field-row { grid-template-columns: 1fr 1fr; align-items: end; }

/* ---- 4g. Modal & toast --------------------------------------------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,18,24,.5); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
.modal { background: var(--surface); border-radius: var(--radius); max-width: 520px; width: 100%; box-shadow: var(--shadow); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 18px 20px; max-height: 65vh; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
.confirm-text { font-size: 14px; color: var(--ink-soft); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); z-index: 200; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

@media (max-width: 640px) {
  .field-row { grid-template-columns: 1fr; }
  .trip-title-row h1 { font-size: 23px; }
}

/* ---- 4h. Map tab ----------------------------------------------------- */
.map-toggles { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.map-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); cursor: pointer; user-select: none; }
.map-toggle input { margin: 0; cursor: pointer; }
.map-toggle-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.map-canvas { height: 480px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); }
.map-status { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }
/* Leaflet's popup chrome is styled inline by the library; these few rules
   just make it sit comfortably against the app's own card/surface look
   instead of Leaflet's plain-white default. */
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
.leaflet-popup-content { font-family: var(--font-body); font-size: 13px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6z"/></svg>
    Waypoint
  </div>
  <span id="save-indicator" class="save-indicator"></span>
</div>
<div class="page">
  <div id="app"></div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/WayPoint/vendor/leaflet/leaflet.js"></script>
<script>
/* ================================================================
   WAYPOINT — application logic
   ----------------------------------------------------------------
   This file has no build step and no framework: it is plain
   JavaScript that (a) keeps all trip data in one JS object called
   `state`, (b) turns that object into HTML strings whenever
   something changes (the render* functions), and (c) saves the
   updated object to our own tiny JSON API (see loadInitialState()
   and persist() below), which stores it in Cloudflare KV — see
   src/worker.js in this same repo for the server side of that API —
   so the trips are still here next time you open the page. Sections
   below are ordered so each one only depends on the ones above it.
   ================================================================ */

/* ---------- 1. Small constants ---------------------------------- */

var COMMON_CURRENCIES = ['GBP','USD','EUR','JPY','AUD','CAD','CHF','CNY','HKD',
  'NZD','SGD','THB','VND','INR','MXN','ZAR','AED','TRY','KRW','IDR','MYR',
  'PHP','BRL','SEK','NOK','DKK','PLN','CZK','HUF','EGP','MAD'];

var WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var TRANSPORT_MODES = ['Flight','Train','Bus','Car','Ferry','Other'];
var EXPENSE_CATEGORIES = ['Food & drink','Transport','Accommodation','Activities','Shopping','Other'];

// A curated set of IANA timezone names covering common travel
// destinations. The destination form's timezone field offers these as
// suggestions but still accepts any free-text value.
var COMMON_TIMEZONES = ['UTC','Europe/London','Europe/Dublin','Europe/Lisbon','Europe/Paris','Europe/Madrid',
  'Europe/Berlin','Europe/Amsterdam','Europe/Zurich','Europe/Rome','Europe/Athens','Europe/Istanbul','Europe/Moscow',
  'America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Anchorage',
  'America/Toronto','America/Vancouver','America/Mexico_City','America/Bogota','America/Lima',
  'America/Sao_Paulo','America/Buenos_Aires','America/Santiago',
  'Asia/Dubai','Asia/Karachi','Asia/Kolkata','Asia/Dhaka','Asia/Bangkok','Asia/Jakarta','Asia/Singapore',
  'Asia/Kuala_Lumpur','Asia/Hong_Kong','Asia/Shanghai','Asia/Taipei','Asia/Seoul','Asia/Tokyo',
  'Asia/Manila','Asia/Ho_Chi_Minh',
  'Australia/Perth','Australia/Adelaide','Australia/Sydney','Australia/Brisbane',
  'Pacific/Auckland','Pacific/Fiji','Pacific/Honolulu',
  'Africa/Cairo','Africa/Johannesburg','Africa/Nairobi','Africa/Lagos','Indian/Maldives'];

// Country names for the destination form's autocomplete. Not an
// official ISO list — just plain English names a traveller would
// type — offered as suggestions via a datalist, so any value the
// viewer actually types is still accepted.
var COMMON_COUNTRIES = ['Afghanistan','Albania','Algeria','Andorra','Angola','Argentina','Armenia','Australia',
  'Austria','Azerbaijan','Bahamas','Bahrain','Bangladesh','Barbados','Belarus','Belgium','Belize','Benin','Bhutan',
  'Bolivia','Bosnia and Herzegovina','Botswana','Brazil','Brunei','Bulgaria','Burkina Faso','Burundi','Cambodia',

/* ---------- 2. Generic utilities --------------------------------- */

// Turns any value into a short random-ish id, unique enough for a
// personal planner (not a distributed database, so this is plenty).
function newId() {
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

// Escapes text so it is always safe to drop straight into an HTML
// template string, whether it ends up as element text or inside a
// quoted attribute. Without this, a note containing e.g. `<` or `"`
// could break the page's markup.
function esc(value) {
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function byId(list, id) {
  return (list || []).find(function (x) { return x.id === id; });
}

// Deep-clones the app state before we mutate it, so a half-finished
// edit never leaks into the UI before it's actually saved.
function cloneState(s) {
  if (typeof structuredClone === 'function') return structuredClone(s);
  return JSON.parse(JSON.stringify(s));
}

function slug(str) {
  return String(str || 'trip').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'trip';
}

/* ---- date/time helpers ----
   All dates are stored as plain "YYYY-MM-DD" strings and combined
   date+times as "YYYY-MM-DDTHH:MM". We deliberately avoid feeding
   these into `new Date("YYYY-MM-DD")` for display, because that
   parses as UTC midnight and then a *local* timezone conversion can
   silently roll the displayed date backwards a day. Working with
   the UTC getters keeps every user's timeline showing the date they
   actually typed in, no matter where they are. */

function addDays(dateStr, n) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}

function formatDateHeading(dateStr) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  return WEEKDAYS[dt.getUTCDay()] + ' ' + parts[2] + ' ' + MONTHS[parts[1] - 1] + ' ' + parts[0];
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  var parts = dateStr.split('-').map(Number);
  return parts[2] + ' ' + MONTHS[parts[1] - 1] + ' ' + parts[0];
}

function dateOnly(iso) { return iso ? iso.slice(0, 10) : ''; }
function timeOnly(iso) { return (iso && iso.length >= 16) ? iso.slice(11, 16) : ''; }

function combineDateTime(date, time) {
  if (!date) return '';
  return date + 'T' + (time || '00:00');
}
function splitDateTime(iso) {
  return { date: dateOnly(iso), time: timeOnly(iso) };
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

/* ---- currency helpers ---- */

// Converts an amount in `currency` into the trip's home currency.
// A per-item `rateOverride` always wins; otherwise we fall back to
// the trip's one fixed rate for that currency (set in Settings).
// `known` is false when neither is available, so callers can flag
// the amount instead of silently treating it as zero.
function homeValue(trip, amount, currency, rateOverride) {
  var amt = Number(amount) || 0;
  if (!currency || currency === trip.homeCurrency) return { value: amt, rateUsed: 1, known: true };
  var rate = (rateOverride !== undefined && rateOverride !== null && rateOverride !== '')
    ? Number(rateOverride)
    : trip.currencyRates[currency];
  if (rate === undefined || rate === null || isNaN(rate)) return { value: 0, rateUsed: null, known: false };
  return { value: amt * rate, rateUsed: rate, known: true };
}

function money(amount, currency) {
  var n = Number(amount) || 0;
  return (currency || '') + ' ' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Turns an IANA timezone name (e.g. "Asia/Bangkok") into a short
// current UTC-offset label (e.g. "GMT+7") using the browser's own
// timezone database — no network call involved. Returns '' for a
// blank or unrecognised timezone rather than throwing, since this is
// only ever used for a friendly hint next to the name the user typed.
function tzOffsetLabel(tz) {
  if (!tz) return '';
  try {
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(new Date());
    var part = parts.find(function (p) { return p.type === 'timeZoneName'; });
    return part ? part.value : '';
  } catch (e) {
    return '';
  }
}

// Returns the icon key that best represents a transport mode, so the
// timeline and transport list show a plane for flights, a train icon
// for trains, and so on.
function transportIconKey(mode) {
  var m = (mode || '').toLowerCase();
  if (m === 'flight') return 'plane';
  if (m === 'train') return 'train';
  if (m === 'bus') return 'bus';
  if (m === 'car') return 'car';
  if (m === 'ferry') return 'ferry';
  return 'arrowRight';
}

// One-line label for a transport leg, e.g. "Flight BA15: LHR → HND" or
// plain "Car: Hotel → Airport" for modes with no flight number. Shared
// by the Transport tab, the Timeline and the expense ledger so the
// same leg always reads the same way everywhere.
function transportLabel(t) {
  return (t.mode || 'Transport') + (t.flightNumber ? ' ' + t.flightNumber : '') + ': ' + t.fromLocation + ' → ' + t.toLocation;
}

function icon(name, extraClass) {
  var body = ICONS[name] || ICONS.pin;
  return '<svg class="icon ' + (extraClass || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
}

/* ---------- 4. Application state & persistence --------------------
   `state` holds every trip and is the single source of truth for
   everything on screen. `currentView` / `currentTripId` / `currentTab`
   track where the viewer is right now (dashboard vs. a trip, which
   tab) — that's per-viewer navigation, not trip data, so it is kept
   out of `state` and never saved into the page. */

var state = { trips: [] };
var currentView = 'dashboard';
var currentTripId = null;
var currentTab = 'timeline';

// Self-hosted version: state no longer lives inside the page's own HTML
// (that was the Claude Artifact "publish" trick). Instead, the very
// first thing this page does (see the init() function at the bottom of
// this file) is fetch() the saved data from our own tiny JSON API,
// which is backed by Cloudflare KV (see src/worker.js in this repo).
// This function does the fetching and always resolves to a valid
// { trips: [...] } object, even if the request fails, so the rest of
// the app never has to worry about a missing or malformed response.
async function loadInitialState() {
  try {
    var res = await fetch('/WayPoint/api/data', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('Server responded with status ' + res.status);
    var parsed = await res.json();
    if (!parsed || typeof parsed !== 'object') parsed = {};
    if (!parsed.trips) parsed.trips = [];
    return parsed;
  } catch (e) {
    console.error('Waypoint: could not load saved data from the server', e);
    showToastSafe('Could not load your saved trips — starting from a blank slate. Refresh to try again.');
    return { trips: [] };
  }
}

// showToast() itself isn't defined yet at the point loadInitialState()
// first runs (script order), and toast-root may not exist yet either if
// something goes very wrong very early — this tiny wrapper just makes
// sure a failed load never throws a *second*, more confusing error on
// top of the first one.
function showToastSafe(message) {
  try { showToast(message); } catch (e) { console.error(message); }
}


function setSaveStatus(kind, message) {
  var el = document.getElementById('save-indicator');
  if (!el) return;
  el.dataset.kind = kind;
  var labels = { saving: 'Saving…', saved: 'Saved', error: message || 'Save failed', readonly: 'Read-only', unsaved: message || 'Not saved' };
  el.textContent = labels[kind] || '';
}

// Every mutation in the app goes through here: `mutator` receives a
// deep clone of the current state and edits it in place (push into an
// array, change a field, etc). We then hand that clone to persist(),
// which saves it to the server (see below). Using a clone means a save
// that fails partway through never leaves the on-screen state
// half-changed.
function updateState(mutator) {
  var next = cloneState(state);
  mutator(next);
  persist(next);
}

// Every mutation in the app goes through updateState() -> persist():
// updateState() hands persist() a full, already-mutated copy of the
// trips data, and persist() is the only place that talks to the
// network. It (a) swaps it in as the live `state`, (b) re-renders
// immediately so the UI feels instant, and (c) saves it to the server
// in the background, updating the little "Saved" / "Saving…" label in
// the top bar so you can always tell whether your last change actually
// made it to the server.
async function persist(newState) {
  state = newState;
  try {
    sessionStorage.setItem('waypoint-nav', JSON.stringify({ view: currentView, tripId: currentTripId, tab: currentTab }));
  } catch (e) { /* sessionStorage may be unavailable in some browsers/private modes; nav just won't be restored */ }

  render();

  setSaveStatus('saving');
  try {
    var res = await fetch('/WayPoint/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('Server responded with status ' + res.status);
    setSaveStatus('saved');
  } catch (err) {
    console.error('Waypoint: save failed', err);
    setSaveStatus('error', 'Could not save');
    showToast('Could not save your change: ' + (err && err.message ? err.message : 'unknown error') + '. Your edit is only kept in this browser tab until it saves successfully.');
  }
}

/* ---------- 5. Toast & confirm dialog ------------------------------ */

function showToast(message) {
  var root = document.getElementById('toast-root');
  var div = document.createElement('div');
  div.className = 'toast';
  div.textContent = message;
  root.appendChild(div);
  requestAnimationFrame(function () { div.classList.add('show'); });
  setTimeout(function () {
    div.classList.remove('show');
    setTimeout(function () { div.remove(); }, 250);
  }, 3200);
}

var pendingConfirm = null;

function openConfirm(opts) {
  pendingConfirm = opts.onConfirm;
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal" onclick="event.stopPropagation()">' +
        '<div class="modal-head"><h2>' + esc(opts.title || 'Are you sure?') + '</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('close') + '</button></div>' +
        '<div class="modal-body"><p class="confirm-text">' + esc(opts.message) + '</p></div>' +
        '<div class="modal-foot">' +
          '<button class="btn" data-action="close-modal">Cancel</button>' +
          '<button class="btn btn-danger" data-action="confirm-yes">' + esc(opts.confirmLabel || 'Delete') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  window.__formConfig = null;
  pendingConfirm = null;
}

/* ---------- 6. Generic form-field schemas & modal builder ----------
   Rather than hand-writing six near-identical forms, every entity
   (trip, destination, activity, transport, accommodation, contact,
   expense) describes its fields as a small array. fieldHtml() turns
   one field description into the right input, and openForm() wires
   the whole array up into a modal with Cancel/Save buttons. */

function fieldHtml(field, value, trip) {
  var val = (value === undefined || value === null) ? '' : value;
  var req = field.required ? 'required' : '';
  var full = field.wide ? 'style="grid-column:1/-1"' : '';
  var inputHtml;
  switch (field.type) {
    case 'text':
      inputHtml = '<input type="text" name="' + field.key + '" value="' + esc(val) + '" ' + req +
        ' placeholder="' + esc(field.placeholder || '') + '">';
      break;
    case 'number':
      inputHtml = '<input type="number" step="0.01" name="' + field.key + '" value="' + esc(val) + '" ' + req + '>';
      break;
    case 'date':
      inputHtml = '<input type="date" name="' + field.key + '" value="' + esc(val) + '" ' + req + '>';
      break;
    case 'time':
      inputHtml = '<input type="time" name="' + field.key + '" value="' + esc(val) + '">';
      break;
    case 'textarea':
      inputHtml = '<textarea name="' + field.key + '" rows="3" placeholder="' + esc(field.placeholder || '') + '">' + esc(val) + '</textarea>';
      break;
    case 'select':
      inputHtml = '<select name="' + field.key + '">' + field.options.map(function (o) {
        return '<option value="' + esc(o) + '" ' + (o === val ? 'selected' : '') + '>' + esc(o) + '</option>';
      }).join('') + '</select>';
      break;
    case 'currency':
      inputHtml = '<input type="text" list="currency-list" maxlength="6" style="text-transform:uppercase" ' +
        'name="' + field.key + '" value="' + esc(val) + '" ' + req + ' placeholder="GBP">';
      break;
    case 'country':
      inputHtml = '<input type="text" list="country-list" maxlength="60" ' +
        'name="' + field.key + '" value="' + esc(val) + '" ' + req +
        ' placeholder="' + esc(field.placeholder || '') + '">';
      break;
    case 'timezone':
      inputHtml = '<input type="text" list="timezone-list" maxlength="40" ' +
        'name="' + field.key + '" value="' + esc(val) + '" ' + req +
        ' placeholder="' + esc(field.placeholder || '') + '">' +
        (val ? '<div class="field-hint">Currently ' + esc(tzOffsetLabel(val) || 'unrecognised') + '</div>' : '');
      break;
    case 'select-destination':
      inputHtml = '<select name="' + field.key + '"><option value="">—</option>' + (trip.destinations || []).map(function (d) {
        return '<option value="' + d.id + '" ' + (d.id === val ? 'selected' : '') + '>' + esc(d.name) + '</option>';
      }).join('') + '</select>';
      break;
    case 'select-contact':
      inputHtml = '<select name="' + field.key + '"><option value="">—</option>' + (trip.contacts || []).map(function (c) {
        return '<option value="' + c.id + '" ' + (c.id === val ? 'selected' : '') + '>' + esc(c.name) + '</option>';
      }).join('') + '</select>';
      break;
    default:
      inputHtml = '';
  }
  return '<div class="field" ' + full + '><label>' + esc(field.label) + '</label>' + inputHtml +
    (field.hint ? '<div class="field-hint">' + esc(field.hint) + '</div>' : '') + '</div>';
}

// Groups adjacent short fields into two-column rows so the form
// doesn't feel like one long single column; textareas and any field
// marked `wide` always take the full width.
// Any single-line input type can share a row; only a textarea (or a
// field explicitly marked `wide`) always takes the full width. Kept
// as a blacklist rather than a whitelist so a new short-input field
// type (like "country") doesn't need this list updated too.
function isPairableField(f) {
  return f.type !== 'textarea' && !f.wide;
}

function fieldsHtml(fields, initial, trip) {
  var out = '';
  var i = 0;
  while (i < fields.length) {
    var f = fields[i];
    var pairable = isPairableField(f);
    var next = fields[i + 1];
    var nextPairable = next && isPairableField(next);
    if (pairable && nextPairable) {
      out += '<div class="field-row">' + fieldHtml(f, initial[f.key], trip) + fieldHtml(next, initial[next.key], trip) + '</div>';
      i += 2;
    } else {
      out += fieldHtml(f, initial[f.key], trip);
      i += 1;
    }
  }
  return out;
}

// opts.fields is usually a plain array, but can instead be a function
// of the form's current values — that's how the transport form swaps
// in flight-only or car-only fields as soon as "Mode" changes. This
// always resolves it to a plain array.
function resolveFields(opts, values) {
  return (typeof opts.fields === 'function') ? opts.fields(values) : opts.fields;
}

// Reads every field currently in a live <form> into a plain object,
// so a reactive re-render (see openForm's `change` handling below)
// can carry over whatever the viewer already typed.
function currentFormValues(formEl) {
  var fd = new FormData(formEl);
  var values = {};
  fd.forEach(function (v, k) { values[k] = v; });
  return values;
}

function openForm(opts) {
  // opts: { title, fields, initial, trip, submitLabel, onSubmit,
  //         reactiveKey } — reactiveKey names a field (e.g. "mode")
  // that, when changed, should recompute a function-valued `fields`
  // and re-render just the field list, keeping everything else typed.
  window.__formConfig = opts;
  var root = document.getElementById('modal-root');
  var initial = opts.initial || {};
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal" onclick="event.stopPropagation()">' +
        '<div class="modal-head"><h2>' + esc(opts.title) + '</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal">' + icon('close') + '</button></div>' +
        '<form id="entity-form">' +
          '<div class="modal-body" id="modal-fields">' + fieldsHtml(resolveFields(opts, initial), initial, opts.trip || {}) + '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">' + esc(opts.submitLabel || 'Save') + '</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>' +
    '<datalist id="currency-list">' + COMMON_CURRENCIES.map(function (c) { return '<option value="' + c + '">'; }).join('') + '</datalist>' +

/* ---------- 9. Cost / expense aggregation --------------------------
   Every bookable item (activity, transport leg, accommodation stay)
   can carry its own cost; on top of that a trip can have standalone
   expenses (meals, taxis, souvenirs...). allCostLines() flattens all
   of it into one list so the Expenses tab and the CSV export both
   work from a single, consistent ledger. */

function allCostLines(trip) {
  var lines = [];
  trip.activities.forEach(function (a) {
    if (a.costAmount) lines.push({ date: a.date, type: 'Activity', desc: a.title, amount: a.costAmount, currency: a.costCurrency, rateOverride: a.costRate, receiptRef: a.receiptRef, bookingRef: a.bookingRef, category: 'Activities' });
  });
  trip.transport.forEach(function (t) {
    if (t.costAmount) lines.push({ date: dateOnly(t.departDateTime), type: 'Transport', desc: transportLabel(t), amount: t.costAmount, currency: t.costCurrency, rateOverride: t.costRate, receiptRef: t.receiptRef, bookingRef: t.bookingRef, category: 'Transport' });
  });
  trip.accommodation.forEach(function (ac) {
    if (ac.costAmount) lines.push({ date: dateOnly(ac.checkIn), type: 'Accommodation', desc: ac.name, amount: ac.costAmount, currency: ac.costCurrency, rateOverride: ac.costRate, receiptRef: ac.receiptRef, bookingRef: ac.bookingRef, category: 'Accommodation' });
  });
  trip.expenses.forEach(function (e) {
    lines.push({ date: e.date, type: 'Expense', desc: e.description, amount: e.amount, currency: e.currency, rateOverride: e.rateOverride, receiptRef: e.receiptRef, bookingRef: '', category: e.category || 'Other' });
  });
  lines.sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  return lines;
}

function usedCurrencies(trip) {
  var set = {};
  allCostLines(trip).forEach(function (l) { if (l.currency && l.currency !== trip.homeCurrency) set[l.currency] = true; });
  return Object.keys(set).sort();
}

function csvEscape(v) {
  var s = String(v === undefined || v === null ? '' : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildCsv(trip) {
  var lines = allCostLines(trip);
  var header = ['Date', 'Type', 'Category', 'Description', 'Amount', 'Currency', 'Rate used', 'Converted (' + trip.homeCurrency + ')', 'Booking ref', 'Receipt ref'];
  var rows = lines.map(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    return [l.date, l.type, l.category, l.desc, l.amount, l.currency, hv.rateUsed == null ? '' : hv.rateUsed, hv.known ? hv.value.toFixed(2) : 'unknown', l.bookingRef, l.receiptRef];
  });
  return [header].concat(rows).map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
}

// Builds the CSV text (see buildCsv() above) and hands it to the
// browser as a normal file download. This is the standard vanilla-JS
// download trick: wrap the text in a Blob, make a temporary object URL
// for it, click a hidden link pointing at that URL, then clean both up
// straight away. No server round-trip needed for this one.
function exportCsv(trip) {
  var csv = buildCsv(trip);
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = slug(trip.name) + '-expenses.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  // Give the browser a moment to actually start the download before we
  // revoke the URL it's reading from.
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ---------- 10. Timeline logic --------------------------------------
   This is the heart of the "multi-leg, overnight, several areas in a
   day" requirement: it builds one chronological agenda per trip that
   folds together destinations, activities, transport and
   accommodation, and makes overnight travel and multi-night stays
   visible instead of splitting them awkwardly across days. */

function tripDayList(trip) {
  var dates = {};
  function add(d) { if (d) dates[d] = true; }
  add(trip.startDate); add(trip.endDate);
  trip.destinations.forEach(function (d) { add(d.arriveDate); add(d.departDate); });
  trip.activities.forEach(function (a) { add(a.date); });
  trip.transport.forEach(function (t) { add(dateOnly(t.departDateTime)); add(dateOnly(t.arriveDateTime)); });
  trip.accommodation.forEach(function (a) { add(dateOnly(a.checkIn)); add(dateOnly(a.checkOut)); });
  var keys = Object.keys(dates).sort();
  if (keys.length === 0) return [];
  var out = []; var cur = keys[0]; var end = keys[keys.length - 1];
  while (cur <= end) { out.push(cur); cur = addDays(cur, 1); }
  return out;
}

function eventsForDay(trip, day) {
  var events = [];
  trip.activities.forEach(function (a) {
    if (a.date === day) events.push({ time: a.startTime || '00:00', kind: 'activity', data: a });
  });
  trip.accommodation.forEach(function (ac) {
    if (dateOnly(ac.checkIn) === day) events.push({ time: timeOnly(ac.checkIn) || '15:00', kind: 'checkin', data: ac });
    if (dateOnly(ac.checkOut) === day) events.push({ time: timeOnly(ac.checkOut) || '11:00', kind: 'checkout', data: ac });
  });
  trip.transport.forEach(function (t) {
    if (dateOnly(t.departDateTime) === day) events.push({ time: timeOnly(t.departDateTime) || '00:00', kind: 'depart', data: t });
    if (dateOnly(t.arriveDateTime) === day && dateOnly(t.arriveDateTime) !== dateOnly(t.departDateTime)) {
      events.push({ time: timeOnly(t.arriveDateTime) || '00:00', kind: 'arrive', data: t });
    }
  });
  events.sort(function (a, b) { return a.time.localeCompare(b.time); });
  return events;
}

function overnightStay(trip, day) {
  var stay = trip.accommodation.find(function (ac) { return dateOnly(ac.checkIn) <= day && day < dateOnly(ac.checkOut); });
  if (stay) return { kind: 'stay', data: stay };
  var nextDay = addDays(day, 1);
  var leg = trip.transport.find(function (t) { return dateOnly(t.departDateTime) === day && dateOnly(t.arriveDateTime) === nextDay; });
  if (leg) return { kind: 'transit', data: leg };
  return null;
}

function areasForDay(trip, day) {
  return trip.destinations.filter(function (d) { return d.arriveDate <= day && day <= d.departDate; });
}

/* ---------- 11. Trip-level stats ------------------------------------ */

function tripStatus(trip) {
  var today = todayStr();
  if (trip.startDate && trip.endDate) {
    if (today < trip.startDate) return 'upcoming';
    if (today > trip.endDate) return 'past';
    return 'ongoing';
  }
  if (trip.startDate && today < trip.startDate) return 'upcoming';
  if (trip.endDate && today > trip.endDate) return 'past';
  return 'upcoming';
}

function tripSpend(trip) {
  var known = 0, unknownCount = 0;
  allCostLines(trip).forEach(function (l) {
    var hv = homeValue(trip, l.amount, l.currency, l.rateOverride);
    if (hv.known) known += hv.value; else unknownCount++;
  });
  return { known: known, unknownCount: unknownCount };
}

function renderDashboard() {
  if (state.trips.length === 0) {

        '<h3>No trips yet</h3>' +
        '<p>Add a trip to start planning destinations, activities, transport and accommodation — with expenses tracked across currencies as you go.</p>' +
      '</div>'
    );
  }
  var sorted = state.trips.slice().sort(function (a, b) { return (a.startDate || '9999') < (b.startDate || '9999') ? -1 : 1; });
  var cards = sorted.map(function (trip) {
    var status = tripStatus(trip);
    var spend = tripSpend(trip);
    var statusLabel = status === 'ongoing' ? 'In progress' : (status === 'past' ? 'Past' : 'Upcoming');
    return (
      '<div class="trip-card" data-action="open-trip" data-id="' + trip.id + '">' +
        '<div class="trip-card-top">' +
          '<div><h3>' + esc(trip.name) + '</h3><div class="trip-dates">' +
            (trip.startDate ? formatDateShort(trip.startDate) : 'No dates set') +
            (trip.endDate ? ' – ' + formatDateShort(trip.endDate) : '') + '</div></div>' +
          '<span class="pill pill-' + status + '">' + statusLabel + '</span>' +
        '</div>' +
        '<div class="trip-stats">' +
          '<span>' + icon('pin') + ' <b>' + trip.destinations.length + '</b> areas</span>' +
          '<span>' + icon('wallet') + ' <b>' + money(spend.known, trip.homeCurrency) + '</b>' + (spend.unknownCount ? ' <span class="rate-missing">+' + spend.unknownCount + ' need rate</span>' : '') + '</span>' +
        '</div>' +
        '<div class="card-actions" data-write-only>' +
          '<button class="btn btn-icon btn-ghost" data-action="edit-trip" data-id="' + trip.id + '" title="Edit trip">' + icon('edit') + '</button>' +
          '<button class="btn btn-icon btn-ghost" data-action="delete-trip" data-id="' + trip.id + '" title="Delete trip">' + icon('trash') + '</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  return (
    '<div class="intro-note"><strong>Waypoint</strong> keeps every trip\'s destinations, activities, transport and accommodation in one place, with a day-by-day timeline that shows overnight travel and multi-area days clearly, plus expenses tracked across currencies.</div>' +
    '<div class="section-head"><h1>Your trips</h1>' +
      '<button class="btn btn-accent" data-write-only data-action="new-trip">' + icon('plus') + ' New trip</button></div>' +
    '<div class="trip-grid">' + cards + '</div>'
  );
}

/* ---------- 13. Render: Trip view shell (header + tabs) -------------- */

// The two "big picture" views of a trip — see the day-by-day agenda, or
// see it on a map — are surfaced as large HERO_TABS buttons above the
// regular tab bar rather than being just another tab among the data-entry
// ones below, since they're what most people actually want to look at
// most of the time. Everything else (adding/editing the underlying data)
// lives in TABS, in the order requested: Destinations, Transport,
// Accommodation, Activities, then Contacts, with Expenses and Settings
// kept at the end as before. Both arrays share the exact same "switch-tab"
// data-action/click handler (see the click listener further down) — a
// hero button and a regular tab button are just two different looks for
// the same underlying currentTab switch.
var HERO_TABS = [
  { key: 'timeline', label: 'Timeline', icon: 'calendar' },
  { key: 'map', label: 'Map', icon: 'map' }
];

var TABS = [
  { key: 'destinations', label: 'Destinations', icon: 'pin' },
  { key: 'transport', label: 'Transport', icon: 'plane' },
  { key: 'accommodation', label: 'Accommodation', icon: 'bed' },
  { key: 'activities', label: 'Activities', icon: 'ticket' },
  { key: 'contacts', label: 'Contacts', icon: 'users' },
  { key: 'expenses', label: 'Expenses', icon: 'wallet' },
  { key: 'settings', label: 'Settings', icon: 'gear' }
];

function renderTripView() {
  var trip = currentTrip();
  if (!trip) { currentView = 'dashboard'; return renderDashboard(); }
  var spend = tripSpend(trip);
  var status = tripStatus(trip);
  var heroHtml = HERO_TABS.map(function (t) {
    return '<button class="hero-btn ' + (currentTab === t.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + t.key + '">' +
      icon(t.icon) + t.label + '</button>';
  }).join('');
  var tabsHtml = TABS.map(function (t) {
    return '<button class="tab-btn ' + (currentTab === t.key ? 'active' : '') + '" data-action="switch-tab" data-tab="' + t.key + '">' +
      icon(t.icon) + t.label + '</button>';
  }).join('');
  var panel;
  switch (currentTab) {
    case 'destinations': panel = renderDestinationsTab(trip); break;
    case 'activities': panel = renderActivitiesTab(trip); break;
    case 'transport': panel = renderTransportTab(trip); break;
    case 'accommodation': panel = renderAccommodationTab(trip); break;
    case 'map': panel = renderMapTab(trip); break;
    case 'contacts': panel = renderContactsTab(trip); break;
    case 'expenses': panel = renderExpensesTab(trip); break;
    case 'settings': panel = renderSettingsTab(trip); break;
    default: panel = renderTimelineTab(trip);
  }
  return (
    '<div class="trip-header">' +
      '<button class="back-link" data-action="back-to-dashboard">' + icon('back') + ' All trips</button>' +
      '<div class="trip-title-row">' +
        '<div><h1>' + esc(trip.name) + '</h1>' +
          '<div class="trip-meta">' +
            '<span>' + (trip.startDate ? formatDateShort(trip.startDate) : '?') + ' – ' + (trip.endDate ? formatDateShort(trip.endDate) : '?') + '</span>' +
            '<span><b>' + money(spend.known, trip.homeCurrency) + '</b> spent so far' +
              (spend.unknownCount ? ' · <button class="warn-link" data-action="switch-tab" data-tab="settings">' + spend.unknownCount + ' need an exchange rate</button>' : '') +
            '</span>' +
          '</div>' +
        '</div>' +
        '<div class="card-actions" data-write-only>' +
          '<button class="btn btn-icon btn-ghost" data-action="edit-trip" data-id="' + trip.id + '" title="Edit trip">' + icon('edit') + '</button>' +
          '<button class="btn btn-icon btn-ghost" data-action="delete-trip" data-id="' + trip.id + '" title="Delete trip">' + icon('trash') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="hero-row">' + heroHtml + '</div>' +
    '<div class="tabbar">' + tabsHtml + '</div>' +
    '<div>' + panel + '</div>'
  );
}

/* ---------- 14. Shared row-rendering helpers -------------------------- */

function copyBtn(value, label) {
  if (!value) return '';
  return '<button class="copy-btn" data-action="copy-text" data-value="' + esc(value) + '" title="Copy ' + esc(label) + '">' + icon('copy') + '</button>';
}

function mapsLink(address) {
  if (!address) return '';
  var url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">Open in Maps ' + icon('arrowRight') + '</a>';
}

function costTag(trip, amount, currency, rateOverride) {
  if (!amount) return '';
  var hv = homeValue(trip, amount, currency, rateOverride);
  var label = money(amount, currency);
  if (currency && currency !== trip.homeCurrency) {
    label += hv.known ? ' (≈ ' + money(hv.value, trip.homeCurrency) + ')' : ' (rate needed)';
  }
  return '<span class="tag tag-cost">' + icon('wallet') + label + '</span>';
}

function rowActions(trip, section, item, label) {
  return '<div class="item-actions" data-write-only>' +
    '<button class="btn btn-icon btn-ghost" data-action="edit-' + section + '" data-id="' + item.id + '" title="Edit">' + icon('edit') + '</button>' +
    '<button class="btn btn-icon btn-ghost" data-action="delete-' + section + '" data-id="' + item.id + '" title="Delete">' + icon('trash') + '</button>' +
  '</div>';
}

function emptyTab(iconName, title, body, addAction, addLabel) {
  return '<div class="empty-state">' + icon(iconName) + '<h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' +
    '<div style="margin-top:14px" data-write-only><button class="btn btn-accent" data-action="' + addAction + '">' + icon('plus') + ' ' + esc(addLabel) + '</button></div></div>';
}

function tabHead(title, addAction, addLabel) {
  return '<div class="tab-panel-head"><h2>' + esc(title) + '</h2>' +
    '<button class="btn btn-accent" data-write-only data-action="' + addAction + '">' + icon('plus') + ' ' + esc(addLabel) + '</button></div>';
}

function renderDestinationsTab(trip) {
  if (trip.destinations.length === 0) return emptyTab('pin', 'No destinations yet', 'Add the places or areas you\'ll be based in — activities and accommodation can then be tagged to them.', 'new-destination', 'Add destination');
  var sorted = trip.destinations.slice().sort(function (a, b) { return (a.arriveDate || '') < (b.arriveDate || '') ? -1 : 1; });
  var rows = sorted.map(function (d) {
    var tzOffset = d.timezone ? tzOffsetLabel(d.timezone) : '';
    var tzTag = d.timezone ? '<span class="tag">' + icon('clock') + esc(d.timezone) + (tzOffset ? ' (' + esc(tzOffset) + ')' : '') + '</span>' : '';
    return '<div class="item-row"><div class="item-icon">' + icon('pin') + '</div><div class="item-main">' +
      '<div class="item-title-row"><span class="item-title">' + esc(d.name) + (d.country ? ', ' + esc(d.country) : '') + '</span></div>' +
      '<div class="item-sub">' + formatDateShort(d.arriveDate) + ' – ' + formatDateShort(d.departDate) + '</div>' +
      (tzTag ? '<div class="item-tags">' + tzTag + '</div>' : '') +
      (d.notes ? '<div class="item-sub">' + esc(d.notes) + '</div>' : '') +

function renderActivitiesTab(trip) {
  if (trip.activities.length === 0) return emptyTab('ticket', 'No activities yet', 'Tours, museum visits, dinner reservations — anything with a date and time.', 'new-activity', 'Add activity');
  var sorted = trip.activities.slice().sort(function (a, b) { return ((a.date || '') + (a.startTime || '')) < ((b.date || '') + (b.startTime || '')) ? -1 : 1; });
  var rows = sorted.map(function (a) {
    var dest = a.destinationId ? byId(trip.destinations, a.destinationId) : null;
    var contact = a.contactId ? byId(trip.contacts, a.contactId) : null;
    var tags = [];
    if (a.location) tags.push('<span class="tag">' + esc(a.location) + '</span>');
    if (dest) tags.push('<span class="tag">' + icon('pin') + esc(dest.name) + '</span>');
    if (a.bookingRef) tags.push('<span class="tag">' + icon('ticket') + esc(a.bookingRef) + copyBtn(a.bookingRef, 'booking ref') + '</span>');
    if (contact) tags.push('<span class="tag">' + icon('user') + esc(contact.name) + '</span>');

      '<div class="item-title-row"><span class="item-title">' + esc(a.title) + '</span><span class="item-sub">' + formatDateShort(a.date) + (a.startTime ? ' · ' + a.startTime : '') + (a.endTime ? '–' + a.endTime : '') + '</span></div>' +
