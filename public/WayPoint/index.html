<script src="/WayPoint/vendor/leaflet/leaflet.js"></script>
<script src="/WayPoint/data/currencies.js"></script>
<script src="/WayPoint/data/timezones.js"></script>
<script src="/WayPoint/data/countries.js"></script>
<script src="/WayPoint/data/cities.js"></script>
<script src="/WayPoint/data/airports.js"></script>
<script src="/WayPoint/data/avatars.js"></script>
<!-- `defer`, unlike the data/*.js tags above: this file (~550KB, ~7,900
     airports) is a coordinate-lookup fallback only touched when a
     Flight leg is saved, never needed for the very first form's
     suggestion dropdown the way the others above are — see the comment
     at the top of data/airports-full.js for the full reasoning. -->
<script defer src="/WayPoint/data/airports-full.js"></script>
<!-- Local, dependency-free semantic SVG set; loaded before the application
     renderer so every screen and Leaflet marker uses the same artwork. -->
<script src="/WayPoint/ui/icons.js"></script>
<script>
/* ================================================================
   WAYPOINT — application logic
   ----------------------------------------------------------------
   No build step, no framework: plain JavaScript that (a) keeps all
   trip data in one JS object called `state`, (b) turns that object
   into HTML strings whenever something changes (the render*
   functions), and (c) saves it to our own JSON API (see
   loadInitialState()/persist() below), stored in Cloudflare KV — see
   src/worker.js for the server side. Sections below are ordered so
   each only depends on the ones above it.
   ================================================================ */

/* ---------- 1. Small constants ---------------------------------- */

// COMMON_CURRENCIES, COMMON_TIMEZONES, COMMON_COUNTRIES, COMMON_CITIES
// and COMMON_AIRPORTS are loaded from separate files under
// /WayPoint/data/ (see the <script> tags near the top, after
// leaflet.js) to keep this file smaller — they're still plain globals
// by the time any code below runs. See data/airports.js for why
// COMMON_AIRPORTS is shaped differently (objects with city/country,
// not flat strings) — that's for the Map tab's geocoding.

var WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var TRANSPORT_MODES = ['Flight','Train','Bus','Car','Ferry','Other'];
// How a transport leg was paid for — drives which cost-related fields
// show up on the form (see transportSectionsForMode()): Cash shows a
// currency+amount, Points shows a program+points-count, Combo shows
// both, and Free shows neither (nothing to record).
var TRANSPORT_PAYMENT_TYPES = ['Cash', 'Points', 'Combo', 'Free'];
var EXPENSE_CATEGORIES = ['Food & drink','Transport','Accommodation','Activities','Shopping','Other'];

/* ---------- 2. Generic utilities --------------------------------- */

// Turns any value into a short random-ish id, unique enough for a
// personal planner (not a distributed database, so this is plenty).
function newId() {
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

// Escapes text so it's safe to drop into an HTML template string as
// element text or inside a quoted attribute. Without this, a note
// containing `<` or `"` could break the page's markup.
function esc(value) {
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Resolves a semantic design token for JavaScript-owned surfaces such as
// Leaflet paths. Keeping the source of truth in CSS means these elements use
// the same approved light/dark palette as the rest of the application.
function cssToken(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// Finds one item in `list` by its id. Most Waypoint data uses a typed id
// field (tripId, destinationId, ...; see "SCHEMA" in src/worker.js) --
// pass which field to match as `idField`, e.g. byId(trip.destinations,
// someId, 'destinationId'). Account/login records still use plain `id`,
// the default when `idField` is omitted.
function byId(list, id, idField) {
  var field = idField || 'id';
  return (list || []).find(function (x) { return x[field] === id; });
}

// Maps a trip item type -- plural key on the trip ("destinations") or
// singular name in click-action strings ("edit-destination") -- to that
// item's own id field, so deleteEntity() and rowActions() stay in sync.
var ENTITY_ID_FIELDS = {
  destination: 'destinationId', destinations: 'destinationId',
  activity: 'activityId', activities: 'activityId',
  transport: 'transportId',
  accommodation: 'accommodationId',
  contact: 'contactId', contacts: 'contactId',
  companion: 'companionId', companions: 'companionId',
  expense: 'expenseId', expenses: 'expenseId'
};

// Deep-clones the app state before we mutate it, so a half-finished
// edit never leaks into the UI before it's actually saved.
function cloneState(s) {
  if (typeof structuredClone === 'function') return structuredClone(s);
  return JSON.parse(JSON.stringify(s));
}

function slug(str) {
  return String(str || 'trip').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'trip';
}

/* ---- date/time helpers ----
   Dates are stored as "YYYY-MM-DD", date+times as "YYYY-MM-DDTHH:MM".
   Deliberately not fed into `new Date("YYYY-MM-DD")` for display: that
   parses as UTC midnight, and a local timezone conversion can then
   silently roll the displayed date back a day. The UTC getters keep
   everyone's timeline showing the date they actually typed. */

function addDays(dateStr, n) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}

// Whole days between two "YYYY-MM-DD" dates. Built from Date.UTC parts for
// the same reason as addDays(): a local-timezone parse can shift the result.
function daysBetween(fromDate, toDate) {
  var from = fromDate.split('-').map(Number);
  var to = toDate.split('-').map(Number);
  return Math.round((Date.UTC(to[0], to[1] - 1, to[2]) - Date.UTC(from[0], from[1] - 1, from[2])) / 86400000);
}

function formatDateHeading(dateStr) {
  var parts = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  return WEEKDAYS[dt.getUTCDay()] + ' ' + parts[2] + ' ' + MONTHS[parts[1] - 1] + ' ' + parts[0];
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  var parts = dateStr.split('-').map(Number);
  return parts[2] + ' ' + MONTHS[parts[1] - 1] + ' ' + parts[0];
}

function dateOnly(iso) { return iso ? iso.slice(0, 10) : ''; }
function timeOnly(iso) { return (iso && iso.length >= 16) ? iso.slice(11, 16) : ''; }

function combineDateTime(date, time) {
  if (!date) return '';
  return date + 'T' + (time || '00:00');
}
function splitDateTime(iso) {
  return { date: dateOnly(iso), time: timeOnly(iso) };
}

// Activities originally stored one `date` plus optional times. Keep that
// field as a compatibility mirror, while all new UI reads the explicit range.
// This lets an older saved activity open naturally in the redesigned editor
// and makes every date-aware view use the same inclusive range.
function activityStartDate(activity) { return (activity && (activity.startDate || activity.date)) || ''; }
function activityEndDate(activity) { return (activity && (activity.endDate || activityStartDate(activity))) || ''; }
function activityIsAllDay(activity) {
  if (!activity) return true;
  return activity.allDay === true || activity.allDay === 'true' || (!activity.startTime && !activity.endTime);
}
function activityOccursOn(activity, day) {
  var start = activityStartDate(activity), end = activityEndDate(activity);
  return !!(day && start && start <= day && day <= end);
}
function activityDateTimeLabel(activity) {
  var start = activityStartDate(activity), end = activityEndDate(activity);
  if (!start) return '';
  var dates = formatDateShort(start) + (end && end !== start ? ' – ' + formatDateShort(end) : '');
  if (activityIsAllDay(activity)) return dates + ' · All day';
  var startTime = activity.startTime || '';
  var endTime = activity.endTime || '';
  if (end && end !== start) return dates + (startTime ? ' · ' + startTime : '') + (endTime ? ' → ' + endTime : '');
  return dates + (startTime ? ' · ' + startTime : '') + (endTime ? '–' + endTime : '');
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

/* ---- currency helpers ---- */

// Converts an amount in `currency` into the trip's home currency. A
// per-item `rateOverride` always wins; otherwise falls back to the
// trip's fixed rate for that currency (set in Settings). `known` is
// false when neither is available, so callers can flag the amount
// instead of silently treating it as zero.
function homeValue(trip, amount, currency, rateOverride) {
  var amt = Number(amount) || 0;
  if (!currency || currency === trip.homeCurrency) return { value: amt, rateUsed: 1, known: true };
  var rate = (rateOverride !== undefined && rateOverride !== null && rateOverride !== '')
    ? Number(rateOverride)
    : trip.currencyRates[currency];
  if (rate === undefined || rate === null || isNaN(rate)) return { value: 0, rateUsed: null, known: false };
  return { value: amt * rate, rateUsed: rate, known: true };
}

function money(amount, currency) {
  var n = Number(amount) || 0;
  return esc(currency || '') + ' ' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Turns an IANA timezone name (e.g. "Asia/Bangkok") into a short
// current UTC-offset label (e.g. "GMT+7") via the browser's timezone
// database. Returns '' for a blank/unrecognised timezone rather than
// throwing -- only ever used as a friendly hint next to the typed name.
function tzOffsetLabel(tz) {
  if (!tz) return '';
  try {
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(new Date());
    var part = parts.find(function (p) { return p.type === 'timeZoneName'; });
    return part ? part.value : '';
  } catch (e) {
    return '';
  }
}

/* ---------- 3. Icons ---------------------------------------------
   Artwork lives in ui/icons.js. This local wrapper keeps existing render
   functions terse while routing every request through semantic validation. */

// Returns the icon key that best represents a transport mode, so the
// timeline and transport list show a plane for flights, a train icon
// for trains, and so on.
function transportIconKey(mode) {
  var m = (mode || '').toLowerCase();
  if (m === 'flight') return 'flight';
  if (m === 'train') return 'rail';
  if (m === 'bus') return 'bus';
  if (m === 'car') return 'car';
  if (m === 'ferry') return 'ferry';
  return 'route';
}

// One-line label for a transport leg, e.g. "Flight BA15: LHR → HND" or
// plain "Car: Hotel → Airport" for modes with no flight number. Shared
// by the Transport tab, the Timeline and the expense ledger so the
// same leg always reads the same way everywhere.
function transportLabel(t) {
  return (t.mode || 'Transport') + (t.flightNumber ? ' ' + t.flightNumber : '') + ': ' + t.fromLocation + ' → ' + t.toLocation;
}

function icon(name, extraClass) {
  return WayPointIcons.render(name, extraClass);
}

// The brand mark is sourced from the registry as well, rather than being a
// second hand-maintained inline SVG in the page shell.
document.getElementById('brand-icon').innerHTML = icon('brand');

/* ---------- 3b. Avatars (Companions/Avatars feature) ------------------
   Draws a companion/account marker: item rows, trip cards, the
   timeline, the tag-picker (companionTags()/renderTripCardAvatars()/
   eventRowHtml()/the 'tag-picker' case in fieldHtml()). Resolution --
   animal vs. smiley, which colour/animal -- always happens server-side
   (resolveCompanionAvatars() in src/worker.js, the `companionAvatars`
   map on every trip); this only turns the resolved
   `{ type, color, animal }` into HTML, via avatarColorHex()/
   avatarAnimalEmoji() (data/avatars.js) so a token never gets written
   straight into a `style` attribute (see that file for the
   CSS-injection risk). `name` is always shown as a title/tooltip. */
function avatarMarkerHtml(avatar, name, extraClass) {
  if (!avatar) return '';
  var title = ' title="' + esc(name || '') + '" aria-label="' + esc(name || '') + '"';
  if (avatar.type === 'account') {
    var bg = avatarColorHex(avatar.color) || AVATAR_GREY_HEX;
    var glyph = avatarAnimalEmoji(avatar.animal) || '';
    return '<span class="avatar-marker ' + (extraClass || '') + '" style="background:' + bg + '"' + title + '>' + glyph + '</span>';
  }
  // Non-account companion: fixed grey circle (see AVATAR_GREY_HEX),
  // coloured smiley per whoever added them.
  var smileyHex = avatarColorHex(avatar.color) || '#6b7280';
  return '<span class="avatar-marker ' + (extraClass || '') + '" style="background:' + AVATAR_GREY_HEX + '"' + title + '>' +
    '<span class="avatar-marker-smiley" style="color:' + smileyHex + '">☺</span></span>';
}

// Looks up companion `companionId`'s resolved marker on `trip` and draws
// it via avatarMarkerHtml() above, paired with their name. Returns ''
// for a dangling/removed companion id, degrading to "nothing shown"
// rather than an error.
function companionAvatarHtml(trip, companionId, name) {
  if (companionId === SUPERUSER_PARTICIPANT_ID) {
    return avatarMarkerHtml(trip.superuserParticipant && trip.superuserParticipant.avatar, name);
  }
  var avatar = trip.companionAvatars && trip.companionAvatars[companionId];
  return avatarMarkerHtml(avatar, name);
}

// The full list offered by a People picker. The trip owner is deliberately
// virtual: it is supplied from server-owned account data, while ordinary
// companions continue to use the existing per-trip records and ids.
function taggablePeople(trip) {
  var people = [];
  if (trip && trip.superuserParticipant && trip.superuserParticipant.name) {
    people.push({
      companionId: SUPERUSER_PARTICIPANT_ID,
      name: trip.superuserParticipant.name,
      isSuperuser: true
    });
  }
  return people.concat(((trip && trip.companions) || []).filter(function (c) {
    return c.companionId !== SUPERUSER_PARTICIPANT_ID;
  }));
}

function taggablePersonById(trip, id) {
  return taggablePeople(trip).find(function (person) { return person.companionId === id; }) || null;
}

// Dashboard trip cards: "who's on this trip at a glance". Bare markers
// with no '.tag' pill (unlike companionTags() above) — a plain row of
// small circles rather than the pill treatment used inside a trip's own
// tabs. Capped at MAX_CARD_AVATARS; overflow collapses into a single
// "+N" bubble (title lists remaining names) rather than wrapping. Data
// is already scoped/stripped server-side per buildVisibleTrip(), so
// there's nothing extra to permission-check here.
var MAX_CARD_AVATARS = 6;
function tripCardAvatarsHtml(trip) {
  var companions = trip.companions || [];
  if (companions.length === 0) return '';
  var shown = companions.slice(0, MAX_CARD_AVATARS);
  var overflow = companions.length - shown.length;
  var html = shown.map(function (c) { return companionAvatarHtml(trip, c.companionId, c.name); }).join('');
  if (overflow > 0) {
    var remainingNames = companions.slice(MAX_CARD_AVATARS).map(function (c) { return c.name; }).join(', ');
    html += '<span class="avatar-marker avatar-marker-overflow" title="' + esc(remainingNames) + '">+' + overflow + '</span>';
  }
  return '<span class="avatar-row trip-card-avatars">' + html + '</span>';
}

/* ---------- 4. Application state & persistence --------------------
   `state` holds every trip, the single source of truth on screen.
   `currentView`/`currentTripId`/`currentTab` track where the viewer is
   (dashboard vs. a trip, which tab) — per-viewer navigation, not trip
   data, so it's kept out of `state` and never saved. */

var state = { trips: [] };
var currentView = 'dashboard';
var currentTripId = null;
var currentTab = 'timeline';
// Mobile remembers the last child used inside the three multi-view
// destinations. More intentionally opens its own directory page every time,
// matching the agreed information architecture rather than guessing whether
// Expenses or Settings was wanted.
var mobileLastTab = { overview: 'timeline', plan: 'destinations', people: 'companions' };
var accountMenuOpen = false;
// Timeline disclosure is local viewing state, never trip data. Missing entries
// use the date-sensitive default: earlier days closed, today/future days open.
var timelineDayExpansion = {};
// Connection, loading and save feedback are separate axes. Keeping them
// separate prevents a successful historic load from being mistaken for an
// editable online session after the browser later loses its connection.
var appLoadState = 'loading';
var connectionState = typeof navigator !== 'undefined' && navigator.onLine === false ? 'offline' : 'online';
var reconnectInFlight = false;

function timelineLocalTodayStr(now) {
  var date = now || new Date();
  var month = String(date.getMonth() + 1).padStart(2, '0');
  var day = String(date.getDate()).padStart(2, '0');
  return date.getFullYear() + '-' + month + '-' + day;
}

function timelineDayKey(tripId, day) { return String(tripId || '') + '|' + day; }

function timelineDayExpanded(tripId, day, today) {
  var key = timelineDayKey(tripId, day);
  if (Object.prototype.hasOwnProperty.call(timelineDayExpansion, key)) return timelineDayExpansion[key];
  return day >= (today || timelineLocalTodayStr());
}

// ---- Accounts / login (see section 4b, "Auth", further down) ----------
// `currentUser` is null until checkAuth() resolves at boot, and stays
// null for the session if nobody's logged in — renderBoot() then shows
// the login screen instead of trip data. { id, username, isUberUser }
// once set. No global "role" -- what an account can do is entirely per
// trip (each trip's own `myGrant`, from src/worker.js's
// buildResponseState(); see canFullyEditTrip()/canEditItem() below).
// `isUberUser` is this account's own flag, only in responses describing
// the caller's own account (login/whoami/setup), never other accounts —
// see "undisclosed" in src/worker.js. Used only to show "Manage accounts".
var currentUser = null;
// Reserved participant id for tagging the trip owner directly (an
// account, not a companion record) without a duplicate companion.
var SUPERUSER_PARTICIPANT_ID = '__trip_superuser__';
// Set by checkAuth() from whoami: true only when no accounts exist yet,
// so the login screen offers first-run setup instead of a login form.
// See renderAuthScreen().
var setupNeeded = false;
// Account list as last fetched for "Manage accounts" (site owner only).
// See loadAndRenderManageUsers()/renderManageUsersView().
var managedUsers = [];
var siteStatus = null;

// The first thing this page does (see init() at the bottom) is fetch()
// saved data from our own JSON API, backed by Cloudflare KV (see
// src/worker.js). loadInitialState() below always resolves to a valid
// { trips: [...] }, even on failure, so the rest of the app never
// worries about a missing/malformed response.
//
// `stateIsTrustworthy` is true only while `state` is known to be a
// faithful copy of the server's data, set false the moment a load
// fails — this is what stops persist() from ever saving over real data
// with a state that was never really loaded. WHY THIS MATTERS: a trip
// is deleted by being left out of what the browser sends back (no
// separate delete endpoint — see "SAVING SAFELY" in src/worker.js). If
// a load fails and falls back to "no trips at all", the next edit would
// POST an empty list and the server would read that as "delete
// everything this account can see" — for the site owner, every trip.
// The server refuses a save deleting more than one trip as a backstop,
// but the browser shouldn't be sending it in the first place.
var stateIsTrustworthy = false;

async function loadInitialState() {
  appLoadState = 'loading';
  updateSystemFeedback();
  try {
    var res = await fetch('/WayPoint/api/data', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('Server responded with status ' + res.status);
    var parsed = await res.json();
    if (!parsed || typeof parsed !== 'object') parsed = {};
    if (!parsed.trips) parsed.trips = [];
    stateIsTrustworthy = true;
    connectionState = 'online';
    appLoadState = 'ready';
    updateSystemFeedback();
    return parsed;
  } catch (e) {
    console.error('Waypoint: could not load saved data from the server', e);
    stateIsTrustworthy = false;
    appLoadState = 'error';
    if (typeof navigator !== 'undefined' && navigator.onLine === false) connectionState = 'offline';
    updateSystemFeedback();
    showToastSafe('Could not load your trips. Your data is safe on the server; editing is locked until Waypoint reconnects.');
    return { trips: [] };
  }
}

// showToast() itself isn't defined yet at the point loadInitialState()
// first runs (script order), and toast-root may not exist yet either if
// something goes very wrong very early — this tiny wrapper just makes
// sure a failed load never throws a *second*, more confusing error on
// top of the first one.
function showToastSafe(message) {
  try { showToast(message, 'error'); } catch (e) { console.error(message); }
}


function setSaveStatus(kind, message) {
  var el = document.getElementById('save-indicator');
  if (!el) return;
  el.dataset.kind = kind;
  el.setAttribute('role', kind === 'error' || kind === 'unsaved' ? 'alert' : 'status');
  el.setAttribute('aria-live', kind === 'error' || kind === 'unsaved' ? 'assertive' : 'polite');
  var labels = { saving: 'Saving…', saved: 'Saved', error: message || 'Save failed', readonly: message || 'Read-only', unsaved: message || 'Not saved' };
  el.textContent = labels[kind] || '';
}

function editingAvailable() {
  return appLoadState === 'ready' && connectionState === 'online' && stateIsTrustworthy;
}

function updateSystemFeedback() {
  var banner = document.getElementById('system-banner');
  if (!banner) return;
  var kind = '';
  var message = '';
  if (connectionState === 'offline') {
    kind = 'offline';
    message = 'You are offline. Trip data remains visible, but editing is locked until Waypoint reconnects.';
  } else if (appLoadState === 'loading') {
    kind = 'loading';
    message = 'Loading your trips…';
  } else if (appLoadState === 'error' || !stateIsTrustworthy) {
    kind = 'error';
    message = 'Waypoint could not refresh your trips. Editing remains locked to protect your saved data.';
  }
  banner.className = 'system-banner' + (kind ? ' is-visible' : '');
  banner.dataset.kind = kind;
  banner.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  banner.innerHTML = kind
    ? icon(kind === 'loading' ? 'loading' : (kind === 'offline' ? 'offline' : 'warning')) + '<span class="system-banner-message">' + esc(message) + '</span>' +
      ((kind === 'offline' || kind === 'error') ? '<button type="button" class="btn btn-ghost" data-action="retry-connection"' + (reconnectInFlight ? ' disabled' : '') + '>' + (reconnectInFlight ? 'Retrying…' : 'Retry now') + '</button>' : '')
    : '';
  document.body.classList.toggle('editing-locked', !editingAvailable());
  updateStickyShellOffsets();
  updateSubmitAvailability(document);
  Array.prototype.forEach.call(document.querySelectorAll('[data-action]'), function (control) {
    if (isMutationAction(control.dataset.action)) control.disabled = !editingAvailable();
  });
}

// Sticky offsets follow the actual rendered header/banner, including text
// zoom, role badges and wrapping offline messages, rather than fixed heights.
function updateStickyShellOffsets() {
  var topbar = document.querySelector('.topbar');
  var banner = document.getElementById('system-banner');
  if (topbar) document.documentElement.style.setProperty('--wp-shell-bar-height', topbar.getBoundingClientRect().height + 'px');
  if (banner) document.documentElement.style.setProperty('--wp-shell-banner-height', banner.getBoundingClientRect().height + 'px');
}

async function retryConnection(options) {
  if (reconnectInFlight || !currentUser) return;
  reconnectInFlight = true;
  if (typeof navigator === 'undefined' || navigator.onLine !== false) connectionState = 'online';
  updateSystemFeedback();
  try {
    var fresh = await loadInitialState();
    if (!stateIsTrustworthy) return;
    state = fresh;
    // A reconnect deliberately trusts the server copy. A failed optimistic
    // save is never replayed without the person seeing and choosing it again.
    pendingSaveState = null;
    render();
    if (!(options && options.silent)) showToast('Connection restored. Your trips are up to date.', 'status');
  } finally {
    reconnectInFlight = false;
    updateSystemFeedback();
  }
}

// Every mutation goes through here: `mutator` receives a deep clone of
// the current state and edits it in place, then persist() saves it to
// the server. The clone means a save that fails partway never leaves
// the on-screen state half-changed.
function updateState(mutator) {
  if (!editingAvailable()) {
    setSaveStatus('readonly', connectionState === 'offline' ? 'Offline' : 'Editing locked');
    updateSystemFeedback();
    return false;
  }
  var next = cloneState(state);
  mutator(next);
  persist(next);
  return true;
}

// Every mutation goes through updateState() -> persist(): persist() is
// the only place that talks to the network. It (a) swaps in the live
// `state`, (b) re-renders immediately so the UI feels instant, and (c)
// saves to the server in the background, updating the "Saved"/"Saving…"
// label in the top bar.
//
// Save queue. Only ever one POST to /api/data in flight; if more edits
// happen while one runs, only the newest state is sent afterwards
// (every POST carries the whole picture, not a diff). This avoids two
// problems: ordering (two overlapping saves finishing out of order could
// let an older state undo a newer edit), and deleting two trips in quick
// succession putting two requests in flight that both omit the second
// trip, which the server rejects as a suspicious multi-trip deletion.
var saveInFlight = false;
var pendingSaveState = null;
var lastSaveStartedAt = 0;
var MIN_SAVE_INTERVAL_MS = 1100;

function waitMs(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

function saveNavigationState() {
  try {
    sessionStorage.setItem('waypoint-nav', JSON.stringify({
      view: currentView,
      tripId: currentTripId,
      tab: currentTab,
      mobileLastTab: mobileLastTab
    }));
  } catch (e) { /* Navigation persistence is an enhancement; rendering still works without storage. */ }
}

async function persist(newState) {
  // See stateIsTrustworthy above: refuse to save rather than risk
  // writing over real data with a state never successfully loaded. The
  // edit stays on screen but is NOT saved; the indicator says so.
  if (!stateIsTrustworthy) {
    setSaveStatus('readonly', 'Editing locked');
    updateSystemFeedback();
    return;
  }

  state = newState;
  saveNavigationState();
  render();

  if (saveInFlight) { pendingSaveState = state; return; }
  sendSave(state);
}

// The actual network half of persist(), split out so that draining the
// queue below doesn't re-run persist()'s render() — re-rendering for a
// save that changed nothing on screen would, among other things, tear
// down and rebuild the Leaflet map mid-view (see render()).
async function sendSave(toSave) {
  saveInFlight = true;
  setSaveStatus('saving');
  try {
    // Cloudflare KV permits only one write per second to a given key. The
    // queue already prevents overlap; this spacing also prevents the next
    // queued snapshot from immediately following the previous request.
    var spacing = MIN_SAVE_INTERVAL_MS - (Date.now() - lastSaveStartedAt);
    if (spacing > 0) await waitMs(spacing);

    var res;
    for (var attempt = 0; attempt < 3; attempt++) {
      lastSaveStartedAt = Date.now();
      res = await fetch('/WayPoint/api/data', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toSave)
      });
      if (res.status !== 429 || attempt === 2) break;
      var retryAfter = Number(res.headers.get('Retry-After')) || Math.pow(2, attempt + 1);
      await waitMs(Math.min(retryAfter * 1000, 8000));
    }
    if (!res.ok) {
      // The server sends a human-readable explanation for a refused save
      // (e.g. the multi-trip-deletion guard) — show that, not a bare code.
      var body = await res.json().catch(function () { return {}; });
      throw new Error(body.error || ('Server responded with status ' + res.status));
    }
    var savedBody = await res.json().catch(function () { return {}; });
    var revisions = savedBody.revisions || {};
    [state, pendingSaveState, toSave].forEach(function (snapshot) {
      if (!snapshot || !Array.isArray(snapshot.trips)) return;
      snapshot.trips.forEach(function (trip) {
        if (Object.prototype.hasOwnProperty.call(revisions, trip.tripId)) trip.revision = revisions[trip.tripId];
      });
    });
    setSaveStatus('saved');
  } catch (err) {
    console.error('Waypoint: save failed', err);
    setSaveStatus('error', 'Could not save');
    if ((typeof navigator !== 'undefined' && navigator.onLine === false) || err instanceof TypeError) connectionState = 'offline';
    stateIsTrustworthy = false;
    appLoadState = 'error';
    pendingSaveState = null;
    updateSystemFeedback();
    showToast('Could not save your change: ' + (err && err.message ? err.message : 'unknown error'), 'error');
  } finally {
    saveInFlight = false;
    if (pendingSaveState && editingAvailable()) {
      var queued = pendingSaveState;
      pendingSaveState = null;
      sendSave(queued);
    }
  }
}

/* ---------- 4b. Auth: login / setup / logout / per-trip permissions ---
   Who's using the app right now, as opposed to what trip data they're
   looking at (`state`, above). See the top of src/worker.js for the
   server side; this is just the frontend's half: show a login screen
   with no session, remember who's logged in once there is one. What
   that account can DO is decided per trip (and, for a "user" grant, per
   item) — see canFullyEditTrip()/canEditItem() near currentTrip(). */

// Asks the server "is there a valid session, and if so who?" — always
// resolves (never throws), leaving currentUser null on failure so the
// app falls back to the login screen rather than a half-broken page.
async function checkAuth() {
  try {
    var res = await fetch('/WayPoint/api/whoami', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    var body = await res.json();
    if (body && body.loggedIn) {
      currentUser = { id: body.id, username: body.username, isUberUser: !!body.isUberUser, avatar: body.avatar || null };
    } else {
      currentUser = null;
      setupNeeded = !!(body && body.setupNeeded);
    }
  } catch (err) {
    currentUser = null;
  }
}

// Keeps the topbar's "who's logged in" area in sync with `currentUser`.
// Called whenever currentUser changes (checkAuth(), login/setup,
// logout). No global read-only styling here — permissions are per trip,
// checked by every trip/item-level render itself.
function applyAuthUI() {
  var el = document.getElementById('account-bar');
  if (!el) return;
  if (!currentUser) { el.innerHTML = ''; return; }
  // The avatar swatch itself IS the "change your avatar" control -- a
  // single clickable button, rather than a separate edit link. See
  // openAvatarPicker(). currentUser.avatar is always a real
  // {color,animal} pair once logged in (resolveAccountAvatar() on the
  // server never sends back nothing), so no "not set yet" case here.
  var marker = avatarMarkerHtml(currentUser.avatar ? { type: 'account', color: currentUser.avatar.color, animal: currentUser.avatar.animal } : null, currentUser.username);
  var manageDesktop = currentUser.isUberUser ? '<button class="btn btn-ghost" data-action="open-site-settings">Site settings</button><button class="btn btn-ghost" data-action="open-manage-users">Manage accounts</button>' : '';
  var manageMobile = currentUser.isUberUser ? '<button class="account-menu-item" role="menuitem" data-action="open-site-settings">' + icon('settings') + ' Site settings</button><button class="account-menu-item" role="menuitem" data-action="open-manage-users">' + icon('people') + ' Manage accounts</button>' : '';
  el.innerHTML =
    '<div class="account-desktop-actions">' +
      '<button class="account-avatar-btn" data-action="open-avatar-picker" aria-label="Change your avatar" title="Change your avatar">' + marker +
        '<span class="account-label account-label-inline">' + esc(currentUser.username) + '</span>' +
      '</button>' + manageDesktop +
      '<button class="btn btn-ghost" data-action="logout">Log out</button>' +
    '</div>' +
    '<div class="account-menu">' +
      '<button class="account-avatar-btn account-menu-toggle" data-action="toggle-account-menu" aria-label="Open account menu" aria-haspopup="menu" aria-expanded="' + String(accountMenuOpen) + '">' + marker + '</button>' +
      (accountMenuOpen ? '<div class="account-popover" role="menu" aria-label="Account">' +
        '<div class="account-popover-name">Signed in as ' + esc(currentUser.username) + '</div>' +
        '<button class="account-menu-item" role="menuitem" data-action="open-avatar-picker">' + icon('edit') + ' Change avatar</button>' +
        manageMobile +
        '<button class="account-menu-item" role="menuitem" data-action="logout">' + icon('logout') + ' Log out</button>' +
      '</div>' : '') +

}

// Builds the login screen, or (if no account exists yet — see
// setupNeeded, set by checkAuth()) the one-time setup screen instead.
// `errorMessage`, when given, is shown above the form.
function renderAuthScreen(errorMessage) {
  var errorHtml = errorMessage ? '<p class="auth-error" role="alert" tabindex="-1">' + esc(errorMessage) + '</p>' : '';
  if (setupNeeded) {
    return '<div class="auth-screen"><div class="auth-card">' +
      '<h1>Set up Waypoint</h1>' +
      '<p class="field-hint">No accounts exist yet — create your own account to get started. It becomes the site owner\'s account, with full access to everything. You\'ll need the setup key (the <code>WAYPOINT_PASSWORD</code> secret set in the Cloudflare dashboard when this was first deployed).</p>' +
      errorHtml +
      '<form id="setup-form">' +
        '<div class="field"><label>Setup key</label><input type="password" name="setupKey" required autocomplete="off"></div>' +
        '<div class="field"><label>Choose a username</label><input type="text" name="username" required autocomplete="username"></div>' +
        '<div class="field"><label>Choose a password</label><input type="password" name="password" required autocomplete="new-password"><div class="field-hint">At least 8 characters.</div></div>' +
        '<button type="submit" class="btn btn-primary auth-primary">Create account</button>' +
      '</form>' +
    '</div></div>';
  }
  return '<div class="auth-screen"><div class="auth-card">' +
    '<h1>Log in to Waypoint</h1>' +
    errorHtml +
    '<form id="login-form">' +
      '<div class="field"><label>Username</label><input type="text" name="username" required autocomplete="username"></div>' +
      '<div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>' +
      '<button type="submit" class="btn btn-primary auth-primary">Log in</button>' +
    '</form>' +
    '<p class="field-hint auth-footer">Don\'t have an account? Ask the site owner to set one up for you.</p>' +
  '</div></div>';
}

// Shared by the login form and the first-run setup form ('login-form'/
// 'setup-form' branches in the submit listener below) — POSTs
// credentials, lands in the app on success or re-shows the screen with
// an error on failure, rather than leaving the form silently stuck.
async function submitAuthForm(url, payload) {
  try {
    var res = await fetch(url, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      var errorApp = document.getElementById('app');
      errorApp.innerHTML = renderAuthScreen(body.error || 'Something went wrong — try again.');
      enhanceAccessibility(errorApp);
      var authError = errorApp.querySelector('.auth-error');
      if (authError) authError.focus();
      return;
    }
    currentUser = { id: body.id, username: body.username, isUberUser: !!body.isUberUser, avatar: body.avatar || null };
    clearSavedNav();
    await renderBoot();
  } catch (err) {
    var offlineApp = document.getElementById('app');
    offlineApp.innerHTML = renderAuthScreen('Could not reach the server — check your connection and try again.');
    enhanceAccessibility(offlineApp);
    var offlineError = offlineApp.querySelector('.auth-error');
    if (offlineError) offlineError.focus();
  }
}

// Forgets "which trip/tab was last open" (see persist()'s
// sessionStorage.setItem and renderBoot()'s read of it) whenever the
// logged-in account changes. Without this, logging out of one account
// into a different one on the same browser tab (routine on a shared
// family device) could land the new account inside the previous
// account's trip instead of the dashboard — a real bug caught by
// test-auth-roles.js.
function clearSavedNav() {
  try { sessionStorage.removeItem('waypoint-nav'); } catch (e) { /* sessionStorage may be unavailable */ }
}

async function doLogout() {
  try {
    await fetch('/WayPoint/api/logout', { method: 'POST', credentials: 'same-origin' });
  } catch (err) {
    // Worst case the server-side cookie lingers until it expires -- we
    // still drop back to the login screen client-side either way, and
    // every real data endpoint re-checks the session regardless.
  }
  state = { trips: [] };
  currentView = 'dashboard'; currentTripId = null; currentTab = 'timeline';
  clearSavedNav();
  // Re-run checkAuth() (not just currentUser = null) so setupNeeded
  // refreshes too -- otherwise logging out right after first-ever setup
  // would show the setup screen again instead of a login form.
  await checkAuth();
  await renderBoot();
}

// The single entry point deciding what the page shows: the login/setup
// screen, or the normal app. Called once at boot (see init() at the
// bottom) and after every login/setup/logout -- always this function,
// never render() directly, decides that top-level split.
async function renderBoot() {
  applyAuthUI();
  if (!currentUser) {
    document.body.classList.remove('is-trip-view');
    var authApp = document.getElementById('app');
    authApp.innerHTML = renderAuthScreen();
    enhanceAccessibility(authApp);
    return;
  }
  state = await loadInitialState();
  try {
    var nav = JSON.parse(sessionStorage.getItem('waypoint-nav') || 'null');
    if (nav && nav.view === 'trip' && byId(state.trips, nav.tripId, 'tripId')) {
      currentView = 'trip'; currentTripId = nav.tripId; currentTab = nav.tab || 'timeline';
      if (nav.mobileLastTab && typeof nav.mobileLastTab === 'object') {
        ['overview', 'plan', 'people'].forEach(function (destination) {
          if (typeof nav.mobileLastTab[destination] === 'string') mobileLastTab[destination] = nav.mobileLastTab[destination];
        });
      }
    }
  } catch (e) { /* ignore malformed/unavailable sessionStorage */ }
  render();
}

/* ---------- 4c. Manage accounts (site owner / uber-user only) ---------
   A trip-agnostic screen (currentView === 'manage-users') for creating,
   renaming, resetting the password of, and deleting logins. Minimal,
   since permissions live on trips now, not accounts -- roles and trip
   access are each trip's own Superuser/Admin's call, via that trip's
   Companions tab (openCompanionLinkForm()/openAddLinkedCompanionForm()).
   Reached via "Manage accounts" in the topbar (applyAuthUI()), shown
   only for the uber-user -- the server enforces the same rule
   independently (src/worker.js's /api/users routes). */

async function loadAndRenderManageUsers() {
  currentView = 'manage-users';
  try {
    var res = await fetch('/WayPoint/api/users', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    var body = await res.json();
    managedUsers = (body && body.users) || [];
  } catch (err) {
    managedUsers = [];
    showToastSafe('Could not load accounts.');
  }
  pendingRenderFocus = '[data-page-heading]';
  render();
}

function renderManageUsersView() {
  var rows = managedUsers.slice().sort(function (a, b) { return a.username.localeCompare(b.username); }).map(function (u) {
    // Accounts are not a trip record, so rowActions() has no id field or
    // permission rule for them -- the two controls are supplied directly
    // and the card's own action slot is switched off.
    return itemRowHtml(null, {
      context: 'person', section: 'account', item: u, icon: 'person',
      title: u.username,
      showRecordActions: false,
      extraActionsHtml: '<div class="item-actions">' +
        '<button class="btn btn-icon btn-ghost" data-action="edit-user" data-id="' + u.id + '" aria-label="Edit account" title="Edit account">' + icon('edit') + '</button>' +
        '<button class="btn btn-icon btn-ghost" data-action="delete-user" data-id="' + u.id + '" aria-label="Delete account" title="Delete account">' + icon('delete') + '</button>' +
      '</div>',
      metadata: {}
    });

  return '<button class="back-link" data-action="back-to-dashboard">' + icon('back') + ' All trips</button>' +
    '<div class="tab-panel-head"><h1 data-page-heading tabindex="-1">Manage accounts</h1>' +
      '<button class="btn btn-accent" data-action="new-user">' + icon('add') + ' Add account</button></div>' +
    '<p class="field-hint manage-users-intro">You set every account\'s username and password yourself and share it with them directly — there\'s no self-signup or "forgot password" flow. Creating an account here just gives someone a login; it doesn\'t give them access to any trip. Whoever creates a trip becomes that trip\'s owner, and can then share it with any of these accounts from that trip\'s own Settings tab.</p>' +
    (managedUsers.length ? '<div class="item-list">' + rows + '</div>' : '<p class="field-hint">No accounts yet.</p>');

async function loadAndRenderSiteSettings() {
  currentView = 'site-settings';
  siteStatus = null;
  pendingRenderFocus = '[data-page-heading]';
  render();
  try {

    if (!res.ok) throw new Error('Status ' + res.status);

function integrationStatusBadge(configured) {

// Opens the Add/Edit account modal. Built directly rather than through
// the openForm()/fieldHtml() system every other form uses -- too small a

async function saveUserAccount(payload) {
  var form = document.getElementById('user-form');
  try {
    var res = await fetch('/WayPoint/api/users', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) { showFormError(form, body.error || 'Could not save that account.', form && form.elements.username); return; }
    closeModal();
    setSaveStatus('saved');
    await loadAndRenderManageUsers();
  } catch (err) {
    showToast('Could not save that account — check your connection and try again.', 'error');
  }

function deleteUserAccount(id) {
  var u = managedUsers.find(function (x) { return x.id === id; });
  if (!u) return;
  openConfirm({
    title: 'Delete this account?', message: 'This deletes the login for "' + u.username + '". This can\'t be undone.', confirmLabel: 'Delete',
    onConfirm: async function () {
      try {
        var res = await fetch('/WayPoint/api/users/delete', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        });
        var body = await res.json().catch(function () { return {}; });
        if (!res.ok) { showToast(body.error || 'Could not delete that account.'); return; }
        setSaveStatus('saved');
        await loadAndRenderManageUsers();
      } catch (err) {
        showToast('Could not delete that account — check your connection and try again.', 'error');
      }
    }
  });
}

/* ---------- 5. Toast & confirm dialog ------------------------------ */

// Toasts are deliberately reserved for global connection, save-failure and
// system events. Field validation belongs beside its field (showFormError),
// while successful record saves use the persistent top-bar save indicator.
function showToast(message, explicitKind) {
  var root = document.getElementById('toast-root');
  var div = document.createElement('div');
  var isError = explicitKind === 'error' || (!explicitKind && /could not|cannot|failed|not saved|invalid|error|enter |must |at least|before the start|after the start/i.test(message));
  div.className = 'toast' + (isError ? ' toast-error' : '');
  div.setAttribute('role', isError ? 'alert' : 'status');
  div.setAttribute('aria-live', isError ? 'assertive' : 'polite');
  div.setAttribute('aria-atomic', 'true');
  div.textContent = message;
  root.appendChild(div);
  requestAnimationFrame(function () { div.classList.add('show'); });
  setTimeout(function () {
    div.classList.remove('show');
    setTimeout(function () { div.remove(); }, 250);
  }, isError ? 8000 : 3200);
}

function announceStatus(message) {
  var region = document.getElementById('polite-status');
  if (!region) return;
  region.textContent = '';
  requestAnimationFrame(function () { region.textContent = message; });
}

/* ---------- 5a. Shared accessibility infrastructure -----------------
   WayPoint renders its UI from HTML strings, so these helpers apply the
   repeated behavioural guarantees in one place: field labelling, dialog
   focus containment and restoration, and stable descriptions for hints. */

var accessibilityId = 0;
var modalReturnFocus = null;

function ensureElementId(el, prefix) {
  if (!el.id) el.id = (prefix || 'wp-a11y') + '-' + (++accessibilityId);
  return el.id;
}

function appendDescribedBy(control, id) {
  var values = (control.getAttribute('aria-describedby') || '').split(/\s+/).filter(Boolean);
  if (values.indexOf(id) === -1) values.push(id);
  control.setAttribute('aria-describedby', values.join(' '));
}

function enhanceAccessibility(scope) {
  if (!scope || !scope.querySelectorAll) return;
  Array.prototype.forEach.call(scope.querySelectorAll('.field'), function (field) {
    var controls = Array.prototype.filter.call(field.querySelectorAll('input:not([type="hidden"]), select, textarea'), function (control) {
      return control.closest('.field') === field && !control.closest('label');
    });
    var label = Array.prototype.find.call(field.children, function (child) { return child.tagName === 'LABEL'; });
    var control = controls[0];
    if (label && control) {
      var controlId = ensureElementId(control, 'wp-field');
      label.htmlFor = controlId;
      if (control.required && !label.querySelector('.required-marker')) {
        var marker = document.createElement('span');
        marker.className = 'required-marker';
        marker.textContent = ' (required)';
        label.appendChild(marker);
      }
      Array.prototype.forEach.call(field.querySelectorAll('.field-hint'), function (hint) {
        if (hint.closest('.field') !== field) return;
        appendDescribedBy(control, ensureElementId(hint, 'wp-hint'));
      });
    }
    var picker = field.querySelector('.tag-picker');
    if (picker && label) {
      picker.setAttribute('role', 'group');
      picker.setAttribute('aria-labelledby', ensureElementId(label, 'wp-group-label'));
    }
  });

  Array.prototype.forEach.call(scope.querySelectorAll('.avatar-picker-section'), function (section) {
    var heading = section.querySelector('h4');
    var grid = section.querySelector('.avatar-swatch-grid');
    if (heading && grid) {
      grid.setAttribute('role', 'group');
      grid.setAttribute('aria-labelledby', ensureElementId(heading, 'wp-avatar-group'));
    }
  });
  Array.prototype.forEach.call(scope.querySelectorAll('button.avatar-swatch-btn'), function (button) {
    button.setAttribute('aria-pressed', String(button.classList.contains('is-selected')));
  });
  // If connectivity changes while a modal or screen is already open, disable
  // every state-changing control in that rendered subtree. Navigation and
  // local view controls remain available, so saved data can still be read.
  Array.prototype.forEach.call(scope.querySelectorAll('[data-action]'), function (control) {
    if (isMutationAction(control.dataset.action)) control.disabled = !editingAvailable();
  });
  updateSubmitAvailability(scope);
}

function updateSubmitAvailability(scope) {
  Array.prototype.forEach.call(scope.querySelectorAll('form:not(#login-form):not(#setup-form) button[type="submit"]'), function (button) {
    // Retain intentional (e.g. pending request) disables when the lock lifts.
    if (!editingAvailable() && !button.disabled) { button.dataset.editLock = 'true'; button.disabled = true; }
    else if (editingAvailable() && button.dataset.editLock === 'true') { delete button.dataset.editLock; button.disabled = false; }
  });
}

function modalFocusableElements(dialog) {
  return Array.prototype.filter.call(dialog.querySelectorAll('button:not([disabled]), summary, [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'), function (el) {
    // Hidden disclosure contents and CSS-hidden controls cannot receive focus.
    return !el.closest('[hidden], [inert], [aria-hidden="true"]') && el.getClientRects().length > 0;
  });
}

function setModalBackgroundInert(inert) {
  ['.topbar', '#main-content', '#system-banner'].forEach(function (selector) {
    var el = document.querySelector(selector);
    if (!el) return;
    el.inert = inert;
    if (inert) el.setAttribute('aria-hidden', 'true');
    else el.removeAttribute('aria-hidden');
  });
}

function activateModal() {
  var root = document.getElementById('modal-root');
  var dialog = root && root.querySelector('.modal');
  if (!dialog) return;
  enhanceAccessibility(dialog);
  if (dialog.dataset.accessibilityReady === 'true') return;
  dialog.dataset.accessibilityReady = 'true';
  modalReturnFocus = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('tabindex', '-1');
  var heading = dialog.querySelector('.modal-head h2');
  if (heading) dialog.setAttribute('aria-labelledby', ensureElementId(heading, 'wp-dialog-title'));
  setModalBackgroundInert(true);
  document.body.classList.add('has-modal');
  requestAnimationFrame(function () {
    if (!dialog.isConnected) return;
    var initial = dialog.querySelector('[data-modal-initial]') || modalFocusableElements(dialog)[0] || dialog;
    initial.focus();
  });
}

function showFormError(form, message, control) {
  if (!form) { showToast(message); return; }
  var body = form.querySelector('.modal-body') || form;
  var summary = form.querySelector('.form-error-summary');
  if (!summary) {
    summary = document.createElement('div');
    summary.className = 'form-error-summary';
    summary.setAttribute('role', 'alert');
    summary.setAttribute('tabindex', '-1');
    body.insertBefore(summary, body.firstChild);
  }
  summary.textContent = message;
  if (control) {
    // Invalid fields can live in a collapsed optional section. Reveal every
    // ancestor disclosure before focus so the error is visible and reachable.
    var ancestor = control.parentElement;
    while (ancestor && ancestor !== form) {
      if (ancestor.tagName === 'DETAILS') ancestor.open = true;
      ancestor = ancestor.parentElement;
    }
    control.setAttribute('aria-invalid', 'true');
    var error = control.parentElement && control.parentElement.querySelector('.field-error');
    if (!error) {
      error = document.createElement('div');
      error.className = 'field-error';
      if (control.parentElement) control.parentElement.appendChild(error);
    }
    error.textContent = message;
    appendDescribedBy(control, ensureElementId(error, 'wp-error'));
    control.focus();
  } else {
    summary.focus();
  }
}

function isMutationAction(action) {
  if (!action) return false;
  return /^(new-|edit-|delete-|timeline-add-|link-companion$)/.test(action) ||
    ['confirm-yes', 'open-avatar-picker', 'set-location-pin', 'use-typed-location', 'review-map-location'].indexOf(action) !== -1;
}

function clearFieldError(event) {
  var control = event.target;
  if (!control || !control.removeAttribute) return;
  if (control.getAttribute('aria-invalid') === 'true') {
    control.removeAttribute('aria-invalid');
    var error = control.parentElement && control.parentElement.querySelector('.field-error');
    if (error) {
      var errorId = error.id;
      error.remove();
      var descriptions = (control.getAttribute('aria-describedby') || '').split(/\s+/).filter(function (id) { return id && id !== errorId; });
      if (descriptions.length) control.setAttribute('aria-describedby', descriptions.join(' '));
      else control.removeAttribute('aria-describedby');
    }
    var form = control.form;
    if (form && !form.querySelector('[aria-invalid="true"]')) {
      var summary = form.querySelector('.form-error-summary');
      if (summary) summary.remove();
    }
  }
}
document.addEventListener('input', clearFieldError);
document.addEventListener('change', clearFieldError);

// Native constraint validation is still the source of truth, but presenting
// its message inside the dialog makes the failure persistent, programmatically
// associated with the field, and reachable by screen-reader and keyboard users.
var invalidFormResetTimer = null;
document.addEventListener('invalid', function (event) {
  var control = event.target;
  var form = control && control.form;
  event.preventDefault();
  if (!form || form.dataset.invalidMessageShown === 'true') return;
  form.dataset.invalidMessageShown = 'true';
  showFormError(form, control.validationMessage || 'Check the highlighted field and try again.', control);
  clearTimeout(invalidFormResetTimer);
  invalidFormResetTimer = setTimeout(function () { delete form.dataset.invalidMessageShown; }, 0);
}, true);

document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape') {
    var openDayAdd = document.querySelector('.day-add[open]');
    if (openDayAdd) {
      event.preventDefault();
      openDayAdd.removeAttribute('open');
      var dayAddToggle = openDayAdd.querySelector('.day-add-btn');
      if (dayAddToggle) dayAddToggle.focus();
      return;
    }
  }
  if (event.key === 'Escape' && accountMenuOpen) {
    event.preventDefault();
    accountMenuOpen = false;
    applyAuthUI();
    var accountToggle = document.querySelector('.account-menu-toggle');
    if (accountToggle) accountToggle.focus();
    return;
  }
  if (accountMenuOpen && event.target.closest && event.target.closest('.account-popover') && ['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(event.key) !== -1) {
    var menuItems = Array.prototype.slice.call(document.querySelectorAll('.account-popover [role="menuitem"]'));
    if (menuItems.length) {
      event.preventDefault();
      var menuIndex = menuItems.indexOf(document.activeElement);
      if (event.key === 'Home') menuIndex = 0;
      else if (event.key === 'End') menuIndex = menuItems.length - 1;
      else if (event.key === 'ArrowDown') menuIndex = (menuIndex + 1) % menuItems.length;
      else menuIndex = (menuIndex <= 0 ? menuItems.length : menuIndex) - 1;
      menuItems[menuIndex].focus();
    }
    return;
  }
  var dialog = document.querySelector('#modal-root .modal');
  if (!dialog) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    // Dismiss the innermost popup first; a second Escape closes the dialog.
    if (typeof suggestDropdownState !== 'undefined' && suggestDropdownState.input && suggestDropdownState.input.getAttribute('aria-expanded') === 'true') {
      closeSuggestions(suggestDropdownState.input);
      return;
    }
    closeModal();
    return;
  }
  if (event.key !== 'Tab') return;
  var focusable = modalFocusableElements(dialog);
  if (!focusable.length) { event.preventDefault(); dialog.focus(); return; }
  var first = focusable[0], last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
});

new MutationObserver(function () {
  var root = document.getElementById('modal-root');
  if (root && root.querySelector('.modal')) activateModal();
}).observe(document.getElementById('modal-root'), { childList: true, subtree: true });

var pendingConfirm = null;

function openConfirm(opts) {
  pendingConfirm = opts.onConfirm;
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal">' +
        '<div class="modal-head"><h2>' + esc(opts.title || 'Are you sure?') + '</h2>' +
          '<button class="btn btn-icon btn-ghost" data-action="close-modal" aria-label="Close dialog" title="Close">' + icon('close') + '</button></div>' +
        '<div class="modal-body"><p class="confirm-text">' + esc(opts.message) + '</p></div>' +
        '<div class="modal-foot">' +
          '<button class="btn" data-action="close-modal" data-modal-initial>Cancel</button>' +
          '<button class="btn btn-danger" data-action="confirm-yes">' + esc(opts.confirmLabel || 'Delete') + '</button>' +
        '</div>' +
      '</div>' +
